[package]
name = "repo_utilities"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Repo hygiene CLI: ansi-check, terminology-gate, verify-artifacts. Depends only on the leaf repo_root crate so gate-time rebuilds stay isolated from the main workspace reverse closure."

[[bin]]
name = "repo-utilities"
path = "src/main.rs"

[dependencies]
repo_root = { workspace = true }
anstyle = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
regex = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
