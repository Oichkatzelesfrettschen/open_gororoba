[package]
name = "repo_utilities"
version = "0.1.0"
edition = { workspace = true }
description = "Repo hygiene CLI: ansi-check, terminology-gate, verify-artifacts. Standalone (no workspace-crate deps) so gate-time rebuilds are isolated from the main workspace's reverse-closure invalidations."
license = "MIT"

[[bin]]
name = "repo-utilities"
path = "src/main.rs"

[dependencies]
anstyle = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
regex = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
