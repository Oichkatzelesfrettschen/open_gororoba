[package]
name = "lbm_vulkan"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
ash = { workspace = true, features = ["debug", "libloading", "loaded"] }
gpu-allocator = { workspace = true, features = ["vulkan"] }
gororoba_gpu_bridge = { workspace = true }
gororoba_gpu_readback = { workspace = true }
log = { workspace = true }
image = { workspace = true }
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
env_logger = { workspace = true }
thiserror = { workspace = true }

# cubecl: portable kernel-source-once, runs on Vulkan/Metal/CUDA/DX12/WebGPU.
# Gated behind the `cubecl` feature so non-cubecl builds (e.g. CI on minimal
# hosts) do not pull in the cubecl-wgpu compile chain.
cubecl = { workspace = true, optional = true }
cubecl-core = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
winit = { workspace = true }
raw-window-handle = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[features]
default = []
# Enables the cubecl-wgpu backend for box-counting + the 3-way parity test.
# Mirrors the cubecl gating used by cd_kernel (commit 8f8d90e4 era).
cubecl = ["dep:cubecl", "dep:cubecl-core", "dep:cubecl-wgpu", "dep:bytemuck"]

# cubecl-core, cubecl-wgpu, bytemuck are conditionally enabled via the
# `cubecl` feature; cargo machete / unused-dep checks must ignore them
# in builds where the feature is off.
[package.metadata.cargo-machete]
ignored = ["cubecl-core", "cubecl-wgpu", "bytemuck"]

[lints]
workspace = true
