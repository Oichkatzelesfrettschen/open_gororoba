[package]
name = "sign_imbalance"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-only"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
gororoba_algebra = { path = "../gororoba_algebra", version = "0.1" }
cosmology_core = { path = "../cosmology_core", version = "0.1" }
gr_core = { path = "../gr_core", version = "0.1" }
nalgebra = { workspace = true }
petgraph = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
statrs = { workspace = true }
anyhow = { workspace = true }
cudarc = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
stats_core = { path = "../stats_core" }
criterion = { workspace = true }

[features]
default = []
gpu = ["cudarc"]

[[bench]]
name = "imbalance_bench"
harness = false

[lints]
workspace = true
