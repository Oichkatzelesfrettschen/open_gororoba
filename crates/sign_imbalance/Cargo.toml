[package]
name = "sign_imbalance"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
anyhow = { workspace = true }
cosmology_core = { path = "../cosmology_core", version = "0.1" }
cudarc = { workspace = true, optional = true }
gororoba_algebra = { path = "../gororoba_algebra", version = "0.1" }
gororoba_gpu_cuda = { workspace = true, optional = true }
gr_core = { path = "../gr_core", version = "0.1" }
nalgebra = { workspace = true }
petgraph = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
statrs = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true }
stats_core = { path = "../stats_core" }

[features]
default = []
# The explicit cudarc feature preserves the old public feature name while gpu
# enables the same CUDA surface.
cudarc = ["dep:cudarc", "dep:gororoba_gpu_cuda", "gororoba_gpu_cuda/cudarc"]
gpu = ["cudarc"]

[[bench]]
name = "imbalance_bench"
harness = false

[lints]
workspace = true
