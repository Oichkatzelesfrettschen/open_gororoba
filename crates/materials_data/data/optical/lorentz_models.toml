# Drude-Lorentz optical models -- DrudeLorentzParams constructors that
# pair an optional Drude free-carrier response with one or more Lorentz
# oscillators plus a high-frequency dielectric background (eps_inf).
#
# Each [[material]] entry emits two constants:
#   pub const <NAME>_EPS_INF: f64 = X;
#   pub const <NAME>_OSCILLATORS: &[[f64; 3]] =
#       &[[strength, omega_0_ev, gamma_ev], ...];
#
# (Drude-component-free materials only for now; a future iteration can
# add `drude_omega_p_ev / drude_gamma_ev` scalar fields for combined
# Drude+Lorentz models like the metal Drude-Lorentz variants.)
#
# Fields:
#   name        -- const prefix (e.g. "SILICA_CASIMIR" -> SILICA_CASIMIR_*)
#   eps_inf     -- high-frequency dielectric background
#   oscillators -- array of {strength, omega_0_ev, gamma_ev} tables
#   reference   -- literature source (ignored by build.rs, for humans)

[[material]]
name = "SILICA_CASIMIR"
eps_inf = 2.1
reference = "Lambrecht & Reynaud (2000) Lifshitz Casimir calculations; Palik handbook IR phonon assignments. eps(0) = 2.1 + 0.185 + 0.115 + 1.400 = 3.800 matches measured static dielectric."

[[material.oscillators]]
# IR1: Si-O rocking mode (460 cm^{-1} = 0.057 eV)
strength = 0.185
omega_0_ev = 0.057
gamma_ev = 0.003

[[material.oscillators]]
# IR2: Si-O bending mode (800 cm^{-1} = 0.099 eV)
strength = 0.115
omega_0_ev = 0.099
gamma_ev = 0.005

[[material.oscillators]]
# IR3: Si-O stretching mode (1075 cm^{-1} = 0.133 eV), dominant
strength = 1.400
omega_0_ev = 0.133
gamma_ev = 0.012

[[material]]
name = "SILICON"
eps_inf = 1.0
reference = "E0/E1/E2 critical points of intrinsic Si; bandgap ~1.1 eV."

[[material.oscillators]]
# E0 critical point (direct gap at ~3.4 eV)
strength = 29.0
omega_0_ev = 3.40
gamma_ev = 0.1

[[material.oscillators]]
# E1 critical point
strength = 6.0
omega_0_ev = 3.74
gamma_ev = 0.25

[[material.oscillators]]
# E2 critical point
strength = 3.0
omega_0_ev = 4.40
gamma_ev = 0.2

[[material]]
name = "SILICA"
eps_inf = 2.1
reference = "Wide-bandgap dielectric; n = 1.45 -> eps = 2.1. Two-oscillator IR + UV."

[[material.oscillators]]
# IR phonon resonance (~8 microns)
strength = 1.0
omega_0_ev = 0.064
gamma_ev = 0.005

[[material.oscillators]]
# UV absorption edge
strength = 1.0
omega_0_ev = 11.0
gamma_ev = 2.0

[[material]]
name = "SILICON_NITRIDE"
eps_inf = 4.0
reference = "Si3N4 dielectric, n ~ 2.0. Single IR resonance."

[[material.oscillators]]
# IR resonance
strength = 1.5
omega_0_ev = 0.11
gamma_ev = 0.01

[[material]]
name = "GERMANIUM"
eps_inf = 1.0
reference = "E0 gap + E1 critical point of Ge."

[[material.oscillators]]
# E0 gap
strength = 25.0
omega_0_ev = 2.1
gamma_ev = 0.15

[[material.oscillators]]
# E1 critical point
strength = 8.0
omega_0_ev = 2.3
gamma_ev = 0.2

# ============================================================
# Tungsten oxide family (Sprint 44 / Garcia + Granqvist + Lynch)
# ============================================================

[[material]]
name = "WO3"
eps_inf = 4.5
reference = "Granqvist (2000), Niklasson & Granqvist (2007). Stoichiometric wide-gap semiconductor, no free carriers."

[[material.oscillators]]
# W-O stretching mode
strength = 1.5
omega_0_ev = 0.085
gamma_ev = 0.008

[[material.oscillators]]
# W-O-W bending mode
strength = 0.8
omega_0_ev = 0.042
gamma_ev = 0.005

[[material.oscillators]]
# Higher phonon
strength = 0.4
omega_0_ev = 0.120
gamma_ev = 0.010

[[material.oscillators]]
# Band-edge absorption
strength = 6.0
omega_0_ev = 3.5
gamma_ev = 0.8

[[material.oscillators]]
# Higher UV transition
strength = 3.0
omega_0_ev = 5.5
gamma_ev = 1.5

[[material]]
name = "WO3_X"
eps_inf = 5.88
reference = "Garcia et al. Nano Lett. 11(10), 2011. Oxygen-deficient WO3-x plasmonic conductor. omega_p ~1.07 eV for n~1e21 cm^-3 and m*=1.2*m_e."

[material.drude]
omega_p_ev = 1.07
gamma_ev = 0.20
eps_inf = 1.0

[[material.oscillators]]
# Residual phonon (reduced by vacancy disorder)
strength = 0.8
omega_0_ev = 0.085
gamma_ev = 0.015

[[material.oscillators]]
# Band-edge (blue-shifted by Burstein-Moss effect)
strength = 5.0
omega_0_ev = 3.8
gamma_ev = 1.0

[[material]]
name = "CS_WO3"
eps_inf = 5.97
reference = "Lynch & Hunter (1991) Handbook of Optical Constants II. Polycrystalline scalar average of anisotropic Cs0.33WO3 tungsten bronze. omega_p_avg^2 = (4.664^2 + 2*3.180^2)/3 -> 3.741 eV; gamma_avg = (0.217 + 2*0.335)/3 = 0.296 eV; eps_inf_avg = (6.3 + 2*5.8)/3 = 5.97."

[material.drude]
omega_p_ev = 3.741
gamma_ev = 0.296
eps_inf = 1.0

[[material.oscillators]]
# Interband transition
strength = 2.0
omega_0_ev = 4.0
gamma_ev = 1.5

# Uniaxial anisotropic Cs0.33WO3 -- parallel + perpendicular split. Each
# direction is a full DrudeLorentz model; emitted as a pair of [[material]]
# entries that the caller (cs_wo3_uniaxial constructor) wraps in a
# UniaxialOptical struct.
[[material]]
name = "CS_WO3_PARALLEL"
eps_inf = 6.3
reference = "Lynch & Hunter (1991). c-axis parallel component of hexagonal Cs0.33WO3 tungsten bronze."

[material.drude]
omega_p_ev = 4.664
gamma_ev = 0.217
eps_inf = 1.0

[[material.oscillators]]
strength = 2.0
omega_0_ev = 4.0
gamma_ev = 1.5

[[material]]
name = "CS_WO3_PERPENDICULAR"
eps_inf = 5.8
reference = "Lynch & Hunter (1991). a-b plane perpendicular component of hexagonal Cs0.33WO3 tungsten bronze."

[material.drude]
omega_p_ev = 3.180
gamma_ev = 0.335
eps_inf = 1.0

[[material.oscillators]]
strength = 2.0
omega_0_ev = 4.0
gamma_ev = 1.5

[[material]]
name = "CAWO4"
eps_inf = 3.7
reference = "Nikl et al. Rad. Meas. 33(5), 2000. Calcium tungstate scheelite scintillator (Eg ~5.0 eV), CRESST experiment."

[[material.oscillators]]
# WO4 internal stretching modes
strength = 1.0
omega_0_ev = 0.110
gamma_ev = 0.006

[[material.oscillators]]
# Lattice phonon
strength = 0.6
omega_0_ev = 0.045
gamma_ev = 0.004

[[material.oscillators]]
# UV absorption edge
strength = 4.0
omega_0_ev = 5.5
gamma_ev = 1.0

[[material]]
name = "PBWO4"
eps_inf = 4.8
reference = "Nikl et al. Rad. Meas. 33(5), 2000. Lead tungstate fast scintillator (Eg ~4.2 eV), CMS calorimeter. UV edge lower than CaWO4 due to Pb 6s states."

[[material.oscillators]]
# WO4 internal modes
strength = 1.2
omega_0_ev = 0.100
gamma_ev = 0.008

[[material.oscillators]]
# Pb-O lattice mode
strength = 0.8
omega_0_ev = 0.035
gamma_ev = 0.005

[[material.oscillators]]
# UV absorption edge (lower than CaWO4 due to Pb 6s states)
strength = 5.0
omega_0_ev = 4.5
gamma_ev = 1.2

