# Drude parameters for simple free-electron metals.
#
# Each entry maps to a pub const NAME: [f64; 3] = [omega_p_ev, gamma_ev, eps_inf]
# emitted by materials_data/build.rs into generated_optical_params.rs.
#
# Fields:
#   name        -- const name prefix (e.g. "GOLD_DRUDE" -> GOLD_DRUDE: [f64; 3])
#   omega_p_ev  -- plasma frequency in eV
#   gamma_ev    -- Drude damping (relaxation rate) in eV
#   eps_inf     -- high-frequency dielectric background
#   reference   -- literature source for these values

[[metals]]
name = "GOLD_DRUDE"
omega_p_ev = 9.0
gamma_ev = 0.035
eps_inf = 1.0
reference = "Lambrecht & Reynaud, Eur. Phys. J. D 8, 309 (2000)"

[[metals]]
name = "SILVER_DRUDE"
omega_p_ev = 9.17
gamma_ev = 0.021
eps_inf = 1.0
reference = "Lambrecht & Reynaud, Eur. Phys. J. D 8, 309 (2000)"

