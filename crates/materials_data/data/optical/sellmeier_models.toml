# Sellmeier dispersion model registry -- TOML codegen source for
# SellmeierParams constructors (#127 Phase 8).
#
# Each [[sellmeier]] entry emits three pub static consts:
#   pub static <NAME>_B_COEFFS: &[f64] = &[...]
#   pub static <NAME>_C_COEFFS: &[f64] = &[...]
#   pub static <NAME>_VALIDITY_UM: (f64, f64) = (min, max)
#
# Schema fields:
#   name              -- const prefix (must be a valid Rust ident, uppercase)
#   b_coeffs          -- oscillator strengths B_i (dimensionless)
#   c_form            -- "squared" if c_coeffs are already lambda_i^2,
#                        or "linear" if they should be squared at codegen time
#                        (to preserve byte-identical f64 with the original
#                        Rust `powi(2)` evaluation).
#   c_coeffs          -- resonance values (either C_i or lambda_i, per c_form)
#   validity_range_um -- [min_um, max_um]
#   reference         -- primary literature citation (ignored by build.rs)

