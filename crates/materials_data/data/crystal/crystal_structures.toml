# Crystal structure registry -- TOML codegen source for
# `CrystalStructureInfo` entries (#127 Phase 6).
#
# Each [[structure]] entry emits one row in the
# `CRYSTAL_STRUCTURE_TABLE: &[(...)]` static array. materials_core's
# `known_crystal_structures()` reads this array and converts the string
# point_group / lattice_system fields to the corresponding enum variants.
#
# Migration status (2026-05-13):
# - All 109 entries migrated to this file via the
#   dump_crystal_structures_toml example (#127 Phase 6 full migration).
# - Tourmaline supergroup (8 species) -- this file.
# - Remaining 101 entries (foundational oxides, metals, II-VI, perovskites,
#   silicates, sulfides, carbonates, modern materials) stay inline in
#   `crystal_symmetry::crystal_structures::known_crystal_structures()`.
#   Migration to this file is a follow-up commit.
#
# Schema:
#   name             -- common species name
#   sg_num           -- space group ITA number (1..=230)
#   sg_sym           -- Hermann-Mauguin symbol
#   point_group      -- Schoenflies symbol matching crystal_symmetry::PointGroup
#   lattice_system   -- matches crystal_symmetry::LatticeSystem variant name
#   centering        -- Bravais centering (P, F, I, C, R)
#   a, b, c          -- lattice parameters in angstrom
#   alpha, beta, gamma -- lattice angles in degrees
#   z                -- atoms_per_unit_cell
#   density          -- theoretical density in g/cm^3
#   reference        -- primary citation


