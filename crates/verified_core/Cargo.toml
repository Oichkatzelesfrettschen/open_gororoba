[package]
name = "verified_core"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
description = "Rocq-verified operations extracted to Rust"

# Most modules in this crate are pure arithmetic derived from Rocq extraction.
# The topology helper is intentionally host-facing and depends on runtime CPU
# discovery plus a pinned Rayon pool for deterministic parallel execution.

[dev-dependencies]
cosmology_core = { path = "../cosmology_core" }
gororoba_algebra = { path = "../gororoba_algebra" }
gr_core = { path = "../gr_core" }
optics_core = { path = "../optics_core" }

[lints]
workspace = true

[dependencies]
core_affinity.workspace = true
nalgebra.workspace = true
rand.workspace = true
raw-cpuid = "11.6.0"
rayon = { workspace = true }
