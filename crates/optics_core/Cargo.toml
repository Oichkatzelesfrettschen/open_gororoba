[package]
name = "optics_core"
version = "0.1.0"
autobins = false
edition = { workspace = true }
license = "MIT"
description = "GRIN ray tracing: gradient-index optics, Beer-Lambert absorption, RK4 integration"

[[bin]]
name = "p2a-legacy-optics-characterization"
path = "src/bin/p2a_legacy_optics_characterization.rs"

[[bin]]
name = "p2a-channel-oracle-evidence"
path = "src/bin/p2a_channel_oracle_evidence.rs"

[dependencies]
anyhow = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
gororoba_gpu_cubecl = { workspace = true, optional = true }
gororoba_gpu_cuda = { workspace = true, optional = true }
gororoba_gpu_vulkan = { workspace = true, optional = true }
num-complex = { workspace = true }
rustfft = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
gpu = ["dep:anyhow", "dep:cudarc", "dep:gororoba_gpu_cuda", "gororoba_gpu_cuda/cudarc"]
vulkan = ["dep:gororoba_gpu_vulkan", "gororoba_gpu_vulkan/ash"]
cubecl = [
    "dep:cubecl",
    "dep:cubecl-wgpu",
    "dep:gororoba_gpu_cubecl",
    "gororoba_gpu_cubecl/cubecl",
]

[dev-dependencies]
approx = { workspace = true }
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true
