[package]
name = "gororoba_algebra"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
description = "Cayley-Dickson algebras, Clifford algebras, and algebraic structures for physics"

[dependencies]
algebra_analysis = { workspace = true, optional = true }
cd_kernel = { workspace = true }
csv = { workspace = true }
cubecl = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
gororoba_gpu_bridge = { workspace = true }
gororoba_gpu_cubecl = { workspace = true, optional = true }
nalgebra = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wide = { workspace = true }

# External algebra crates (workspace)
atlas-embeddings = { workspace = true }
padic = { workspace = true }

# Stochastic processes and fractal analysis (workspace)
diffusionx = { workspace = true }

# GPU acceleration (optional, feature-gated)
cudarc = { workspace = true, optional = true }
gororoba_gpu_cuda = { workspace = true, optional = true }
gororoba_gpu_vulkan = { workspace = true, optional = true }
verified_core = { version = "0.1.0", path = "../verified_core" }

[features]
default = ["core", "analysis", "physics"]
# Core Cayley-Dickson construction, traits, error types, and universal algebra.
# No internal deps.  Used by 8+ downstream crates.
core = []
# ZD graphs, box-kites, codebook, fractal, stochastic, homotopy, PG, Reggiani.
# Depends on core (analysis modules reference construction::cayley_dickson).
analysis = ["core", "dep:algebra_analysis"]
# Clifford, octonion field, M3, billiard simulation, amplitudes.
# Depends on core + lie (billiard_sim uses kac_moody::E10RootSystem).
physics = ["core", "lie"]
# E8 lattice, E7 geometry, Kac-Moody, group theory, nilpotent orbits, Lyndon.
# No cross-module deps beyond self-referential.
lie = []
# GPU acceleration (CUDA via cudarc). The explicit cudarc feature preserves
# the old public feature name while gpu enables the same CUDA surface.
cudarc = ["dep:cudarc", "dep:gororoba_gpu_cuda", "gororoba_gpu_cuda/cudarc"]
gpu = ["analysis", "physics", "cudarc"]
vulkan = ["analysis", "physics", "dep:gororoba_gpu_vulkan", "gororoba_gpu_vulkan/ash"]
cubecl = [
    "analysis",
    "physics",
    "dep:cubecl",
    "dep:cubecl-wgpu",
    "dep:gororoba_gpu_cubecl",
    "gororoba_gpu_cubecl/cubecl",
]
wedged = []
# CD tower feature gates: each level enables the one below.
cd-512 = []
cd-1024 = ["cd-512"]
# Meta-feature: full upper tower (32D through 1024D with all SIMD types).
higher-cd = ["cd-1024"]
# SU(5), three generations, lepton masses, Leech lattice (Phase 7 graduation).
physics-sm = []

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
iai-callgrind = { workspace = true }
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }

[[bench]]
name = "algebra_bench"
harness = false

[[bench]]
name = "dimensional_bench"
harness = false

[[bench]]
name = "tensor_avt_bench"
harness = false
required-features = ["gpu"]

[[bench]]
name = "tensor_avt_iai"
harness = false
required-features = ["gpu"]

[[example]]
name = "tensor_avt_profile"
required-features = ["gpu"]

[[example]]
name = "m3_e8_bridge"
required-features = ["lie", "physics"]

[lints]
workspace = true
