[package]
name = "gororoba_cli_governance"
version = "0.1.0"
edition = { workspace = true }
description = "Slim governance and routing operator binaries for gororoba"
license = "MIT"
autobins = false

[[bin]]
name = "markdown-registry"
path = "../gororoba_cli_data/src/bin/markdown_registry.rs"

[[bin]]
name = "governance-verify"
path = "../gororoba_cli_data/src/bin/governance_verify.rs"

[[bin]]
name = "workspace-routing"
path = "../gororoba_cli_data/src/bin/workspace_routing.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
glob = { workspace = true }
provenance_ops = { path = "../provenance_ops" }
provenance_store = { path = "../provenance_store" }
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
