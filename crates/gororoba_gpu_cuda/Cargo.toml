[package]
name = "gororoba_gpu_cuda"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = { workspace = true }
description = "Shared CUDA helpers (context / device probe / NVRTC compile / module registry / buffer + managed memory / launch config / NVML telemetry / OptiX scaffolding) consolidating the workspace's cudarc + nvml-wrapper boilerplate"

[dependencies]
gororoba_gpu_bridge = { workspace = true }
gororoba_optix = { workspace = true }

cudarc = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[features]
default = []
# Enables the CUDA helpers. When off, the crate exposes only the
# re-exported gororoba_gpu_bridge and gororoba_optix types.
cudarc = ["dep:cudarc", "dep:nvml-wrapper", "dep:thiserror", "dep:log"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["cudarc", "nvml-wrapper", "thiserror", "log"]
