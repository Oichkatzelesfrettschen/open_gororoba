[dependencies]
algebra_core = { path = "../algebra_core", features = ["lie", "experimental"] }
cosmology_core = { path = "../cosmology_core" }
gr_core = { path = "../gr_core" }
materials_core = { path = "../materials_core" }
optics_core = { path = "../optics_core" }
quantum_core = { path = "../quantum_core" }
spectral_core = { path = "../spectral_core" }
lbm_core = { path = "../lbm_core" }
lbm_3d = { path = "../lbm_3d" }
lbm_3d_cuda = { path = "../lbm_3d_cuda", optional = true }
stats_core = { path = "../stats_core" }
data_core = { path = "../data_core" }
snia_core = { path = "../snia_core" }
vacuum_frustration = { path = "../vacuum_frustration" }
neural_homotopy = { path = "../neural_homotopy" }
spin_tomography_core = { path = "../spin_tomography_core" }
cd_spin_bridge = { path = "../cd_spin_bridge" }
qgp_scaling = { path = "../qgp_scaling" }
lbm_vulkan = { version = "0.1.0", path = "../lbm_vulkan" }
ash = { version = "0.38.0", features = ["debug"] }
nalgebra = { workspace = true }
ndarray = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
anyhow = { workspace = true }
plotters = { workspace = true }
pgfplots = { workspace = true }
rustfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
glob = { workspace = true }

[features]
default = ["gpu"]
gpu = ["lbm_3d_cuda", "vacuum_frustration/gpu"]
hdf5-export = ["data_core/hdf5-export"]

[lints]
workspace = true
