[package]
name = "neural_homotopy"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-only"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
algebra_core = { path = "../algebra_core" }
cosmology_core = { path = "../cosmology_core" }
burn = { workspace = true, features = ["ndarray", "openblas"] }
blas-src = { version = "0.10", features = ["openblas"] }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["wgpu-backend"]
wgpu-backend = []
cuda-backend = []

[[bench]]
name = "training_bench"
harness = false

[lints]
workspace = true
