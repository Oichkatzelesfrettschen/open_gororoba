[package]
name = "neural_homotopy"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-only"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
gororoba_algebra = { path = "../gororoba_algebra" }
cosmology_core = { path = "../cosmology_core" }
burn = { workspace = true, features = ["ndarray"] }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["wgpu-backend"]
wgpu-backend = []
cuda-backend = []
# Native BLAS acceleration is opt-in so default builds stay offline-friendly and
# portable across CI and developer machines. These feature names are enabled with
# `cargo ... --features <name>`.
#
# Burn 0.16 can forward additional native BLAS backends upstream, but the repo's
# default nextest lanes resolve the workspace with all package features. Exposing
# source-backed backends here would drag uncached native source crates into the
# default smoke lane, so keep the repo surface limited to the backend we can
# support in CI and on this machine without implicit downloads.
#
# `blas-src` itself also supports BLIS, but Burn does not expose a BLIS backend
# flag here, so this crate intentionally does not advertise a misleading `blis`
# feature until the backend plumbing supports it end-to-end.
openblas-system = ["burn/openblas-system"]

[[bench]]
name = "training_bench"
harness = false

[lints]
workspace = true
