[package]
name = "gororoba_gpu_vulkan"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = { workspace = true }
description = "Shared Vulkan helpers (instance / adapter / device / allocator / shader / descriptor / pipeline / dispatch) consolidating the workspace's ash + naga + gpu-allocator boilerplate"

[dependencies]
gororoba_gpu_bridge = { workspace = true }

# All Vulkan-side deps are optional and gated behind the `ash` feature.
# Default builds (no features) compile to an empty stub so non-Vulkan
# consumers of types pay zero compile cost.
ash = { workspace = true, optional = true, features = ["debug", "libloading", "loaded"] }
gpu-allocator = { workspace = true, optional = true, features = ["vulkan"] }
naga = { workspace = true, optional = true, features = ["wgsl-in", "spv-out"] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }

[features]
default = []
# Enables the Vulkan helpers. When off, the crate exposes only the
# re-exported gororoba_gpu_bridge types (ComputeBackend, StoragePrecision, ...).
ash = ["dep:ash", "dep:gpu-allocator", "dep:naga", "dep:thiserror"]

[lints]
workspace = true
