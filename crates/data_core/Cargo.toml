[package]
name = "data_core"
version = "0.1.0"
edition = { workspace = true }
description = "Dataset acquisition, validation, and caching for cosmological catalogs"
license = "MIT"

[dependencies]
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
backon = { workspace = true }
ureq = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
rand = { workspace = true }
nalgebra = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
hifitime = { workspace = true }
gororoba_contracts = { path = "../gororoba_contracts" }
hdf5 = { workspace = true, optional = true }
polars = { workspace = true, optional = true }
fitsio = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
memmap2 = "0.9.10"
wide.workspace = true

[features]
default = []
hdf5-export = ["dep:hdf5"]
dataframe = ["dep:polars"]
fits = ["dep:fitsio", "dep:quick-xml"]

[dev-dependencies]
approx = { workspace = true }
tempfile = { workspace = true }
rand_distr = { workspace = true }

[lints]
workspace = true
