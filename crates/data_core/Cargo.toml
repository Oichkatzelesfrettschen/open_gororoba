[package]
name = "data_core"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Dataset acquisition, validation, and caching for cosmological catalogs"

[dependencies]
anise = { workspace = true, optional = true }
anyhow = { workspace = true }
backon = { workspace = true, optional = true }
cd_kernel = { workspace = true }
cdf = { workspace = true }
chrono = { workspace = true }
core_affinity = { workspace = true }
csv = { workspace = true }
faer = { workspace = true, optional = true }
fitsio = { workspace = true, optional = true }
flate2 = { workspace = true }
gororoba_contracts = { path = "../gororoba_contracts" }
gororoba_sparse_grid = { workspace = true }
hdf5 = { workspace = true, optional = true }
hifitime = { workspace = true }
log = { workspace = true }
memmap2 = "0.9.11"
nalgebra = { workspace = true }
netcdf-reader = { workspace = true, optional = true }
netcdf3 = { workspace = true, optional = true }
polars = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
verified_core = { version = "0.1.0", path = "../verified_core" }
wide.workspace = true
zip = { workspace = true }

[features]
# WHY: default is empty so that pure data-model consumers (structs, parsing,
# formats) do not transitively depend on reqwest/ureq/backon/url.  All
# workspace consumers already declare default-features = false and explicitly
# opt in to the features they need.  Leaving fetch in default would silently
# re-introduce the network plane for any future consumer added carelessly.
default = []
fetch = ["dep:reqwest", "dep:ureq", "dep:backon", "dep:url"]
hdf5-export = ["dep:hdf5"]
netcdf = ["dep:netcdf3", "dep:netcdf-reader"]
dataframe = ["dep:polars"]
fits = ["dep:fitsio", "dep:quick-xml"]
nanograv-engine = ["dep:faer", "dep:anise"]
# Opt-in feature that compiles the 354 auto-generated registry-mirror modules.
# These are pure doc-string (//!) files with zero compiled exports; they exist
# only for rustdoc generation. Gating them here removes ~95K lines and 354
# modules from the default cargo check / language-server index.
# Enable with: cargo check -p data_core --features registry-mirrors
# The make registry-export-markdown and registry-verify-mirrors targets pass
# this flag when they need the modules compiled for freshness checks.
registry-mirrors = []

[dev-dependencies]
approx = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# netcdf3 and netcdf-reader are optional deps behind the `netcdf` feature gate;
# they are not imported in default builds but must remain declared for
# `cargo check --features netcdf` to compile correctly.
ignored = ["netcdf-reader", "netcdf3"]
