[package]
name = "quantum_core"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Quantum physics: MERA tensor networks, holographic entropy, Ryu-Takayanagi"

[dependencies]
algebra_experimental = { version = "0.1.0", path = "../algebra_experimental" }
faer = { workspace = true }
lbm_core = { path = "../lbm_core" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
ndarray016 = { package = "ndarray", version = "0.16" }
num-complex = { workspace = true }
qua_ten_net = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustfft = { workspace = true }
thiserror = { workspace = true }
verified_core = { path = "../verified_core" }

# GPU acceleration (optional)
cubecl = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
gororoba_gpu_cubecl = { workspace = true, optional = true }
gororoba_gpu_cuda = { workspace = true, optional = true }
gororoba_gpu_vulkan = { workspace = true, optional = true }
gr_core = { version = "0.1.0", path = "../gr_core" }
nalgebra-sparse = { workspace = true, optional = true }

[features]
default = []
# The explicit cudarc feature preserves the old public feature name while gpu
# enables the same CUDA surface.
cudarc = ["dep:cudarc", "dep:gororoba_gpu_cuda", "gororoba_gpu_cuda/cudarc"]
gpu = ["cudarc"]
cubecl = [
    "dep:cubecl",
    "dep:cubecl-wgpu",
    "dep:gororoba_gpu_cubecl",
    "gororoba_gpu_cubecl/cubecl",
]
vulkan = ["dep:gororoba_gpu_vulkan", "gororoba_gpu_vulkan/ash"]
sparse-hamiltonians = ["dep:nalgebra-sparse"]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "quantum_bench"
harness = false

[[bench]]
name = "gpu_peps_bench"
harness = false

[lints]
workspace = true
