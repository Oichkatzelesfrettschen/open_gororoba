[package]
name = "quantum_core"
version = "0.1.0"
edition = { workspace = true }
description = "Quantum physics: MERA tensor networks, holographic entropy, Ryu-Takayanagi"
license = "MIT"

[dependencies]
algebra_experimental = { path = "../algebra_experimental" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
rustfft = { workspace = true }
faer = { workspace = true }
thiserror = { workspace = true }
qua_ten_net = { workspace = true }

# GPU acceleration (optional)
cudarc = { workspace = true, optional = true }

[features]
default = []
gpu = ["cudarc"]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "quantum_bench"
harness = false

[[bench]]
name = "gpu_peps_bench"
harness = false

[lints]
workspace = true
