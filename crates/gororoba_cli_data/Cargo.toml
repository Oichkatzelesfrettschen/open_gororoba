[dependencies]
gororoba_cli = { path = "../gororoba_cli" }
docpipe = { path = "../docpipe", features = ["fallback"] }
data_core = { path = "../data_core" }
scrolls_core = { path = "../scrolls_core" }
stats_core = { path = "../stats_core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
