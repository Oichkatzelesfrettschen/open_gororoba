[[bin]]
name = "claims-audit"
path = "src/bin/claims_audit.rs"

[[bin]]
name = "claims-consolidate"
path = "src/bin/claims_consolidate.rs"

[[bin]]
name = "claims-verify"
path = "src/bin/claims_verify.rs"

# ---- Registry (4) ----

[[bin]]
