chrono = { workspace = true }
ureq = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
hdf5-export = ["data_core/hdf5-export"]

[lints]
workspace = true
