[package]
name = "dickson_1919"
version = "0.1.0"
edition = { workspace = true }
description = "Dickson (1919) Cayley-Dickson process -- verified Rust implementation"
license = "GPL-2.0-or-later"

# Source: Dickson, L.E. (1919) "On Quaternions and Their Generalization and the
# History of the Eight Square Theorem", Annals of Math., 20(3), pp. 155-171.
#
# Rocq verification: proofs/theories/DicksonCDProcess.v (239 lines, 0 Admitted)
#
# This crate implements the CD construction (sections 1-4) and the property
# hierarchy: C (commutative), H (non-commutative, associative),
# O (non-commutative, non-associative, division), S (zero divisors).

[dependencies]
cd_kernel.workspace = true
hurwitz_1898 = { path = "../hurwitz_1898" }

[lints]
workspace = true
