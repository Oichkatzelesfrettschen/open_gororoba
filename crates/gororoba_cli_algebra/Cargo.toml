[dependencies]
algebra_analysis = { workspace = true }
cd_kernel.workspace = true
gororoba_algebra = { path = "../gororoba_algebra", features = ["lie"] }
algebra_experimental = { workspace = true }
gororoba_engine = { path = "../gororoba_engine" }
spectral_core = { path = "../spectral_core" }
stats_core = { path = "../stats_core" }
clap = { workspace = true }
csv = { workspace = true }
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
rand.workspace = true
rand_chacha.workspace = true
rustfft = { workspace = true }
anyhow.workspace = true
nalgebra = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
faer.workspace = true
hdf5-metno = "0.12.3"
glob.workspace = true
statrs.workspace = true

[features]
default = []
gpu = ["gororoba_algebra/gpu"]
tracy-profile = ["dep:tracing-tracy"]
profile-dd-hotspots = ["algebra_analysis/profile-dd-hotspots"]

[lints]
workspace = true
