[package]
name = "gororoba_engine"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[dependencies]
# Sub-crate decomposition: pipeline traits + GPU bridge
gororoba_gpu_bridge = { path = "../gororoba_gpu_bridge" }
gororoba_pipeline = { path = "../gororoba_pipeline" }

# Domain physics crates
algebra_analysis = { path = "../algebra_analysis", optional = true }
algebra_experimental = { path = "../algebra_experimental" }
anyhow = { workspace = true }
cd_spin_bridge = { path = "../cd_spin_bridge" }
chrono.workspace = true
cosmology_core = { path = "../cosmology_core" }
cudarc = { workspace = true, optional = true }
gororoba_algebra = { path = "../gororoba_algebra", features = ["lie"] }
gororoba_gpu_cuda = { workspace = true, optional = true }
gr_core = { version = "0.1.0", path = "../gr_core" }
lattice_filtration = { path = "../lattice_filtration" }
lbm_3d = { path = "../lbm_3d" }
lbm_3d_cuda = { path = "../lbm_3d_cuda" }
lbm_core = { path = "../lbm_core" }
nalgebra = { workspace = true }
ndarray = { workspace = true }
neural_homotopy = { path = "../neural_homotopy" }
num-complex = { workspace = true }
optics_core = { path = "../optics_core" }
quantum_core = { path = "../quantum_core" }
rand = { workspace = true }
serde.workspace = true
sha2.workspace = true
sign_imbalance = { path = "../sign_imbalance" }
spectral_core = { version = "0.1.0", path = "../spectral_core" }
spin_tomography_core = { path = "../spin_tomography_core" }
stats_core = { path = "../stats_core" }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "pipeline_bench"
harness = false

[features]
gpu = [
    "lbm_3d_cuda/cufft",
    "gororoba_algebra/gpu",
    "algebra_experimental/gpu",
    "stats_core/gpu",
    "cufft",
    "dep:cudarc",
    "dep:gororoba_gpu_cuda",
    "gororoba_gpu_cuda/cudarc",
]
cufft = []
analysis-examples = ["dep:algebra_analysis"]

[[example]]
name = "voudon_cuda_bridge"
required-features = ["gpu"]

[[example]]
name = "voudon_stabilizer_demo"
required-features = ["gpu"]

[[example]]
name = "phase_transition_demo"
required-features = ["gpu", "analysis-examples"]

[lints]
workspace = true
