[package]
name = "gororoba_cli"
version = "0.1.0"
edition = { workspace = true }
description = "CLI tools for gororoba physics simulation library"
license = "MIT"
autobins = false

# ---- Residual: dispatcher + thesis + ZD resonance + orchestration ----

[[bin]]
name = "gororoba"
path = "src/main.rs"

[[bin]]
name = "thesis-synthesis"
path = "src/bin/thesis_synthesis.rs"

[[bin]]
name = "thesis-synthesis-engine"
path = "src/bin/thesis_synthesis_engine.rs"

[[bin]]
name = "thesis-program-sweep"
path = "src/bin/thesis_program_sweep.rs"

[[bin]]
name = "thesis-lab"
path = "src/bin/thesis_lab.rs"

[[bin]]
name = "thesis-cross-tx1"
path = "src/bin/thesis_cross_tx1.rs"

[[bin]]
name = "thesis-cross-tx2"
path = "src/bin/thesis_cross_tx2.rs"

[[bin]]
name = "thesis-cross-tx3"
path = "src/bin/thesis_cross_tx3.rs"

[[bin]]
name = "thesis2-kolmogorov-2d"
path = "src/bin/thesis2_kolmogorov_2d.rs"

[[bin]]
name = "thesis2-3d-thickening"
path = "src/bin/thesis2_3d_thickening.rs"

[[bin]]
name = "zd-resonance-sweep"
path = "src/bin/zd_resonance_sweep.rs"

[[bin]]
name = "zd-resonance-bf16"
path = "src/bin/zd_resonance_bf16.rs"

[[bin]]
name = "zd-resonance-cuda"
path = "src/bin/zd_resonance_cuda.rs"

[[bin]]
name = "zd-resonance-4d"
path = "src/bin/zd_resonance_4d.rs"

[[bin]]
name = "gororoba-gate"
path = "src/bin/gororoba_gate.rs"

[[bin]]
name = "gororoba-studio"
path = "src/bin/gororoba_studio.rs"

[[bin]]
name = "spin-decoherence-pipeline"
path = "src/bin/spin_decoherence_pipeline.rs"

[[bin]]
name = "lattice-filtration-analyzer"
path = "src/bin/lattice_filtration_analyzer.rs"

[[bin]]
name = "percolation-experiment"
path = "src/bin/percolation_experiment.rs"

[[bin]]
name = "test-tda-api"
path = "src/bin/test_tda_api.rs"

[[bin]]
name = "thesis-42-support"
path = "src/bin/thesis_42_support.rs"

[[bin]]
name = "vis-hyper-artifacts"
path = "src/bin/vis_hyper_artifacts.rs"

[[bin]]
name = "detect-worker-budget"
path = "src/bin/detect_worker_budget.rs"

[[bin]]
name = "docs-redirect-check"
path = "src/bin/docs_redirect_check.rs"

[[bin]]
name = "proof-dep-graph"
path = "src/bin/proof_dep_graph.rs"

[[bin]]
name = "proof-metrics"
path = "src/bin/proof_metrics.rs"

[[bin]]
name = "proof-doc"
path = "src/bin/proof_doc.rs"

[[bin]]
name = "attractor-sweep-runner"
path = "src/bin/attractor_sweep_runner.rs"

[[bin]]
name = "paper-fetcher"
path = "src/bin/paper_fetcher.rs"

[[bin]]
name = "pre-push-hook"
path = "src/bin/pre_push_hook.rs"

[[bin]]
name = "makew"
path = "src/bin/makew.rs"

[dependencies]
# Workspace domain crates (used by dispatcher + thesis + orchestration bins)
gororoba_algebra = { path = "../gororoba_algebra", features = ["lie"] }
algebra_experimental = { path = "../algebra_experimental" }
cosmology_core = { path = "../cosmology_core" }
gr_core = { path = "../gr_core" }
materials_core = { path = "../materials_core" }
optics_core = { path = "../optics_core" }
quantum_core = { path = "../quantum_core" }
spectral_core = { path = "../spectral_core" }
lbm_core = { path = "../lbm_core" }
lbm_3d = { path = "../lbm_3d" }
lbm_3d_cuda = { path = "../lbm_3d_cuda", optional = true }
stats_core = { path = "../stats_core", features = ["gpu"] }
data_core = { path = "../data_core" }
sign_imbalance = { path = "../sign_imbalance" }
neural_homotopy = { path = "../neural_homotopy" }
lattice_filtration = { path = "../lattice_filtration" }
gororoba_engine = { path = "../gororoba_engine" }
gororoba_view_raster = { path = "../gororoba_view_raster" }
gororoba_cli_physics = { path = "../gororoba_cli_physics" }
provenance_store = { path = "../provenance_store" }
tda = { workspace = true }
lbm_vulkan = { version = "0.1.0", path = "../lbm_vulkan" }
ash = { version = "0.38.0", features = ["debug"] }
# External crates
nalgebra = { workspace = true }
ndarray = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
csv = { workspace = true }
plotters = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
pgfplots = { workspace = true }
chrono = { workspace = true }
strsim = { workspace = true }
ureq.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["gpu"]
gpu = [
    "lbm_3d_cuda",
    "lbm_3d_cuda/cufft",


    "gororoba_algebra/gpu",
    "quantum_core/gpu",
    "sign_imbalance/gpu",
    "gororoba_engine/gpu",
]
hdf5-export = ["data_core/hdf5-export"]

[lints]
workspace = true
