[dependencies]
docpipe = { path = "../docpipe", features = ["fallback"] }
algebra_core = { path = "../algebra_core" }
cosmology_core = { path = "../cosmology_core" }
gr_core = { path = "../gr_core" }
materials_core = { path = "../materials_core" }
optics_core = { path = "../optics_core" }
quantum_core = { path = "../quantum_core" }
spectral_core = { path = "../spectral_core" }
lbm_core = { path = "../lbm_core" }
lbm_3d = { path = "../lbm_3d" }
lbm_3d_cuda = { path = "../lbm_3d_cuda", optional = true }
cudarc = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
stats_core = { path = "../stats_core", features = ["gpu"] }
data_core = { path = "../data_core" }
scrolls_core = { path = "../scrolls_core" }
snia_core = { path = "../snia_core" }
vacuum_frustration = { path = "../vacuum_frustration" }
neural_homotopy = { path = "../neural_homotopy" }
lattice_filtration = { path = "../lattice_filtration" }
gororoba_engine = { path = "../gororoba_engine" }
spin_tomography_core = { path = "../spin_tomography_core" }
cd_spin_bridge = { path = "../cd_spin_bridge" }
tda = { workspace = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
csv = { workspace = true }
num-complex = { workspace = true }
plotters = { workspace = true }
plotters-svg = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
strsim = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gororoba_contracts = { path = "../gororoba_contracts" }
pgfplots = { workspace = true }
chrono = { workspace = true }
latex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["gpu"]
gpu = [
    "lbm_3d_cuda",
    "lbm_3d_cuda/cufft",
    "dep:cudarc",
    "dep:nvml-wrapper",
    "algebra_core/gpu",
    "quantum_core/gpu",
    "vacuum_frustration/gpu",
    "gororoba_engine/gpu",
]
hdf5-export = ["data_core/hdf5-export"]

[lints]
workspace = true
