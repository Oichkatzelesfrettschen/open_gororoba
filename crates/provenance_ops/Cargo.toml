[package]
name = "provenance_ops"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Shared provenance operation helpers for lightweight CLI entrypoints"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
ureq.workspace = true
url = { workspace = true }
walkdir = { workspace = true }
zip.workspace = true

[package.metadata.cargo-machete]
# These 7 deps are used by source_provenance.rs, which is included via
# #[path = "../../gororoba_cli_data/src/source_provenance.rs"] in lib.rs.
# machete cannot follow cross-crate #[path] redirections.
ignored = ["chrono", "csv", "regex", "rusqlite", "toml", "url", "walkdir"]

[lints]
workspace = true
