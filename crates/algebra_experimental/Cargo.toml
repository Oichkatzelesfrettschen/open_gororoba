[package]
name = "algebra_experimental"
version = "0.1.0"
edition = { workspace = true }
description = "Experimental algebraic structures: emanation tables, E10-octonion bridge, billiard statistics, moonshine, Golay/Leech, algebraic dynamics"
license = "GPL-2.0-only"

[dependencies]
cd_kernel = { workspace = true }
algebra_analysis = { workspace = true }
# Needed for e10_octonion (lie::e8_lattice, physics::octonion_field)
# and billiard_stats (SedenionZdSystem uses algebra_core types).
algebra_core = { path = "../algebra_core", features = ["lie", "physics"] }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
num-bigint = { workspace = true }
petgraph = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true
