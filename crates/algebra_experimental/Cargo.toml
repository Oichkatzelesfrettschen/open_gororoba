[package]
name = "algebra_experimental"
version = "0.1.0"
edition = { workspace = true }
description = "Experimental algebraic structures: emanation tables, E10-octonion bridge, billiard statistics, moonshine, Golay/Leech, algebraic dynamics"
license = "GPL-2.0-or-later"

[dependencies]
cd_kernel = { workspace = true }
algebra_analysis = { workspace = true }
# Needed for e10_octonion (lie::e8_lattice, physics::octonion_field)
# and billiard_stats (SedenionZdSystem uses gororoba_algebra types).
gororoba_algebra = { path = "../gororoba_algebra", features = ["lie", "physics", "physics-sm", "analysis"] }
num-complex = { workspace = true }
wide = { workspace = true }
nalgebra = { workspace = true }
rand.workspace = true
rayon = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
num-bigint = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cudarc = { workspace = true, optional = true }
faer.workspace = true
flavor_lifts = { path = "../flavor_lifts" }
argmin = { workspace = true }
argmin-math = { workspace = true }

[features]
gpu = ["gororoba_algebra/gpu", "dep:cudarc"]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
plotters = "0.3"

[lints]
workspace = true

[package.metadata.cargo-machete]
# argmin-math provides blanket ArgminAdd/ArgminSub/ArgminMul impls for Vec<f64>
# that argmin's NelderMead solver requires at compile time.  It is not directly
# imported in source but removing it causes E0277 trait-bound errors.
ignored = ["argmin-math"]

[[bench]]
name = "su5_construction"
harness = false
