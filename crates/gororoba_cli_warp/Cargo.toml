[package]
name = "gororoba_cli_warp"
version = "0.1.0"
autobins = false
edition = { workspace = true }
license = "MIT"
description = "Warp domain CLI binaries and shared modules for gororoba"

[[bin]]
name = "warp"
path = "src/bin/warp/main.rs"
required-features = ["gpu"]

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
cudarc = { workspace = true, optional = true }
data_artifacts_core = { path = "../data_artifacts_core" }
env_logger = { workspace = true }
glob = { workspace = true }
gororoba_algebra = { path = "../gororoba_algebra", features = ["lie"] }
gororoba_cli = { path = "../gororoba_cli" }
gororoba_contracts = { path = "../gororoba_contracts" }
gororoba_engine = { path = "../gororoba_engine" }
gororoba_gpu_cuda = { workspace = true, optional = true }
gr_core = { path = "../gr_core" }
lbm_3d_cuda = { path = "../lbm_3d_cuda", optional = true }
lbm_core = { path = "../lbm_core" }
log = { workspace = true }
materials_core = { path = "../materials_core" }
ndarray = { workspace = true }
num-complex = { workspace = true }
nvml-wrapper = { workspace = true, optional = true }
optics_core = { path = "../optics_core" }
plotters = { workspace = true }
rand = { workspace = true }
spectral_core = { path = "../spectral_core" }
stats_core = { path = "../stats_core" }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["gpu"]
gpu = [
    "lbm_3d_cuda",
    "lbm_3d_cuda/cufft",
    "dep:cudarc",
    "dep:nvml-wrapper",
    "dep:gororoba_gpu_cuda",
    "gororoba_gpu_cuda/cudarc",
    "gororoba_algebra/gpu",
    "gororoba_engine/gpu",
    "stats_core/gpu",
]
hdf5-export = ["data_artifacts_core/hdf5-export"]

[lints]
workspace = true
