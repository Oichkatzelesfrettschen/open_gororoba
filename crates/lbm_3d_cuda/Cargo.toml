[package]
name = "lbm_3d_cuda"
version = "0.1.0"
edition = { workspace = true }
authors = ["open_gororoba contributors"]
description = "GPU-accelerated Lattice Boltzmann Method (D3Q19) with CUDA"
license = "MIT OR Apache-2.0"

[dependencies]
lbm_3d = { path = "../lbm_3d" }
gororoba_algebra = { path = "../gororoba_algebra" }
gororoba_gpu_bridge = { workspace = true }
gororoba_gpu_readback = { workspace = true }
gororoba_sparse_grid = { workspace = true }
gororoba_optix = { workspace = true }
gr_core = { path = "../gr_core" }
cudarc = { workspace = true }
half = { workspace = true }
libloading = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
wide = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
cosmology_core = { path = "../cosmology_core" }

[features]
default = []
cufft = ["cudarc/cufft"]
aot-cubin = []  # AOT .cubin compilation via build.rs (reclaims ~1.5 GB VRAM)

[[bench]]
name = "gpu_performance"
harness = false

[[bench]]
name = "gpu_exhaustive"
harness = false

[[bench]]
name = "gpu_scaling_ada"
harness = false

[[bench]]
name = "gpu_sparse_1024"
harness = false

[lints]
workspace = true
