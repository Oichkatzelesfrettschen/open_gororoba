[package]
name = "lbm_3d_cuda"
version = "0.1.0"
edition = { workspace = true }
authors = ["open_gororoba contributors"]
description = "GPU-accelerated Lattice Boltzmann Method (D3Q19) with CUDA"
license = "MIT OR Apache-2.0"

[dependencies]
lbm_3d = { path = "../lbm_3d" }
cudarc = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[features]
default = []
cufft = ["cudarc/cufft"]

[[bench]]
name = "gpu_performance"
harness = false

[[bench]]
name = "gpu_exhaustive"
harness = false

[lints]
workspace = true
