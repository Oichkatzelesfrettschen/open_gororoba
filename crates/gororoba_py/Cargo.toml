[package]
name = "gororoba_py"
version = "0.1.0"
edition = { workspace = true }
description = "Python bindings for gororoba physics simulation library"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
gororoba_algebra = { path = "../gororoba_algebra" }
cosmology_core = { path = "../cosmology_core" }
lbm_core = { path = "../lbm_core" }
materials_core = { path = "../materials_core" }
quantum_core = { path = "../quantum_core" }
spectral_core = { path = "../spectral_core" }
stats_core = { path = "../stats_core" }
gr_core = { path = "../gr_core" }
pyo3 = { workspace = true, features = ["extension-module"] }
numpy = { workspace = true }
sha2 = { workspace = true }
gororoba_engine = { version = "0.1.0", path = "../gororoba_engine" }
lbm_3d_cuda = { version = "0.1.0", path = "../lbm_3d_cuda" }

[lints]
workspace = true
