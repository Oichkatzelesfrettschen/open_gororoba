[package]
name = "cd_kernel"
version = "0.1.0"
edition = { workspace = true }
license = "GPL-2.0-or-later"
description = "Pure Cayley-Dickson arithmetic kernel: recursive multiplication, conjugation, norm, zero-divisor search, associator computation, and SIMD variants"

[dependencies]
aligned-vec = { workspace = true }
ash = { version = "0.38.0", optional = true }
bitvec = { workspace = true }
bytemuck = { workspace = true }
core_affinity = { workspace = true }
crossbeam-utils = { workspace = true }
cubecl = { workspace = true, optional = true }
cubecl-core = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
dyn-stack = { workspace = true }
fwht = { workspace = true }
gauss-quad = { workspace = true }
gororoba_gpu_bridge = { workspace = true }
gororoba_gpu_cubecl = { workspace = true, optional = true }
gororoba_gpu_cuda = { workspace = true, optional = true }
gororoba_gpu_vulkan = { workspace = true, optional = true }
pulp = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
simsimd = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
verified_core = { path = "../verified_core" }
wide = { workspace = true }

[features]
default = []
# `cuda` chains gororoba_gpu_cuda's `cudarc` feature so the workspace's
# consolidated Context, DeviceProbe, CompileOptions, ModuleRegistry, and
# LaunchConfig helpers are available behind the same flag that previously
# enabled raw cudarc usage. The local `cudarc` dep stays because the
# turboquant kernel-launch paths still call cudarc::driver builder APIs
# (PushKernelArg, CudaSlice<T> typed buffers) that gpu_cuda does not yet
# wrap end-to-end.
cuda = ["dep:cudarc", "dep:gororoba_gpu_cuda", "gororoba_gpu_cuda/cudarc"]
# `vulkan` chains gororoba_gpu_vulkan/ash so the workspace's consolidated
# Vulkan helpers (InstanceBuilder, Adapter, DeviceBuilder, ShaderModule,
# DescriptorSetLayoutSpec, ComputePipelineBuilder) are available behind
# the same flag that previously enabled raw ash usage. The local `ash`
# dep stays optional so the bespoke quantize() pipeline (memory mapping,
# command buffer recording with push constants) can keep calling raw
# vk handles obtained via helper accessors.
vulkan = ["dep:ash", "dep:gororoba_gpu_vulkan", "gororoba_gpu_vulkan/ash"]
# `cubecl` chains gororoba_gpu_cubecl's `cubecl` feature so the workspace's
# consolidated panic-safe `Runtime::probe()` is available alongside the raw
# cubecl + cubecl-wgpu deps that the launcher still needs for the actual
# kernel launch path.
cubecl = [
    "dep:cubecl-core",
    "dep:cubecl",
    "dep:cubecl-wgpu",
    "dep:gororoba_gpu_cubecl",
    "gororoba_gpu_cubecl/cubecl",
]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
iai-callgrind = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "flat_multiply_bench"
harness = false

[[bench]]
name = "turboquant_iai"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
# ash (vulkan feature), cubecl-core (cubecl feature), and pulp are optional
# feature-gated deps; they are intentional stubs for future GPU backends and
# are not imported in default builds.  cargo-machete flags them because the
# features are not in the default set.
ignored = ["ash", "cubecl-core", "pulp"]
