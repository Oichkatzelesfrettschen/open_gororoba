[package]
name = "cd_kernel"
version = "0.1.0"
edition = { workspace = true }
description = "Pure Cayley-Dickson arithmetic kernel: recursive multiplication, conjugation, norm, zero-divisor search, associator computation, and SIMD variants"
license = "GPL-2.0-or-later"

[dependencies]
core_affinity = { workspace = true }
rayon = { workspace = true }
wide = { workspace = true }
pulp = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }
aligned-vec = { workspace = true }
dyn-stack = { workspace = true }
crossbeam-utils = { workspace = true }
bitvec = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
verified_core = { path = "../verified_core" }
gauss-quad = { workspace = true }
cudarc = { workspace = true, optional = true }
ash = { version = "0.38.0", optional = true }
cubecl-core = { workspace = true, optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
vulkan = ["dep:ash"]
cubecl = ["dep:cubecl-core"]

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "flat_multiply_bench"
harness = false

[lints]
workspace = true
