[package]
name = "cosmology_core"
version = "0.1.0"
edition = { workspace = true }
description = "Cosmology simulations: gravastar TOV, spectral dimensions, fractal cosmology"
license = "MIT"

[dependencies]

# Numerical quadrature
gauss-quad = { workspace = true }

# Statistical distributions (Gamma function for dimensional geometry)
statrs = { workspace = true }

# RNG for synthetic data generation
rand = { workspace = true }
rand_distr = { workspace = true }

# Linear algebra (Cholesky factorization for covariance matrices)
nalgebra = { workspace = true }

# Parallel chi2 evaluation across SN data points
rayon = { workspace = true }
algebra_experimental = { path = "../algebra_experimental" }
algebra_analysis = { path = "../algebra_analysis" }
quantum_core = { path = "../quantum_core" }
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, optional = true }

# Euclid catalog reader: Apache Arrow parquet (pure Rust, zero-copy columnar)
parquet = { version = "58.0.0", optional = true, default-features = false, features = ["arrow", "snap"] }
arrow-array = { version = "58.0.0", optional = true }
verified_core = { version = "0.1.0", path = "../verified_core" }

[features]
default = []
argmin-optimizers = ["dep:argmin", "dep:argmin-math"]
euclid-catalog = ["dep:parquet", "dep:arrow-array"]

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true
