[package]
name = "navier_stokes_verify"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Exact rational continuum certificates for specified periodic Navier-Stokes data"

[dependencies]
num-bigint.workspace = true
num-integer = "0.1"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
