# Machine-readable invalidation state for retained heliosphere artifacts.
#
# An entry here means the file named by `artifact` is a historical
# output of a superseded implementation. The file stays in the tree so
# the number it once published remains auditable, and each JSON carries
# the same record under its top-level "invalidation" key. A consumer
# treats a listed artifact as unusable until a regeneration entry
# supersedes it. `stale_sha256` is the content the record applies to;
# a regenerated file has a different hash and no `invalidation` key.
#
# `regeneration_status = "regenerated"` names the successor content in
# `successor_sha256`. `successor_confidence` is "final" when the successor
# rests on inputs whose provenance is complete, and "provisional" when a
# named input defect survives the regeneration. The command, counts and
# validation for every successor live in
# data/output/heliosphere/ablations/regeneration_receipts.toml.

