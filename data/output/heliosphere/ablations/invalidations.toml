reason = "beta-join derived the ESA day of year from a non-leap month table while the default year 2008 is a leap year, so every minute after February joined plasma from the following day. The 2026-09-01 regeneration narrows what that defect explains. The leap-aware rerun reproduces n_matched 2821 exactly and Spearman 0.6511588521069863 against the published 0.6511610007246746, agreement to 2e-6, so the join shift did not move the pair set this record attributes to it. The archived exponent 0.775 is a least-squares slope over the artifact's own 17 bin means, recovered as 0.7749951 at R^2 0.7837638 against the published 0.7749921471180499 at 0.7837684502151782 and pinned by beta_join::tests::archived_exponent_is_a_fit_over_bin_means; the regenerated fits are 1.24531424197569 over the 2821 pairs and 0.5736003671943737 over the regenerated bin means. The exponent delta is therefore a fit-definition delta and the leap-year join shift is unsupported as its cause. One difference stays unexplained: the archived bins span beta 0.01 to 37.9 while the regenerated pairs span 0.0024 to 53.4, and the old non-leap code path was never rerun against these inputs, so this record does not claim the defect was harmless. The artifact stays invalidated on an independent ground: its bin construction is not in the tree, so binned_beta, binned_mean_A, binned_counts, beta_crit_approx 11.3 and the exponent fitted from them cannot be reproduced or audited."
binary = "heliosphere beta-join"
regeneration_status = "regenerated"
successor_sha256 = "6e49643a6d0465eca50a0850d42927919eb7233d61e190c911b273543ade77a6"
successor_confidence = "provisional"
regeneration_note = "regenerated 2026-09-01 by the rewritten beta-join; receipt in data/output/heliosphere/ablations/regeneration_receipts.toml. The refetch blocker named here is discharged: SRC-THEMIS-THA-ESA-DAILY carries a validated retrieval_method and a 2026-09-01 refetch of 2008 DOY 301 reproduced the cached file byte for byte. The successor stays provisional for a different reason: the quality-filtered parameters tha_peif_densityQ and tha_peif_avgtempQ return NaN on 935 of the 3931 cached rows, the cached CSVs carry no quality column, and the successor therefore joins moments the instrument team flags as suspect on about a quarter of the samples. Removing the provisional label needs a refetch that carries tha_peif_data_quality and a rerun that filters on it."
regeneration_caveat = "the successor's beta_crit_approx 13.928 is not comparable to the archived 11.288: the archived bin construction is absent from the tree, so the successor declares its own (17 geometric bins over the observed beta range, beta_crit at the largest rise in mean A between adjacent populated bins). See the [finding] table in regeneration_receipts.toml."
