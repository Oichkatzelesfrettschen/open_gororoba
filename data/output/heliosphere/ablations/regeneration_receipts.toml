# Regeneration receipts for the heliosphere artifacts listed in
# data/output/heliosphere/ablations/invalidations.toml.
#
# One [[regenerated]] entry per output file. Each entry names the command that
# produced the file, the commit and working-tree state it ran from, every input
# with its sha256, the counts the run reported, the validation commands that
# gate the code path, and the delta against the number the invalidated artifact
# published. Paths are repository-relative and every run used the primary
# checkout as its working directory.

[meta]
regenerated_on = "2026-09-01"
commit = "81f2e819a4174a3ee8eb94ad1c42a3cbffb0d951"
working_tree = "dirty: crates/gororoba_cli_physics/src/bin/heliosphere/beta_join.rs and norm_dump.rs carry the rewrite this branch commits"
binary_profile = "validation"
cargo_target_dir = ".cache/gate-target (worktree-local)"

[validation]
clippy_command = "cargo clippy -p gororoba_cli_physics --bin heliosphere --all-targets --profile validation -- -D warnings"
clippy_result = "exit 0, no diagnostics"
test_command = "cargo nextest run -p gororoba_cli_physics --bin heliosphere --cargo-profile validation -E 'test(beta_join)'"
test_result = "8 tests run, 8 passed, 7 skipped"
tolerance_boundary_note = "minute keys are integers, so the 3.25 default admits a 3-minute gap and rejects a 4-minute one; nearest_join_honors_the_tolerance_and_breaks_ties_early asserts both edges, so the plus-or-minus-3 effective window is measured rather than asserted"
test_names = [
  "beta_join::tests::leap_year_post_february_doy_counts_february_29",
  "beta_join::tests::rejects_other_years_and_invalid_dates",
  "beta_join::tests::exact_power_law_recovers_its_exponent",
  "beta_join::tests::spearman_saturates_on_a_monotone_series",
  "beta_join::tests::geometric_bins_partition_the_beta_range",
  "beta_join::tests::nearest_join_honors_the_tolerance_and_breaks_ties_early",
  "beta_join::tests::archived_exponent_is_a_fit_over_bin_means",
  "beta_join::tests::norms_csv_carries_its_normalization_label",
]

[finding]
title = "the published 0.775 exponent is a fit over bin means, and the leap-year join defect did not move this join"
detail = "Fitting the invalidated artifact's own binned_beta against its own binned_mean_A recovers exponent 0.7749951 and R^2 0.7837638 against the published 0.7749921 and 0.7837685, so the 2026-03-27 exponent is a least-squares slope over 17 bin means and not over the 2821 pairs. The regenerated leap-aware exact-minute join returns the same n_matched of 2821 and Spearman 0.6511588521069863 against the published 0.6511610007246746, a difference of 2.1e-6, so the pair set the leap-year defect was said to have shifted is reproduced almost exactly. The invalidation record's claim that n_matched=2821 is a product of the shifted join is therefore not supported by this rerun; the exponent difference is a fit-definition difference. The regression test beta_join::tests::archived_exponent_is_a_fit_over_bin_means pins the first half of this."

