# Debt baseline delta: 2026-07-10 anchor -> 2026-07-24 refresh.
#
# WHY: A dated re-measurement keeps the debt taxonomy honest between full
# baseline rewrites. This delta answers one question -- which debt classes
# moved since the strict-gate anchor -- and links the one actionable
# regression to the PR review that independently flagged the same line.
#
# WHAT: The per-metric move from the strict-gate anchor
# (data/output/audit/2026-07-09/repo_audit_anchored_2026_07_10.toml) to the
# refreshed machine snapshot
# (data/output/audit/2026-07-24/repo_audit_anchored_2026_07_24.toml).
#
# HOW: Re-run procedure:
#   REPO_AUDIT_OUT=data/output/audit/2026-07-24 make repo-audit
#   diff the [totals] block against the prior anchor.

[meta]
measured_at = "2026-07-24"
anchor = "data/output/audit/2026-07-09/repo_audit_anchored_2026_07_10.toml"
snapshot = "data/output/audit/2026-07-24/repo_audit_anchored_2026_07_24.toml"
taxonomy_reference = "plans/repo_debt_taxonomy_roadmap_2026_06_04.toml"
git_branch = "audit-refresh-pr-comment-reconciliation-2026-07-23"

# Totals: value_2026_07_10 -> value_2026_07_24 (delta). Metrics omitted here
# are unchanged from the anchor.
[totals_delta]
rust_files = { was = 2399, now = 2412, delta = 13, note = "workspace grew" }
rocq_files = { was = 297, now = 300, delta = 3, note = "three tracked proofs added" }
unsafe_blocks = { was = 520, now = 520, delta = 0, note = "flat despite +13 rust files -- no new unsafe surface" }
safety_comments = { was = 193, now = 200, delta = 7, note = "SAFETY-positive; block coverage improved" }
allow_clippy_attrs = { was = 139, now = 140, delta = 1, note = "one new suppression (the classify allow below)" }
allow_clippy_unjustified = { was = 0, now = 1, delta = 1, note = "REGRESSION -> RESOLVED this branch; see actionable_regression below" }
allow_dead_code_attrs = { was = 99, now = 102, delta = 3, note = "three new dead_code allows; below strict cap, informational" }
todo_fixme_xxx_hack = { was = 4, now = 3, delta = -1, note = "improved" }
todo_fixme_comment_resident = { was = 47, now = 46, delta = -1, note = "improved" }
