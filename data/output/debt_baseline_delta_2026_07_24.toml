[actionable_regression]
metric = "allow_clippy_unjustified"
canonical_class = "DEBT-TEST-VERIFICATION"
site = "crates/gororoba_cli_data/src/bin/document_mineru_replay.rs classify()"
description = """
A bare #[allow(clippy::too_many_lines)] on classify() entered the tree with the
document-inventory work. It trips make repo-audit-strict-unjustified (per-root
cap 0) and was independently flagged by CodeRabbit on PR #115 as finding F115-9.
The audit metric and the human review point at the same line.
"""
resolution = """
Added a mechanism-first rationale immediately above the attribute: classify() is
one flat routing decision-table whose arms share the reasons accumulator and fire
in priority order, so the length is inherent to the routing surface. This
re-justifies the allow, returning allow_clippy_unjustified to 0 in crates/.
"""
falsifier = "make repo-audit-strict-unjustified exits 0"

[interpretation]
summary = """
The window is healthy. Memory-safety debt held flat (unsafe 520/520) while the
workspace grew and SAFETY coverage rose (+7). Placeholder markers fell. The sole
non-SAFETY regression -- one unjustified clippy allow -- is closed on this branch,
so a re-pin of REPO_AUDIT_BASELINE is unnecessary: the gate passes against the
existing 2026-07-10 anchor once this branch merges.
"""
