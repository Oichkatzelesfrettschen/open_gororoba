# ----------------------------------------------------------------------------
# Methodology notes
# ----------------------------------------------------------------------------
[methodology]
audit_binary       = "crates/gororoba_cli_data/src/bin/repo_audit.rs"
strip_pass         = "Rust block comments, line comments, and \"...\" / '...' literals are replaced with whitespace before regex matching."
limitations        = """
v1 limitations vs an ideal AST-aware audit:
- Raw string literals r#\"...\"# are NOT specially handled; the strip pass treats r as identifier and may leave content intact. Negligible impact on observed counts.
- Macro-generated code is counted in source files; if a macro emits unsafe blocks they will count multiple times once expanded. v1 is correct for un-expanded source.
- The strip pass does not parse cfg-gated code; counts include #[cfg(...)] gated unsafe blocks even if they would never compile on the current platform.
"""
recommended_v2     = """
A v2 audit using `syn 2.x` would produce strictly more accurate counts for:
- unsafe blocks (per-function, per-impl, per-module)
- attribute placement (which item carries the #[ignore] or #[allow(clippy)])
- macro invocations (distinguishing definitions from call sites)
v2 is tracked in plans/ as a future refinement; v1 is sufficient for replacing v0 baseline.
"""
