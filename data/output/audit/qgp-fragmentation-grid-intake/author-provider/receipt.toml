doi = "10.1103/PhysRevD.76.074033"
result = "The matched record metadata has neither a urls field nor a documents field; the DOI identifies the charged-hadron publication. The complete API response is retained."
inspection = "jq '.hits.hits[0] | {id,metadata:(.metadata|{urls,documents,dois})}' inspire.body"

[adjudication]
