http_status = 200
exit_status = 0
result = "Institutional author-page candidate redirects to the author user page; retained HTML contains a meta-refresh link to http://www.icas.unsam.edu.ar/deflo."
provenance_boundary = "The initial institutional author-page URL is a discovery candidate; the subsequent ICAS URL is explicitly linked by its retained response. HTTP destination transport is unauthenticated."

[[request]]
id = "icas"
command = "curl -L --max-time 20 -sS -D icas.headers -o icas.body -w 'http_status=%{http_code}\\neffective_url=%{url_effective}\\n' http://www.icas.unsam.edu.ar/deflo > icas.status 2> icas.stderr"
