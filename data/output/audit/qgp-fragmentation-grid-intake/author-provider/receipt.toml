[[request]]
id = "inspire"
command = "curl -L --max-time 20 -sS -D inspire.headers -o inspire.body -w 'http_status=%{http_code}\\neffective_url=%{url_effective}\\n' 'https://inspirehep.net/api/literature?q=arxiv:0707.1506&size=1' > inspire.status 2> inspire.stderr"
request_url = "https://inspirehep.net/api/literature?q=arxiv:0707.1506&size=1"
