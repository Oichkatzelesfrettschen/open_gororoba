[finding]
primary = "The native AMDA packet contains finite RTN-vector rows, but every Bartol 1990-1995 magnetic-field row is fill-only. No finite cross-source residual is admissible."
interpretation = "The acquisition proves source coverage and parser conformance; it does not prove Bartol-AMDA agreement or independent instrument validation."
legacy_e128_status = "not_closed"
claim_status_changes = false
scientific_lane_changes = "heliosphere comparator boundary only"

[adversarial_review]
skill = "adversarial-review"
review_status = "applied"
resolved_findings = [
  "zero residuals cannot represent missing finite overlap",
  "field coverage is retained per component",
  "native HAPI metadata identity and parameter schema are validated",
  "native data bytes are hashed in every replay report",
  "malformed numeric tokens are rejected rather than counted as fills",
  "rejected native rows and empty inputs fail the CLI",
  "RTN provenance survives the native parser boundary",
  "nonfinite residual arithmetic fails explicitly",
  "residual aggregate overflow fails explicitly",
  "invalid timestamp keys and duplicate slots fail explicitly",
  "metadata hash acceptance and rejection are tested",
  "duplicate timestamp rejection is tested through the indexing helper",
  "undeclared large sentinels are rejected rather than treated as fills",
  "requested-year coverage is required on both input sides",
  "out-of-range timestamp storage boundaries fail explicitly",
]
remaining_boundary = "A no-finite-Bartol reference blocks the E-128 comparison and requires a finite Bartol capture or a separately declared SPDF-vs-AMDA experiment."

[gate]
completion_gate = "Declare the heliosphere source-boundary action complete only after a finite Bartol magnetic reference is acquired and the native AMDA parser is replayed against it under the retained field-level comparison contract."
next_action = "Acquire or lawfully resolve a finite Bartol magnetic reference, or define a separate SPDF-vs-AMDA experiment without relabeling it as Bartol-AMDA validation."
stop_condition = "Do not close E-128, do not promote heliosphere claims, and do not begin P2C2 from this source-boundary result."
