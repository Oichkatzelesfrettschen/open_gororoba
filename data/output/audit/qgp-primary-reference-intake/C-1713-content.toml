claim_id = "C-1713"
expected_statement = "The retained alice_pbpb_5020_mc_glauber epsilon2 sequence lacks an identified source table and estimator definition in the enumerated primary-source audit. Its interpretation as a two-particle-cumulant eccentricity remains unadmitted. Partial agreement of participant counts with an older-energy table establishes neither eccentricity identity nor the full reference population."
expected_where_stated = "data/output/audit/qgp-reference-population/adjudication.toml; data/output/audit/qgp-reference-population/SHA256SUMS; preserved prior comparisons in canonical content revision history"
statement = "The historical epsilon2 citation PRC 93 (2016) 034913 identifies an ALICE charged-pion, kaon and proton RAA paper at 2.76 TeV (DOI 10.1103/PhysRevC.93.034913; arXiv:1506.07287; HEPData 71310v1). The inspected primary source and its 16 advertised tables supply no eccentricity estimator table. The retained alice_pbpb_5020_mc_glauber epsilon2 sequence therefore remains unadmitted as a two-particle-cumulant eccentricity reference. Participant-count comparisons and retrieved experimental RAA tables do not establish its estimator or nine-row source identity. The original values and comparisons remain preserved."
