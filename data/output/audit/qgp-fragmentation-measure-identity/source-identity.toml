schema_version = 1
claim_id = "C-1710"
evidence_layer = "source_proposition"
review_method = "Compare retained versioned primary PDFs, decoded text and rendered equations; separate source transcription from physical calibration."
new_physical_fits = 0

[printed_2017]
source = "arXiv:1703.10852v1"
pdf = "data/output/audit/qgp-source-quenching-identity/arxiv-1703.10852v1.pdf"
equation_locator = "PDF page2 Eq2; page4 fragmentation-moment paragraph"
equation = "sum_k integral dz D_k(z) integral dx sigma_k((p+omega_c*x)/z)*(1/z)*Pbar_k(x/z)"
change_of_variable = "y=x/z; dx=z*dy cancels the displayed 1/z, leaving integral dz D_k(z) integral dy sigma_k((p+z*omega_c*y)/z)*Pbar_k(y)"
power_law_measure = "d sigma/(dy dpT) proportional to pT^(-n)"
printed_weight = "D_k(z)*z^n"
printed_mean_z = "M_(n+1)/M_n, where M_r=integral dz z^r D_k(z)"
dominance_assumption = "One dominant fragmenting partonic channel; the typical-z extraction also assumes slowly varying scaled quenching weight."
physical_ingestion = "unadmitted_measure_convention"

[jacobian_comparison]
assumption = "Ordinary number-density FF D_std(z) dz with p_h=z*p_parton and spectrum differential in dpT"
pushforward = "delta(p_h-z*p_parton) integration supplies 1/z"
conventional_weight = "D_std(z)*z^(n-1)"
conventional_mean_z = "M_n/M_(n-1)"
possible_reconciliation = "D_printed=D_std/z makes the two conventions agree; the inspected 2017 text does not declare that definition."
scope = "A measure comparison identifies an unresolved convention, rather than a demonstrated author error. Preserve the printed equation and require an explicit map before standard-FF ingestion."

