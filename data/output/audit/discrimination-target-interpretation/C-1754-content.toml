statement = "On all 166 THEMIS-D V2 crossing dates in 2015/2016, retrospective timestamp-only quarantine replaces four ambiguous timestamp fields while preserving original bytes by inverse reconstruction. The unchanged causal runner admits 4,219,790 decisions with 124,834 positives and evaluates 63 frozen THEMIS-A models with zero new training fits. Across 2,000 paired daily-file bootstrap draws, the global minimum canonical-associator ROC-AUC increment over the six-feature baseline across widths 64, 256 and 1024 and both years has approximate 95 percent interval [0.0007173048330896048, 0.0024898116600369224]. The interval supports a small positive external archive-conditional increment and lies below the historical investigator-declared 0.005 discrimination target. The target has no established application-based justification; the below-target comparison leaves practical utility unassessed. Independent support checks exclude quarantined rows and pre-reset history. Whole-file quality selection uses lookahead; online availability and ordinary-day false alerts remain unmeasured. E-283 retains its failed provider-product admission."
