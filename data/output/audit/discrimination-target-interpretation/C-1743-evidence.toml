admitted interval has upper endpoint strictly below 0.005: reject attainment of that historical discrimination target for the tested scope. A positive lower endpoint still supports a positive effect. E-282 supplies both observations; neither observation adjudicates practical utility."], inconclusive_outcomes = ["An interval contains zero, or dependence and support uncertainty prevents a sufficiently precise positive-effect decision: the positive-effect extension remains inconclusive rather than becoming an absence-of-effect claim.", "An interval touches or crosses 0.005: target attainment remains inconclusive. Failed support or precision admission independently limits effect inference. Neither condition supplies a practical-utility verdict.", "Canonical-minus-control simultaneous uncertainty intervals remain unrun or contain zero: algebra-specific superiority remains inconclusive despite fourteen to sixteen controls equaling or exceeding canonical point ROC-AUC in every final panel.", "External retrieval, identity or chronological admission remains unresolved: E-283 remains blocked with zero numerical inference. Provider-corrected source bytes require preserved provenance and a separately declared intake; sorting, deduplicating or omitting the failed date cannot manufacture campaign completion.", "Practical utility remains unassessed until a defined application, operating point, admitted prevalence and ordinary-day false alarms, missed-event and resource costs, and paired operational outcomes support a decision analysis. ROC-AUC target attainment alone cannot establish usefulness or uselessness."] }
