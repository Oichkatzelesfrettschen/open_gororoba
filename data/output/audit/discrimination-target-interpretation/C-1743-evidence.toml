depth_rationale = "The claim measures discrimination on an admitted calibrated-product archive. The enumerated maps are computational stages shared by the declared model branches. A physical interpretation of the staple embedding and cubic contraction has not been assessed; computational stage counts do not establish physical lift depth."
intervening_maps = [{ name = "timestamp_batch_admission", branch = "shared_all_models", description = "Close each timestamp batch at the next strictly later timestamp. Admit exactly one valid vector per closed batch; score at decision t using only already closed earlier batches. Apply the declared fill, malformed-row, duplicate, gap and backward-time rules.", kind = "computational" }, { name = "common_raw_support_selection", branch = "shared_all_models", description = "Select six earlier field vectors and the preceding maximum-width increment history. Every width, canonical tensor, sign control and geometric baseline uses the identical admitted decisions and raw dependency support.", kind = "computational" }, { name = "catalog_localization_labels", branch = "shared_all_models", description = "Label decision t by a same-probe V2 crossing within 120 seconds, retaining adjacent-date crossings. Labels never select raw feature supports or fit transforms on final or external observations.", kind = "computational" }, { name = "six_geometric_predictors", branch = "shared_all_models", description = "Compute last-pair magnitude change per second, last-pair rotation, six-sample cumulative rotation, maximum rotation, maximum increment divided by the declared preceding RMS, and maximum absolute determinant of three consecutive increment vectors.", kind = "computational" }, { name = "fixed_preceding_increment_rms", branch = "shared_all_models", description = "For each fixed width W, divide the maximum of five feature-window increment norms by the RMS of exactly W increments strictly preceding the six-vector window. The local statistic uses fixed coefficients and zero population-fitted parameters; its full input support is declared and shared.", kind = "computational" }, { name = "magnitude_augmentation_and_overlapping_staples", branch = "all_augmented_models", description = "Augment each GSE magnetic vector with its Euclidean magnitude. Pack four consecutive augmented vectors into R16 and construct three overlapping staples spanning the same six admitted field samples.", kind = "computational" }, { name = "matched_sparse_cubic_contraction", branch = "all_augmented_models", description = "Evaluate the canonical associator and each coefficient-sign control through the same 1848-term sparse contraction. Preserve ordered input support, coefficient magnitudes, output XOR rule and dimension; only coefficient signs vary. Generic cubic controls need not define algebras.", kind = "computational" }, { name = "shared_norm_product_normalization", branch = "all_augmented_models", description = "Normalize every cubic score by the product of the three staple norms plus 1e-30. Append exactly one canonical or control score to the six shared geometric predictors.", kind = "computational" }, { name = "fixed_log_transform", branch = "shared_all_models", description = "Apply ln(score+1e-12) to each predictor and retain f32 logged features. The transform has fixed coefficients and estimates zero population parameters.", kind = "computational" }, { name = "training_only_standardization", branch = "shared_all_models", description = "Fit each logged predictor mean and population standard deviation exclusively on admitted THEMIS-A training rows from 2007-2012. Freeze six means and six scales for each baseline, or seven means and seven scales for each augmented model.", kind = "computational" }, { name = "training_only_ridge_logistic_fit", branch = "shared_all_models", description = "Fit the intercept and six baseline slopes or seven augmented slopes with the shared convergence-checked ridge logistic procedure. Freeze all coefficients for validation, final epochs, bootstrap evaluation and any subsequently admitted external inference.", kind = "computational" }, { name = "paired_epoch_metric_and_global_minimum", branch = "shared_all_models", description = "Compute paired augmented-minus-baseline ROC-AUC in each final year and width. In every paired whole-file bootstrap draw take the global minimum canonical increment across both final years and all three widths. Compare its interval separately with zero and the historical declared 0.005 discrimination target; control comparisons retain their own uncertainty boundary.", kind = "computational" }, { name = "five_increment_rms_capacity", branch = "geometric_augmented", description = "Add logged RMS norm of the five feature-window increments divided by RMS of exactly W strictly preceding increments. Preserve six-vector support, common admission, log epsilon, normalization history and seven-predictor budget.", kind = "computational" }]
fitted_parameters = [{ branch = "fixed_local_features", count = 0, names = [], training_boundary = "The preceding-window RMS, geometric transforms, staple embedding, canonical/control tensor coefficients and norm/log transforms estimate zero population parameters. Local statistics remain input features with full causal raw support; control seeds and tensor coefficients stay fixed before fitting." }, { branch = "logistic_baseline_per_width", count = 19, names = ["intercept", "slope_dbdt", "slope_rot", "slope_cumrot6", "slope_maxrot6", "slope_pvi6", "slope_gram6", "mean_dbdt", "mean_rot", "mean_cumrot6", "mean_maxrot6", "mean_pvi6", "mean_gram6", "std_dbdt", "std_rot", "std_cumrot6", "std_maxrot6", "std_pvi6", "std_gram6"], training_boundary = "Per fixed width: seven logistic coefficients plus twelve standardization parameters, fitted exclusively on admitted THEMIS-A 2007-2012 training rows. Three baseline models retain separate fitted values. Final-year bootstrap draws resample evaluation files while retaining the original frozen training fits." }, { branch = "logistic_augmentation_per_width_and_tensor", count = 22, names = ["intercept", "slope_dbdt", "slope_rot", "slope_cumrot6", "slope_maxrot6", "slope_pvi6", "slope_gram6", "slope_cubic", "mean_dbdt", "mean_rot", "mean_cumrot6", "mean_maxrot6", "mean_pvi6", "mean_gram6", "mean_cubic", "std_dbdt", "std_rot", "std_cumrot6", "std_maxrot6", "std_pvi6", "std_gram6", "std_cubic"], training_boundary = "Per fixed width and canonical/control tensor: eight logistic coefficients plus fourteen standardization parameters, fitted exclusively on the identical THEMIS-A 2007-2012 training rows. Each of sixty augmented models has the same parameter and optimizer budget. Final and external observations supply zero fitted parameters." }, { branch = "geometric_capacity_per_width", count = 22, names = ["intercept", "slope_dbdt", "slope_rot", "slope_cumrot6", "slope_maxrot6", "slope_pvi6", "slope_gram6", "slope_rms6", "mean_dbdt", "mean_rot", "mean_cumrot6", "mean_maxrot6", "mean_pvi6", "mean_gram6", "mean_rms6", "std_dbdt", "std_rot", "std_cumrot6", "std_maxrot6", "std_pvi6", "std_gram6", "std_rms6"], training_boundary = "Eight logistic coefficients and fourteen standardization parameters per width, fitted only on admitted 2007-2012 data. Require full-rank design; freeze three model receipts before final access. Canonical and scrambled models retain their original frozen fits." }]
fixed_hyperparameters = ["Joint follow-up family: 114 exact-support contrasts plus six matched geometric-capacity contrasts under one simultaneous 120-contrast interval procedure", "Geometric training rank eight required at Gram relative tolerance 1e-10; all three model receipts freeze before final raw data access", "Post-hoc exact-support follow-up: recover all 120 final canonical/control kernels using frozen models; simultaneous centered max-absolute paired whole-file bootstrap across 114 contrasts at confidence 0.95", "Original baseline-comparison target 0.005 remains recorded. Practical equivalence remains unadjudicated until a separately declared margin; geometric capacity control requires its own matched training-only fit", "Training epochs 2007-2012; descriptive validation epochs 2013-2014; final epochs 2015 and 2016", "Six strictly earlier unique timestamp batches; current decision vector excluded", "Maximum positive gap 30 seconds and maximum six-vector feature span 30 seconds", "Common admission requires 1024 preceding increments before the six-vector window for every width and tensor", "Fixed local RMS widths 64, 256 and 1024; every width enters the primary global minimum", "Crossing localization radius 120 seconds using the hash-admitted full V2 same-probe catalog including adjacent UTC dates", "Exact finite fill sentinel -1e30; malformed and duplicate batches reset segments; backward time rejects the file", "16-dimensional overlapping staple embedding and 1848-term ordered tensor support", "Canonical tensor plus 19 independent exact-support coefficient-sign controls at seeds 1000 through 1018", "Shared norm-product denominator epsilon 1e-30", "Fixed ln(score+1e-12) transform; logged features stored as f32", "Ridge penalty 1e-6; maximum Newton iterations 25; relative deviance tolerance 1e-8", "2000 paired whole-daily-file bootstrap draws with seed 20260904; linear 2.5 and 97.5 percentile endpoints", "Bootstrap conditions on frozen training fits and observed final years; training parameters remain fixed across draws", "Historical investigator-declared discrimination target 0.005 ROC-AUC; application-based justification remains unestablished", "At least 30 admitted files and 10 positive-containing files per final year; empty classes, nonfinite metrics and nonconverged fits fail numerical admission", "External probe D, years 2015 and 2016, every planned crossing date; apply frozen THEMIS-A transforms and coefficients", "The historical target is reported separately from the sign and uncertainty of the effect. Its 0.005 value has no established application-based justification and supplies no general scientific or practical-utility pass/fail gate."]
