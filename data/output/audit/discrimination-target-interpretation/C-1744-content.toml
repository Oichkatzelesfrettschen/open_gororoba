statement = "On the admitted THEMIS-A final 2015/2016 archive, a declared post-hoc paired whole-daily-file bootstrap with 2000 draws and simultaneous 95 percent intervals across 120 canonical-minus-control ROC-AUC contrasts yields 47 control-superiority intervals, 73 intervals crossing zero, and zero canonical-superiority intervals. The family includes nineteen exact-support sign controls and one matched geometric-capacity control at widths 64, 256 and 1024 in each year. All six geometric intervals cross zero. Algebra-specific superiority is unestablished; practical equivalence is unadjudicated without a declared margin. The result conditions on frozen fits, admits no external replication, and retains the separate historical 0.005 discrimination target for the baseline comparison. That target has no established application-based justification and supplies neither a general scientific gate nor a practical-utility verdict."
