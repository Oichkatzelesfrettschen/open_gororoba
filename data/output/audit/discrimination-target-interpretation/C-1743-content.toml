claim_id = "C-1743"
expected_statement = "On the timestamp-causal THEMIS-A crossing-day archive (22,263,526 admitted decisions, 543,911 positives, 813 daily files), training-only preprocessing and ridge-logistic fits on 2007-2012 produce a small positive canonical-associator increment over six matched geometric predictors in held-out 2015 and 2016. Across 2,000 paired whole-daily-file bootstrap draws, the global minimum ROC-AUC increment over calibration widths 64, 256 and 1024 and both final years has approximate 95 percent interval [0.0010149049086891153, 0.0029188809429172872]. The upper endpoint lies below the preregistered investigator-defined 0.005 minimum and rejects the declared useful discrimination increment within the admitted archive. Fourteen to sixteen of nineteen exact-support sign controls equal or exceed canonical point ROC-AUC in every final panel; a declared post-hoc 120-contrast whole-file bootstrap comparison now finds 47 control-superiority intervals and 73 directionally inconclusive intervals, including all six matched-capacity geometric comparisons. Canonical superiority is unestablished; practical equivalence requires a declared margin. External probe-D inference remains blocked by a backward timestamp independently confirmed in the native source product."
