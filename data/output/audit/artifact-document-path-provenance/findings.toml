[canonical_migration]
mechanism = "artifact repair-paths validates a typed finite specification, exact prior path sets, regular Git-tracked repository-contained target files and SHA256. One transaction changes canonical paths and path relations and records full before/after rows, specification hash, actor and reason in export_runs. Original keys, titles, citations, statuses, source references and lanes remain preserved."
replay_behavior = "An identical repair key/specification returns the retained report after checking target bytes and post-state. Changed specifications, target bytes or artifact/path post-state fail. Canonical repair specifications describe a fixed revision; later intentional edits to owning documents require a newly evidenced specification."
command = 'CARGO_TARGET_DIR="$PWD/.cache/gate-target" cargo run --locked --profile validation -p gororoba_db --bin gororoba-db -- --repo-root "$PWD" artifact repair-paths --spec data/output/audit/artifact-document-path-provenance/repair.toml'
exports = ["provenance export-control-plane", "registry-integrity", "provenance verify-control-plane"]

[verification]
api = "Eight artifact path repair tests pass, including full-row metadata preservation, exact replay, invalid admissions, symlink components, inherited Git environment isolation and late-trigger transaction rollback."
scanner = "All 26 provenance_ops library tests pass, including document, context-chunk and generic artifact regressions. provenance_ops all-target Clippy passes with warnings denied."
idempotence = "Two canonical CLI applications emit byte-identical reports and retain one repair event."
finite_delta = "All 14 SQL assertions pass: exactly five canonical-path changes, seven removed downloaded relations and thirteen added typed relations; original artifact metadata, source references, citations, lanes, claims, transitions and prior export history remain preserved."
falsifier = "Deleting the transformed-copy relation in a scratch database makes verify-preservation.sql fail at exact_added_paths."
recovery = "git show b41a4a6f2f052513a28901a1ce31290f331e00a9:papers/extracted/moreno-2005-math0512516/table_1.csv reproduces the retained original bytes."
comparison_baseline = "mkdir -p .cache/artifact-provenance; git show 5663248a8b042c742a64b6277f545fe68418042c:registry/canonical/control_plane.sqlite3 > .cache/artifact-provenance/before.sqlite3"
comparison = "sqlite3 registry/canonical/control_plane.sqlite3 < data/output/audit/artifact-document-path-provenance/verify-preservation.sql"
availability = "provenance --repo-root MATERIALIZED_CHECKOUT --db MATERIALIZED_CHECKOUT/registry/canonical/control_plane.sqlite3 verify"
availability_boundary = "Repository-wide availability depends on the materialized checkout. The five repaired canonical paths are tracked files; other pre-existing downloaded artifacts can be host-local."
repository_gate = "make validate-local REPO_SHARE_PRIMARY_CACHE=1 CARGO_BUILD_JOBS=2 exits 0; scoped Clippy, 64 library tests and governance pass. The scanner source is compiled by provenance_ops through a path import, so its separate 26-test suite and all-target Clippy supply coverage beyond direct-path gate routing."
preintegration_availability = "All 1658 canonical path rows resolve in the union of the worktree tracked files and primary local materialization. Final single-root availability is checked after integration."

[review_hardening]
rebuild_boundary = "The host-neutral artifact inventory cannot reproduce canonical historical relations. build_fresh checks the existing database read-only before deletion; provenance reindex checks before clearing tables. Either retained repair events or canonical-only path relations cause refusal, including when claim-history loss was separately acknowledged."
rebuild_test = "A CLI rebuild of a scratch copy using --allow-transition-history-loss fails on one repair event and eight canonical-only relations. Database bytes compare identical before and after. Unit tests also preserve rows on reindex refusal and protect relations without a repair event."
tracked_targets = "Admission checks the exact Git worktree root and one regular stage-0 index entry for each replacement and related path. Untracked, ignored, unresolved and nonrepository paths fail. Materialized SHA256 remains authoritative because Git LFS index entries store pointer bytes."
specialized_identity = "Book ownership conversion is restricted to registry/book_docs.toml. End-to-end candidate extraction combines specialized external-source and generic passes: DOI and arXiv dossiers plus a citing book yield five candidates and exactly three intended artifacts."
relative_spec = "A real CLI invocation from /tmp using an absolute --repo-root and repository-relative --spec emits a byte-identical retained repair report."
focused_validation = "All 45 provenance_store library tests and all 26 provenance_ops library tests pass."
early_preflight = "Both provenance index --refresh-compat-exports and provenance export-artifact-scan --reindex-after reject a scratch database holding repair history before export writes. The database and sentinel export remain byte-identical; the four-file scratch inventory remains unchanged."
hook_environment = "The initial review push failed because fixture Git subprocesses inherited hook GIT_* overrides. Git init changed primary core.bare to true and fixture adds staged replacement.txt and transformed.txt in the feature index. The operator restored core.bare=false and removed those two fixture-only index entries; primary main remained at the base commit with clean tracked status. Repository Git subprocesses now clear inherited GIT_* overrides. A child-process regression injects redirected Git directories, index and core.bare configuration, runs the exact repair/replay test, and verifies the caller directory remains empty."

