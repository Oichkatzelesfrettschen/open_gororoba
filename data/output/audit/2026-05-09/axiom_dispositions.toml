# Axiom + Parameter disposition manifest for proofs/theories/.
#
# Generated 2026-05-09 from the anchored repo-audit count of 132 axioms +
# 64 parameters across 28+ Rocq files. Each entry records the file:line
# location, the kind (axiom or parameter), the declaration name, the
# enclosing module (.v basename), and a classification slot for human
# curation.
#
# CLASSIFICATION TAXONOMY:
#
#   module_signature_parameter
#     A Parameter declared inside a Module Type that defines an abstract
#     algebraic carrier or operation. Example: `Parameter carrier : Type.`
#     Not technical debt -- this is how Rocq expresses universal algebraic
#     properties.
#
#   module_signature_axiom
#     An Axiom declared inside a Module Type that constrains the abstract
#     algebra. Example: `Axiom mul_scale_left : forall r a b, ...`
#     Not technical debt -- it is the law side of the Module Type interface.
#
#   external_theorem_axiomatized
#     A known theorem from published mathematical literature, axiomatized
#     rather than re-proved (because the proof would require multi-thousand
#     line library development). Should carry a citation in the rationale.
#     Example: Hurwitz's theorem on real division algebras.
#
#   numerical_real_analysis
#     An axiom about real-number arithmetic, IEEE-754 floats, or special
#     functions that is not provable in the current Coq/Rocq standard
#     library. Example: FloatAxioms entries.
#
#   physics_specification
#     A specification axiom describing the behavior of a physical or
#     mathematical model that the proof script consumes as a postulate.
#     Example: `Axiom chern_integral_linear : ...` in TightBindingTopology.
#     May warrant promotion to proof-debt if the relation could be derived
#     from more primitive axioms; review case by case.
#
#   proof_debt
#     An axiom that COULD be proved with the current library but has not
#     been. This is real proof debt.
#
#   unclassified
#     Default. Needs human review.
#
# REGENERATION:
#   See data/output/audit/2026-05-09/repo_audit_anchored_2026_05_09.toml
#   for the count totals; the per-entry tuples below are produced by:
#     grep -rEn "^[[:space:]]*Axiom[[:space:]]+[A-Za-z_][A-Za-z0-9_]*|^[[:space:]]*Parameter[[:space:]]+[A-Za-z_][A-Za-z0-9_]*" proofs/theories/
#   then awk-shaped into TOML.

