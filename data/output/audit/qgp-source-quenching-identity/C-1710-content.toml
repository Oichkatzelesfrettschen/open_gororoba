statement = "The retained ALICE fixture matches all 38 freshly retrieved HEPData89396v1 Table1 rows for charged particles in Pb-Pb at 5.02 TeV, 0-5 percent centrality, including the supplied error columns. Historical diagonal stat-plus-systematic residuals omit the separately tabulated normalization uncertainty. Independent E-296 replay establishes shared fit/scoring objective conformance; physical rejection still requires admitted covariance, source ansatz and declared calibration freedom. Primary-source admission identifies arXiv2212.01324v1 Eq2 and arXiv1703.10852v1 Eq5 as positive-shift quenching-weight convolutions. The retained r_aa_model instead evaluates a negative-shift fixed-loss power with a hard cutoff. E-296 therefore validates an objective for a different ansatz; its failed fit cannot reject the identified source convolution. The source fragmentation map, pp-spectrum fit, quenching distribution and likelihood remain admission prerequisites."
