contradiction = "The source v2 relation uses directional-path eccentricity. The historical optical input computes centered second moments, and avg_path_length computes a collision-weighted radial distance. The retained cumulant table has a third, unresolved estimator identity."
implementation = "qgp_scaling::directional_path::TransverseDensityGrid::directional_moments accumulates cell-center production weights and exact piecewise-constant medium segment integrals. path_eccentricity forms the two-axis ratio. qgp_scaling::glauber::directional_density_grid samples a declared hard-sphere optical model at fixed impact parameter."
units = "rho_coll and rho_part in fm^-2, joint denominator in fm^-1, first-distance numerator dimensionless, L in fm, eccentricity dimensionless."
convention = "Positive rays from each origin, zero exterior density, midpoint production sampling. Eq9 leaves ray bounds implicit; signed-ray equivalence requires inversion symmetry."
result = "Six independent integration tests and three module tests pass. Rectangle factor-two/global-normalization, unequal density weights, independent density rescalings, coordinate scaling, reflection, axis exchange, disjoint forward support and all-cell ray intersections distinguish failures."
rectangle_result = "Uniform1-by2 fm half-widths give path eccentricity1/3 and moment eccentricity3/5. The declared finite-cell length correction agrees within1e-12 fm and the continuous rectangle length error decreases by four on grid doubling."
