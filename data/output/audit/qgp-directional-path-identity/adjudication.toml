physical_boundary = "Centrality selection, event weights, field averaging and ratio ordering remain unresolved. E-309 supplies fixed-field numerical conformance; it does not replace the geometry in a source physical fit or authenticate the historical epsilon2 rows."
downstream_boundary = "C-1710 source scaling additionally requires a source-compatible angular and centrality path prescription; retained radial distance and moment eccentricity do not supply that map. Quenching-weight, pp calibration and covariance prerequisites remain in force."
