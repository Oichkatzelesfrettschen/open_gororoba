historical_preservation = "historical-source-preservation.json verifies identical noncomment bytes for preexisting glauber.rs after excluding the new sampler, and for v2_relation.rs. Historical APIs and numerical callers retain their original inputs; CLI text labels the estimator comparison as historical sensitivity."
