# Q5: PyO3 / numpy declared-but-unused
# ----------------------------------------------------------------------------
[[question]]
id = "Q-2026-04-30-05"
area = "supply_chain"
plan_task = "T-115"
title = "pyo3 0.28 + numpy 0.28 declared workspace-wide; zero crates use them"
context = """
The workspace Cargo.toml declares pyo3 and numpy as workspace dependencies
but no crate currently consumes either. Two paths:
  (a) Remove the declarations; revisit if Python interop becomes necessary.
  (b) Wire one binding (e.g., expose algebra_analysis as a Python module)
      and add a smoke test, formalizing the declared interop strategy.

Memory notes that the user prefers PyO3 wrapping over Python scripts
(feedback_pure_rust_pyo3.md). That argues for path (b) but only if there
is a concrete consumer.

Phase 1 T-115 verification (2026-04-30):
  - root Cargo.toml: pyo3 = { version = "0.28", features = ["extension-module"] }
  - root Cargo.toml: numpy = "0.28"
  - per-crate: zero matches for `pyo3 = ` or `numpy = ` in crates/*/Cargo.toml
  - source: zero matches for `use pyo3` or `extern crate pyo3` in crates/*.rs
  - cargo-machete: silent (it does not detect workspace-level dead deps;
    see data/output/static_analysis/machete_2026_04_30.txt for that note).
"""
verification_command = "grep -rE '^\\s*pyo3\\s*=' crates/*/Cargo.toml | wc -l  # expect 0 if unused"
