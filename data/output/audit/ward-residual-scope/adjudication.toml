[retained_full_vector]
original_receipt = "data/output/audit/claim-family-evidence-adjudication/ward-independent-residuals.toml"
after_receipt = "vector-residuals-after.toml"
original_scalar_norm = 2.36262291671245853e-3
original_spinor_norm = 5.86824021281251006e-3
after_scalar_norm = 5.29674078749403643e-3
