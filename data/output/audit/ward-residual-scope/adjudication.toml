[remaining_uv_scope]
instrument = "crates/gr_core/tests/ward_source_scope.rs::orbital_and_spinor_uv_coefficients_are_separate"
observed_channel = "integral du [det*exp*J(0,0,1)]/(i*e*C(0,0,1)), C(0,0,1)=B*k0; 64 u nodes"
proper_times = [0.1, 0.03, 0.01, 0.003, 0.001]
scalar_coefficient_at_0001 = 0.666658559825103469
spinor_coefficient_at_0001 = 0.666689102654931864
finding = "Both regular-node coefficients approach +2/3 in the sampled channel. The spinor +4/3 counterterm therefore leaves a regular-node coefficient near2; source-measure conformance does not establish UV cancellation."
source_contact_locators = "2601.23279v1 B.4/B.36 retain delta12; B.8/B.39 retain coincidence delta(0); Eq4.5 states a total derivative."
implementation_contact_locators = "worldline_tensor.rs::pure_magnetic_coincidence stores equal2I coincidence contact coefficients; irreducible_tensor.rs::tilde_j_structures uses regular parts; noncoincident pure_magnetic_worldline omits delta12; Gauss-Legendre u integration samples the open interval."
causal_limit = "Equal coincidence2I terms cancel in spinor J1; blindly adding a coincidence contact cannot explain the gauge defect. The noncoincident delta12 and integration-by-parts jump contributions require separate derivation."
next_decisive_test = "At fixed proper time, independently integrate the unreduced Eq4.3/4.4 representation, add the signed Eq4.5 endpoint jump and explicit B.4/B.36 distribution coefficients, then compare componentwise to Eq4.11; omit each distribution/jump separately under the same endpoint convention."
scalar_source_blocker = "gr-qc/0412095 Eq3.11 uses a2/3 counterterm and an oppositely signed orbital J convention;2601.23279 Eq4.11 gives the spinor representation with a scalar remove-fermion/global-factor prescription. Scalar coefficient/convention reconciliation remains unresolved; coefficients were not fitted to cancel the numerical result."

