integrator = "crates/gr_core/src/photon_graviton/tensor_integrands.rs::double_integrate_rank_three, power=1"
original_defect = "The rescaled dT/T path retained an extra T^2 multiplying the counterterm."
repair = "Remove only the extra proper_time.powi(2); preserve the inherited coefficient and loop prefactors."
independent_test = "crates/gr_core/tests/ward_source_scope.rs::rescaled_counterterm_matches_source_measure"
