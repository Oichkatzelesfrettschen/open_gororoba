after_receipt = "counterterm-after.log"

[transverse]
primary_equations = "7.3 through 7.7; source PDF printed pages 17-18"
source_scope = "The source returns to off-shell unrenormalized amplitudes before deriving 7.6; the on-shell amplitude includes transverse photon polarization. Renormalized runs are reported separately."
instrument = "crates/gr_core/tests/ward_source_scope.rs::transverse_source_identity_retains_diagram_omissions_and_vector_defects"
momentum = "k=[2/3,1/3,2/3,i*sqrt(1-q)]"
transverse_basis = "e1=[1,-2,0,0]/sqrt(5); e2=[4,2,-5,0]/(3*sqrt(5)); both zeta and photon polarization range over e1,e2"
virtualities = [0.02, 0.01, 0.005]
quadrature = "T=[1e-4,20], n_u=48, n_t=96; degree-two Lagrange zero-intercept"
decisive_pair = "polarization=e1, zeta=e2; each omitted diagram retains a nonzero amplitude"
scalar_unrenormalized_absolute = 1.04235874489114200e-17
scalar_unrenormalized_normalized = 2.39971235872095274e-11
scalar_renormalized_absolute = 6.01043991459810842e-18
scalar_renormalized_normalized = 1.38372004984733028e-11
