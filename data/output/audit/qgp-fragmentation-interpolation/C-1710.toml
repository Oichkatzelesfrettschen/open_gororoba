verification_outcomes = ["E-314 both source-real variants pass all10368 per-channel comparisons each at abs2e-12 plus rel2e-11 and independent malformed-input, identity and charge controls discriminate failure.","E-311 admits all39 pp bins at each explicit energy and rejects identity/unit/group/error/decimal-order ambiguity; the two provider representations agree in390 checked numeric fields. This establishes reference identity alone.","E-310 independent mean, transform and convolution residuals and refined paired orders pass the unchanged1e-8 gate on the declared finite grid; the original failing order pair remains retained.","All 38 retained HEPData table rows match edges, RAA and stated error columns exactly; the diagonal historical scoring omits separately tabulated normalization uncertainty.","E-296 independently reproduces the shared corrected numerical objective at identical parameters and weights."]
revision_outcomes = ["Correct source attribution if a7TeV neutral-pion plot or pion/kaon-only release is presented as a5.02TeV inclusive charged calibration; retain the original comparison and declare the appropriate population.","A new provider release or corrected model definition receives a separate source identity and canonical revision; preserve original columns and objective results.","An admitted physical model comparison requires its own covariance, calibration freedom, interpretive maps and rejection rule.","A source-implementation mismatch narrows the failed fit to its actual ansatz; preserve the result and require independently verified source convolution before physical rejection."]
abandonment_outcomes = ["E-314 a precision-matched channel exceeds its frozen gate or malformed input passes admission: abandon the affected finite-mesh conformance predicate until corrected and replayed.","Any wrong source DOI, differential measure, group, bin or uncertainty passes pp admission, or any corresponding provider-representation value differs: abandon the affected table-identity predicate.","Independent source mean, Laplace or convolution residual exceeds1e-8 on the admitted grid: abandon the affected numerical conformance predicate. A paired-order failure withholds output admission until the instrument is refined at unchanged gates.","An identical-source row or uncertainty column differs, or independent same-input objective evaluation disagrees; abandon the affected implementation identity clause."]
inconclusive_outcomes = ["Source passports identify different species/energies and FF releases. The ordinary-FF versus printed2017 Jacobian map, evolved charged-total package, channel weights/scales and propagated uncertainty remain unadmitted.","Matching pp rows and a declared two-parameter fit leave calibration unexecuted while cross-bin covariance remains unadmitted. Per-source quadrature is not evidence of bin independence; the global2.3percent uncertainty remains separate.","Finite-grid quenching conformance leaves physical pp calibration, fragmentation, parton mixture, covariance and geometry pooling unadmitted; empirical order changes do not certify a continuous-mixture error bound.","Using retained radial distances or moment eccentricity leaves source geometry-to-observable mapping unadmitted even when a numerical fit passes. Fixed-field directional conformance does not establish centrality pooling.","A large diagonal chi2 alone leaves physical rejection unresolved when covariance, source ansatz or population remains unadmitted.","The six-point E-296 test establishes optimizer/objective conformance only; extrapolation to every centrality remains unexecuted.","Authenticated source equations differ from the implemented law: source-model fit agreement or rejection remains unadjudicated."]
