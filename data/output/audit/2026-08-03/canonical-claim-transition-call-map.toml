[[load_bearing_edge]]
from = "plan_claim_transition"
to = "validate_source_state"
invariant = "The plan rejects a stale status or complete source-state hash before allocating IDs."

[[load_bearing_edge]]
from = "apply_claim_transition"
to = "transaction_with_behavior(Immediate)"
invariant = "The event, children, successors, relations, revisions, and source status share one transaction."

[[load_bearing_edge]]
from = "apply_claim_transition"
to = "claims_status_requires_event"
invariant = "The status update succeeds only while the event-scoped transition context is live."

[[load_bearing_edge]]
from = "render_claim_row"
to = "splice_compat_toml_overrides(status)"
invariant = "Every generated claim row exposes the live canonical status instead of a stale cached status field."

[[load_bearing_edge]]
from = "apply_claim_transition"
to = "claim_transition_events_append_only_update/delete"
invariant = "Public replay can inspect an event but cannot mutate or delete it."

[[load_bearing_edge]]
from = "allocate_successors"
to = "claim_transition_successors and claim_relations"
invariant = "Proposal keys sort deterministically before canonical IDs and typed edges are written."

[[load_bearing_edge]]
from = "export_claim_transition_compat_paths"
to = "registry/claim_transitions.toml and registry/claim_relations.toml"
invariant = "Generated views expose prior status, verdict, evidence, assumptions, current status, and successor links without flattening history."

[[load_bearing_edge]]
from = "verify_claim_transition_invariants"
to = "status history and relation graph"
invariant = "Canonical rows, transition history, successor rows, relation edges, and evidence references resolve together."

[path_falsifiers]
stale_expected_status = "Change expected_prior_status or source-state hash; plan and apply reject without event or successor rows."
missing_evidence = "Use an unknown artifact ID; the transaction rejects before commit and source status remains unchanged."
changed_replay = "Reuse transition_key with changed raw specification; the stored content hash rejects the replay."
direct_status_write = "Issue a status UPDATE without the event-scoped context; the SQLite trigger aborts."
relation_cycle = "Inject a cycle into the typed relation graph; graph validation rejects it."
legacy_graph_tool = "Run cflow or cscope on the bounded Rust files; false or empty graph output prevents accidental semantic trust."
