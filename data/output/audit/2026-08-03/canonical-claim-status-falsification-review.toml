[synthesis]
novel_insight = "The seven-row mismatch is not one problem. It is a three-layer collapse: a source theorem, a tensor implementation predicate, and a phenomenological TCMT bridge were stored as neighboring Verified rows while their evidence paths measured different objects."
derived_consequence = "The typed transition graph must split source propositions from implementation conformance and from cross-domain model identification. Status counts then become a map of epistemic boundaries rather than a scoreboard of test counts."
control_plane_defect = "The current SQLite evidence_edges table is empty while generated compatibility edges contain rows; transition evidence must reference canonical artifacts directly until that older edge lane is repaired separately."
proposal_defect = "C-865 declares two successor concepts in its transition row but has no successor_claim_proposal entries. The transition application therefore requires a retained adjudication artifact and must not invent a silent interpretation."

