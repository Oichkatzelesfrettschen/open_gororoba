[expected]
title = "FFT of Sorted Catalog Values Tests Distributional Shape, Not Physical Periodicity"
status = "verified"
summary = "FFT of sorted catalog values (the quantile function) measures regularity of the inverse CDF, not temporal or spatial periodicity. A peak at f~0.214 describes the curvature structure of the distribution at ~1/5 of its support, not a physical signal. This is methodologically analogous to the debunked redshift periodicity claims (Karlsson 1971), which were shown by Tang & Zhang 2005 and Hawkins et al. 2002 to arise from survey selection effects and distributional artifacts. The correct spectral method for sorted distributional data is the quantile periodogram (Li 2012), not standard FFT. Sprint 50 hardening via 7 independent methods (bootstrap null, BH-FDR, permutation test, Lomb-Scargle+Baluev, multitaper F-test, IAAFT surrogates, Stouffer combination) confirms: synthetic sorted distributions do NOT produce significant ghost peaks, and the existing detections (C-784..C-786) require re-verification on real data with corrected statistics."
confidence = "high"
claim_refs = [
    "C-784",
    "C-785",
    "C-786",
    "C-789",
    "C-797",
    "C-798",
]

[revised]
title = "Sorted-value spectra retain distributional structure while discarding physical order"
status = "verified"
summary = "Sorting equal multisets produces equal estimator inputs regardless of their original physical ordering. A sorted-value FFT therefore describes the empirical distribution and declared preprocessing. The implementation reports k/N cycles per rank sample; frequency 0.214 corresponds to approximately 4.67 rank samples per cycle, rather than a location at one fifth of distributional support. Prescribing Li's quantile periodogram universally exceeds the inspected evidence; the cited body remains uninspected, and an estimator supplied t=i cannot recover discarded physical coordinates. E-071 records corrected real-data re-verification and C-784/C-785/C-786 refutations. Methods sharing input and preprocessing do not supply independent data confirmation. C-797 injection counts and uncertainty require reconciliation before interpreting calibration strength."
confidence = "high"
status_note = "Verified applies to the bounded ordering and frequency-unit lesson. Li source interpretation, calibration-denominator reconciliation and historical numerical replay remain open; high confidence applies to that bounded lesson rather than a physical detection."
claim_refs = [
    "C-784",
    "C-785",
    "C-786",
    "C-789",
    "C-797",
    "C-798",
]

