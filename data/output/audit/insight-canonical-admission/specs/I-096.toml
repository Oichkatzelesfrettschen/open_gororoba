disposition = "preserve_sorted_rank_lesson_correct_frequency_and_method_prescription"
falsifier = "A method whose input is invariant under permutations cannot recover physical ordering removed by sorting. Match the reported frequency to the code's k/N units; inspect Li's actual proposition before prescribing its estimator."
