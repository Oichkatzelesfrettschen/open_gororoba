[revised]
title = "Mean-DM distance conversion requires explicit electron and host conventions"
status = "partial"
summary = "The implemented DM-to-redshift-to-comoving-distance construction supports a declared cosmology. Macquart et al. Eq. (2) defines a mean cosmic-DM relation with an explicit electron-density helium factor and diffuse baryon fraction; Eq. (1) separates Galactic, halo and redshift-scaled host contributions. The inspected routine omits the explicit 0.875 helium factor under its documented f_IGM convention. Its constants give 927.936546 rather than the approximate comment coefficient 935; multiplying by 0.875 gives only a conditional arithmetic value, 811.944478. An initial bisection bracket of width 10 requires 30 halvings to reach width 1e-8; expanded brackets require additional halvings. Caller host-frame conventions, scatter and physical calibration remain to be admitted. C-071 supplies research motivation rather than evidence for the Macquart formula or inversion convergence."
status_note = "Partial denotes an implemented construction with unresolved source conformance. The retained primary source and arithmetic witness support the stated convention and iteration corrections. Source-faithful numerical repair, caller audit and independent astrophysical validation remain separate tasks."
claim_refs = ["C-071"]

