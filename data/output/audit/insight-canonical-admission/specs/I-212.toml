[expected]
title = "Equal-receptive-field controls expose temporal support as a benchmark confound"
status = "verified"
summary = "Matching only input variables and labels is insufficient when detectors consume different temporal windows: the staple-associator reads six raw samples while one-step rotation reads two, and equal-receptive-field controls (cumrot6, maxrot6) reverse the apparent associator-versus-rotation ranking on the same benchmark. Temporal support is a confound that decides the ranking; every baseline battery must state and match the receptive field per detector before a dominance claim is registered."
status_note = "E-242 (2026-09-01) ran the conditional-information follow-up: under 5-fold file-grouped cross-validation a logistic model on the six matched six-sample baselines reaches out-of-fold ROC-AUC 0.8428, above the standalone associator's 0.8274, and adding the associator raises it by +0.0020 [0.0017, 0.0023] (C-1731). The confound stands: most of the associator's standalone discrimination is carried by six-sample angular and magnitude statistics, and the associator's unique contribution at matched receptive field is small and nonzero. The insight is not closed."
claim_refs = [
    "C-1628",
    "C-1631",
    "C-1633",
]

[revised]
title = "Detector comparisons require local windows, calibration and fitting boundaries"
status = "verified"
summary = "The registry records six-sample angular controls maxrot6 and cumrot6 at ROC-AUC 0.8383 and 0.8352 versus associator 0.8274, reversing the one-step comparison on that benchmark. Original angular-bootstrap bodies require recovery before replay. Six consecutive rows specify sample count; equal timestamps and gaps prevent treating sample count as elapsed duration. Each comparison must separately declare local numerator window, calibration context, model-fit context and uncertainty conditioning. The later model includes two-sample dbdt/rotation features and full-day PVI calibration. Fixed-model AUC increments establish conditional discrimination in the tested model class; information-theoretic uniqueness and practical utility require separately defined targets and evidence."
status_note = "C-1738 refines PVI calibration; C-1739 bounds the E-242 fixed-model/fold result. C-1734, C-1741 and C-1743 provide separately scoped descendants, with C-1744 and C-1754 retained held-out and external results. E-242's retained AUC changes from 0.8428282832626345 to 0.84481471574976. The 0.005 comparison is a historical investigator-declared discrimination target with unestablished application justification; practical utility remains unassessed. Superseded C-1731 remains a historical reference. The temporal-support lesson survives; original angular-bootstrap replay remains pending."
