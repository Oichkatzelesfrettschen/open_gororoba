[[intervening_maps]]
branch = "shared_all_models"
name = "timestamp_batch_admission"
kind = "computational"
description = "Close each timestamp batch at the next strictly later timestamp. Admit exactly one valid vector per closed batch; score at decision t using only already closed earlier batches. Apply the declared fill, malformed-row, duplicate, gap and backward-time rules."

[[intervening_maps]]
branch = "shared_all_models"
name = "common_raw_support_selection"
kind = "computational"
description = "Select six earlier field vectors and the preceding maximum-width increment history. Every width, canonical tensor, sign control and geometric baseline uses the identical admitted decisions and raw dependency support."

[[intervening_maps]]
branch = "shared_all_models"
name = "catalog_localization_labels"
kind = "computational"
description = "Label decision t by a same-probe V2 crossing within 120 seconds, retaining adjacent-date crossings. Labels never select raw feature supports or fit transforms on final or external observations."

[[intervening_maps]]
branch = "shared_all_models"
name = "six_geometric_predictors"
kind = "computational"
description = "Compute last-pair magnitude change per second, last-pair rotation, six-sample cumulative rotation, maximum rotation, maximum increment divided by the declared preceding RMS, and maximum absolute determinant of three consecutive increment vectors."

[[intervening_maps]]
branch = "shared_all_models"
name = "fixed_preceding_increment_rms"
kind = "computational"
description = "For each fixed width W, divide the maximum of five feature-window increment norms by the RMS of exactly W increments strictly preceding the six-vector window. The local statistic uses fixed coefficients and zero population-fitted parameters; its full input support is declared and shared."

[[intervening_maps]]
branch = "all_augmented_models"
name = "magnitude_augmentation_and_overlapping_staples"
kind = "computational"
description = "Augment each GSE magnetic vector with its Euclidean magnitude. Pack four consecutive augmented vectors into R16 and construct three overlapping staples spanning the same six admitted field samples."

[[intervening_maps]]
branch = "all_augmented_models"
name = "matched_sparse_cubic_contraction"
kind = "computational"
description = "Evaluate the canonical associator and each coefficient-sign control through the same 1848-term sparse contraction. Preserve ordered input support, coefficient magnitudes, output XOR rule and dimension; only coefficient signs vary. Generic cubic controls need not define algebras."

[[intervening_maps]]
branch = "all_augmented_models"
name = "shared_norm_product_normalization"
kind = "computational"
description = "Normalize every cubic score by the product of the three staple norms plus 1e-30. Append exactly one canonical or control score to the six shared geometric predictors."

[[intervening_maps]]
branch = "shared_all_models"
name = "fixed_log_transform"
kind = "computational"
description = "Apply ln(score+1e-12) to each predictor and retain f32 logged features. The transform has fixed coefficients and estimates zero population parameters."

[[intervening_maps]]
branch = "shared_all_models"
name = "training_only_standardization"
kind = "computational"
description = "Fit each logged predictor mean and population standard deviation exclusively on admitted THEMIS-A training rows from 2007-2012. Freeze six means and six scales for each baseline, or seven means and seven scales for each augmented model."

[[intervening_maps]]
branch = "shared_all_models"
name = "training_only_ridge_logistic_fit"
kind = "computational"
description = "Fit the intercept and six baseline slopes or seven augmented slopes with the shared convergence-checked ridge logistic procedure. Freeze all coefficients for validation, final epochs, bootstrap evaluation and any subsequently admitted external inference."

[[intervening_maps]]
branch = "shared_all_models"
name = "paired_epoch_metric_and_global_minimum"
kind = "computational"
description = "Compute paired augmented-minus-baseline ROC-AUC in each final year and width. In every paired whole-file bootstrap draw take the global minimum canonical increment across both final years and all three widths. Compare its interval separately with zero and the declared 0.005 useful-increment threshold; control comparisons retain their own uncertainty boundary."

[[intervening_maps]]
branch = "geometric_augmented"
name = "five_increment_rms_capacity"
kind = "computational"
description = "Add logged RMS norm of the five feature-window increments divided by RMS of exactly W strictly preceding increments. Preserve six-vector support, common admission, log epsilon, normalization history and seven-predictor budget."

