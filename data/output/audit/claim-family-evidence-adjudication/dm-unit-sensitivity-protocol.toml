density_levels = [0.5, 1.0, 2.0]
baseline_velocity = [0.05, 0.0, 0.0]
comparison = "positive and negative force each paired with the exact zero-force baseline; uniform periodic momentum increment expected F/rho"
measurement = ["signed increment", "central difference", "relative error", "zero-control drift", "mass error", "zero observable increment"]
resolution_rule = "report every force level; first resolved level means relative error at most 0.01 for every tau/density pair, positive central response, and response above ten times the zero-control drift"
