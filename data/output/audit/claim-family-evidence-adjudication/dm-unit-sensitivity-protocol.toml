schema = "dm-unit-sensitivity-protocol-v1"
claim = "C-1681"
family = ["C-1681", "C-1682", "C-1683", "C-1684", "C-1685", "C-1686", "C-1687"]
evidence_layer = "implementation_conformance"
interpretive_depth = "not_assessed"
fitted_parameters = 0
maps = ["declared cold-stream SI drag to lattice acceleration", "local mass density times acceleration to force density", "Guo forcing to distribution populations", "population moments to velocity"]
boundary = "CPU FP64, 4 cubed periodic uniform cells, one timestep; excludes MHD, open boundaries, spacecraft inputs, gravitational frame and halo inference"
force_levels = [0.01, 0.0001, 0.000001, 0.00000001, 0.0000000001, 0.000000000001, 0.00000000000001, 0.0000000000000001, 0.000000000000000001, 0.00000000000000000001]
