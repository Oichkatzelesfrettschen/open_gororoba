statement = "For repository reference parameters and open-patch radii 2, 3 and 4, point_defect_modes returns 15, 25 and 52 spectral-gap candidates, while matched pristine patches return 18, 28 and 48. The degenerate group near model energy 2.181737 has full projector weight on the boundary and is an open-edge group, not a bulk flat-band group. The upper group at 2.23664264422176 coincides with the strict sampled gap endpoint within floating-point rounding, making raw inclusion counts precision-sensitive. A defect-only candidate near 1.84022963875 has normalized inverse participation sum|psi|^4 about 0.9020061, reciprocal participation about 1.10863995, central-cell weight about 0.9749865, and decreasing boundary weight across these three radii. These finite observations support central localization without proving uniqueness or asymptotic size independence; physical GHz calibration remains separate."
where_stated = "crates/quantum_core/src/magnonic_crystal.rs::point_defect_modes; crates/quantum_core/tests/magnonic_localization.rs; data/output/audit/claim-family-evidence-adjudication/magnonic-localization-adjudication.toml"
