provider = "https://zenodo.org/api/records/15106473"
provider_checksum = "md5:2bdaea95a50fdddbccbff2e7b1a05996"
provider_size_and_checksum = "match retained input"
input_admission = "Check Arrow validity, finite model inputs, positive shape/radius/redshift and unique admitted object IDs. Preserve every rejected physical row and its reason. Nullable unused sky/SFR metadata remain NaN; admission does not validate astrophysical column conventions."
selection = "First prepare_galaxy-admitted entry in ascending object_id order from the same sealed catalog, with the exact selected object and numerical arrays retained by the runner."
grid = [16, 16, 16]
steps = 24
tau = 0.8
dx_kpc = 1.0
alpha_zd = 0.1
density_floor = 0.045
softening_eps_cells = 0.5
morphological_ml = true
smagorinsky_cs = 0.0
collision = "MRT"
backends = ["CPU f64", "CUDA FP32"]
noise_trials = 10
seed = 42
max_relative_mass_error = 0.00001
max_mach = 0.3
budget_scope = "Engineering admission for this low-Mach periodic instrument; neither budget is a demonstrated physical accuracy bound."
observation = "Cell-major post-step D3Q19 populations provide density, mass and velocity moments. Both backends use the same host box-count oracle at the same completed step. Include readback/measurement overhead explicitly; cached pre-collision GPU macros remain outside the comparison."
stability = "Inspect every evolved step; preserve the first failed step and separate finite-state, positive-density, mass-error and Mach predicates. A rejected trial cannot pass a fractal-dimension predicate."
conditions = ["uniform + zero force", "uniform + standalone ZD force", "paired white noise + zero force", "identical paired white noise + standalone ZD force", "same Sersic galaxy + zero force", "same Sersic galaxy + full NFW/ZD force", "same Sersic galaxy + NFW force with alpha_zd=0"]
noise_pairing = "Each stochastic trial uses the same declared seed and identical initial density array across force conditions and backends."
comparison = "Preserve all six historical fixed thresholds unchanged. Separately report the paired full-minus-NFW-only Sersic contrast and paired noise-force contrasts; their magnitudes do not establish algebra specificity or physical utility."
verify = "Every expected condition/trial is present exactly once, paired inputs match, observation times match, and stable finite fields alone reach the declared historical predicates."
revise = "A surviving control reproduces the target morphology or a historical fixed threshold fails: retain the actual result and narrow the pipeline interpretation."
abandon = "Unstable/nonfinite fields, missing/duplicate rows or mismatched paired inputs invalidate that trial or contrast as a measurement."
inconclusive = "A small-grid short-duration pilot cannot adjudicate galaxy-scale behavior, asymptotic resolution convergence, or fractal physical interpretation."

[pre_execution_amendment]
parent_protocol = "null-control-protocol-before-population-admission.toml"
parent_sha256 = "27f5d7f8451ce4767994fc6de4427896643d47faf2185b37f742212c7004c342"
execution_status_when_declared = "neither CPU nor CUDA pilot executed"
kinetic_population_gate = "Every observed population must be nonnegative. Retain minimum population and separate the predicate from finite-state, positive-density, mass and Mach gates."
rationale = "Negative kinetic populations invalidate this declared nonnegative-distribution instrument, even when aggregate moments remain finite. This engineering admission is not a universal MRT stability theorem. A failure at tiny negative magnitude remains a failed strict gate; no post-run tolerance is substituted."
execution_mode = "Direct stepping with post-step readback after every completed step. Captured MRT bulk execution is outside this sampled instrument and requires a separate replay; the existing BGK capture evidence retains its own scope."
build_runtime_boundary = "The existing euclid-df-sweep Cargo target requires gpu; compile with euclid-catalog,gpu, select --cpu for CPU runtime, then omit --cpu for CUDA runtime. The declared CPU run invokes the CPU solver. Sealed Cargo manifests remain unchanged."
retention = "Each backend writes a distinct evidence directory containing original rho/force f64LE input arrays and hashes, selected object metadata, all 25 output rows, and attempted/completed step plus separate numerical predicates. The shared catalog admission ledger retains all rejected source rows and fields."
