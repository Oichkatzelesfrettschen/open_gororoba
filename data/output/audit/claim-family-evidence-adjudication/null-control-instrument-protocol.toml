evidence_layer = "implementation_conformance"
physical_interpretation = "unassessed"
preregistration_scope = "Declared before executing the repaired pilot. Historical six-condition thresholds and pipeline defects were already inspected. This is an instrument replay, not a blinded physical replication or a resolution-convergence study."
input = "data/output/audit/claim-family-evidence-adjudication/euclid-physical-measurements.parquet"
original_filename = "useful_physical_measurements.parquet"
