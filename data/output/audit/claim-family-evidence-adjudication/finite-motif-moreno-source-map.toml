[[claim_disposition]]
claim = "C-1715"
measured = "Across D=16,32,64,128,256 the minimum degree is 4 and maximum degree is 4,12,28,60,124, respectively: D/2-4, contradicting the statement D/2-3."
finite_spectral_basis = "Identical-column pair differences are exact Laplacian eigenvectors with their common degree. The retained matrices and complement-component counts support checking spectral bounds without a thresholded eigensolver."
remaining = "An asymptotic non-expansion claim requires proving the sparse degree-4 subclass and required denominator scaling at every dimension beyond the census."

[[claim_disposition]]
claim = "C-1716"
measured = "The exact complete multipartite predicate finds 7,8,9,10,11 cocktail-party components across the five dimensions. Each has m=D/4-1 parts of two vertices."
spectral_proof = "For K_(2,...,2), the constant vector has Laplacian eigenvalue 0; m within-pair differences have eigenvalue N-2; m-1 pair-sum differences have eigenvalue N. These independent vectors span N=2m dimensions. The test verifies the integer eigenvector equations for every enumerated cocktail-party component."
conditional_extension = "The spectrum formula applies to any graph already proved isomorphic to K_(2,...,2). The test does not prove that the densest motif graph retains that identity at all larger CD dimensions."
spacing_scope = "A normalized spacing list including multiplicities is mathematically defined and has a two-level degenerate distribution. Generic continuous random-matrix spacing classification is not informative; declaring the statistic itself undefined requires an explicit distinct-level or unfolding admission rule."

[[claim_disposition]]
claim = "C-1717"
analytic_proof = "For N>=2 sorted values at exactly two levels with both populated, the M=N-1 spacings contain one gap Delta>0 and M-1 zeros. Division by the mean Delta/M gives one spacing M and M-1 zeros. Population variance is ((M-1)^2+(M-1))/M=M-1=N-2. The argument covers all N and is independent of level separation and multiplicities."
normalization_boundary = "With sample-variance denominator M-1 and N>2 the variance is M=N-1. At N=2 the sample variance is undefined."
finite_arithmetic_check = "Integer cross-multiplied identities pass for N=2 through256; the general derivation is stated above rather than inferred from enumeration."

[[claim_disposition]]
claim = "C-1718"
measured = "Every component at D=16,32,64,128,256 has N=D/2-2 vertices and exact rational adjacency nullity N/2. The finite evidence extends the historical 64,128,256 floating-threshold census to exact rank and additionally covers16,32."
formal_boundary = "C1262_FlatBandFractionHalf defines 42/84 and105/210 using fixed naturals and proves arithmetic fractions. The file defines neither adjacency nor a spectrum and proves no motif-graph theorem."
remaining = "The universal CD-dimension extension requires a construction proving the paired-column decomposition and invertible quotient for all dimensions. The finite modular-rank witnesses alone do not establish that extension."

