physics_scope = "D=4 Euclidean pure-magnetic tensors with unit-natural loop parameters; one off-shell fixture and one four-point virtuality ladder, Scalar and Spinor"
independence = "The oracle reuses physics tensors and quadrature. Reverse-order component contraction, lower-point effective-polarization assembly, hypot norms and Lagrange zero-intercepts are independent. The oracle does not independently derive the worldline integrand."
fitted_parameter_count = 0
interpolation = "Two-point degree-one and three-point degree-two interpolation of computational virtuality; not a phenomenological fit"
original_evidence_preservation = "Original p1_* artifacts and experiment manifest remain unchanged; pre-repair logs retain signed limit components."

[fixture]
magnetic_field_01 = 0.1
momentum_real = [0.15, 0.0, 0.2, 0.0]
momentum_imaginary = [0.0, 0.0, 0.0, 0.0]
gravitational_parameter = [0.2, 0.1, -0.3, 0.4]
virtuality = 0.0625
lower_point_momentum = [0.0, 0.0, 0.0, 0.0]

[quadrature]
base_u_nodes = 32
base_t_nodes = 64
refined_u_nodes = 64
refined_t_nodes = 128
t_min = 1e-6
t_max = 20.0
refinement_preserves_integration_domain = true

[on_shell_ladder]
virtualities = [0.1, 0.05, 0.01, 0.005]
momentum = "[1,0,0,i*sqrt(1-virtuality)]"
gravitational_parameter = [0.0, 1.0, 0.0, 0.0]
tolerance_absolute = 1e-12
tolerance_normalized = 1e-6
limit_status = "Both sampled loops fail the original cancellation gate after the intercept sign repair."
uncertainty_status = "Uncertified: fixed-domain quadrature refinement changes components more than virtuality-order refinement; a numerical error budget remains unresolved."
zero_interval_admission = "No rigorous residual interval was constructed. Observed discretization spreads are diagnostics, not confidence intervals or remainder bounds."

[arithmetic_repair]
function = "gr_core::photon_graviton::gravitational_ward::extrapolate_pair"
original_denominator = "second.virtuality - first.virtuality"
corrected_denominator = "first.virtuality - second.virtuality"
numerator = "second.components * first.virtuality - first.components * second.virtuality"
effect = "All extrapolated component signs reverse. Euclidean norms, convergence-estimate norms and passing predicates remain unchanged."
regression_test = "affine_virtuality_extrapolation_preserves_component_signs"
independent_falsifier = "Lagrange interpolation at zero disagreed with every nonzero component of the original production intercept; the corrected production intercept agrees within 1e-12 vector norm."
failed_oracle_log = "data/output/audit/claim-family-evidence-adjudication/ward-independent-replay.log"

[omission_scope]
gauge = "Every J omission changes the tensor at the fixture. Scalar gauge residuals remain below threshold, and omit-J1 leaves the gauge residual unchanged for both loops. Gauge transversality alone therefore does not establish amplitude completeness."
one_photon = "The constant-background fixture has zero lower-point momentum and zero one-photon coefficient. Omitting that term has zero measured effect and fails to provide a discriminating control."
two_photon = "Omitting the vacuum-polarization RHS changes the scalar off-shell defect from approximately 1.04e-15 to 1.68e-5."
external_and_irreducible = "Both separate on-shell diagram limits are nonzero. The combined limit also fails; an omission does not turn a passing full identity into failure at this fixture."
tadpole = "The retained trace perturbation test independently changes the zero photon-contracted tadpole residual to a nonzero value."
spinor_cause = "Missing contact or integration-by-parts boundary contributions remain a source-derived hypothesis; the oracle does not establish the causal repair."

[replay]
gauge_command = "cargo test -p gr_core --profile validation --lib photon_graviton::tensor_ward -- --nocapture"
