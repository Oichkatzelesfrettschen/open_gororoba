gram_rank_relative_tolerance = 1e-10
widths = [64, 256, 1024]
training_years = [2007, 2008, 2009, 2010, 2011, 2012]
final_years = [2015, 2016]
feature = "Natural log of RMS norm of all five increments in the same six-vector feature window divided by RMS norm of exactly W strictly preceding calibration increments, plus the unchanged parent log epsilon. The bridge increment between calibration and feature window is excluded."
feature_budget = "Same six baseline predictors plus one geometric scalar and an intercept. The geometric model carries geometric_capacity=true and tensor=null. Legacy baseline and tensor models retain their original JSON without new false metadata."
training = "geometric-train reads only parent-admitted 2007-2012 files. Use existing training-only f64 means/scales and identical fit_irls ridge, 25-iteration budget and 1e-8 relative-deviance convergence. Preserve rank/condition diagnostics before fitting. Freeze all three model receipts before final raw access."
design_gate = "Full rank eight in standardized training design including intercept. Compute its normalized Gram spectrum with symmetric Jacobi rotations, maximum 512 rotations, off-diagonal relative tolerance 1e-13; count eigenvalues above 1e-10 times maximum. This corresponds to a singular-value relative cutoff of 1e-5. Record Gram, eigenvalues and sqrt(lambda_max/lambda_min); Gram formation squares conditioning. Rank deficiency blocks fitting without dropping predictors or changing regularization."
evaluation = "geometric-evaluate verifies protocol digest, admitted source hashes, parent identity, training design and model hashes before opening final raw files. Require identical raw/file/support/label evidence. Reproduce each canonical point within 1e-12 AUC and identical support counts, and require exact canonical AUC-kernel equality with recovered evidence."
source_amendment = "The admitted_sources table seals the entire compiled source/build set. Relative to the parent: features.rs adds a separate geometric field; fitting.rs adds an explicit geometric selector sharing standardization/IRLS/prediction arithmetic; control_uncertainty.rs adds a six-kernel extension while retaining the empty-extension 114-contrast calculation; runner/evidence dispatch and seal the new module. Cargo manifest retains the previously documented utility-binary stanza amendment. Original parent models, point records and recovery outputs remain read-only inputs."
resampling = "One 2000-draw whole-file bootstrap with seed 20260904; share each year's file multiplicities across every width and all 120 canonical-minus-control contrasts. Recompute the 95th percentile of maximum absolute centered deviation across the combined 114 exact-support and six geometric contrasts. Retain all multiplicities."
confidence = 0.95
bootstrap_draws = 2000
bootstrap_seed = 20260904
superiority = "Lower simultaneous endpoint >0 establishes canonical direction; upper endpoint <0 establishes control direction; intervals containing zero have insufficient directional precision."
equivalence = "No practical-equivalence margin is declared. A near-zero estimate or interval containing zero cannot establish practical equivalence."
minimum_useful_increment = 0.005
minimum_useful_increment_scope = "Preserve the original canonical-minus-baseline requirement and its original result. These canonical-minus-control intervals neither replace nor relax it."
limits = "Conditional on frozen fits, selected final years and crossing-catalog days. Interday independence and bootstrap coverage remain assumptions. Training uncertainty, external replication and ordinary-day operational utility are outside this analysis."
