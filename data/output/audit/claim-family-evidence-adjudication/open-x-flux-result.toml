module_sha256 = "7ac41e5a71fe71a08feb7e09625208df1760a02089adec07e7fc01e90d150ea8"
streaming = "D3Q19 populations advect to their destination; outgoing min/max-x populations are counted and leave the domain. Transverse y/z destinations wrap periodically. Missing incoming x-face slots start at zero."
min_x = "Zou-He velocity reconstruction in AoSoA storage; measure every incoming positive-x population"
max_x = "Explicit ZeroGradientPopulations closure copies only incoming negative-x populations from the adjacent streamed interior cell; measure the inserted population mass"
mutation = "Validate dimensions, storage, finite prestate, inlet velocity, timestep and reconstructed values before swapping populations; failed admission preserves solver populations and timestep"
ledger = "Record mass before streaming, outgoing and incoming mass at both x faces, mass after streaming, mass after reconstruction and independent population mass after collision"
residuals = "Streaming and boundary residuals are separate. Collision mass delta is tested against zero. Step and cumulative conservation residuals subtract measured net boundary influx, without treating collision error as an allowed mass source."
units = "Lattice population mass inventory per step; physical kilograms require rho_ref*dx^3 and a rate additionally requires division by dt"
timing = "Every declared step streams, reconstructs and collides, including the first step from initialized equilibrium populations. The historical first-step streaming omission is retained at the parent revision."

