# -----------------------------------------------------------------------
# NEXT-STEP RECOMMENDATIONS
# -----------------------------------------------------------------------
[recommendations]
high_priority_actions = [
    "Add metadata accessors for silicon, silica, silicon_nitride, germanium, alumina, diamond, quartz, tio2, ito (9 high-impact materials)",
    "Add metadata accessors for the 4 most-used Drude metals (Au, Ag, Cu, Al) and route the *_drude_lorentz variants to share them",
    "Extend MineralMetadata struct with: melting_point_k, thermal_conductivity_w_mk, debye_temperature_k, primary_doi (high value-per-byte)",
    "Mine refractiveindex.info (CC0 GitHub) for explicit Sellmeier coefficients for quartz, alumina, tio2 to replace approximated Lorentz models in oxides_tcos."
]
medium_priority_actions = [
    "Add wo3 / cs_wo3 / cawo4 / pbwo4 metadata (scheelite-structure tungstates important for scintillator physics).",
    "Add the 7 medium-priority pure-Drude metals (Be, Cr, Ni, Pd, Pt, Ti, W).",
    "Add anatase TiO2 polymorph as separate constructor (current tio2_optical models rutile only)."
]
low_priority_actions = [
    "Resolve doped_silicon_optical / srtio3_doped_optical / wo3_x_optical / silica_casimir_optical metadata via delegation to their parent materials.",
    "Track ima_status_code + mindat_id + rruff_id once an open-source mineralogical-id mapping (RRUFF API or COD) is wired into materials_data."
]

[open_source_databases_evaluated]
refractiveindex_info = { license = "CC0", url = "github.com/polyanskiy/refractiveindex.info-database", coverage = "stoichiometric_compounds_only", suitable_for = "non-mineral inorganic materials (Si, Au, SiO2, etc.)" }
rruff_project = { license = "open_for_research", url = "rruff.info", coverage = "minerals_raman_ir_xrd", suitable_for = "tourmaline_supergroup_and_other_minerals" }
crystallography_open_database = { license = "public_domain", url = "crystallography.net", coverage = "230_space_groups_with_cifs", suitable_for = "crystallographic_lattice_parameters" }
materials_project = { license = "CC-BY-4.0", url = "materialsproject.org", coverage = "DFT_computed_properties", suitable_for = "DFT-derived dielectric tensors when literature gaps exist", requires_registration = true }
optimade = { license = "varies_per_node", url = "optimade.org", coverage = "federated_materials_query_protocol", suitable_for = "cross-database lookups via OPTIMADE 1.x API" }
mindat = { license = "proprietary", url = "mindat.org", coverage = "comprehensive_mineral_id", suitable_for = "REFERENCE ONLY -- not license-compatible for redistribution" }
