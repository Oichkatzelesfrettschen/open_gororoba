# Audit: MineralMetadata coverage in optical_database
# Date: 2026-05-13
# Source commit: 696bb1d4 (tourmaline supergroup added)
# Conjecture under test: "we have all possible properties built out in this repo"
# Verdict: FALSIFIED -- 35 of 43 optical-model constructors (81.4%) lack any
# crystallographic / gemological MineralMetadata accessor. Only the 8
# tourmaline species added at commit 696bb1d4 expose the new metadata path.

[summary]
total_optical_constructors = 43
constructors_with_metadata = 8
constructors_without_metadata = 35
metadata_coverage_pct = 18.6
conjecture_verdict = "falsified"

# Properties currently captured by MineralMetadata:
#   species_name, formula, crystal_system, space_group, n_omega, n_epsilon,
#   birefringence, optic_sign, hardness_mohs, density_g_cm3, color, reference
# Properties NOT YET in MineralMetadata (future expansion candidates):
#   melting_point_k, debye_temperature_k, thermal_conductivity_w_mk,
#   thermal_expansion_1e6_per_k, electrical_resistivity_ohm_m,
#   magnetic_susceptibility, dielectric_constant_static, cleavage_planes,
#   fracture_type, streak_color, luster, fluorescence_uv_response,
#   ima_status_code, mindat_id, rruff_id, refractiveindex_info_path,
#   doi_primary_reference, type_locality, year_first_described.

