[gaps_metadata_struct_extension]
# CrystalStructureInfo today has only 6 fields. Properties any
# "exhaustive properties" claim must include:
required_additions = [
    "lattice_a_angstrom (f64): a-axis length",
    "lattice_b_angstrom (f64): b-axis length",
    "lattice_c_angstrom (f64): c-axis length",
    "alpha_deg (f64): alpha angle",
    "beta_deg (f64): beta angle",
    "gamma_deg (f64): gamma angle",
    "atoms_per_unit_cell (u32): Z, number of formula units",
    "density_g_cm3 (f64): theoretical density",
    "primary_reference (&'static str): doi or paper citation",
]
optional_future_additions = [
    "wyckoff_positions (Vec<(letter, multiplicity, x, y, z)>)",
    "atomic_basis (Vec<(element, x, y, z, occupancy)>)",
    "thermal_expansion_1e6_per_k (f64)",
    "bulk_modulus_gpa (f64)",
    "linear_compressibility (f64)",
    "elasticity_tensor (6x6 voigt notation, [[f64; 6]; 6])",
    "piezoelectric_tensor (3x6, [[f64; 6]; 3])",
    "raman_active_modes (Vec<RamanMode>)",
    "ir_active_modes (Vec<IRMode>)",
]

[open_source_data_sources_for_remediation]
# License-compatible sources for populating these fields:
crystallography_open_database = { license = "public_domain", url = "crystallography.net", api = "OPTIMADE 1.x", primary_use = "CIF files for 500k+ structures with full lattice parameters" }
rruff_project = { license = "open_for_research", url = "rruff.info", primary_use = "mineralogical samples with measured Raman/IR/XRD; type-locality references" }
materials_project = { license = "CC-BY-4.0", url = "materialsproject.org", primary_use = "DFT-computed lattice constants and elastic tensors" }
mindat = { license = "proprietary", url = "mindat.org", primary_use = "REFERENCE ONLY -- chemistry/locality lookup; cannot redistribute" }
optimade = { license = "varies", url = "optimade.org", primary_use = "federated query across COD, MaterialsProject, AFLOW, NOMAD" }

