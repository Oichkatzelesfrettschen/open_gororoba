# Audit: known_crystal_structures coverage
# Date: 2026-05-13
# Source: crates/materials_core/src/crystal_symmetry/crystal_structures.rs
# Conjecture under test: "our crystal structures and other crystal items
# have exhaustive crystalline and materials properties mined from recent
# research and sources and are fully maximally built out."
# Verdict: FALSIFIED severely. The known_crystal_structures() registry
# currently lists 3 entries (NaCl, Diamond, Wurtzite). Tourmaline -- a
# 43-species IMA supergroup with crystallographic properties already
# captured in optical_database/tourmaline.rs MineralMetadata -- has ZERO
# crystal_structures entries despite being one of the most-studied
# mineral groups in materials science.

[summary]
known_crystal_structures_count_before = 3
known_crystal_structures_count_target = 50  # next-pass target after this commit
tourmaline_supergroup_in_registry = false
metadata_extended_with_lattice_parameters = false
conjecture_verdict = "falsified"

# CrystalStructureInfo currently has 6 fields:
#   name, space_group_number, space_group_symbol, point_group,
#   lattice_system, bravais_centering.
# These are categorical; NO quantitative lattice parameters
# (a/b/c/alpha/beta/gamma), NO density, NO atomic count per unit cell,
# NO primary literature reference. Building "exhaustive properties" out
# requires extending the struct AND populating real values.

[gaps_high_priority]
# Tourmaline supergroup: 0 of 8 species in optical_database have a
# matching crystal_structures entry (despite their MineralMetadata being
# 100% populated as of commit 408b43a4).
tourmaline_species_missing = [
    "schorl", "dravite", "elbaite", "uvite",
    "liddicoatite", "rossmanite", "foitite", "povondraite",
]
# All tourmaline species share R3m (#160) trigonal lattice. Unit cell
# parameters typical for natural samples:
#   a = 15.842 - 15.985 angstrom (varies with X-site cation)
#   c = 7.075 - 7.232 angstrom
#   alpha = beta = 90 deg, gamma = 120 deg (hexagonal setting)
# Reference: Bosi et al. (2019) Lithos 322 "Tourmaline crystal chemistry".

# Foundational oxides + tetragonal structures (already in MineralMetadata
# at optical_database but NOT in known_crystal_structures):
foundational_oxides_missing = [
    { name = "alumina_sapphire", space_group = "R-3c (167) corundum", lattice = "trigonal" },
    { name = "rutile_tio2", space_group = "P4_2/mnm (136) rutile", lattice = "tetragonal" },
    { name = "anatase_tio2", space_group = "I4_1/amd (141) anatase", lattice = "tetragonal", note = "not currently in MineralMetadata either" },
    { name = "brookite_tio2", space_group = "Pbca (61)", lattice = "orthorhombic", note = "not in MineralMetadata" },
    { name = "alpha_quartz", space_group = "P3_121 (152) right-handed", lattice = "trigonal" },
    { name = "calcite", space_group = "R-3c (167)", lattice = "trigonal", note = "geologically prominent; not in MineralMetadata" },
    { name = "aragonite", space_group = "Pmcn (62)", lattice = "orthorhombic", note = "CaCO3 polymorph; not in MineralMetadata" },
    { name = "fluorite_caf2", space_group = "Fm-3m (225)", lattice = "cubic", note = "Mohs 4; reference fluorite-type" },
    { name = "spinel_mgal2o4", space_group = "Fd-3m (227)", lattice = "cubic", note = "AB2X4 reference; not in MineralMetadata" },
    { name = "galena_pbs", space_group = "Fm-3m (225) NaCl-type", lattice = "cubic", note = "thermoelectric reference" },
    { name = "pyrite_fes2", space_group = "Pa-3 (205)", lattice = "cubic", note = "semiconductor; photovoltaic candidate" },
    { name = "sphalerite_zns", space_group = "F-43m (216) zincblende", lattice = "cubic", note = "II-VI semiconductor reference" },
    { name = "scheelite_cawo4", space_group = "I4_1/a (88)", lattice = "tetragonal", note = "metadata exists; structure absent" },
    { name = "stolzite_pbwo4", space_group = "I4_1/a (88)", lattice = "tetragonal", note = "scintillator; CMS calorimeter material" },
