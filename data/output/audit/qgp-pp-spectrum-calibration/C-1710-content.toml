statement = "The retained ALICE fixture matches all 38 freshly retrieved HEPData89396v1 Table1 rows for charged particles in Pb-Pb at 5.02 TeV, 0-5 percent centrality, including the supplied error columns. Historical diagonal stat-plus-systematic residuals omit the separately tabulated normalization uncertainty. Independent E-296 replay establishes shared fit/scoring objective conformance; physical rejection still requires admitted covariance, source ansatz and declared calibration freedom. Primary-source admission identifies arXiv2212.01324v1 Eq2 and arXiv1703.10852v1 Eq5 as positive-shift quenching-weight convolutions. The retained r_aa_model instead evaluates a negative-shift fixed-loss power with a hard cutoff. E-296 therefore validates an objective for a different ansatz; its failed fit cannot reject the identified source convolution. The source fragmentation map, pp-spectrum fit, quenching distribution and likelihood remain admission prerequisites. Source Eq9 also differs from the retained collision-weighted radial distance returned by avg_path_length. E-309 verifies fixed-field directional joint moments; angular and centrality pooling require separate admission before source scaling fits. E-310 verifies the full asymptotic outgoing BDMPS positive-shift convolution through its exact Gamma/Laplace identity on the declared finite grid. Independent mean, transform, convolution and delta-loss controls pass after a retained initial quadrature-gate failure and refinement at unchanged tolerance. Numerical sensitivity is not a certified total error bound. Source fragmentation, pp calibration, parton mixture, covariance and geometry pooling remain prerequisites for physical fits. E-311 identifies the matching pp reference as HEPData86210v1 Table4 group0: primary charged particles in INEL pp at5.02TeV, |eta|<0.8, per-event dN/deta/dpT. Its39 bins carry stat/sys errors; the source separately lists2.3percent normalization uncertainty. JSON/YAML representation identity does not establish cross-bin covariance. A two-parameter amplitude/slope bin-integrated fit over10-30GeV is declared but withheld pending covariance admission; frozen n6.1 remains an historical input."
