schema_version = 1
claim = "C-1710"
evidence_layer = "implementation_conformance"
source_doi = "10.17182/hepdata.86210.v1/t4"
source_group = 0
source_energy = "5020.0 GeV"
source_reaction = "P P --> CHARGED X"
source_acceptance = "-0.8 - 0.8"
source_independent_measure = "PT [GEV]"
source_measure = "(1/(Nevt))*D2(N)/DETARAP/DPT [C/GEV]"
expected_rows_per_group = 39
source_errors = ["stat", "sys"]
source_normalization_percent = 2.3
source_normalization_scope = "Paper Table2 pp5.02TeV global normalization; Figure3 pT-dependent systematic uncertainties exclude normalization."
independent_representation = "Compare all39 bins and both explicit energy groups against independently decoded raw scalar values from the provider YAML export. The comparison checks export identity, not independent observations."
lexical_contract = "Preserve JSON strings for bin edges, values and named errors. Resolve qualifier spans from explicit group and colspan. Reject duplicate JSON object keys, wrong identity, ambiguous qualifiers, malformed selected groups, duplicate/missing uncertainties, invalid or overlapping bins and nonfinite values."
verification = "All39 rows in each energy group preserve exact selected JSON strings and agree numerically with corresponding provider YAML scalars; all identity and malformed-input controls reject."
revision = "Changed provider release or corrected measure receives separate retained input hashes and canonical history before reuse."
abandonment = "Any selected row, error, group or qualifier mismatch invalidates the affected table admission; label changes alone cannot admit another population."
inconclusive = "Table identity supplies neither cross-bin covariance nor a fitted pp exponent. Withhold physical slope calibration until the fit prerequisites below pass."

[fit_contract]
execution_status = "withheld_pending_covariance_admission"
model = "Bin-average A*(pT/10GeV)^(-n) in the admitted deta dpT yield measure; A>0 and n>0. Integrate over each published interval and divide by its width."
fitted_parameter_count = 2
fitted_parameter_names = ["amplitude", "spectral_index"]
primary_support_gev = [10.0, 30.0]
primary_bins_gev = [[10.0,13.0],[13.0,20.0],[20.0,30.0]]
primary_degrees_of_freedom = 1
sensitivity_support_gev = [[10.0,50.0],[8.0,30.0]]
selection_reason = "Primary range intersects the source high-pT regime with the retained RAA upper edge30GeV. Sensitivity ranges are declared before fitting and cannot replace the primary result after inspection."
measure_control = "A scalar conversion by67.6mb changes amplitude alone. Multiplication by pT changes a power-law index by one; dN/deta/dpT and invariant yields must have separate headers and fitted exponents. The eta-to-y map requires separate physical admission."
covariance_prerequisite = "Require an authenticated cross-bin covariance or per-source signed nuisance response. Paper quadrature across systematic sources does not specify cross-bin correlations. An assumed diagonal or common-mode model can only produce separately labeled conditional sensitivity results."
normalization_prerequisite = "Declare the global2.3percent normalization treatment; a free amplitude absorbs its shape effect. Keep source uncertainty in absolute amplitudes and physical conversions."
comparison = "Profile amplitude and compare independent objective/gradient evaluations; publish n, joint fitting freedom, source covariance, residuals and exact interval. Primary goodness-of-fit uses chi-square at fixed alpha0.05 only after covariance and sampling assumptions are admitted. Sensitivity fits remain descriptive rather than additional significance tests."
revision_outcome = "An admitted failed power-law residual gate requires curvature or narrower explicitly preregistered successor; preserve the original fit and threshold."
abandonment_outcome = "Wrong differential measure, population, bins or covariance invalidates the physical calibration; retain the frozen historical n6.1 input without calling it fitted."
inconclusive_outcome = "Missing covariance, only three primary bins, unadmitted eta-to-y mapping or fragmentation freedom limits interpretation; numerical fitting alone does not admit C-1710 physical agreement."
