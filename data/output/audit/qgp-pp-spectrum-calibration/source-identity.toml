[measure]
source_locator = "PDF page5, Section2.3, Eq2; PDF page11, Section3.1; PDF page12, Figure3 caption"
eq2 = "d2sigma/(deta dpT)=sigma_MB_pp * N_rec(Delta_eta,Delta_pT)*C(Delta_eta,Delta_pT)*epsilon_VZ/[Nevt_rec*Delta_eta*Delta_pT]"
figure_normalization = "Section3.1 divides the pp differential cross sections by the corresponding inelastic nucleon-nucleon cross section:67.6mb at5.02TeV and61.8mb at2.76TeV. Figure3 caption repeats the normalization."
table_header = "(1/(Nevt))*D2(N)/DETARAP/DPT [C/GEV]"
identity = "Table4 carries the Figure3 per-event pseudorapidity/momentum yield. Multiplication by67.6mb restores the5.02TeV differential cross-section normalization used in the source."
measure_limit = "The displayed measure is differential in pT and pseudorapidity. It contains neither an invariant1/(2*pi*pT) factor nor a dpT-squared measure. Rapidity and pseudorapidity require a separate population/Jacobian map when exact correspondence is needed."
slope_implication = "Multiplication by a momentum-independent cross section changes a fitted amplitude and preserves a power-law exponent when that amplitude is free. A momentum-dependent Jacobian changes the slope. A dpT-squared power index differs by one from the corresponding dpT index."
normalization_uncertainty_limit = "The cross-section value does not supply its own covariance or an uncertainty-free physical normalization. Any normalization nuisance must retain its source uncertainty and relation to the likelihood."

[systematics]
source_locator = "PDF page11, final paragraph before Section3; PDF page12 Figure3 caption"
source_statement = "For the evaluation of the total systematic uncertainty all contributions are considered to be uncorrelated and they are summed in quadrature."
interpretation = "The statement describes combining systematic contributions into each total uncertainty. It does not state that different pT bins are mutually uncorrelated."
figure_scope = "Figure3's lower panels exclude the normalization uncertainty; Section3.1 and the caption distinguish that uncertainty from the plotted relative systematic uncertainty."
