source_definition = "Eq2 uses corrected reconstructed counts in Delta_eta and Delta_pT intervals divided by both interval widths. The adjacent paragraph explicitly describes those intervals."
provider_representation = "All39 x entries contain low and high edges only; the inspected x objects contain zero center or shifted-effective-momentum fields."
source_center_shift_search = "The inspected PDF text supplies no bin-center shift prescription; matches for shift concern detector effects, rapidity or centrality."
model_comparison = "A source-compatible declared binned prediction integrates the model over each retained pT interval and divides by its width, with the eta acceptance also specified. Evaluating only at an arithmetic midpoint adds an approximation for a curved spectrum."
limit = "The count-per-bin definition supports an interval-averaged density interpretation. The audit does not infer a hidden Lafferty-Wyatt correction, an effective center, or exact detector response from bin edges."

