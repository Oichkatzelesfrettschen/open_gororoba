claim_id = "C-1663"
decidability = "internal"
falsifier = "False if the fused-silica standalone SFWM amplitude evaluates to zero or non-finite under the declared Malitson dispersion and 500 um thickness."
check_performed = "Read substrate_sfwm_contribution and the sfwm-implementation-source-matrix audit; recomputed dk and F(500) independently; ran the optics_core test binaries."
observed = "rate_proxy = chi3^2 * F(L)^2 with F(L) = L*sinc(dk*L/2). Independently: dk = -0.0257 per um, dk*L/2 = -6.41 rad, F(500) = 10.2 um, rate_proxy = 6.6e-42. has_contribution is true whenever |rate_proxy| > 1e-60."
verdict = "confirmed"
verdict_reason = "True and NEAR-TAUTOLOGICAL -- falsified only if the sinc lands exactly on a zero, a measure-zero coincidence. It also HAS NO DENOMINATOR, so it establishes a standalone amplitude and cannot support any statement about a fraction of a total rate. IT DUPLICATES C-838 with the fraction language stripped out."
recommended_status = "Verified"
verification_rule = "cargo test -p optics_core sfwm::tests::test_substrate_sfwm_fused_silica_500um; a stronger successor should assert the value of F(500) against an independently computed Malitson dk rather than assert nonzero."
confidence = "high"

[synthesis]
cross_claim_findings = """
The block splits into one family where the primary source decides everything and one
where the repository's own predeclared gate already decided against it.

THE RUAN-FAN FINDING IS STRUCTURAL. A GENUINE PREREGISTRATION EXISTS: git shows
p2b-preregistration.toml landed in de7a772a at 2026-08-04 14:41:46 -0700 and the
evidence in fc7778e8 at 16:48:15 -0700, and the file honestly labels its 0.01 gate as
'repository claim predicate; not stated by Ruan and Fan'. THE GATE THEN FAILED. The
retained evidence reads c849_verdict = 'Falsifies' and c850_verdict = 'Falsifies'.
C-1652, C-1654, and C-1655 are the two failed reproduction claims RESTATED AS EXISTENCE
CLAIMS about a measured envelope, with the threshold removed. The briefing predicted an
envelope fitted to the residual; what actually happened is worse-shaped, because an
unfalsifiable restatement cannot be caught by any tolerance audit. THE TELL IS
GRAMMATICAL: 'has a measured error envelope' and 'has a retained error envelope' have
no predicate that a number can violate. C-1653 and C-1657, written in the same batch,
DO carry predicates and both survive -- so the defect is per-claim drafting, not a
campaign-wide practice.

A SECOND RUAN-FAN FINDING THE RETAINED EVIDENCE DOES NOT STATE: the paper does not
derive its Figure 5 parameters at all. It says 'We use the above theory to fit these
curves.' The complex-pole, lossless-to-lossy, uniform-background procedure is verbatim
the paper's FIGURE 4 method, and the repository extended it to Figure 5 on its own.
Every claim calling the Figure 5 path 'source-derived' (C-1654, C-1655, and by
inheritance C-1657) MISATTRIBUTES A REPOSITORY CONSTRUCTION TO THE SOURCE. This also
predicts the observed asymmetry: Figure 4, where the procedure is the paper's, misses
the 0.01 gate by 1.6x, while Figure 5, where it is not, misses by 4x to 6x.

A THIRD: [fit_summary] records maximum_source_derived_test_complex_s_error = 5.6902e-2
against maximum_unconstrained_one_pole_test_complex_s_error = 3.0233e-2. THE
SOURCE-DERIVED CONSTRAINED MODEL IS BEATEN ON HELD-OUT DATA BY A GENERIC UNCONSTRAINED
SINGLE POLE, by a factor of 1.9. The preregistration's performance_rule required the
constrained model to improve on its baselines. It did not.

THE C-1656 LANDMARK DISCREPANCY IS UNEXPLAINED and the two-factor structure narrows it
usefully: scattering is off by 4.72x, absorption by 1.244x. A single normalization,
unit, or scale error produces ONE factor, not two, which eliminates the 2*lambda/pi
convention and any per-channel division. The independent layered-Mie construction
agrees with production to 4.26e-11, so this is the repository disagreeing with Ruan and
Fan's numerical simulation, not with itself.

ON THE SFWM SIDE THE PRIOR SESSION'S BLOCKER IS REAL BUT NARROWER THAN IT LOOKS.
Supplement 1 is genuinely absent from the public packet, and it does block any
adjudication of whether 25 percent is right. It does NOT block C-1662, which claims
only that the source reports it, subject to Supplement 1 assumptions. The main text is
on disk, hash-verified, and settles C-1658, C-1660, and C-1662 outright. No fetch was
required for this block and no new host was contacted.

C-834 EXPOSES AN EVIDENCE-LINKAGE DEFECT THAT THE PHYSICS HIDES. Its proposition is
true: the corrected signed path gives 0.04774, under 5 percent, pinned to 1e-14 and
cross-checked against an 80-digit fixture. But its where_stated points at
crates/optics_core/src/sfwm.rs, whose linbo3_paper_calibrated uses chi3 = 2.4e-21
against the source's 1.5e-20 and chi2 = 27e-12 against 2.5e-11, sets all three
mismatches positive in violation of the source identity, omits the Eq. 6 prefactor
entirely, records 0.088 in its own status_note, and is gated by a test asserting only
< 0.15. THREE SEPARATE ERRORS PARTIALLY CANCEL to produce a plausible-looking number.
The quarantine recorded in the P2C1 ledger was never propagated to the claim's
where_stated field.

FINALLY, THE RETAINED PROVENANCE CHAIN DOES NOT VERIFY. The Son-Chekhova PDF hashes to
...112ec8e6 on disk and in the intake SHA256SUMS, but four evidence files record
...112ec8e8 and two record the 63-character truncation ...112ec8e. The two commits
titled 'sfwm: reconcile retained evidence hashes' APPENDED A WRONG FINAL CHARACTER
rather than the right one. Independently, the Ruan-Fan ledger records tex_source_sha256
= 086721ff... while two P2B evidence files record 625f2dc4... at 61 characters, and the
.tex is not on disk to break the tie. BOTH PDFs VERIFY; only the derived records are
wrong. No claim's physics depends on this, but the audit trail currently fails its own
integrity check.
"""
