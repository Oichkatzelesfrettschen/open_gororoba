observed = "Published: 'Corollary 1.6. (Elementary facts on zero divisors). For x and y in A_n  n >= 4. 1. xy=0 <=> yx=0 <=> conj(x)y=0 <=> x conj(y)=0. 2. If x != 0 and xy = 0 then t(y)=0. 3. If y != 0 and xy = 0 then t(x)=0. 4. x^2 = 0 if and only if x = 0.' The claim's parts 1 and 2 are exact, including term order and each conjugate's placement. Index bound n >= 4 exact. Two deviations, both weakenings: the claim omits part 3 entirely, and renders part 4 as one-way 'x^2=0 implies x=0' where the paper states an iff. Formalization: C1538_MorZDSymmetry.v proves zd_symmetry : conj x = neg x -> x <> zero -> (mul x y = zero <-> mul y x = zero), i.e. only the xy=0 <=> yx=0 fragment, under two hypotheses Moreno does not need (x purely imaginary, x nonzero); the conjugate leg is a one-directional lemma zd_conj_vanishes. The file's header states this narrowing explicitly and honestly. Parts 3 and 4 are not formalized there."
