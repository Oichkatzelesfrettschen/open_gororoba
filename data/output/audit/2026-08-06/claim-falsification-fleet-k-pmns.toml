[synthesis]
cross_claim_findings = """
All three PMNS claims share one root object: the NuFit60::normal_ordering()
literal at crates/algebra_experimental/src/experimental_predictions.rs:117-163,
labelled 'NuFit 6.0 (2024) global oscillation fit -- normal ordering (NO), with
SK atmospheric. Source: www.nu-fit.org, NuFit 6.0 release.' Every field is
traceable, and none of them to NuFit 6.0:

  theta_12 = 33.41             = NuFit 5.2 (2022) NO best fit, exactly
  theta_13 = 8.54              = NuFit 5.2 / 5.3 NO without-SK best fit
  theta_23 = 49.0              = NuFit 5.0 (2020) NO without-SK best fit
  delta_CP = 195               = NuFit 5.0 (2020) NO without-SK best fit
  dm21_sq  = 7.53e-5 +/-0.18   = PDG 2021/2022 Summary Table, exactly
  dm31_sq  = 2.453e-3 +/-0.033 = PDG 2021/2022 Delta_m^2_32 (NO), exactly
  delta_CP 1-sigma [138,258]   = matches NO published NuFit 1-sigma interval in
                                 v5.0, v5.1, v5.2, v5.3, v6.0 or v6.1
  delta_CP 3-sigma [0,360]     = no NuFit release has a full-circle 3-sigma;
                                 v6.0 gives 124->364 (w/ SK), 96->422 (w/o SK)

A four-source composite (two NuFit releases four years apart, two SK variants,
and the PDG listing) published under a single 2024 label. The mislabel is the
shared hidden assumption of the whole block and decides all three claims at
once. It also explains the delta_CP arithmetic: pull -0.526 is exactly
(165-195)/57 and -1.789 is exactly (93-195)/57, computed against the constructed
contour -- against neither mass ordering nor either SK variant of any real
release.

No single NuFit variant makes the block coherent. There is exactly ONE variant
-- NuFit 6.0 without SK -- under which C-1530's three angles AND C-1531's CP-A
all land inside 1-sigma, and it is not the variant the code names. At that same
variant C-1532 sits at 2.85 percent against its 3 percent threshold, the
tightest of any. At NuFit 6.1 (2025) C-1530 and C-1531 fail under both SK
variants because 6.1 places theta_23 firmly in the first octant (43.3) whether
or not SK is included. Registry staleness is real and COMPOUND: the claims were
stale relative to the release they cite on the day they were written
(2026-03-23, sixteen months after NuFit 6.0), and are now additionally stale
relative to 6.1.

C-1531 contradicts the repo's own scorecard. registry/scorecard.toml OBS-017,
amended 2026-03-22, states 'Framework prediction is genuinely falsified on
delta_CP' and 'Sign systematics (8 combos) confirm NO route to delta=195'.
C-1531, dated 2026-03-23, asserts CP-A is inside NuFit 1-sigma. That
contradiction needed no external source at all and sat one day apart in the same
registry for over four months.

An inversion worth naming: the suspicion that a 120-degree window makes C-1531
near-unfalsifiable is correct as far as it goes -- 120 deg is 33.3 percent of
the circle against the 67 deg (18.6 percent) NuFit 6.0 with-SK reality, and the
'3-sigma = [0,360]' sub-test is vacuous by construction. But the inflated window
did not manufacture a pass. It CONCEALED a real exclusion: CP-B at 93 deg lies
outside the published NuFit 3-sigma range in all four release/variant
combinations checked. The framework's CP-B prediction is excluded at more than
3 sigma by existing global data, today, without waiting for DUNE or HyperK.
That is the strongest result in this block and the claim as written asserts the
opposite.

SCOPE LIMIT: these refutations are of the OVERLAY -- the NuFit comparison layer
-- not of the underlying fit values. scorecard OBS-010/011/012 carry claim_id
C-1492 and OBS-017 carries C-1494/C-1498; those claims are outside this block
and are not touched. What is refuted is the assertion that the scorecard values
sit inside NuFit 6.0 contours, not the derivation that produced the values.

The two Moreno claims are unrelated and both survive. Their shared pattern is
the mirror image of the PMNS half: the transcription is exact where it matters
(conjugate placement, index bound, operator side, domain, form) and the defects
are all UNDER-statement -- a dropped sub-part, an iff weakened to an
implication, a Remark cited as a Proposition. The 2026-05-28 remediation and the
feedback_moreno_plan_corrections note appear to have done their work: no
transcription trap of the kind that memory warned about survives. What the Rocq
files do NOT do is prove the claims at the stated generality, and both files say
so in their own headers.
"""
new_claims_proposed = """
1. The delta_CP value 93 deg (CP-B, the framework's maximal-CP extraction) is
   excluded at more than 3 sigma by the NuFit global fit in every published
   release/variant combination from NuFit 6.0 (2024) onward: below the 3-sigma
   lower edge of 124 (6.0 with SK), 96 (6.0 without SK), 125 (6.1 with SK) and
   114 (6.1 without SK). FALSIFIER: a NuFit release whose NO 3-sigma delta_CP
   range includes 93 deg, or a corrected framework extraction moving CP-B above
   the current lower edge. The 6.0-without-SK margin is only 3 deg, so a modest
   future shift could reopen that one variant.

2. WITHDRAWN 2026-08-06 (orchestrator post-write review). The withdrawn text
   read: "The scorecard theta_23 = 48.99 deg is excluded at 5.7 sigma (with SK)
   by NuFit 6.0 and 5.9 sigma by 6.1, because both place theta_23 in the first
   octant (43.3). The framework's second-octant theta_23 is a FALSIFIED
   prediction against current global data, not merely an untested one."
   It is withdrawn because 5.69 and 5.9 are LOCAL-GAUSSIAN pulls formed against
   the upper 1-sigma half-width of a visibly non-Gaussian delta-chi2 profile.
   They are not confidence levels and must not be reported as exclusions.
   48.99 deg lies INSIDE the published 3-sigma interval at both releases
   ([41.3, 49.9] at 6.0 with SK; [41.27, 49.86] at 6.1 with SK).
   REPLACEMENT PROPOSITION: theta_23 = 48.99 deg lies outside the 1-sigma
   interval that the scorecard claims contains it, under NuFit 6.0 and 6.1 both
   with and without SK, while remaining inside the published 3-sigma interval of
   each. FALSIFIER: a NuFit release whose NO 1-sigma theta_23 interval contains
   48.99 deg. The octant preference itself is unstable across releases and
   sensitive to SK inclusion, so no exclusion strength attaches to it.

3. The NuFit60 struct is a four-source composite (NuFit 5.0, NuFit 5.2, PDG
   2021/2022) mislabelled as a single NuFit 6.0 with-SK NO column, and its
   dm31_sq field holds PDG's Delta_m^2_32 rather than Delta_m^2_31. FALSIFIER:
   any single published NuFit release column reproducing all six central values
   and both sigma bands simultaneously. Six releases checked; none does.

4. proofs/theories/C1538_MorZDSymmetry.v and C1539_MorSkewSymm.v establish
   strictly weaker theorems than C-1538 and C-1539 assert -- the former needs x
   purely imaginary and nonzero where Moreno needs neither, and neither closes
   Ker(L_x) = Ker(R_x) at Moreno's generality. FALSIFIER: a Rocq theorem
   discharging Corollary 1.6 part 1 with no hypotheses on x, or the Remark's
   kernel equality for all x in circ-A_n including x = 0.
"""
