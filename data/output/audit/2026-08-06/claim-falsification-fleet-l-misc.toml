[synthesis]
cross_claim_findings = """
Three of seven (C-970, C-980, C-990) share one move: an algebraic dimension or component
count is read directly as a count of physical objects, with no derivation fixing any
physical scale from the algebra. C-970 sets n_nacelles = cd_dimension by literal
assignment; C-980 gets its 16 planes from a hardcoded index pairing that never touches
the zero-divisor graph it invokes, and derives no angular scale; C-990 embeds 3D vectors
into 64D with |cos(17i)|, |sin(31i)|, |cos(43i)| padding and a free coupling alpha. All
three cited implementations produce the asserted structure by construction rather than by
computation. Falsified if any one supplies a map from the algebra to a length, angle, or
force -- a nacelle count emerging from an energy minimization, an angular splitting in
microarcseconds, or an alpha fixed independently of the flyby data.

A sharper pattern is specific to the Provisional claims dated 2026-03-04 and 2026-03-05
(C-960 nearby, C-970, C-980, C-990): each carries a status_note of the form 'Phase X
complete/initiated. Rust implementation and Rocq proofs pending.' In every case the code
that does exist is a stub that announces the conclusion. C-970's sweep prints 'Phase
transition detected' from an if on the loop index; C-990's drag gates on a condition
provably never satisfied and returns zero; C-768's own status_note admits the coupling
layer was never written. The shared hidden assumption is that a compiling binary in
where_stated constitutes evidence. This is a CLASS DEFECT in how where_stated was
populated for the 2026-02/03 tranche, not seven independent errors.

C-990's k == 0 defect and C-1362's spill hazard both turn on an exact structural property
of the code that no amount of running reveals, because in one case the answer is silently
zero and in the other silently low-precision. Both are caught by reading, not testing --
which is why neither has a verification_rule edge today.

C-1629 is the counter-example showing the registry can do this well: predeclared strata, a
conservative min-over-strata statistic quoted in preference to the flattering bulk delta,
explicit supersession of the earlier moving-block design, a documented deduplication defect
preserved as an artifact, and a self-limiting final sentence recording the C-1633 sign
reversal. Worth stating: its effect is +0.002 AUC on 23.7M samples -- statistically nonzero
and practically negligible.
"""
new_claims_proposed = """
1. "No alternator violation in any Cayley-Dickson algebra has k = 0, because the associator
   with the identity vanishes identically; therefore any contraction gated on k == 0 is
   identically zero." Falsifier: exhibit dim and (i, j) with [e_i,e_j,e_0] + [e_j,e_i,e_0]
   != 0. Enumerated to dim 64 with zero hits.

2. WITHDRAWN 2026-08-06 (orchestrator post-write review). The withdrawn text read:
   "the ratio 2688/336 is exactly 8, pointing at a counting-convention difference
   (ordered rather than i<j pairs, or per-output-axis rather than per-triple) rather
   than an arithmetic error on either side ... Resolution: ... NOT RUN."
   The convention hypothesis is wrong and the resolution is no longer outstanding.
   2688 is the BOX-KITE PERMUTATION count, carried in this repository as
   crates/algebra_experimental/src/cd_tower_violations.rs BOX_KITE_VIOLATION_COUNTS[16]
   = 2688 with the doc comment "7 box-kites x 384 permutations". The alternator count
   is EXACT_ALTERNATOR_COUNTS[16] = 336 in the same file, and the reimplementation
   reproduces it exactly, as it does 5040 at D=32 and 52080 at D=64. The two constants
   are DIFFERENT topological invariants and the file says so.
   REPLACEMENT PROPOSITION: the doc comment on crates/algebra_analysis/src/avt.rs
   commits a cross-invariant conflation -- a box-kite statistic copied into the
   documentation of an alternator tensor -- and states a candidate-space cardinality
   that is also wrong, since the implemented loops range over C(16,2)*16 = 1920
   triples, not 16^3/2 = 2048. Falsifier: an enumeration of the tensor's own loop
   bounds yielding 2048 candidates or 2688 violations at D=16.

3. "MathComplexity::KerrNewman is a dead enum variant: constructed in
   crates/lbm_vulkan/src/lib.rs and read nowhere, so no relativistic geometry reaches any
   lbm_vulkan shader." Falsifier: a grep for MathComplexity outside lib.rs returning a use
   site.

4. "The Alcubierre wall energy density for a 1 um bubble exceeds the parallel-plate Casimir
   density at any gap above 10 nm by more than 1e38, independent of bubble velocity down to
   1 m/s." Falsifier: a geometry and velocity where the ratio drops below 1e38.

5. "In the deduplicated THEMIS-A staples benchmark the file cluster is exactly the day
   cluster: data/output/tha_matched_files.csv has 815 rows and 815 distinct (year, doy)."
   Falsifier: any repeated (year, doy). This is the precondition C-1629's population
   inference rests on and it is currently untested.

6. "The cached experiment binary at
   .cache/exp-staples-target/release/staples-roc-cluster-bootstrap no longer accepts the
   argument list in E-239's own registered run command, so the cache artifact cannot
   replay its registered experiment." Falsifier: the cached binary accepting --col-a.
   GENERALIZES to a proposed cache-staleness gate over all registered experiment
   binaries -- if one cached binary has drifted from its registered run command, others
   likely have too, and no current check would notice.
"""
gaps = """
