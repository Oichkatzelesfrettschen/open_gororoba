[synthesis]
cross_claim_findings = """
THE C-820 / C-822 'GAP' IS NEITHER PHYSICAL NOR A GAP. Both claims report THE SAME
SCALAR. ward.rs check_gravitational_ward assigns `let residual = irr_residual;`, and
irreducible.rs multiplies its entire integrand by `let on_shell_factor = 0.0_f64;`. The
probe confirms both return IEEE 0x0 at every field configuration and both loop types.
The two tolerances are TWO THRESHOLDS APPLIED TO ONE COMPILE-TIME CONSTANT, so the
numbers are incomparable rather than discrepant, and neither is a measurement. This
generalizes: THREE OF THE FOUR legacy Ward checks (tadpole and external return literal
0.0 with `let _ = config;`, gravitational aliases the irreducible) NEVER TOUCH THE
AMPLITUDE AT ALL.

THE SUPERSESSION QUESTION RESOLVES MORE SHARPLY THAN PROPOSED. C-1635 and C-1637 do
replace C-820 and C-822 with a real instrument, but they do not merely RELOCATE them --
THEY CONTRADICT THEM. Where the tensor path actually contracts the amplitude, the spinor
gauge residual is 2.3e-2 and the on-shell gravitational combination is 2.4e-3 to 5.9e-3,
against a 1e-6 tolerance. So 'Superseded' UNDERSTATES the finding: the successor evidence
FALSIFIES the predecessor quantifiers. Refuted is the correct disposition for C-820 and
C-822, with the source propositions preserved intact in C-1634 and C-1636.

THE SCALAR/SPINOR SPLIT IS THE BLOCK'S SHARPEST SINGLE FACT and it is new as a
source-versus-implementation contradiction. The grid divides 51/51 EXACTLY along loop
type: scalar normalized residuals 2.2e-18 to 1.6e-17, spinor 2.26e-2 to 2.4e-2 --
SIXTEEN ORDERS APART. Ahmadiniaz et al. state directly, one sentence before Eq. (7.1),
that 'there is no difference between the scalar and spinor-loop cases'. THE SOURCE
THEREFORE PREDICTS THE TWO PATHS AGREE, AND THE REPOSITORY'S OWN EVIDENCE SHOWS THEY DO
NOT. That localizes the defect to the spinor contact or integration-by-parts boundary
term WITH SOURCE AUTHORITY behind the localization, which the retained audit artifacts
describe only as an open 'boundary gap'. FALSIFIER: implement the missing spinor boundary
term and the 51 failing records must drop to the scalar residual scale; if they do not,
the defect is in the spinor determinant or J-structure assembly instead.

THE TCMT SUB-BLOCK FAILS AT THE SOURCE LAYER, NOT THE NUMERICAL LAYER, AND THE FAILURE IS
SHARED. C-865, C-1638 and C-1639 all rest on kappa_1 - kappa_2 = gamma_l, WHICH APPEARS
IN NEITHER CITED PAPER. Maksimov gives kappa^2 = 2*gamma (Eq. 48) and moduli equalities
|kappa_1| = |kappa_2| (Eq. 68); Ruan and Fan give eta*eta^* = 2*gamma and kappa*eta^* =
2*gamma. The repo relation looks like A CONFLATION of Maksimov's kappa_1, kappa_2
subscripts with Ruan-Fan's per-channel gamma_l, and the quadratic-versus-linear structure
makes it DIMENSIONALLY IMPOSSIBLE rather than merely unattested. ONE FALSIFIER -- read
Eq. (48) -- DECIDES ALL THREE CLAIMS AT ONCE, which is why they should be adjudicated
together.

THE TCMT REFUTATIONS PROPAGATE OUTSIDE THIS BLOCK. source_inventory.toml records
dependency_closure = ["C-864", "C-865", "C-866", "C-867"] for the tcmt.mapping section,
so refuting C-865, C-1638 and C-1639 puts C-864, C-866 and C-867 IN SCOPE for the same
source audit. The test run already surfaces in-repo audit tests naming those claims --
audit_c866_cross_section_ratio_is_tautological,
audit_c866_lossless_case_retains_gravitational_decay, and
audit_c867_base_profile_is_even_in_detuning -- ALL PASSING, meaning the defects they name
are ASSERTED AS PRESENT. Those three claims were outside this block and were not
adjudicated here.

TWO CITATION-FIDELITY DEFECTS. source_inventory.toml records arXiv:2505.00396 as 'Generic
temporal coupled-mode theory constraints from symmetry'; the fetched paper is titled
'Temporal coupled mode theory for high-Q resonances in dielectric metasurfaces'. THE REPO
TITLE IS A PARAPHRASE OF THE ROLE THE PAPER WAS ASSIGNED, which is precisely the failure
mode that let a nonexistent equation be attributed to it. Separately, ward.rs cites
'Bastianelli et al. (2026), Sec 7'; the section is 8 (its equations are tagged 7.x) and
the first author is Ahmadiniaz.

C-1643 AND THE ALREADY-VERIFIED C-1644 ARE NEAR-REDUNDANT. Ruan-Fan derives kappa = eta by
combining energy conservation (Eq. 17) with time reversal (Eq. 18a), so a SINGLE computed
quantity, kappa - eta, decides both the reciprocity claim and the time-reversal claim in
the single-channel basis. In a 1x1 channel basis matrix reciprocity is trivially
satisfied; the substantive content is entirely kappa = eta.

A POSITIVE CONTROL ON THE WHOLE EXERCISE: all ten photon_graviton tensor source files
still hash-match the experiment manifest, and the live run reproduces the retained grid to
NINE OR MORE significant figures (on-shell scalar 2.3626229167124594e-3 live versus
2.36262291743054948e-3 retained). THE 2026-08-02 EVIDENCE IS CURRENT, NOT STALE, so the
