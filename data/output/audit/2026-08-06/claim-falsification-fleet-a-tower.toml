THE BLOCK CONTAINS ITS OWN REFUTATION. Claims in this block are contradicted by
claims already carrying status VERIFIED in registry/claims.toml: C-1111 negates
C-1040 (512D CHSH |S| = 1.528, no Bell violation, against a claim predicting Bell
