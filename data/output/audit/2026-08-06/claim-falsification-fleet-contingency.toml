note = """
Replicates is empty because no claim in this frontier asserted reproduction of an
external published result that the campaign then reproduced. Every external
comparison either read a source and found the repository value wrong, or found no
repository computation to compare.
"""

# ---------------------------------------------------------------------------
# What the two matrices disagree about, and why that is the point
# ---------------------------------------------------------------------------

[divergence]
falsifies_vs_refuted = """
57 claims carry Falsifies and 57 carry final status Refuted, but they are not the
same 57. Three claims scored Inconclusive by the fleet were nonetheless set to
Refuted because a source-attribution defect decided them without an executable
check, and three claims scored Falsifies sit at Closed/Research-Program or
Provisional because the proposition outran what the falsifier could decide.
"""
methodology_invalid = """
MethodologyInvalid holds 3 rows, all of them cases where the falsifier tested for
the EXISTENCE of a repository implementation rather than for the truth of the
proposition. Two of the three (C-1050, C-970) were corrected from Falsifies after
the branch review. The review asked for a bounded audit of all six fleet-refuted
findings whose final status is not Refuted; the other four were upheld, with
reasons recorded in the review-response artifact.
"""
survives_challenge_not_verified = """
Six claims survive their falsifier without reaching Verified: C-1060 at
Superseded, C-1244 and C-1285 at Provisional, C-1538 and C-1539 at Theoretical,
C-1656 at Closed/Methodology-Insufficient. Surviving a challenge is not the same
as being established, and the reason differs per row. C-1244's falsifier does not
discriminate, since the test passes unchanged under maximal inversion breaking.
C-1538 and C-1539 have Rocq theorems that hold but are strictly weaker than the
propositions they are cited for.
"""
inconclusive_and_provisional = """
41 of 52 Inconclusive rows end at Provisional, which is the campaign's largest
single cell and its most honest one. These claims were not refuted and were not
verified; the check that would decide them is named and unwritten.
"""

