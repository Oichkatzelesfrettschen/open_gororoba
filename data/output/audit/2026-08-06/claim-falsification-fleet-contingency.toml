# Claim falsification fleet 2026-08-06: contingency matrices over the 148 claims.
#
# TWO DISTINCT VOCABULARIES appear below and neither substitutes for the other.
#
# fleet_finding_verdict is the classification each block agent recorded in its
# return: refuted, partially_confirmed, confirmed, not_run. It is a campaign
# artifact and appears nowhere in the canonical schema.
#
# canonical_experiment_verdict is the value stored on the transition event, drawn
# from the schema's closed set at crates/provenance_store/src/claim_transitions.rs
# CLAIM_EXPERIMENT_VERDICTS: Falsifies, MethodologyInvalid, Inconclusive,
# SurvivesChallenge, Replicates.
#
# final_status is the claim's status after every event landed, including the six
# corrective transitions appended in response to the branch review.
#
# Verdict and status are separate axes on both matrices. The first emission of
# this campaign collapsed them into a single headline number; these tables exist
# so that cannot recur, and labelling the fleet vocabulary as canonical would
# re-collapse them in a different way.

[matrix_meta]
generated = "2026-08-06"
revised = "2026-08-06 (branch review response)"
total_claims = 148
fleet_events = 148
corrective_events = 6
status_changing_events = 107
status_preserving_events = 47

# ---------------------------------------------------------------------------
# Matrix 1: fleet finding verdict x final status
# ---------------------------------------------------------------------------

[fleet_finding_matrix]
axis_rows = "fleet_finding_verdict (campaign vocabulary, not canonical)"
axis_cols = "final_status (canonical)"
table = """
fleet_finding_verdict   Cls/Anlg  Cls/MethIns  Cls/ResPrg  Cls/SrcIns  Provisional  Refuted  Superseded  Theoretical  Verified  TOTAL
refuted                        1            1           3           0            1       54           0            0         0     60
