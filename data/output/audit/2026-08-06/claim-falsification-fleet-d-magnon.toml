decidability = "internal"
falsifier = "False if E(k) != E(-k) with zero InversionBreakingParams. The claim's conditional structure is false if E(k) = E(-k) ALSO holds with NONZERO breaking."
check_performed = "500 pseudo-random k, all nine bands, for both InversionBreakingParams::none() and ::kaman_default(); max |Im(t)| over the full hopping list."
observed = "Symmetric model: max |E(k) - E(-k)| = 0.000e0. INVERSION-BROKEN MODEL: max |E(k) - E(-k)| = 0.000e0 AS WELL. max |Im(amplitude)| over all 18 hoppings = 0.000e0 -- every hopping is REAL. CORRECTED 2026-08-06 (orchestrator post-write review): the withdrawn wording said 'so H(k) is a real symmetric matrix and H(k)* = H(-k) identically'. H(k) is NOT real symmetric. hamiltonian_at_k at crates/quantum_core/src/tight_binding.rs:243-262 accumulates amplitude * exp(i k.R) and adds the conjugate to the transposed entry, so H(k) is COMPLEX HERMITIAN. What real amplitudes give is H(-k) = conj(H(k)), and since H is Hermitian conj(H(k)) = H(k)^T, whose spectrum equals that of H(k). E(k) = E(-k) therefore follows for every parameter set, but through spinless time-reversal acting on a Hermitian matrix, not through real symmetry."
verdict = "confirmed"
verdict_reason = "CORRECTED 2026-08-06 (orchestrator post-write review); the withdrawn verdict was partially_confirmed with the reason 'the claim's ATTRIBUTION IS WRONG'. The claim states a conditional: inversion preserved implies E(k) = E(-k). A conditional is not falsified by its consequent also holding when its antecedent fails. E(k) = E(-k) was observed with zero InversionBreakingParams, so the claim SURVIVES ITS STATED FALSIFIER; preserved inversion is sufficient, merely not necessary. The durable finding is weaker and different: the repo test named test_time_reversal_symmetry passes unchanged under maximal inversion breaking, so the TEST is non-discriminating even though the CLAIM is true. A discriminating negative control must introduce a genuinely time-reversal-breaking complex (Haldane-type) hopping, not a different onsite inversion-breaking term."
recommended_status = "Provisional"
verification_rule = "Restate as: E(k) = E(-k) holds for ALL InversionBreakingParams because every Hopping.amplitude is real. New test asserting E(k) == E(-k) WITH kaman_default breaking AND asserting model.hoppings.iter().all(|h| h.amplitude.im == 0.0), so the assertion fails loudly if a complex (Haldane-type) hopping is ever introduced."
confidence = "high"

