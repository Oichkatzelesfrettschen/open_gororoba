observed = "yig_effective_spin() returns A BARE LITERAL 14.2 with the comment 'Per magnetic site in a simple model: S ~ 14.2 is conventional' and no derivation. The docstring is INTERNALLY INCONSISTENT THREE WAYS: it says '20 Fe3+ ions per formula unit' (Y3Fe5O12 has 5), then '12 octahedral (up) and 8 tetrahedral (down), net = 12*5/2 - 8*5/2 = 10', then 'Per primitive cell with 4 formula units: S_eff = 40' -- three mutually incompatible numbers, none of them 14.2. THE SITE LABELS ARE ALSO SWAPPED: YIG's 24d sites are TETRAHEDRAL (12 per primitive cell of 4 f.u.) and the 16a sites are OCTAHEDRAL (8 per primitive cell), with the tetrahedral majority setting the net moment. Correct bookkeeping: net 5 mu_B per formula unit, S_net = 10 per 20-Fe3+ primitive cell -- so 2S = 20, not 28.4. The paper never states 14.2, 28.4, or a sublattice count; 'with 10 sublattices' appears nowhere in the paper or the code."
