[synthesis]
cross_claim_findings = """
THE BLOCK'S HEADLINE IS A PROVENANCE FAILURE that decides every 'matches Kaman et al.'
conjunct at once. The fetched primary source (arXiv:2601.03210v2, sha256 79148155...)
gives Table I as eps_s/eps_p/eps_k/t_sk/t_pk = 1.69/3.15/3.17/-0.38/-0.63 GHz and
Table II as 1.93/2.83/3.28/-0.45/-0.49 with delta_eps_s/delta_eps_p = 0.12/0.35. The
repo's kaman_default is 1.50/1.80/2.08/0.25/0.15 and its InversionBreakingParams is
0.10/0.05 -- NOT ONE OF THE TWELVE NUMBERS MATCHES, and the signs of both hoppings are
flipped. The geometry constants diverge the same way: the paper's main subject is
d/a = 0.8, a = 333 nm, t = 15 nm, B_ext = 185 mT (200 mT for the defect study), against
the repo's 0.6, 400 nm, 20 nm, 50 mT.

DEFECT CLASS (post-write review): this is TARGET LEAKAGE / CALIBRATION
CIRCULARITY, the scientific analogue of train-test contamination, and it deserves
first-class status alongside the other six fleet structures. The evidentiary
direction is REVERSED: observation -> model parameter -> model output was
presented as independent model -> prediction -> agreement with observation.
GOVERNANCE INVARIANT it implies: an observable used to fit, calibrate, initialize
or select a model MAY NOT subsequently validate a claim predicting that
observable, unless a disjoint held-out datum is identified. This can occur in
cosmological fitting, material-property reconstruction, parameter extraction,
spectral inversion and scattering fits, so it is not specific to this block.

THE ONSITE ENERGIES ARE OUTPUT LANDMARKS. 1.50, 1.80 and 2.08 are the frequencies
the paper's PROSE mentions (1.5 GHz graphene-like region, the 1-2 vs 2-3.5 GHz s/p
split, the 2.08 GHz flat band OBSERVED in MuMax3) inserted directly as ON-SITE ENERGIES.
That inversion is the root cause of the numerical misses in C-1231 and C-1232: eps_k =
2.08 was set to the OBSERVED flat-band frequency, so after hybridization the flat band
lands at 2.2351 rather than 2.08; and eps_s = 1.50 was set to the OBSERVED Dirac
frequency, so the crossing lands at 1.2545. ONE MISTAKE, TWO REFUTATIONS.
SCOPE CORRECTION 2026-08-06 (orchestrator post-write review). Two earlier sentences
overreached and are withdrawn: the header "THE REPO'S PARAMETERS ARE NOT A FIT TO
ANYTHING", which asserts how the numbers came to be chosen, and "Setting a model's
inputs to its intended outputs guarantees the outputs will be wrong", which asserts a
theorem. Neither is supported. Commit-history and author-intent evidence was not
gathered, so provenance of the constants remains an inference from value matching; and
using target-like values as inputs does not mathematically force wrong outputs, it
forces LOSS OF INDEPENDENT EVIDENTIARY VALUE, after which hybridization may or may not
move them. The defensible form: the model uses values matching reported output
landmarks as onsite parameters, so agreement with those same landmarks is not an
independent prediction; in this implementation hybridization then shifts them, which is
the concrete failure observed.

A SECOND FACT DECIDES THREE MORE CLAIMS: max |Im(hopping amplitude)| = 0 over all 18
hoppings, so H(-k) = conj(H(k)) and, H(k) being complex Hermitian, E(k) = E(-k)
identically. (An earlier wording said "H(k) is real symmetric"; it is not, per
tight_binding.rs:243-262, and the corrected route is spinless time reversal.) So (a)
C-1244 is TRUE and survives its stated falsifier -- preserved inversion is sufficient
though not necessary -- while the repo test named test_time_reversal_symmetry is
non-discriminating, since it cannot fail for the reason its name implies; (b) every band Chern number is structurally
zero, so C-1250's non-quantization hedge is the only thing that COULD be true about
valley topology here, and it is; (c) a real-hopping tight-binding model cannot represent
broken time-reversal at all -- a limitation of the paper's own fitting approach carried
into the repo, not a repo defect.

THIRD, THE SAME NUMERICAL MACHINERY FAILS THE SAME WAY across C-1235, C-1237, C-1246 and
C-1250, and the failure is BAND DEGENERACY. The model has three EXACTLY flat bands
(bandwidth 5e-15 to 8e-15 GHz) at 1.644873, 1.800000 and 2.235127 GHz, all p-orbital
derived. Single-band FHS is UNDEFINED where bands touch, and the consequences are
visible: spurious saturated |F| = pi plaquettes on the symmetric model where curvature
must vanish; band Chern numbers of exactly -1.000 and +1.000 on flat bands where
time-reversal forbids anything but zero; and point_defect_modes reporting 15, 25 and 52
'in-gap modes' at radius 2, 3, 4 because it is COUNTING BULK FLAT-BAND STATES pinned at
the gap edge rather than defect states. The one genuine defect state, at 1.84023 GHz with
IPR 1.1, is a single entry in that list at every radius. A DEGENERACY GUARD on
fhs_berry_curvature and band_chern_number, and a LOCALIZATION FILTER on
point_defect_modes, WOULD REPAIR FOUR CLAIMS AT ONCE.

WHAT IS NEW: the exactly flat band at E = eps_p = 1.800000 is PROVABLE, not merely
observed. The four p orbitals {1,2,4,5} carry a degenerate diagonal block eps_p*I and
couple to the three kagome sites through a 3x4 matrix, whose nullity is at least 1 for
every k; that null vector is a zero-kagome-weight eigenstate at eps_p. The probe confirms
both halves -- band 5 has weight 1.0000 on the p sector and 0.0000 on kagome at generic k
-- and confirms the falsifier: switching on delta_eps_p = 0.05 splits the p block into
two 3x2 problems and the bandwidth jumps from 5.3e-15 to 1.61e-3, while bands 2 and 6
stay at 6e-15. THIS REFUTES C-1232's STATED MECHANISM INDEPENDENTLY OF ITS ENERGY:
destructive interference on triangular plaquettes cannot be the cause because the model
has NO KAGOME-KAGOME BONDS AT ALL (magnonic_crystal.rs:288-293 sets them to zero BY
DESIGN, with a comment saying so, and the hopping list is 18 bonds, every one of them
honeycomb-to-kagome).
"""
new_claims_proposed = """
1. The 9-band model has EXACTLY THREE dispersionless bands, at 1.644873, 1.800000 and
   2.235127 GHz, with bandwidths below 1e-14 GHz at any BZ sampling. The one at
   1.800000 = eps_p is the NULL VECTOR of the 3x4 kagome-to-p coupling block and carries
   zero kagome weight. FALSIFIER: any band 5 energy differing from eps_p by more than
   1e-12 at any k, or nonzero weight on orbitals 6-8 in its eigenvector.

2. delta_eps_p != 0 DESTROYS the eps_p flat band (bandwidth 5.3e-15 -> 1.61e-3 GHz at
   delta_eps_p = 0.05) while delta_eps_s alone leaves it exact. FALSIFIER: bandwidth of
   band 5 staying below 1e-12 at delta_eps_p = 0.05.

3. band_chern_number returns SPURIOUS NONZERO INTEGERS for the exactly degenerate flat
   bands -- -1.000 for band 5 at delta_eps_s = 0.05 and +1.000 for band 6 at 0.10 --
   although all hoppings are real and time-reversal forces C = 0 for every band.
   FALSIFIER: a degeneracy-aware (multi-band non-Abelian) FHS returning 0 at the same
   parameters.

4. point_defect_modes DOES NOT ISOLATE DEFECT STATES: its returned count grows 15/25/52
   with supercell radius 2/3/4 because bulk flat-band states at 2.18174 and 2.23664 GHz
   fall inside its detected gap. The single genuine localized state is at 1.84023 GHz
   with IPR 1.1, size-independent. FALSIFIER: a radius-independent returned count.

5. build_domain_wall_supercell produces TWO DOMAIN WALLS, not one: the a2 wrap-around
   hoppings make cell n_cells-1 adjacent to cell 0 across a second sign flip. The two
   walls host in-gap modes at DIFFERENT energies (1.831/1.845 GHz at the seam versus
   2.230/2.234 GHz at cell 10, at k = 0.30 b1). FALSIFIER: an open (non-wrapping) ribbon
   showing the same doubled set of in-gap modes.

6. The repo's magnonic TB parameters are NOT those of Kaman et al.: twelve of twelve
   Table I/II values differ, both hopping signs are flipped, and four of four geometry
   constants differ. FALSIFIER: any version of arXiv:2601.03210 containing eps_s = 1.50,
   eps_p = 1.80, eps_k = 2.08, t_sk = 0.25, t_pk = 0.15.

7. YigParams::gamma = 2.8e10 is DOCUMENTED as rad/(s*T) but is used, and is physically
   correct, as Hz/T (gamma/2pi = 28 GHz/T). Every consumer that pipes
   magnon_frequency_homogeneous through rad_per_s_to_ghz is off by 2pi. FALSIFIER: a
   consumer whose published number matches the rad/s reading.
"""
