# Fleet return: block B_DM_ACCESS, 5 claims. HTML entities restored to ASCII.
#
# ORCHESTRATOR CORRECTION (material, affects the numbers not the verdict):
# The agent reported that the SRC-ACE-MAG-HOURLY path_glob
# data/external/ace_mag/ac_h2_mfi_*.csv "matches zero files". IT MATCHES ONE:
# data/external/ace_mag/ac_h2_mfi_2016.csv, 8784 HOURLY records, columns
# Time,Magnitude,BGSEc_0,BGSEc_1,BGSEc_2 -- explicitly GSE, already hourly. That
# is the exact declared product. The agent instead used the 16-second
# data/external/ace/ac_h0_mfi_2016.csv, hourly-averaged it itself, and flagged an
# unresolvable GSM/GSE labelling ambiguity that does not exist in the right file.
#
# ORCHESTRATOR RE-TEST on the correct input (independent python3, OMNI2 fields
# 13/14/15 = Bx/By/Bz GSE vs BGSEc_0/1/2, lag scan):
#   lag -2  n=8029  r(Bx) 0.8564  r(By) 0.8673  r(Bz) 0.6896
#   lag -1  n=8394  r(Bx) 0.9277  r(By) 0.9543  r(Bz) 0.8872   <-- optimum
#   lag  0  n=8759  r(Bx) 0.8601  r(By) 0.8680  r(Bz) 0.6817
#   lag +1  n=8394  r(Bx) 0.7772  r(By) 0.7710  r(Bz) 0.4956
#   lag +2  n=8029  r(Bx) 0.7229  r(By) 0.7070  r(Bz) 0.3952
# The one-hour propagation lag reproduces as a clean single peak, independently
# confirming the agent's finding. On the correct file By CLEARS 0.95 (0.9543,
# against the agent's 0.9280). Bx 0.9277 and Bz 0.8872 still fail. The claim
# requires all three, so the REFUTED verdict stands on corrected numbers.
# Hours with OMNI2 IMF spacecraft ID == 71 (ACE): 67 of 8784. Confirmed.

[block]
id = "B_DM_ACCESS"
claim_count = 5
agent_note = "Three portal-availability claims and two cross-instrument correlation claims. All five decided. The correlation claims split cleanly: C-1148 survives on real bytes in two independent years while its cited implementation is a proxy that never touches ACE, and C-1147 fails on both the correlation threshold and its own premise -- OMNI2 2016 IMF is 99.2 percent Wind-sourced, not ACE."

[[finding]]
claim_id = "C-1147"
decidability = "internal"
falsifier = "False if any of Pearson r(Bx_GSE), r(By_GSE), r(Bz_GSE) between OMNI2 hourly and hourly ACE MAG L2 is <= 0.95 at the lag maximising the correlation (OMNI2 rows are propagated to the bow shock nose, so lag zero is not assumed); independently, the claim's stated conclusion is false if OMNI2's own per-hour IMF spacecraft ID field is not ACE."
check_performed = "Standalone Rust probe linking data_core by path, on data/external/ace/ac_h0_mfi_2016.csv (16-sec, self-averaged) with a -3..+3 hour lag scan. ORCHESTRATOR RE-TEST on the correct declared product data/external/ace_mag/ac_h2_mfi_2016.csv (already hourly, explicitly GSE). Separately: awk on OMNI2 field 5 decoded against the omni2.text spacecraft identifier table."
observed = "ORCHESTRATOR NUMBERS (authoritative, correct input): optimum at lag -1, n=8394, r(Bx) 0.9277, r(By) 0.9543, r(Bz) 0.8872; lag 0 gives 0.8601 / 0.8680 / 0.6817; correlation falls monotonically on both sides of lag -1. AGENT NUMBERS (16-sec input, superseded): lag -1 Bx 0.9276, By 0.9280, Bz 0.8074. PROVENANCE (both agree): OMNI2 2016 IMF spacecraft ID is 51 for 8716 hours, 71 for 67 hours, 99 for 1. omni2.text TABLE: SPACECRAFT IDENTIFIERS: 'WIND 51 -mag, plasma_KP; 52-Plasma_definitive' and 'ACE 71'. OMNI2 plasma spacecraft ID is 52 (Wind definitive) for 8716 hours. INFRASTRUCTURE: data/external/ace_mag/ holds 366 files named ACE_MAG16_2016-NNN_V4-0.txt that are ALL HTML 404 error pages from izw1.caltech.edu, not data."
verdict = "refuted"
verdict_reason = "The threshold fails on its own terms after the propagation confound is removed. On the correct hourly GSE product By reaches 0.9543 and DOES clear the bar, but Bx (0.9277) and Bz (0.8872) do not, and the claim requires all three components. The claim's stated PURPOSE is refuted more sharply than its threshold: OMNI2 2016 draws its hourly IMF from Wind (ID 51) for 99.2 percent of hours and from ACE (ID 71) for 0.76 percent, so this year of OMNI2 does not substantially include ACE MAG at all. The surviving ~0.93 correlation is Wind and ACE both sampling the same L1 field one hour apart, not OMNI2 ingesting ACE."
recommended_status = "Refuted"
verification_rule = "A cross-validate-solar-wind subcommand comparing data/external/omni2/omni2_YYYY.dat fields 13/14/15 against data/external/ace_mag/ac_h2_mfi_YYYY.csv BGSEc_0/1/2, asserting r > 0.95 on all three at the lag maximising r. The check must (a) use the ac_h2_mfi hourly product, not the 16-second ac_h0_mfi file, (b) restrict to hours where OMNI2 field 5 == 71 if the claim is about ACE ingestion, (c) SCAN LAG rather than assuming zero, and (d) fix parse_ace_mag_hapi_csv, which labels its columns bx_gse/by_gse/bz_gse while the ac_h0_mfi_*.csv files were fetched as BGSM."
source_url = "https://spdf.gsfc.nasa.gov/pub/data/omni/low_res_omni/omni2.text"
source_sha256 = "be4aca7bdf030a3eb6ed584fb6960913e3be909d5627b2a69fe93a4765962d7f"
confidence = "high"

[[finding]]
claim_id = "C-1148"
decidability = "internal"
falsifier = "False if Pearson r for proton density or bulk speed between ACE SWEPAM hourly and WIND SWE hourly-averaged records is <= 0.90 on time-aligned overlapping L1 hours."
check_performed = "Standalone probe on BOTH years present in the repository. data_core parse_swepam_file on data/external/ace_swepam/ac_h2_swe_{2016,2024}.csv and parse_wind_swe_file on data/external/wind_swe/wind_kp_unspike{2016,2024}.txt, hourly-binned through the repository's own merge_wind_swe_mfi, then Pearson r on the (year,doy,hour) intersection."
