verdict = "confirmed"
verdict_reason = "Both claimed variables clear 0.90 with margin on real ACE SWEPAM and real WIND SWE bytes in two independent years at opposite solar-cycle phases: density 0.9607 and 0.9606, speed 0.9961 and 0.9939. THE DENSITY r REPRODUCES TO FOUR SIGNIFICANT FIGURES ACROSS YEARS, a strong stability signal. The claim's numeric content holds; only its where_stated locator is wrong, because the named AceVsWind subcommand substitutes OMNI2 for ACE and its justifying comment is FALSE for 2016 (OMNI2 2016 plasma ID is 52 = Wind definitive for 8716 of 8784 hours)."
recommended_status = "Verified"
verification_rule = "A new cross-validate-solar-wind subcommand that actually reads ACE SWEPAM: parse_swepam_file(ac_h2_swe_YYYY.csv) vs merge_wind_swe_mfi(parse_wind_swe_file(wind_kp_unspikeYYYY.txt)); assert r(density) > 0.90 and r(speed) > 0.90 with n > 1000. Both inputs are already in the repo for 2016 and 2024. UNTIL THAT SUBCOMMAND EXISTS the existing Cmd::AceVsWind must not be cited as evidence for this claim."
confidence = "high"

