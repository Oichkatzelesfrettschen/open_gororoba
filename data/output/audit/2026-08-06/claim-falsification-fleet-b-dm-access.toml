[synthesis]
cross_claim_findings = """
THE BLOCK'S HIDDEN SHARED ASSUMPTION is that a claim about a portal's holdings and a
claim about the repository's fetch lane are the same claim. THEY ARE NOT, and three of
the five conflate them. C-1178, C-1182 and C-1183 all begin with a sentence of the form
'archive X provides only Y', where Y is in fact the subset the repository's own fetcher
requests. AMDA carries eight non-MAG Pioneer datasets, six non-MAG-non-RPW Solar Orbiter
datasets including SWA-EAS, and the New Horizons lane fetches trajectory rather than
SWAP. Splitting each claim into a PORTAL proposition and a LANE proposition makes all
three decidable by a single HAPI info query and removes the drift sensitivity that
leaves them un-datable.

THE TWO CORRELATION CLAIMS SHARE ONE NUMBER THAT TURNS OUT TO BE PROVENANCE, NOT
PHYSICS. C-1147 asserts OMNI2 faithfully includes ACE MAG; C-1148's cited implementation
justifies substituting OMNI2 for ACE with the comment 'OMNI2 is dominated by ACE data'.
THE OMNI2 PER-HOUR SPACECRAFT-ID FIELDS DECIDE BOTH AT ONCE: in 2016, IMF ID is 51
(Wind) for 8716 of 8784 hours and ACE (71) for 67, and plasma ID is 52 (Wind definitive)
for 8716 hours. The same falsifier that refutes C-1147 also invalidates the proxy
C-1148's binary relies on. THAT THIS ID FIELD EXISTS AND WAS NEVER CONSULTED IS THE
FINDING: it is a free, per-hour provenance label sitting in column 5 of every OMNI2 row,
and any future OMNI-versus-spacecraft claim should filter on it before correlating.

THE LAG SCAN TURNS THAT READING INTO A MEASUREMENT. Correlation peaks sharply at lag -1
hour, the ACE sample PRECEDING the OMNI2 timestamp, which is the direct signature of
OMNI2's propagation of L1 measurements to the bow shock nose at the ~430 km/s speeds in
these rows. The peak is unambiguous and falls away monotonically on both sides. TWO
CONSEQUENCES. The lag-zero pairing used by the existing cross_validate_solar_wind binary
SYSTEMATICALLY UNDERSTATES every OMNI-versus-upstream-spacecraft correlation it computes,
so any r it has ever reported is a FLOOR rather than an estimate. And even with the
confound removed, on the correct hourly GSE product the three components sit at 0.928,
0.954, 0.887 -- so r = 0.95 is not attainable for all three vector components between two
spacecraft ~200 Re apart. Only |B|, insensitive to field rotation, clears it comfortably.
The threshold in C-1147 was set against the wrong quantity.

ONE INFRASTRUCTURE FACT SPANS THE BLOCK: data/external/ace_mag/ contains 366 files that
are HTML 404 pages from izw1.caltech.edu, byte-for-byte error documents carrying a data
filename. THEY PASS A FILE-EXISTS CHECK AND FAIL ON PARSE. E-113 lists 'ACE MAG L2
16-sec' as an input and is flagged binary_registered = true. [ORCHESTRATOR: the agent
additionally reported the declared ac_h2_mfi_*.csv glob matches zero files; it matches
ac_h2_mfi_2016.csv, which is real hourly GSE data. The 404 finding stands for the 366
ACE_MAG16_* files; the glob finding does not.]
"""
new_claims_proposed = """
1. OMNI2 hourly IMF for 2016 is WIND-SOURCED, NOT ACE-SOURCED: field 5 of
   omni2_2016.dat equals 51 (Wind) for 8716 of 8784 hours and 71 (ACE) for 67.
   FALSIFIER: an OMNI2 year in which the modal IMF spacecraft ID is 71.

2. ACE SWEPAM and WIND SWE agree on proton bulk speed at r = 0.996 (2016, n = 8685) and
   0.994 (2024, n = 4311), and on proton density at r = 0.9607 (2016) and 0.9606 (2024),
   with WIND running 0.77 to 1.16 cm^-3 denser in the mean. FALSIFIER: a third year, or
   a different hourly binning of the ~92-second SWE cadence, yielding r <= 0.90.

3. ACE SWEPAM and WIND SWE DISAGREE SYSTEMATICALLY ON PROTON TEMPERATURE in a direction
   that repeats across years: r = 0.948 with bias -10070 K in 2016 and r = 0.921 with
   bias -12263 K in 2024, roughly 12 percent of a typical solar wind proton temperature,
   with WIND consistently hotter. FALSIFIER: a year in which the sign of the bias
   reverses, or a bias consistent with zero at 1 sigma of the hour-to-hour scatter.

4. The 366 ACE_MAG16_2016-*.txt files in data/external/ace_mag/ contain NO ACE MAG data;
   all are HTML 404 responses. FALSIFIER: any of those files parsing to a non-empty
   AceMagRecord vector. (The sibling ac_h2_mfi_2016.csv IS real data.)

5. PDS Small Bodies Node is a WORKING SECOND PROVIDER for New Horizons SWAP, publishing
   11 dataset versions from post-launch checkout through the Pluto encounter. FALSIFIER:
   those holding pages returning 404 or containing no retrievable SWAP product.

6. OMNI2's hourly rows are propagated to the bow shock nose, so a LAG-ZERO comparison
   against an upstream L1 spacecraft UNDERSTATES the correlation. Over 2016 the
   OMNI2-versus-ACE-MAG correlation peaks at a one-hour lag with the ACE sample leading
   (r(Bx) 0.860 -> 0.928, r(By) 0.868 -> 0.954, r(Bz) 0.682 -> 0.887) and falls
   monotonically on both sides. FALSIFIER: a lag scan on another year, or on WIND MFI
   instead of ACE, whose peak is not at lag -1.
"""
gaps = """
C-1147's remaining uncertainty is now narrow. The orchestrator re-test used the correct
declared hourly GSE product, so the frame ambiguity the agent flagged is resolved and
does not rescue the threshold. What remains: the claim would deserve a fresh test on a
year where OMNI2's IMF ID is actually 71. No such year is in the repository, and
deciding it needs a multi-year OMNI2 fetch plus a real ACE MAG harvest. That is the one
check not run.

The correlation numbers for C-1148 came from a standalone probe linking data_core by
path rather than from a repository binary, because no repository binary reads ACE
SWEPAM and the one that reads ACE MAG expects a browse format that exists nowhere on
disk. The probe uses data_core's own parsers throughout, so the parsing semantics are
the repository's, but the correlation code is NOT YET A DURABLE REPO TARGET.

Building that probe required RUSTFLAGS=--cap-lints=allow because cd_kernel's
turboquant/simd_codebook.rs line 31 imports the deprecated wide::CmpGt trait, which the
workspace lint table turns into a hard error when the crate is resolved outside the
workspace lockfile. No repository source was modified. WORTH CHECKING INDEPENDENTLY: the
in-workspace build may only be passing on a stale .cache/gate-target artifact.

No PDS-SBN SWAP data product itself was retrieved, only the holdings index and one
DOWNLOAD listing naming nhjusw_2001.tgz; whether those products parse into the
repository's OmniRecord contract is undecided.
"""
