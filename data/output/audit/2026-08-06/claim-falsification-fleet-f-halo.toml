[synthesis]
cross_claim_findings = """
THE BLOCK IS NOT A PREDICTION AWAITING A TEST. It is a prediction that was tested,
came back null, and whose claims were never updated to say so. E-183 is titled
'MaNGA N=6992 harmonic halo stacking null result' and carries status ACTIVE, while
C-1332 still asserts the signature is 'strictly falsifiable today ... No need to
wait for SKA 2030' at status Provisional. The registry holds the experiment and its
verdict in two places that never met.

THE NULL IS SAFE; THE SENSITIVITY IS NOT. This is the block's central new finding,
and it separates two statements C-1332 fuses. With ZERO signal injected the pipeline
reports alpha_zd_recovered = 0.29558 -- roughly 60x the 0.005 limit the claim
proposes to exclude. Across a 16x injection sweep (0 to 0.016) the recovered value
stays within 0.5 percent of that floor and detected_snr moves 0.31 percent, in the
wrong direction. The response to injected signal is indistinguishable from zero.
'We looked and saw nothing' is EARNED; 'we exclude alpha_zd >= 0.005' is NOT.

THE FLOOR IS NOT A MANGA ARTIFACT. A live SPARC replay settles this. At detection
SNR = 0.68 -- nothing found, against a pre-registered threshold of 3.0 -- the pipeline
still reports alpha_zd estimate = 0.540828, 36x the 0.015 the claim quotes for SPARC.
The same pathology therefore appears on TWO INDEPENDENT DATASETS with different
instruments, different selection, and different halo normalizations (Li+2020 fits
against Moster SMHM). What the pipeline reports as alpha_zd is the amplitude of the
BARYONIC RESIDUAL, and it would report a comparable number on any smooth rotation
curve. The same replay also refutes the claim's SPARC threshold directly: the binary
prints 'Detection threshold (5% v_err): alpha_zd >= 0.0207', because it uses the 93
galaxies that survive the cuts (4*0.05/sqrt(93) = 0.020739), whereas the claim's 0.015
is 4*0.05/sqrt(175) = 0.015119 over the full catalog. THE CLAIM QUOTES A SENSITIVITY
FOR A SAMPLE THAT WAS NEVER ANALYZED.

shmr_scatter_injection.csv independently corroborates: halo-mass scatter alone
produces 10.4x more harmonic power (8.41e-3) than the exact-SMHM measurement
(8.06e-4), so the measured power is dominated by mass-normalization systematics.

