rved R exceeds the stated expectation by more than 3x and p by six orders of magnitude, uniformly at all seven modes. Uniformity across every mode is the signature of a smooth deterministic baseline, not modal structure: jackknifing 1 of 16 x-bins barely perturbs the phase, so R -> 1 mechanically. (d) I-182 verbatim: 'The path forward requires SKA neutral hydrogen kinematics (outer halo x > 3) or Euclid weak lensing (mass-not-velocity) ... The MaNGA IFU data cannot distinguish ZD forcing from baryonic systematics in the inner bulge-disk region.'"
