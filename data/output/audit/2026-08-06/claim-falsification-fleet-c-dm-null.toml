decidability = "internal"
falsifier = "False if the WIND-derived ratio is not a genuinely independent measurement -- if |F_DM| carries no WIND datum, so the 'confirmation' restates the constancy of the numerator."
check_performed = "Symbolic trace of the numerator through DmForceField::new (dm_force.rs:187-360) and of the IC path in solar_wind_dm_mhd.rs:208-392. Numerical isolation runs."
observed = "|F_DM| = G*M_NFW(<r_gal)/r_gal^2 * (rho_dm_local/rho_NFW(r_sun)) * force_scale. dm_density[idx] is the literal constant rho_dm_si (line 313). r_gal = 8.3 kpc + r_helio. NO spacecraft field (B, n, v, T) enters the numerator. The ONLY data-dependent term is force_scale = (AU/nx)*(u_scale/(v_ref*1e3))^2, reading a median-speed scalar from the IC header -- spanning ~350-450 km/s across missions, a factor <= 1.7."
verdict = "partially_confirmed"
