decidability = "internal"
falsifier = "False if the shock-ramp (high |B|, high gradient) case does NOT produce a materially different ratio -- a genuinely higher Lorentz force must lower the ratio, so an unchanged O(10^-12) would indicate the input never reached the computation."
check_performed = "Measured the ratio's response to |B| via --b0 in {0.005, 0.05, 0.5, 5.0, 50.0} at fixed nx/v_sw/steps."
observed = "OBSERVED: DM max |F_grav| = 1.306282e-15 at every b0; ratios 9.589e-13, 9.589e-15, 9.589e-17, 9.589e-19, 9.589e-21 -- exactly proportional to b0^-2 over four decades with no residual. INFERRED: a CME shock ramp raising |B| from ~5 nT to 20-50 nT (factor 4-10) must LOWER the ratio by 16-100x relative to quiet wind, because |F_DM| is invariant and |F_Lorentz| goes as |B|^2."
verdict = "refuted"
verdict_reason = "The claim advertises invariance under the strongest available perturbation of the only data-dependent quantity in the ratio. The code guarantees the opposite. Either the two runs actually differed and were both rounded into 'O(10^-12)', or the high-gradient input did not propagate."
recommended_status = "Refuted"
verification_rule = "Run solar-wind-dm-mhd on the quiet WIND IC and the WIND MFI 3-sec CME-ramp IC with all other flags identical, record both ratios verbatim; require agreement within a factor of 3 for 'the null result holds' to mean invariance, or restate as a bound."
confidence = "medium"

