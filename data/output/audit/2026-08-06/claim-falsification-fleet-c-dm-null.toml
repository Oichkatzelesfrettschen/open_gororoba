recommended_status = "Refuted"
verification_rule = "Assert ForceFieldProxy::new(157.0, 0.938272).modulation_potential(1.0, &|_| 400.0/1.496e8, &|r| 4.5e-5*r) lies in [0.4, 0.8]. It returns 0.100."
confidence = "high"

[[finding]]
