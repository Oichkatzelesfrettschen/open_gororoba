# ---- Unit-conversion family ----

[[finding]]
claim_id = "C-1162"
decidability = "external"
falsifier = "False if the cited code does not produce B_r ~ r^-2 and B_phi ~ r^-1, or if the Parker spiral angle at 1 AU is not ~45 deg."
check_performed = "Read of parker_spiral_b (solar_wind_ic.rs:217-240) and MhdField::parker_spiral_init (mhd.rs:88-126); numerical evaluation from the code's defaults. Primary sources fetched and hashed: Parker (1958) ApJ 128, 664; Owens and Forsyth (2013) LRSP 10, 5; Ebert et al. (2013) ApJ 768, 160."
observed = "EXTERNAL: Parker (1958) eq. (26) gives B_r ~ r^-2 and B_phi ~ r^-1 exactly as claimed. BUT Parker's own 45-deg surface, his eq. (27), sits at 2.5 AU, not 1 AU: 'the radius of the cylinder on which B_phi becomes equal to B_r is 2.5 a.u. for v_m = 1000 km/sec.' The ~45 deg at 1 AU figure comes from the modern 400 km/s slow wind and is sourced to Owens and Forsyth (2013). B_r ~ 3 nT is supported by Ebert (2013) Table 1 (|B_r|R^2 = 3.17-3.89 nT); B_phi ~ 3 nT is NOT directly sourced and would imply |B| ~ 4.2 nT, the solar-minimum floor of the observed 4-9 nT range. SCALING, cited file: b_r = b0*(r0/r_cyl)^2 and b_phi = -b0*omega*r0^2/(v*r_cyl) -- correct. SCALING, MHD SIMULATION PATH: mhd.rs computes b_phi = -b0*ratio*(omega*r)/v_sw with ratio = r0/r, which collapses to -b0*r0*omega/v_sw, CONSTANT IN r; one factor of ratio is missing, so B_phi ~ r^0 in the path E-112 actually runs. ANGLE: tan(psi) = omega*r0/v_sw = 2.662e-6*64/0.05 = 3.4074e-3, giving psi = 0.1952 deg, not 45 deg. Physical value: tan(psi) = 2.662e-6*1.496e11/4e5 = 0.9956 -> 44.87 deg. ROOT CAUSE: omega is in physical rad/s while r is in grid cells and v is in lattice units; the missing conversion is delta_t = 148.696 s. Restoring it gives 45.38 deg at r = 128 cells, confirming the diagnosis."
verdict = "partially_confirmed"
verdict_reason = "The r^-2 / r^-1 scaling is confirmed against Parker eq. (26) and correct in the cited file, but it is IMPOSED analytically rather than 'verified by multi-spacecraft data' (the fit machinery consumes interpolator output, and E-114 is planned). The 45 deg spiral angle is refuted in the implementation by a factor of 230, and the MHD path E-112 runs has B_phi constant in r. Two attribution errors: 45 deg at 1 AU is not Parker's result and belongs to Owens and Forsyth (2013), and the B_phi ~ 3 nT half is unsourced."
recommended_status = "Refuted"
verification_rule = "Assert atan(|b_phi/b_r|) at r = nx cells lies in [40, 50] deg for parker_spiral_b; currently 0.195 deg. Separately assert b_phi(2r)/b_phi(r) == 0.5 in MhdField::parker_spiral_init; currently 1.0. Cite Owens and Forsyth (2013) rather than Parker (1958) for the 1 AU angle."
source_url = "https://doi.org/10.1086/146579 ; https://doi.org/10.12942/lrsp-2013-5 ; https://doi.org/10.1088/0004-637X/768/2/160"
source_sha256 = "33de05e35c9a3c17090bd4c4c0da58fd09b27eccc650e8702ebdb43b1e0c028d (parker_1958); 88a36178bf72fb4e4fc76c71e4571b09d63a3357e3645bc258ea916da94373ed (owens_forsyth_2013); 4b56199c0ad6de5363bb5b2772fef231dae17517eb4f44c2336f4193dfd45fd4 (ebert_2013)"
source_path = "data/papers/intake/2026_08_06_claim_falsification/pdf_success/"
confidence = "high"

