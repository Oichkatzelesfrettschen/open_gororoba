[synthesis]
cross_claim_findings = """
THE STRUCTURAL QUESTION IS SETTLED: OPTION (b). The ten claims reporting
|F_DM|/|F_Lorentz| ~ O(10^-12) are not ten measurements. The numerator contains no
spacecraft datum at all. In DmForceField::new the DM density is the literal
assignment dm_density[idx] = rho_dm_si, and the acceleration is
a_phys = G*M_NFW(<r_gal)/r_gal^2 * density_scale evaluated at r_gal = r_sun + r_helio
with r_sun = 8.3 kpc = 2.56e20 m. At the outermost claimed radius, 157 AU = 2.35e13 m,
the heliocentric term perturbs r_gal by 9.2e-8 relative. MEASURED DIRECTLY: running the
E-112 binary with --dm-r-min/--dm-r-max at 1, 50 and 157 AU returns
DM max |F_grav| = 1.355402e-15 in all three cases, identical to every printed
significant figure, ratio 9.949e-19 in all three.

The only path by which any spacecraft number reaches the numerator is
force_scale = (AU/nx) * (u_scale/(v_ref*1e3))^2, reading a single scalar -- the median
bulk speed -- from the IC header. Across OMNI, WIND, ACE MAG and STEREO-A that scalar
spans ~350-450 km/s, a factor of 1.7, ENTIRELY INSIDE the order-of-magnitude bin the
claims report. E-113's own run string holds --nx 128 --dm-density 0.3 --dm-m200 1e12
--dm-c200 10 fixed across all four spacecraft, so the numerator was the same number in
all four runs by construction. C-1152's 'instrument-independence' therefore restates
that a constant is constant. Its NUMBER is defensible; its INFERENCE -- that agreement
'reflects a genuine physical suppression rather than measurement artifact' -- is
REFUTED, because a quantity no instrument can move cannot discriminate between those
two hypotheses. C-1149, C-1150 and C-1151 inherit the same defect at the level of data
source, gradient regime and geometry respectively.

WHAT THE DENOMINATOR ACTUALLY SETS. |F_Lorentz| = |curl(B_l) x B_l| goes as the square
of the lattice magnetic field, and the lattice field is the physical field times
b_scale, a CLI convention knob defaulting to 0.001 whose entire documentation is
'Typical: 0.001 maps 5 nT -> 0.005 LBM units'. Running with --b0 in {0.005, 0.05, 0.5,
5.0, 50.0} returns ratios 9.589e-13, 9.589e-15, 9.589e-17, 9.589e-19, 9.589e-21 -- an
EXACT b0^-2 law across four decades, with |F_DM| pinned at 1.306282e-15 throughout. The
'null result' is a pure function of two fixed constants and one bookkeeping convention.
Two consequences follow.

First, the block's headline number is NOT reproduced by the block's own declared
experiment: E-112 runs --b0 5.0, printing 9.589e-19, eight orders from the claimed
O(10^-12). The 10^-12 figure corresponds to B_lattice ~ 0.005, i.e. the IC-file path
where 5 nT is multiplied by b_scale = 0.001.

Second -- and this is the FAIR version of the critique -- b_scale = 0.001 happens to be
approximately the correct Alfvenic normalisation. With B = 5 nT and n = 5.9 cm^-3,
v_A = B/sqrt(mu_0 rho) = 44.9 km/s, so v_A/v_sw = 0.112 and at v_sw_lattice = 0.05 the
Alfvenic lattice field is 0.0056, against b_scale*5 nT = 0.005. So O(10^-12) lands near
the physically sensible order BY COINCIDENCE of a default that nothing in the code
derives, documents as physical, or enforces -- and that the declared experiment then
overrides by six orders. THE FINDING IS NOT THAT DM GRAVITY MATTERS. IT PLAINLY DOES
NOT. The finding is that the specific exponent -12 is normalisation-dependent, drifts
by a factor of 26 over 500 timesteps (9.589e-13 at step 1, 3.656e-14 at step 500), and
compares a grid maximum of a spatially constant field against a grid maximum taken at
the single steepest-gradient cell, so it is not a local force ratio anywhere in the
domain.

A SHARED DIMENSIONAL DEFECT LINKS C-1154 AND C-1161. The drag law
a = n_chi*sigma*(m_red/m_p)*|v_rel| carries one power of velocity where momentum
transfer requires two. Its units are s^-1, a rate, not m s^-2. Viewed from the
coefficient side this is exactly why kappa comes out with units s/m rather than
dimensionless. ONE MISSING FACTOR OF v_rel EXPLAINS BOTH CLAIMS' FAILURE, and it means
the drag term is added to a dimensionless lattice acceleration by combine_forces. The
10^-45 cm^2 threshold is the point where a mis-dimensioned quantity crosses an
arbitrary line; correcting the velocity power moves it by ~5 orders.
test_drag_lattice_vs_legacy_equivalence certifies only that the two wrong paths agree.

EXPERIMENT STATUS IS THE BLOCK'S LARGEST SINGLE FINDING. Of 27 claims, only 10 have an
experiment with status='active' (E-112, E-113). Fifteen point at E-114 through E-127,
EVERY ONE status='planned'. C-1158 and C-1161 have no experiment row at all. That is
17 of 27 claims with nothing scheduled to produce their number. And even the active
pair has retained nothing: E-112 declares --out data/experiments/e112_solar_wind_dm,
and data/experiments/ DOES NOT EXIST on disk. No claim in this block has a durable
artifact behind it.

CLAIMS WHOSE NAMED MECHANISM IS SIMPLY ABSENT FROM THE CODE. C-1169 asserts solar cycle
phase correction using OMNI sunspot number; grep for sunspot, solar_cycle, cycle_phase
returns NOTHING, and build_radial_profile pools records from different years without
reading an epoch. C-1157 asserts a residual < 20%; grep for 'residual' returns nothing,
and the power-law fit consumes interpolate_radial output, which itself IMPOSES r^-2 --
so a naive fit is partly circular. C-1164 asserts consistency with MHD boundary
conditions at the termination shock; no shock, discontinuity or compression ratio exists
anywhere in the radial profile. In each case the claim describes a computation that was
never written.

A UNIT-CONVERSION FAMILY RUNS THROUGH THE HELIOSPHERIC CLAIMS. C-1162's Parker spiral
angle is 0.195 deg instead of 44.87 deg because omega is applied in physical rad/s
against r in grid cells and v in lattice units; the missing factor is exactly
delta_t = 148.696 s, and restoring it gives 45.38 deg. C-1171's modulation potential is
0.100 GV rather than 0.4-0.8 GV, and the crate's own test passes v_sw as 400.0 in km/s
against kappa in AU^2/s. C-1173's peak shift formula multiplies by the grid spacing
d_ln_r and omits the timestep, making a physical deceleration depend on numerical
resolution. FOUR INSTANCES OF THE SAME FAILURE MODE -- lattice and physical units mixed
in one expression -- IN FOUR DIFFERENT CRATES, which suggests a systematic absence of
dimensional testing rather than four independent slips.

CLAIMS THAT ARE THEIR OWN EVIDENCE. C-1172 compares modulate_spectrum to 'the
force-field prediction' while modulate_spectrum IS the Gleeson-Axford expression
transcribed exactly; the discrepancy is identically zero and the 5% tolerance has no
second computation to bound. C-1153's first sentence claims a 32-dimensional CD escape
statistic 'provides an algebraic vocabulary' for DM-baryon decoupling -- a statement
about language, unfalsifiable in principle rather than merely unmeasured.

