recommended_status = "Provisional"
verification_rule = "Assert DmForceField::new produces a force field with zero dependence on any OmniRecord field: two DmForceConfig differing only in n_ref_cm3 must give bit-identical max_force_magnitude()."
confidence = "high"

[[finding]]
