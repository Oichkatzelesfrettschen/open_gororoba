observed = "The code advances f by -dt*rate*df/d_ln_p with rate = div_u/3, i.e. the physical shift in ln(p) after N steps is (1/3)*div(u)*dt*N. The claim's formula multiplies by d_ln_r and OMITS dt entirely. d_ln_r is the GRID SPACING: making the formula proportional to it means refining the rigidity grid would change the physical deceleration -- a resolution artefact, not physics. The arithmetic is also internally wrong: for RigidityGrid::new(20, 0.1, 100.0), d_ln_r = ln(1000)/19 = 0.3636, not the 0.23 the claim states. 'Decades in ln(R)' is a unit error -- a decade is log10. The cited test asserts only max_bin <= peak_bin, which a ZERO shift also satisfies."
