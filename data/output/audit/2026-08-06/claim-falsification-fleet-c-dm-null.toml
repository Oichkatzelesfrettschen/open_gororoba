apart, presented as one result. C-1167 predicts the NFW force grows 157x at 157 AU; the
measurement gives 1.000000x, and test_r_dependence in the same file asserts the opposite
in its own comment. C-1159 puts the BGK validity boundary at Kn < 100 for r < 50 AU
while test_knudsen_quiet_solar_wind asserts the regime is already Kinetic at 1 AU;
evaluating the formula gives Kn = 2.167e8 at every radius, exactly r-invariant, because
lambda ~ r and d_i ~ r cancel. C-1166 restates the same boundary at a different
threshold using a length scale (cell size) that is not the one the function divides by
(ion inertial length), differing by 1.2e4 at 1 AU.

A GREEN SUITE THAT PROVES NOTHING. Both crates' library tests pass in full (112 and 16,
zero failures), and EVERY test named by a claim in this block is among the passing. Yet
13 of the 27 claims are refuted. The tests and the claims are not testing the same
propositions: test_r_dependence asserts the DM force is approximately CONSTANT while
C-1167 claims it grows linearly with r; test_adiabatic_deceleration_shifts_peak asserts
max_bin <= peak_bin, which A ZERO SHIFT SATISFIES, while C-1173 claims a specific 0.08
magnitude; test_phi_decreases_with_radius asserts an integral shrinks as its interval
shrinks while C-1171 claims phi(1 AU) is 0.4-0.8 GV;
test_mass_conservation_extended_radial asserts a 1e-10 bound against a forcing of 1e-15,
FIVE ORDERS TOO SMALL TO TEST IT. The suite therefore CANNOT FAIL WHEN A CLAIM IS WRONG,
which is why 139 of the 148 claims in this fleet's scope carry no verification_rule edge:
THE EXISTING TESTS WERE NEVER THE FALSIFIERS.

