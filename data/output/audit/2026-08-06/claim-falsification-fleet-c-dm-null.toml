# ---- Dimensional defects ----

[[finding]]
claim_id = "C-1154"
decidability = "internal"
falsifier = "False if the drag formula behind the 10^-45 cm^2 threshold is dimensionally inconsistent, since a threshold derived from a wrong force law is not a detection threshold."
check_performed = "Unit-by-unit dimensional analysis of DmForceField::drag_force (dm_force.rs:430-501) and drag_force_lattice / kappa_base (lines 318-335)."
observed = "f_mag = n_chi[m^-3] * n_b[m^-3] * sigma[m^2] * m_red[kg] * |v_rel|[m/s] and a_phys = f_mag/(n_b*m_p) = n_chi*sigma*(m_red/m_p)*|v_rel|, whose units are m^-3 * m^2 * (m/s) = s^-1. THAT IS A RATE, NOT AN ACCELERATION (m s^-2). The standard DM-baryon momentum-transfer drag is a = n_chi*sigma*(m_red/m_p)*|v_rel|^2: collision rate n*sigma*v times momentum m_red*v per collision. The code carries only ONE power of v_rel. With v_rel ~ 2.2e5 m/s the drag acceleration is understated by ~2.2e5. The kappa path inherits the identical error, and test_drag_lattice_vs_legacy_equivalence merely certifies that the two wrong paths agree."
verdict = "refuted"
verdict_reason = "The drag law is missing one factor of relative velocity, so the computed drag has units of s^-1 rather than m s^-2. The 10^-45 cm^2 threshold is the sigma at which a mis-dimensioned quantity crosses an arbitrary line and corresponds to no physical detection threshold; correcting the power of v moves it by ~5 orders."
recommended_status = "Refuted"
verification_rule = "Unit test asserting drag_force() output scales as |v_rel|^2 -- doubling the DM wind speed at fixed sigma must QUADRUPLE, not double, the drag acceleration. The current code fails this."
confidence = "high"

[[finding]]
claim_id = "C-1161"
decidability = "internal"
falsifier = "False if kappa is not dimensionless, or if drag_force_lattice's inner loop touches a dimensional quantity."
check_performed = "Unit-by-unit walk of kappa_base (dm_force.rs:323-334) and read of the drag_force_lattice inner loop (lines 386-414)."
observed = "kappa = n_chi[m^-3] * sigma_m2[m^2] * mass_ratio[1] * vel_conversion[m/s] * force_scale[s^2/m]. Collecting: m^(-3+2+1-1) * s^(2-1) = s * m^-1. KAPPA CARRIES UNITS s/m AND IS NOT DIMENSIONLESS. The inner-loop half is correct: drag[idx] = kappa * |v_rel| * v_rel_hat with v_rel drawn from solver.u, all lattice-valued, no per-cell conversion. But because kappa is dimensional, the drag term summed into the force field via combine_forces has units s/m while the gravitational term is a dimensionless lattice acceleration."
verdict = "partially_confirmed"
verdict_reason = "The engineering half is confirmed -- the precomputation does hoist every conversion out of the inner loop. The physics half is refuted: kappa has residual units s/m, the same defect as C-1154 (one missing power of velocity) seen from the coefficient side. TWO DIMENSIONALLY INCOMPATIBLE TERMS ARE BEING ADDED."
recommended_status = "Provisional"
verification_rule = "Dimensional test: with sigma fixed, doubling v_ref_kms must leave kappa*|v_rel| unchanged if kappa is a dimensionless lattice multiplier. It does not. NOTE: this claim has NO experiment row in registry/experiments.toml."
confidence = "high"

# ---- Mechanism absent from code ----

[[finding]]
claim_id = "C-1169"
decidability = "internal"
falsifier = "False if build_radial_profile applies no solar cycle phase correction, or if no sunspot-number proxy is used anywhere."
check_performed = "Read of build_radial_profile (solar_wind_ic.rs:765-795); grep -rn for 'sunspot|solar_cycle|cycle_phase' across the binary and its types module; check of E-117 status."
observed = "grep returns ZERO matches for sunspot, solar_cycle and cycle_phase. build_radial_profile bins records by r_au rounded to 0.1 AU and takes per-bin medians of density, speed, temperature and B. Epoch, year and solar cycle phase are never read and never used; records from different years at the same distance are pooled without correction. No residual scatter is computed anywhere, so the 40% threshold has no producer. E-117 has status = 'planned'."
verdict = "refuted"
verdict_reason = "The mechanism the claim names -- solar cycle phase correction using OMNI sunspot number as proxy -- does not exist in the cited function or anywhere in the binary. A claim that a correction reduces scatter to < 40% cannot hold when the correction is absent and the scatter is never measured."
recommended_status = "Refuted"
verification_rule = "Implement the correction, then assert per-bin scatter across spacecraft at overlapping r falls below 0.40 after correction and is higher before it. Both numbers are currently unproduced."
confidence = "high"

