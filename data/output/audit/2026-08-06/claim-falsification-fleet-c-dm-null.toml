[block]
id = "C_DM_NULL"
claim_count = 27
agent_note = "Heliospheric LBM/MHD dark-matter null-result cluster. Its central quantity |F_DM|/|F_Lorentz| ~ O(10^-12) is NOT a measurement: the numerator is a compile-time constant no spacecraft datum touches, and the ratio's order of magnitude is set by a lattice normalisation knob (b_scale, default 0.001). Only 10 of 27 claims have an active experiment (E-112: C-1143/1144/1145; E-113: C-1149-1155); 15 trace to experiments with status=planned and 2 (C-1158, C-1161) have no experiment row at all. The declared output directory data/experiments/ does not exist, so NO run in this block has retained evidence."

# ---- The O(10^-12) cluster ----

[[finding]]
claim_id = "C-1145"
decidability = "internal"
falsifier = "False if the binary's reported |F_DM|/|F_Lorentz| is not O(10^-12), or if the number is not a property of the physics but of an arbitrary non-dimensionalisation constant."
check_performed = "Built and ran the E-112 binary: solar-wind-dm-mhd --nx 128 --ny 32 --nz 32 --steps 1 --tau 0.6 --v-sw 0.05 --b0 B for B in {0.005, 0.05, 0.5, 5.0, 50.0}, plus a 500-step run at b0=0.005."
observed = "DM max |F_grav| = 1.306282e-15 lattice units, IDENTICAL at every b0. Ratios: b0=0.005 -> 9.589e-13; 0.05 -> 9.589e-15; 0.5 -> 9.589e-17; 5.0 -> 9.589e-19; 50.0 -> 9.589e-21. EXACT b0^-2 scaling over four decades. E-112's declared run uses --b0 5.0, yielding 9.589e-19, NOT O(10^-12). The O(10^-12) value appears only at B_lattice ~ 0.005, i.e. 5 nT times the solar_wind_ic b_scale default of 0.001. A 500-step run at b0=0.005 gives 9.589e-13 at step 1 but 3.656e-14 at step 500 -- the value DRIFTS by a factor of 26 as the run evolves."
verdict = "refuted"
verdict_reason = "The stated exponent is not reproduced by the claim's own declared experiment configuration (E-112 uses b0=5.0 -> 1e-19), and the quantity is a pure function of the lattice B normalisation rather than of physics: multiplying B_lattice by 10 divides the 'null result' by 100. The qualitative conclusion (DM gravity is dynamically negligible) SURVIVES; the number O(10^-12) does not."
recommended_status = "Refuted"
verification_rule = "cargo run --release -p gororoba_cli_physics --bin solar-wind-dm-mhd -- --nx 128 --ny 32 --nz 32 --steps 1 --b0 5.0 --v-sw 0.05 ; assert the printed ratio matches the claimed order. Currently prints 9.589e-19."
confidence = "high"

