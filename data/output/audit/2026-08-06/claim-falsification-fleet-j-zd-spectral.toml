[[finding]]
claim_id = "C-924"
decidability = "internal"
falsifier = "False if entropy_upper_bound() does not implement an inequality with content -- specifically if the returned bound equals the measured H(dim) identically for all inputs, or if the k fitted at dim=16 fails to bound H at 32/64/128."
check_performed = "Read associator_entropy.rs:288-297 (entropy_upper_bound), 111-123 (bin_norms), 130-220 (decompose_entropy)."
observed = "entropy_upper_bound(h_8, h_dim, n_zd) computes log_zd = ln(n_zd+1); k = (h_8 - h_dim)/log_zd; bound = h_8 - k*log_zd. Substituting k gives bound = h_8 - (h_8 - h_dim) = h_dim identically, for every (h_8, h_dim, n_zd) with n_zd >= 1. Separately, bin_norms is called with max_val = max_norm computed per dimension from that dimension's own sample (line 186), so H(dim) is a histogram entropy over a per-dimension rescaled support."
verdict = "refuted"
verdict_reason = "The 'upper bound' is an algebraic tautology: the fitted k is defined so the bound equals the measurement exactly, at EVERY dimension, not merely at dim=16. The inequality is satisfied with equality by construction and has zero falsifiable content; the one-point fit is the symptom, the identity is the defect. The per-dimension max_norm binning additionally makes H(dim) a shape statistic on a rescaled support, so cross-dimensional comparison is not on a common scale."
recommended_status = "Refuted"
verification_rule = "Unit test: for arbitrary (h_8, h_dim, n_zd) with n_zd >= 1, assert (entropy_upper_bound(h_8, h_dim, n_zd).1 - h_dim).abs() < 1e-12 -- the function returns an identity, not a bound. Locator: crates/algebra_analysis/src/associator_entropy.rs::entropy_upper_bound"
confidence = "high"

[[finding]]
