cross_claim_findings = """
ONE METHODOLOGICAL FAILURE MODE generates four of the six refutations, the same each
time: a quantity DETERMINED BY CONSTRUCTION is reported as though it were measured.

  - C-924: entropy_upper_bound fits k so that bound == h_dim identically. The "bound"
    is an identity at every dimension.
  - C-926: spectral_gap_census reads components[0] only, on the strength of an inline
    comment ("All components are isomorphic at a given dimension") that the repo's own
    census data contradicts from dim=32 upward. components[0] is always the densest,
    complete-multipartite class, so the census measures the one class for which the
    conclusion is automatic.
  - C-929: brody_q = 0.0 is fit_brody_parameter's domain clamp for any variance >= 1,
    and the variances 59.0 and 123.0 are exactly N-2, the closed-form value forced by a
    two-level spectrum. Nothing statistical was measured.
  - C-930: the same clamp makes q constant across all 8 and all 16 motif classes, so
    "no topology-dependent variation" reports the constancy of a saturated estimator.

THE CROSS-CLAIM LINK that only appears when the block is read together: C-930's own
premise REFUTES C-926's method. C-930 asserts, and zd_nnsd_motif.csv confirms, 8
distinct motif classes at dim=128 and 16 at dim=256. C-926's evidence rests on the
assertion that all components at a dimension are isomorphic. Both cannot be true, and
the census CSVs settle it against C-926: at dim=32 already, 8 components have 84 edges
and 7 have 36.

THE NUMBER 4 appears in two unrelated places and does the work in both. Every dimension
>= 32 has motif classes with degree_min exactly 4, which caps their algebraic
connectivity at 4 and refutes C-926 (Fiedler: a(G) <= delta_min; Grone-Merris:
lambda_max >= Delta_max + 1; hence gap_ratio <= 4/(Delta_max+1), 0.31 at dim=32 falling
to 0.032 at dim=256). And every sedenion zero divisor has annihilator nullity exactly 4,
making the partner graph 4-regular, which is what lets mult(+4) = 7 prove C-1253's
factor of 7 is a component count rather than a coincidence.

C-1253 AND C-1291 ARE THE SAME FACT seen from two directions and neither claim says so.
C-1253's middle entry, degeneracy 6 out of 12, IS the flat band: 6/12 = 1/2. The partner
graph's per-box-kite spectrum {-4, -2^(2), 0^(6), +2^(2), +4} has exactly half its
eigenvalues at zero, which is C-1291's flat band fraction at D=16. Verifying either one
verifies the D=16 instance of the other.

TWO CLAIMS ARE NEGATIVE RESULTS ABOUT THE PROJECT'S OWN PROGRAMME (C-928 excludes
gamma_BG from the Immirzi bridge; C-1139 finds no CHSH violation), both correct, exact,
and sitting at Provisional. They are the block's most solid content and are UNDER-graded,
while the four constructed-quantity claims are graded the same. Status is currently
uncorrelated with evidential strength across this block.
"""
new_claims_proposed = """
1. UNIVERSAL HALF-FILLING OF THE ZD MOTIF ADJACENCY SPECTRUM. Verified exactly at
   D = 64, 128, 256 and conjectured for every D = 2^k with k >= 4: every connected
   component of the zero-divisor cross-assessor motif graph has n = D/2 - 2 vertices and
   adjacency nullity exactly n/2, hence flat band fraction exactly 1/2, INDEPENDENT of
   the component's motif class (edge count, degree sequence, regularity). EVIDENCE:
   exact for all 28 motif classes in data/csv/zd_motif_invariants.csv (15/30, 31/62,
   63/126, all to |lambda| < 1e-6). D = 16 and D = 32 are NOT covered: that CSV holds no
   rows for them, and the D=16 value of 1/2 quoted elsewhere is on the 84-vertex PARTNER
   graph, a different graph from the 42-node motif graph. FALSIFIER: a single component
   at some D = 2^k >= 16 whose adjacency nullity differs from n/2. Decisive check: extend
   the census to D = 16, 32, 512 and assert per-class nullity == n/2 exactly.
   This SUBSUMES C-1291, C-1270 and C-1274 and states the invariant they instantiate.

2. TWO-LEVEL LAPLACIAN SPECTRUM OF THE DENSEST MOTIF CLASS. At every D = 2^k >= 16 the
   densest ZD motif class is the cocktail-party graph K_{m x 2} with m = D/4 - 1, whose
   Laplacian spectrum is {0, (2m-2)^(m), (2m)^(m-1)}: exactly two distinct positive
   levels, so gap_ratio = (m-1)/m -> 1 and any nearest-neighbour spacing statistic on it
   is UNDEFINED rather than integrable. EVIDENCE: k2_multipartite_part_count = 3, 7, 15,
   31, 63 at D = 16..256; the derived spectrum reproduces the n_eigenvalues, mean_spacing
   and spacing_variance columns of zd_nnsd.csv to 7 significant digits. FALSIFIER: a
   densest-class component at some D whose Laplacian has three or more distinct positive
   eigenvalues.

3. SPACING VARIANCE OF A TWO-LEVEL SPECTRUM IS DETERMINISTIC. For any spectrum of N
   values taking exactly two distinct levels, the mean-normalized nearest-neighbour
   spacing variance equals N-2 identically, so a reported variance of N-2 is evidence of
   two-level degeneracy and NOT of super-Poisson statistics. FALSIFIER: a two-level
   spectrum whose computed normalized spacing variance differs from N-2. A unit-testable
   identity, not an empirical claim.

4. THE ZD MOTIF FAMILY IS NOT AN EXPANDER FAMILY. Over D = 32..256 the components split
   into classes whose minimum degree is fixed at 4 while maximum degree grows as
   D/2 - 3; consequently gap_ratio <= 4/(D/2 - 2) -> 0, so no constant c > 0 bounds the
   family's spectral gap ratio from below and the family fails the definition of an
   expander family in both the bounded-degree and normalized-gap senses. FALSIFIER: a
   constant c > 0 with a proof that lambda_2/lambda_max >= c for every component at every
   D; or measured lambda_2 exceeding 4 for a delta_min = 4 component, contradicting
   Fiedler.
"""
