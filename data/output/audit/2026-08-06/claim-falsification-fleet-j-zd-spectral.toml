decidability = "internal"
falsifier = "False if any ZD motif component at any CD dimension 16-512 has gap_ratio = lambda_2/lambda_max <= 0.6, or if the census that established the claim never examined more than one component per dimension."
check_performed = "Read spectral_dimension.rs:484-497 (zd_laplacian_eigenvalues) and 582-620 (spectral_gap_census). Read committed census artifacts data/csv/cd_motif_components_{16,32,64,128,256}d.csv. Applied Fiedler (1973) a(G) <= kappa_v(G) <= delta_min for non-complete connected G, and Grone-Merris/Anderson-Morley lambda_max >= Delta_max + 1."
observed = "zd_laplacian_eigenvalues(dim) computes the Laplacian of components[0] ONLY, justified by the inline comment 'All components are isomorphic at a given dimension' (line 490). That comment is FALSE at every dim >= 32. From cd_motif_components_32d.csv: 8 components have 84 edges (12-regular) and 7 have 36 edges (degree_min 4, degree_max 12). Distinct (node,edge,deg_min,deg_max) signatures: dim=32 (14,36,4,12) and (14,84,12,12); dim=64 (30,84,4,28) (30,228,12,28) (30,276,4,28) (30,420,28,28); dim=128 8 classes, deg_min in {4,12,28,60}, Delta_max = 60; dim=256 16 classes, deg_min in {4,12,28,60,124}, Delta_max = 124. components[0] is ALWAYS the densest (complete-multipartite) class. Analytic upper bound for the delta_min = 4 classes, which exist at every dim >= 32: gap_ratio <= delta_min/(Delta_max+1) = 4/(Delta_max+1): dim=32 <= 4/13 = 0.3077; dim=64 <= 4/29 = 0.1379; dim=128 <= 4/61 = 0.0656; dim=256 <= 4/125 = 0.0320. The repo's own theory doc concedes it: crates/data_core/src/registry_mirrors/docs_theory_cayley_dickson_integrable_expanders.rs:281 'In the strict Alon-Boppana sense, these are NOT Ramanujan (they are complete multipartite, not sparse).'"
verdict = "refuted"
verdict_reason = "The conjunct 'gap_ratio > 0.6 universally' is refuted analytically at every dimension >= 32: sparse motif classes with delta_min = 4 and Delta_max = n-2 exist in the committed census and are bounded above by 4/(Delta_max+1), 0.31 at dim=32 falling to 0.032 at dim=256, an order of magnitude below the asserted floor. The stated mechanism ('near-complete graph topology forces lambda_2 close to n') holds only for the densest class, the only class the census ever measured. The weaker conjunct 'all components exceed 1/(2n)' is NOT decided here, but that test cannot certify an expander family in any case: 1/(2n) shrinks with n, and a family whose degree grows with n is dense. gap_ratio for the sparse classes provably decays as O(1/n) -- the opposite of the constant lower bound an expander family requires."
recommended_status = "Refuted"
