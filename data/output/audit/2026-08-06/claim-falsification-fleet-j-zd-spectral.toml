[[finding]]
claim_id = "C-927"
decidability = "internal"
falsifier = "False if the adaptive threshold epsilon(N) = 1.3*sqrt(16/N) is not tracking the concentration scale of the zd_proximity statistic -- if the statistic concentrates somewhere other than at distance ~sqrt(16/N) from 0 -- since then the non-saturation it produces is an artifact of moving the cut off the support."
check_performed = "Read associator_entropy.rs:64-89 (zd_proximity) and 302-311 (adaptive_proximity_threshold). Asymptotic analysis. Numeric near_frac comparison at dims 32/64/128 attempted via a scratch binary but the build never completed."
observed = "zd_proximity(v, dim) returns min over the (dim/2-1)*(dim/2) coordinate 2-planes of acos(sqrt((v_i^2+v_j^2)/|v|^2)) -- an angle from the 2-plane, initialised at pi/2. For a uniform unit vector in R^N the two largest coordinate squares satisfy max_i v_i^2/|v|^2 ~ 2 ln N / N, so the maximum 2-plane projection is O(ln N / N) and the statistic concentrates at pi/2 with deficit pi/2 - zd_proximity ~ c*sqrt(ln N / N). The claim's threshold 1.3*sqrt(16/N) = 5.2/sqrt(N) is measured from 0, NOT from pi/2. At dim=16 it equals 1.300 rad against a support ceiling of pi/2 = 1.571; at dim=128 it equals 0.460 rad while essentially the whole distribution sits within c*sqrt(ln 128/128) = O(0.2) rad of pi/2, i.e. above 1.3 rad."
verdict = "partially_confirmed"
verdict_reason = "The mechanical statement (fixed 1.3 rad saturates at dim=32, the adaptive threshold does not) is plausible and asserted by two existing tests, but the threshold is anchored at the WRONG END of the statistic's support. zd_proximity concentrates at pi/2 with deficit ~sqrt(ln N/N); a cut shrinking toward 0 as N^{-1/2} does not track that concentration, it walks off the support, so near_frac is driven to 0 rather than desaturated in a principled way. The functional form sqrt(16/N) also does not match the sqrt(ln N/N) concentration scale. The threshold is reverse-engineered: calibrated to reproduce the dim=16 answer (epsilon(16) = 1.3 exactly by construction) and validated only by the absence of saturation it was designed to produce."
recommended_status = "Provisional"
verification_rule = "Replace the anchor: define epsilon(N) = pi/2 - c*sqrt(ln N / N) and assert near_frac stays in (0.05, 0.95) across dims 16..256. Locator: associator_entropy.rs::adaptive_proximity_threshold"
confidence = "medium"

