[[finding]]
claim_id = "C-950"
decidability = "internal"
falsifier = "False if the implementation the claim points at builds no parity-check matrix, or if its syndrome function is not a parity (GF(2)) functional, or if the stabilizer group's defining property -- pairwise commuting generators, -I excluded -- is never defined or tested."
check_performed = "Read crates/quantum_core/src/qec_boxkite.rs:1-70 (BoxKiteStabilizer, check_syndrome, code_distance, num_checks) and crates/quantum_core/src/stabilizer_like.rs:1-42."
observed = "check_syndrome is self.parity_edges.iter().any(|(u, v)| error_mask.contains(u) || error_mask.contains(v)) -- a monotone OR over vertices incident to any edge. NOT a GF(2) sum: it cannot distinguish even-weight from odd-weight error patterns, which is the defining behaviour of a parity check, and it can never un-fire as errors are added. No parity-check matrix is constructed anywhere; parity_edges is a Vec<(usize,usize)> of edges and num_checks() returns its length. code_distance() returns a hardcoded literal 3 with the comment 'K_{2,2,2} box-kites have distance 3'; no minimum-weight computation exists. No commutation, symplectic-product, or -I-exclusion test appears anywhere in crates/quantum_core/. The trait's own doc comment (stabilizer_like.rs:14-18) states: 'Unlike standard stabilizer codes where [S_i, S_j] = 0 and syndromes are binary, non-associative codes have continuous syndrome strengths' -- the module explicitly positions itself as stabilizer-LIKE, not as a stabilizer code."
verdict = "refuted"
verdict_reason = "Both load-bearing technical terms fail against the implementation the claim cites. 'Exact parity-check matrix': no matrix is built and the syndrome functional is a monotone OR, not a parity; a monotone functional cannot be the syndrome map of any linear code. 'Stabilizer code': the abelian-generator condition that defines a stabilizer group is neither defined nor tested, and the trait documentation disclaims it. A category error dressed in exactness -- and 'exact' carries no content in any case, since any 0/1 matrix is the parity-check matrix of some linear code."
recommended_status = "Refuted"
verification_rule = "If revived, the durable check is: build the putative generator set, compute all pairwise symplectic products, assert they vanish (abelian) and that -I is excluded; a stabilizer claim without that test is not decidable. Locator: qec_boxkite.rs::BoxKiteStabilizer::check_syndrome"
confidence = "high"

