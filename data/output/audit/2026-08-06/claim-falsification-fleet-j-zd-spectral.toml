[[finding]]
claim_id = "C-929"
decidability = "internal"
falsifier = "False if brody_q = 0.0 is a domain clamp rather than an estimate, or if the reported spacing variances 59.0 and 123.0 are reproduced by a closed form containing no statistics -- in which case there is no measured statistic to classify."
check_performed = "Read quantum_chaos.rs:301-340 (fit_brody_parameter), 209-226 (unfold_spectrum_kde), 372-445 (nnsd_analysis). Read data/csv/zd_nnsd.csv. Cross-referenced cd_motif_components_{128,256}d.csv and derived the representative component's Laplacian spectrum in closed form."
observed = "zd_nnsd.csv verbatim: 128,61,0.0083333333,58.9999997677,...,0.0000000000,DegenerateIntegrable and 256,125,0.0040322581,122.9999995110,...,0.0000000000,DegenerateIntegrable. fit_brody_parameter returns 0.0 UNCONDITIONALLY whenever variance >= brody_variance(0) ~ 1.0 (lines 319-321). With variance 59 and 123 the bisection never executes: q = 0.0 is the lower endpoint of the estimator's domain, not a fit. The Brody family has variance in [0.273, 1.0]; 59 and 123 lie outside it entirely, so q is not estimable. CLOSED FORM: components[0] at dim=128 is (62 nodes, 1860 edges, 60-regular, k2_multipartite_part_count = 31) = the cocktail-party graph K_{31x2}, Laplacian spectrum {0, 60^(31), 62^(30)}: 61 positive eigenvalues in exactly 2 distinct levels. At dim=256 it is K_{63x2}: {0, 124^(63), 126^(62)}, 125 positive, 2 levels. For N values in exactly 2 levels there are N-1 spacings, N-2 of them exactly 0 and one equal to the whole range S. Then variance = [(N-2) + (N-2)^2]/(N-1) = N-2. N=61 gives 59; N=125 gives 123 -- matching the reported values to 7 significant digits. mean_spacing is also closed form: unfold_spectrum_kde returns sum*1/(2N) so unfolded values lie in [0,1], NOT with unit mean spacing as the docstring asserts; with sigma = 0.1*range the cross-level erf saturates, giving range exactly 0.5, hence mean_spacing = 0.5/(N-1) = 1/120 at N=61 and 0.0040322581 at N=125. Both match exactly. Unfolding cannot help: exact degeneracies map to identical unfolded values under any monotone map and any bandwidth, so the zero spacings survive by construction. The standard remedies (collapse to distinct levels, or symmetry-sector decomposition before computing spacings) were not applied."
verdict = "refuted"
verdict_reason = "Every reported number is reproduced exactly by a closed form containing no statistics: variance = N-2 is forced by a 2-level spectrum, mean_spacing = 0.5/(N-1) is forced by the KDE normalisation and bandwidth, and brody_q = 0.0 is the estimator's domain clamp for any variance >= 1. There is no measured spacing distribution to be super-Poisson. The underlying spectral fact (the representative Laplacian has exactly two distinct positive levels because the graph is complete multipartite) is correct and interesting, but presenting a determined quantity as a measurement is the defect, and NNSD is inapplicable to a 2-level spectrum."
recommended_status = "Refuted"
verification_rule = "Regression test asserting fit_brody_parameter returns exactly 0.0 for any spacing set with normalized variance >= 1.0 (the clamp), plus a test asserting the dim=128 representative Laplacian has exactly 2 distinct positive eigenvalues so nnsd_analysis must decline rather than classify. Locators: quantum_chaos.rs::fit_brody_parameter, data/csv/zd_nnsd.csv"
confidence = "high"

