[synthesis]
cross_claim_findings = """
ONE UNCITED NINE-ROW TABLE IS LOAD-BEARING FOR THREE CLAIMS.
alice_pbpb_5020_npart() and alice_pbpb_5020_mc_glauber() in
crates/qgp_scaling/src/data_tables.rs carry byte-identical N_part columns
(382.8, 329.7, 260.5, 186.4, 128.9, 85.0, 52.8, 30.0, 15.8). The first is cited
to ALICE PLB 772 (2017) and supplies C-840's entire reference side; the second
supplies C-937's 'MC Glauber' alternative and, through
a_perp = sigma_NN * N_part^2 / (4 * N_coll), the geometry C-844 already found
unphysical. PLB 772 (arXiv:1612.08966) contains NO per-centrality N_part table at
all -- only N_part = 7.3 for 80-90%, with the Glauber calculation attributed to
refs [10,14]. The introducing commit 66d5ef05 names no source for the 5.02 TeV MC
Glauber row either. So C-840's 'published values' and C-937's 'independent
eccentricity model' are the same unsourced numbers, and refuting the provenance
decides both at once. Falsifier: produce the publication whose table lists all
nine values including eccentricity 0.029 at 0-5%.

EVERY CLAIM HERE THAT READS AS A VALIDATION IS A COMPARISON AGAINST A FROZEN
NUMBER. C-841 compares a fit to a value (6.1) that is an input constant, not a
fit output. C-847 quotes a literature value the repo cannot compute (no ATLAS jet
v2 on disk) and inflates its uncertainty from +/- 0.06 to +/- 0.15. C-938 and
C-939 'compare models' against digitized figure readings that cannot be refit,
while the favoured model is fitted to the very points it is scored on. The shared
hidden assumption is that a frozen curve or constant can stand in for a model or a
measurement. It cannot: BIC is only defined over models fitted to a common data
set, and a consistency band is only a test if it could have failed. The parameter
counts carry the same defect: CUJET3.0's k is asserted as 5 where the source says
2, and Arleo-Falmagne's k is asserted as 2 (beta, K) where the curve depends on
one fitted epsilon_bar plus a fixed n = 6.1. Both errors point the SAME way,
inflating the competitor's penalty and understating the favoured model's -- and
C-938 still fails.

C-938 FALSIFIES ITSELF IN ITS OWN FAVOURED DIRECTION, and the repo's own binary
prints the refutation. On the six common ALICE 0-5% points above 5 GeV, CUJET3.0
(frozen, wrong collision energy, charged a 5-parameter penalty its source says
should be 2) reaches BIC 1209.0 against Arleo-Falmagne's 2416.2. The parameter
penalty is irrelevant against a 1200-unit chi2 gap. The single root cause behind
C-938, C-842 (Refuted, all per-bin chi2/ndf >> 2), C-844 (Refuted), and C-936 is
the same: the AF power-law R_AA ansatz does not describe ALICE 5.02 TeV data at
published precision -- AF's chi2/n here is 402, about 20 sigma per point. Any
claim of the form 'AF beats X' is therefore measuring how bad X is, and any beta
extracted from that ansatz is a fit artefact. That is why beta_density comes out
0.355 and beta_azimuthal 0.021 against a published 1.02 and 0.94. Falsifier: an
AF fit to any ALICE 5.02 TeV centrality bin reaching chi2/ndf below about 2 with
published stat-plus-syst errors and no added nuisance parameters.

THE ECCENTRICITY MISLABELLING is decided by the repo's own numbers, not by
inference. glauber-only reports optical Glauber eccentricity 0.0710 at 0-5%, while
the table labelled 'MC Glauber epsilon_2{2}' gives 0.029 for the same bin.
Event-by-event epsilon_2{2} is fluctuation-dominated and must exceed the smooth
optical value in central collisions; the labelled MC number is 2.4x smaller, so
the ordering is inverted and the column cannot be epsilon_2{2}. C-937's
'replacement' therefore compares optical Glauber against a second, smaller,
uncited smooth-geometry number.

CENTRALITY-PAIRING DEFECT shared by C-847, C-936, C-937:
raa_table = (c_lo * 20.0) as usize + 1 pairs the 10-20% CMS v2 table with ALICE
table_3, which is 10-15%, and likewise 20-30% with 20-25%, 30-40% with 30-35%,
40-50% with 40-45%. The v2 and eccentricity are broad-bin, the R_AA log slope is
narrow-bin. Cancels in C-937 (both arms share it); does not in C-936.

ARLEO-FALMAGNE'S OWN PAPER CONTRADICTS THE REPO'S USAGE in two unexpected places.
Their hadron beta from the v2/eccentricity relation is 0.94 +/- 0.04, not the
1.02 +0.09/-0.06 the repo compares the azimuthal branch against -- 1.02 is the
density-scaling value, and using it as the azimuthal target CONFLATES the two
extractions the claim asserts are independent. And they explicitly exclude 0-5%
(hadrons) and 0-10% (jets) from that fit because small eccentricity inflates
v2/e uncertainties, while run_cross_validate and run_ecc_compare both include
0-5%.
"""
new_claims_proposed = """
1. On ALICE Pb-Pb 5.02 TeV 0-5% charged-hadron R_AA restricted to pT > 5 GeV, the
   digitized CUJET3.0 2.76 TeV prediction attains a lower chi2 (1200) than the
   BEST-FIT Arleo-Falmagne power-law ansatz (1917) over the identical six points,
   so the AF ansatz is not the preferred description even before any parameter
   penalty. Falsifier: an AF fit over the same six points with any (epsilon_bar, n)
   reaching chi2 < 1200.

2. CUJET3.0 carries two free parameters (alpha_c and c_m), not the five asserted in
   crates/qgp_scaling/src/competing_models.rs, per Xu-Liao-Gyulassy JHEP02(2016)169
   Sec. 6. Falsifier: a passage in that paper enumerating five independently varied
   parameters rather than the stated pair with c_m scanned over three fixed schemes.

3. The reference table alice_pbpb_5020_npart() is not sourced to ALICE PLB 772
   (2017) 567; that paper tabulates no per-centrality N_part. Falsifier: a page or
   table number in PLB 772 containing the nine values.

4. The Arleo-Falmagne power-law R_AA ansatz is falsified against ALICE 5.02 TeV
   data at published precision INDEPENDENTLY of any competitor, at chi2/ndf of
   order 300 per centrality bin. Falsifier: chi2/ndf below about 2 for any
   centrality with published stat-plus-syst errors and no additional nuisance
   parameters.

5. The 5.02 TeV eccentricity column in alice_pbpb_5020_mc_glauber() is not
