[[finding]]
claim_id = "C-938"
decidability = "internal"
falsifier = "False if BIC(Arleo-Falmagne) >= BIC(CUJET3.0) on the ALICE 0-5% pT > 5 GeV points, or if the comparison is not valid model selection (competing model not refit, different data, different likelihood)."
check_performed = "Read competing_models.rs in full and run_bic_compare. Independent recomputation of chi2 and BIC = chi2 + k*ln(n) for all three models against the six ALICE 0-5% points with pT >= 5 GeV from data/external/alice_pbpb_raa/table_1.csv, using total_err = sqrt(stat^2 + syst_up^2) exactly as compute_bic does, with the AF epsilon_bar obtained by grid-minimizing chi2 at n = 6.1 over [0.1, 20]. Fetched Xu, Liao, Gyulassy JHEP02(2016)169 (arXiv:1508.00552) to audit the parameter count."
observed = "REPO RUN verbatim: 'CUJET3.0 Pb-Pb 2.76 TeV 0-5%  k=5  chi2=1200.1  n=6  chi2/n=200.010  excl=0  BIC=1209.0 (dBIC=0.0)'; 'Arleo-Falmagne  k=2  chi2=2412.6  n=6  chi2/n=402.102  excl=0  BIC=2416.2 (dBIC=1207.2)'; 'Frac. Langevin  k=3  chi2=3687.9  n=6  BIC=3693.3 (dBIC=2484.3)'. The binary prints 'Best model: CUJET3.0 ... Evidence strength vs second-best: VERY STRONG (delta-BIC = 1207.2)'. The six points are pT = 5.5, 7.0, 9.0, 11.5, 16.5, 25.0 GeV; all three curves cover them, so n_used = 6, n_excluded = 0 for every model, common data set. Independent recomputation reproduces CUJET (1200.1) and Langevin (3687.9) exactly and finds a BETTER AF optimum than the binary: grid-minimizing gives eps_bar = 3.404, chi2 = 1916.6, whereas the binary's Brent minimizer returns eps_bar = 2.921, chi2 = 2412.6. So the AF fit is not even at its own minimum, and at that minimum it STILL loses to CUJET by 716 in chi2. All model-selection validity conditions except likelihood form fail: CUJET3.0 and Langevin are frozen hardcoded vectors that CANNOT be refit (digitized figure readings), while AF's single parameter is fitted to the very six points it is scored on; the advertised k = 2 (beta, K) is a label, not a count of fitted parameters (one fitted eps_bar plus fixed n = 6.1); and the CUJET curve is Pb-Pb 2.76 TeV scored against 5.02 TeV data. The code PRINTS all of these as CAVEATS, so the invalidity was known when the claim was written. The parameter count is wrong in CUJET's disfavour: the source states 'The sQGMP model depends on two parameters: (1) alpha_c ... and (2) c_m = g*mu_E/mu_M', with alpha_c fixed by one reference datum and c_m scanned over three fixed schemes. k = 2, not 5. Correcting it lowers CUJET's BIC to 1203.7 and widens the margin to 716. The paper also states its predictions are for pT > 10 GeV, so scoring at 5.5, 7.0, 9.0 is outside its validity range -- which penalizes CUJET further, and it still wins."
verdict = "refuted"
verdict_reason = "The repo's own binary prints the opposite of the claim: CUJET3.0 attains BIC 1209.0 against Arleo-Falmagne's 2416.2, delta-BIC 1207, which the code itself labels VERY STRONG -- and it does so while carrying a fabricated 5-parameter penalty where the source says 2. The comparison is in addition not valid model selection: the competing model is a frozen digitized curve at the wrong collision energy while AF is fitted to the scored points."
recommended_status = "Refuted"
