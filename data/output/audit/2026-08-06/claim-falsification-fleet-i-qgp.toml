agent_note = "Decided by four runs of the existing arleo-falmagne-scaling binary plus four fetched primary sources. The briefing called this block uniformly external; it is not -- only C-840, C-841, C-847 turn on a publication, while C-936/937/938/939 are internal claims about this repo's fits. Five of seven refute, three of them on the repo's OWN printed output: glauber-only prints FAIL for six of nine centrality bins (C-840), cross-validate prints UNIVERSALITY BREAKS at z = 27.9 (C-936), and bic-compare ranks CUJET3.0 ABOVE Arleo-Falmagne by delta-BIC 1207 (C-938). Common root cause: the Arleo-Falmagne power-law R_AA ansatz does not fit ALICE 5.02 TeV data at published precision."

