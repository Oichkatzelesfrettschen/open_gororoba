[[finding]]
claim_id = "C-1280"
decidability = "internal"
falsifier = "False if BGK is observed stable above Ma ~ 0.3, or if MRT does not survive materially higher density contrast than BGK."
check_performed = "Read data/output/e167_mrt_bgk_stability_n16_tau07.csv, the retained BGK-vs-MRT stability envelope at n=16, tau=0.7, 200 steps."
observed = "BGK survives with clean mass conservation WELL PAST Ma 0.3: contrast 12.76 Ma=0.982 mass_err=2.88e-14; contrast 15.68 Ma=1.106 mass_err=2.37e-14; contrast 19.26 Ma=1.662 mass_err=1.88e-14. THE FIRST MODE TO EXPLODE IS MRT, at contrast 23.66 (mass_err 3.03e96) where BGK is still intact. At contrast 29.07 the order REVERSES. From 35.72 up, both explode."
verdict = "refuted"
verdict_reason = "The claim's stated BGK ceiling of Ma ~ 0.3 is contradicted by the repo's own retained data, which has BGK stable at Ma = 1.66 -- ABOVE the Ma ~ 1.5 the claim reserves for MRT. There is no consistent ordering: near threshold MRT fails first at one contrast and BGK at the next, so MRT does not extend the envelope 5x or at all. SCOPE NOTE: the claim's stated demonstration is Euclid galaxies at floor=0.03, 64^3, and that specific datum was never replayed (E-162 retained no artifact). What is refuted is the GENERAL assertion of a BGK Ma ~ 0.3 ceiling and of an MRT extension, established on E-167's synthetic Gaussian at n=16. The pre-registered falsifier was 'false if BGK is observed stable above Ma ~ 0.3', and Ma = 1.662 at mass_err = 1.88e-14 meets it regardless of configuration."
recommended_status = "Refuted"
verification_rule = "Assertion over data/output/e167_mrt_bgk_stability_n16_tau07.csv: max BGK max_mach among rows with mass_err < 1e-10 must exceed 0.3 (it is 1.662), falsifying the stated BGK ceiling."
confidence = "high"

