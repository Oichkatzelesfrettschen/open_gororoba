[block]
id = "E_GPU_LBM"
claim_count = 24
agent_note = "A prebuilt binary at .cache/gate-target/release/euclid-df-sweep (mtime 2026-04-12, contemporaneous with these claims) executed the sweeps directly; a from-source rebuild never completed under fleet contention. Two GPU sweeps ran to useful size: E-163 at 64^3 complete at 100/100, and E-166 at 128^3 to 70 galaxies. All 24 claims have ZERO verification_rule edges; every existing edge is a pointer, never a check. THE HEADLINE: the engineering claims largely survive -- some to within 1% -- while the scientific claim the block exists to support does not."

[[finding]]
claim_id = "C-1297"
decidability = "internal"
falsifier = "False if any of the 6 conditions is not distinct from another under the registered run command, or if a condition varies a parameter the kernel ignores, or if D_f ~ 2.73 arises without ZD forcing."
check_performed = "Read run_null_hypothesis_gpu and report_null_hypothesis (euclid_df_sweep.rs:722-1183); traced the force field into the CUDA MRT kernel; read alpha_zd defaults. Then EXECUTED E-174's registered command verbatim against the prebuilt binary, and re-ran at --grid 64 and with --alpha-zd 0.1."
observed = "The forcing DOES reach the kernel -- lbm_step_soa_mrt_fused applies Guo forcing from force[3*N] at kernels_soa.cu:675-691 -- so the controls are not inert in principle. BUT alpha_zd defaults to 0.0 (clap default_value = '0.0' at euclid_df_sweep.rs:87-88, and GalaxyPipelineConfig::default at galaxy_pipeline.rs:74) and E-174's registered command passes no --alpha-zd. Running it verbatim printed, exactly as predicted before the run: 'WARNING: alpha_zd=0 -- C1/C3 degenerate to C0/C2 (no ZD forcing)'. The same run then PANICKED before producing a single trial result: 'thread main panicked at euclid_df_sweep.rs:816:38: LBM step_n: DriverError(CUDA_ERROR_STREAM_CAPTURE_UNSUPPORTED, \"operation not permitted when stream is capturing\")', exit 101. Reproduced identically at --grid 64 and at --grid 128 with --alpha-zd 0.1 (which correctly suppressed the degeneracy warning, confirming the branch). The GPU is present and healthy: the ordinary GPU sweep runs to completion on the same binary."
verdict = "refuted"
verdict_reason = "The experiment declared to establish this claim CANNOT EXECUTE: its registered command aborts on a CUDA graph-capture conflict before emitting any D_f, so no 6-condition result has ever existed. Worse, when it does reach the setup stage it announces that two of its six conditions are byte-identical duplicates of two others, because the ZD coupling defaults to zero -- and the positive control C5 then carries pure NFW gravity with NO ZD FORCING AT ALL. The claim that only Sersic morphology plus ZD algebraic forcing yields D_f ~ 2.73 rests on a control experiment that is simultaneously degenerate and non-functional."
recommended_status = "Refuted"
verification_rule = "E-174 must be re-registered with an explicit nonzero --alpha-zd and extended with Sersic+ZD-only and Sersic+NFW-only conditions; the runner should hard-fail rather than warn when --null-hypothesis is combined with alpha_zd = 0."
confidence = "high"

[[finding]]
claim_id = "C-1288"
decidability = "internal"
falsifier = "False if the stated CI is inconsistent with the stated mean, std and N, or if 2.7268 does not sit at the 31st percentile under any stated reading."
check_performed = "Recomputed the stated CI from mean 2.732, std 0.034, N=100; then RAN E-166 at --grid 128 --steps 200 --mrt, completing 70 galaxies (CSV sha256 0b94db8b0481d1d0e5e195811ff34e2ac581d1861b5875a099bb96efacc4365e), and evaluated the empirical rank of 2.7268 directly."
observed = "The stated CI is internally consistent: se = 0.00340, mean +/- 1.96 se = [2.7253, 2.7387], reproducing [2.725, 2.739] exactly. The MEASURED run gives D_f = 2.7384 +/- 0.0374 over 70 galaxies, CI_95 [2.7297, 2.7472], all 70 stable. The standard deviation reproduces well (0.0374 vs 0.034), but the mean sits 0.0064 HIGHER. Consequences for 2.7268: it lies OUTSIDE the measured CI (2.7268 < 2.7297), at z = -2.61 against the sampling distribution of the mean. Its empirical rank among the 70 per-galaxy values is 33/70 = 47.1 percentile, NOT 31st."
verdict = "refuted"
verdict_reason = "The '31st percentile' is not reproducible under any reading -- the empirical rank, the only reading that could have produced it, is 47.1%. More seriously, the replicated measurement's 95% CI EXCLUDES 2.7268 at z = -2.61, so the CD D=16 prediction is marginally INCONSISTENT with, not in quantitative agreement with, the measured fractal dimension. Given C-1287's finding that the bulk mean shifts 0.173 between 64^3 and 128^3, agreement at the third decimal is not a meaningful test at either resolution."
recommended_status = "Refuted"
verification_rule = "Replay E-166 to data/output/ and assert both the reported percentile against the empirical rank of 2.7268 and whether 2.7268 falls inside CI_95; both currently fail."
confidence = "high"

[[finding]]
claim_id = "C-1287"
decidability = "internal"
falsifier = "False if the 64^3 standard deviation over the 94 non-outlier galaxies is already comparable to 0.034 (showing the 18x is outlier presence, not resolution convergence); or if any of the 6 outliers remains below D_f = 1.0 at 128^3."
check_performed = "Ran both resolutions and matched on object_id: E-163 at --grid 64 (100/100) and E-166 at --grid 128 (70 completed). Decomposed the 18x into outlier-removal and resolution factors."
observed = "Every one of the six 64^3 outliers present in the 128^3 set DOES stabilize, dramatically: 0.6205 -> 2.6800, 0.2371 -> 2.6808, 0.4019 -> 2.6895, 0.6912 -> 2.6785, 0.3907 -> 2.6836, 0.5748 -> 2.6858. Zero outliers at 128^3. BUT the standard-deviation decomposition is: 64^3 over all 100 = 0.6241; 64^3 EXCLUDING the seven outliers = 0.0742; 128^3 = 0.0374. So outlier disappearance contributes 8.41x and actual tightening of the bulk distribution contributes only 1.98x. SEPARATELY, the bulk mean SHIFTS between resolutions: 2.9116 at 64^3 (non-outlier) versus 2.7384 at 128^3, a change of 0.173 -- AN ORDER OF MAGNITUDE LARGER than the 128^3 CI half-width."
verdict = "partially_confirmed"
verdict_reason = "The outlier-stabilization half is confirmed emphatically. The CONVERGENCE FRAMING IS NOT: 8.41 of the 18x comes from six or seven pathological galaxies leaving the low tail, leaving only 1.98x of genuine tightening, and the bulk mean moves by 0.173 between resolutions. A quantity whose central value shifts by 0.17 when resolution doubles is NOT CONVERGED, which is the opposite of what 'resolution convergence' asserts."
recommended_status = "Provisional"
verification_rule = "Replay both grids and assert separately that (a) every object_id with df_final < 1.0 at 64^3 exceeds 2.5 at 128^3, and (b) the outlier-excluded 64^3 std exceeds 5x the 128^3 std -- (b) currently fails at 1.98x, so the 18x must be restated as an outlier effect; add a 256^3 point before any convergence language."
confidence = "high"

