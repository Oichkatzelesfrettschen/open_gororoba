[[finding]]
claim_id = "C-1289"
decidability = "internal"
falsifier = "False if no significance test is implemented, or if an implemented test finds the disk-elliptical difference significant."
check_performed = "Searched the whole tree for a two-sample test reachable from the sweep and read analyze_df_sweep and morph_bin_summary (galaxy_pipeline.rs:413-468); then SUPPLIED the missing test, computing a Welch two-sample t on the disk and elliptical df_final vectors from the measured 128^3 run."
observed = "NO TWO-SAMPLE TEST EXISTS ANYWHERE IN THE TREE. analyze_df_sweep computes only per-bin summaries -- n, mean, std, bootstrap percentile CI -- for each morphology bin separately; the difference is never tested. The measured 128^3 run gives disk n=38 mean 2.7402 sd 0.0390, elliptical n=32 mean 2.7363 sd 0.0358, difference 0.0040, Welch t = 0.442 on 67.5 df, p ~ 0.66. The claim's own figures (disk 2.736, elliptical 2.727, difference 0.009) are not reproduced in magnitude, though the sign agrees."
verdict = "partially_confirmed"
verdict_reason = "The substantive conclusion is CORRECT and now has evidence: the difference is not significant (p ~ 0.66). But the claim asserted that negative statistical result WITHOUT ANY IMPLEMENTED TEST, the measured difference is 0.0040 rather than 0.009, and 'at N=100' misdescribes bins holding 38 and 32. A true conclusion reached without a test is not the same as a verified one."
recommended_status = "Provisional"
verification_rule = "Add a Welch two-sample test over the morphology bins to analyze_df_sweep and assert p > 0.05, so the non-significance claim rests on a computed statistic rather than on inspection of overlapping per-bin CIs."
confidence = "high"

