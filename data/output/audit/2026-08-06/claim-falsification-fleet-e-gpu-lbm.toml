[[finding]]
claim_id = "C-1319"
decidability = "internal"
falsifier = "False if the budget reservation is absent or unchecked, if the reserved size differs from the stated 16 MB, or if the named DarkHaloCudaSolver entry point does not exist."
check_performed = "Read LbmSolver3DCuda::pin_rho_in_l2 (lib.rs:2195-2245) and set_l2_pinning (2286); observed the runtime log line emitted during the live GPU sweeps."
observed = "The reservation call is present and its return value IS checked, with an explicit non-success warning branch. The access policy window sets hitProp = CU_ACCESS_PROPERTY_PERSISTING with hitRatio 1.0 over d_rho. DarkHaloCudaSolver::pin_rho_in_l2 exists at dark_halo.rs:206. BUT THE BUDGET IS 32 MB -- 'let budget: usize = 32 * 1024 * 1024' -- not the 16 MB the claim states. The live runs confirm empirically, printing 'L2 residency: pinned 8192 KB rho field (hitRatio=1.0, PERSISTING, budget=32MB)' at 128^3."
verdict = "partially_confirmed"
verdict_reason = "The negative result and the described fix are both real and pinning demonstrably executes on this Ada GPU. The stated reservation size is wrong by a factor of two -- 32 MB, not 16 MB, as both source and runtime log show -- which matters because the claim's whole point is that the budget reservation is the load-bearing call."
recommended_status = "Provisional"
verification_rule = "Source assertion that pin_rho_in_l2 reserves CU_LIMIT_PERSISTING_L2_CACHE_SIZE and checks the result, with the documented size corrected from 16 MB to 32 MB."
confidence = "high"

