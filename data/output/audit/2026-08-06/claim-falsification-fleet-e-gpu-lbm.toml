decidability = "internal"
falsifier = "False if d_f_tmp is still allocated when A-A streaming is enabled, since the claim is specifically that VRAM is halved and 76 MB saved."
check_performed = "Read the allocation site at lbm_3d_cuda/src/lib.rs:778-782, set_aa_streaming at 1917-1926, and the A-A kernels at kernels_soa.cu:1555-1680."
