[[finding]]
claim_id = "C-1271"
decidability = "internal"
falsifier = "False if the kernel does not use f[dir*N+idx], or if the 19x transaction ratio does not follow from the memory model of the actual target (Ada SM 8.9)."
check_performed = "Read kernels_soa.cu header and lbm_step_soa_fused; recomputed the transaction ratio under both the 128-byte-line and 32-byte-sector models."
