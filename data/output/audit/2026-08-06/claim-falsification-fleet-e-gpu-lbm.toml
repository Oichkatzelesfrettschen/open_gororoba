verdict = "partially_confirmed"
verdict_reason = "The conclusion that ld.global.ca is not needed may survive, but the stated REASON does not: the repository's own A-A kernel, the subject of C-1318, is a write-after-read path. The assessment's premise is contradicted by a neighbouring claim in the same block."
recommended_status = "Provisional"
verification_rule = "Re-derive the assessment against the A-A kernel specifically, or scope the claim to the ping-pong kernels where the no-write-after-read premise is actually true."
confidence = "high"

