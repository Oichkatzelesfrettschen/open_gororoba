[[finding]]
claim_id = "C-1295"
decidability = "internal"
falsifier = "False if the named kernels do not exist, or if the reduction is not GPU-side, or if its cost is not under 10us."
check_performed = "Grepped for compute_speed_magnitude and reduce_max_f32; read LbmSolver3DCuda::max_mach_number_device at lbm_3d_cuda/src/lib.rs:1816-1856."
observed = "NEITHER NAMED KERNEL EXISTS. The implementation uses a single kernel, reduce_max_speed_f32. It is a TWO-PASS HYBRID, not a GPU-side reduction: pass one writes blocks_pass1 per-block maxima to a device buffer, then THE HOST does clone_dtoh of that whole buffer and folds it. The code's own comment states the readback is 'blocks_pass1 floats = 64 KB at 128^3' and that the host fold costs '~5us'. The doc comment four lines above CONTRADICTS this, claiming it 'reads back a single f32 (4 bytes PCIe)'."
verdict = "refuted"
verdict_reason = "The claim misnames both kernels and mischaracterizes the mechanism: the second reduction pass runs on the HOST over a 64 KB transfer, so this is not the GPU-side reduction the claim describes, and the source carries two mutually contradictory descriptions of its own transfer size."
recommended_status = "Refuted"
verification_rule = "Add a device-side second-pass scalar-max kernel, then time max_mach_number_device with CUDA events at 128^3 asserting < 10us and asserting the per-call host transfer is <= 4 bytes."
confidence = "high"

[[finding]]
