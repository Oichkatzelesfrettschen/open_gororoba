[synthesis]
cross_claim_findings = """
THREE STRUCTURAL PATTERNS, each visible only across claims.

FIRST, THE DECLARING EXPERIMENTS WERE LARGELY NEVER RUN. E-169, E-172, E-174,
E-175 and E-176 all carry status = 'planned', yet C-1292, C-1295, C-1296, C-1297,
C-1298 and C-1299 quote precise numbers sourced to them. Status alone could be
stale bookkeeping, so the independent corroboration matters: E-169's registered
command passes --coarsened to euclid-df-sweep, which has no such argument, so clap
rejects it before any work begins; and E-174's registered command, when actually
executed, prints a degeneracy warning and then CRASHES. Two different experiments
fail their own registered invocation in two different ways.

SECOND, SEVERAL CLAIMS ARE RATIOS WHOSE DENOMINATOR HAS SINCE BEEN DELETED. C-1286
needs a readback-GPU box-counting arm that exists only in the CPU sweep; C-1298
needs an AoS scalar collision the AoSoA rewrite replaced; C-1306 needs a
single-stream path with no toggle. These are not unrun measurements, they are
UNMEASURABLE ones, and they share a remedy: a benchmark baseline has to be retained
as a baseline or the ratio retired for an absolute threshold.

THIRD, MORE REDUNDANCY THAN IT APPEARS. Given the traffic model (77.18 GB) and the
device bandwidth (504 GB/s), C-1296's '>= 60% of 504 GB/s' is ALGEBRAICALLY
IDENTICAL to C-1286's '249 ms/galaxy': 60% of 504 is exactly 255 ms/galaxy. They
are one measurement written twice, so a single timing check decides both and
neither corroborates the other. Likewise C-1267 and C-1277 restate two and three
lines of source, with the 32x in C-1267 being the warp width by construction.

THE LOAD-BEARING SCIENTIFIC CLAIM, C-1297, FAILS TWICE OVER, and the second failure
was only visible by running it. The 6-condition control is a 4-condition control as
registered, because alpha_zd defaults to 0.0: C1 receives inputs byte-identical to
C0 and C3 to C2, and the positive control C5 carries pure NFW gravity with no ZD
forcing whatsoever. Running the registered command printed that degeneracy verbatim
as a warning -- and then panicked at euclid_df_sweep.rs:816 with
CUDA_ERROR_STREAM_CAPTURE_UNSUPPORTED before emitting a single trial, reproducibly
at 64^3 and 128^3 and with alpha_zd both zero and 0.1. Even repaired, the condition
set has no Sersic+ZD-only and no Sersic+NFW-only arm, so it cannot attribute the
effect between the two components of C5's force field. That design gap is
independent of any number.

THE MOST INTERESTING RESULT IS ONE NO SINGLE CLAIM STATES: THE ENGINEERING
REPRODUCES REMARKABLY WELL WHILE THE SCIENCE DOES NOT. Measured 247.4 ms/galaxy
against a claimed 249; measured 61.9% of theoretical bandwidth against a claimed 60%
floor; 64^3 distribution 2.7427 +/- 0.6241 against a claimed 2.748 +/- 0.607. These
are honest, replicable numbers. But the same runs DISSOLVE THE INFERENCE BUILT ON
TOP OF THEM. C-1287's 18x standard-deviation reduction decomposes into 8.41x from
six or seven pathological galaxies leaving the low tail and only 1.98x of genuine
tightening; and the bulk mean moves from 2.9116 at 64^3 to 2.7384 at 128^3, a shift
of 0.173 that is an order of magnitude wider than the 128^3 confidence interval. A
quantity still moving by 0.17 per resolution doubling cannot support agreement
claims at the third decimal, and indeed the measured CI_95 [2.7297, 2.7472] excludes
the CD D=16 prediction 2.7268 at z = -2.61. What would falsify this reading is a
256^3 run whose mean returns to 2.732 rather than continuing downward.

A QUIETER FINDING CONCERNS WHAT 'STABLE' MEANS HERE. The retained E-167 pair shows
the two criteria the repository implements DISAGREEING: the summary CSV reports
survived = true for all 40 rows including ones with mass_err = 1e113, because that
field only goes false on a step error or a non-finite Mach number, and 3.5e6 is
finite. The per-step positivity sentinel, on the same MRT contrast-29 run the summary
calls healthy, records min_f = -0.629 with 14 of 400 steps flagged unstable before
recovering. Claims resting on NaN-absence -- C-1279's 'eliminates all NaN
divergence' and C-1280's 'zero NaN' -- are using the WEAKER of two criteria the same
experiment family already implements.
"""
new_claims_proposed = """
1. BGK D3Q19 at tau = 0.7 is stable well past Ma = 0.3, reaching Ma = 1.662 with
   mass conservation error 1.88e-14 at density contrast 19.26. FALSIFIER: a replay
   in which no BGK row exceeds Ma = 0.3 while holding mass_err below 1e-10.

2. Near the divergence threshold MRT and BGK have NO STABILITY ORDERING: at contrast
   23.66 MRT diverges while BGK does not, and at 29.07 the reverse. FALSIFIER: a
   replay in which the MRT crash contrast exceeds the BGK crash contrast at every
   level, with no interleaving.

3. The MRT positivity violation at contrast 29 is TRANSIENT AND SELF-CORRECTING:
   min(f_i) reaches -0.629 by step 4 and returns positive, 14 of 400 steps flagged,
   ending at min_f = +8.33e-2. FALSIFIER: a replay in which min_f stays negative
   through step 399 or the run terminates on NaN.

4. mrt-stability-audit's survived field CANNOT DETECT NUMERICAL EXPLOSION: it is
   false only on a step() error or non-finite Mach, so a trial ending with
   mass_err = 1e113 is reported as survived and printed as OK. FALSIFIER: a run with
   mass_err above 1e6 that reports survived = false.

5. The repository's only CPU/GPU equivalence test is VACUOUS: it evolves a
   uniform-at-rest field (the equilibrium) under BGK on an 8^3 grid, and returns early
   with a pass when no GPU is present. FALSIFIER: exhibiting any test comparing CPU
   and GPU under MRT at nonzero density contrast.

6. The null-hypothesis control path is NON-FUNCTIONAL: euclid-df-sweep
   --null-hypothesis panics at euclid_df_sweep.rs:816 with
   CUDA_ERROR_STREAM_CAPTURE_UNSUPPORTED before emitting any trial, reproducibly at
   64^3 and 128^3 and independently of alpha_zd, on hardware where the ordinary GPU
   sweep runs to completion. FALSIFIER: any completed 6-condition run emitting a C0 row.

7. Galaxy-scale D_f from this pipeline is NOT CONVERGED at 128^3: the non-outlier bulk
   mean moves from 2.9116 at 64^3 to 2.7384 at 128^3, a shift of 0.173, roughly 20x
   the 128^3 CI half-width of 0.0088. FALSIFIER: a 256^3 run whose mean lies within
   0.01 of the 128^3 mean.

8. The 18x standard-deviation reduction is DOMINATED BY OUTLIER DISAPPEARANCE, not
   resolution: 8.41x from removing the seven D_f < 1.0 galaxies, only 1.98x from
   tightening of the remainder. FALSIFIER: an outlier-excluded 64^3 std within a
   factor of 2 of 0.6241 rather than the measured 0.0742.

9. The stated cause of the 64^3 outliers is WRONG IN BOTH DIRECTIONS: 17 of the 23
   galaxies with sersic_n >= 5.50 or photo_z > 2.3 are stable, and one outlier has
   neither property. FALSIFIER: a replay in which the outlier set coincides with the
   (n >= 5.50 OR z > 2.3) set.
"""
gaps = """
FOUR CLAIMS REMAIN UNDECIDED, each for a stated reason.

C-1282 (GPU MRT within 0.05 of CPU MRT) needs a paired run matched on object_id. The
GPU arm is cheap and now known to work; the CPU arm was not run. THIS IS THE SINGLE
MOST VALUABLE OUTSTANDING CHECK IN THE BLOCK, because cross-implementation agreement
catches real bugs, and the tree's only existing equivalence test is vacuous.

C-1279 needs the CPU MRT sweep at floor=0.045, judged on a positivity sentinel rather
than NaN absence.

C-1298 and C-1286's 1.54x ratio CANNOT BE DECIDED AT ALL without code changes, because
both baseline arms were deleted rather than measured. C-1292 needs cuda-precision-bench
comparing mrt against mrt_coarsened, since euclid-df-sweep does not expose the
coarsened path.

TWO LIMITATIONS OF WHAT WAS RUN. First, the 128^3 sweep completed 70 of 100 galaxies
before its wall-clock budget expired, so C-1287/C-1288/C-1289 rest on N=70; the missing
30 are the tail of the same catalog ordering, not a biased subset, and the standard
error at N=70 is 0.0045, but the exclusion of 2.7268 at z = -2.61 could soften with a
fuller sample. Second, everything ran against a prebuilt binary of mtime 2026-04-12,
not current HEAD -- appropriate for claims last verified 2026-03-11, but any divergence
is unmeasured, because the from-source rebuild was killed at its 50-minute timeout.

ONE PREDICTION WENT UNTESTED. C0 (uniform density, zero force) was predicted to print
exactly 3.0000, on the reasoning that a uniform field stays uniform, Otsu on a constant
field returns vmin, and the degenerate box-count fit falls through to unwrap_or(3.0) --
which would make C0's '>2.95 PASS' an ERROR PATH rather than a measurement. The E-174
crash prevented any C0 value from being emitted, so this remains a live and cheap check
the moment the graph-capture conflict is fixed.
"""
