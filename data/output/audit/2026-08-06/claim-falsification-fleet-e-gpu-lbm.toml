[[finding]]
claim_id = "C-1296"
decidability = "internal"
falsifier = "False if 77.2 GB/galaxy does not follow from the D3Q19 FP32 traffic model, if 504 GB/s is not this device's theoretical bandwidth, or if measured wall-clock puts the achieved fraction below 60%."
check_performed = "Recomputed the traffic model; queried the device for memory clock and bus width via nvidia-smi; then MEASURED wall-clock over 70 galaxies at 128^3 MRT on the RTX 4070 Ti the claim names."
observed = "Traffic: 128^3 cells * 184 B/cell * 200 steps = 77.18 GB, where 184 = 76 read + 76 write for the 19 FP32 distributions + 4 rho + 12 u + 4 tau + 12 force -- reproducing the stated 77.2 GB/galaxy EXACTLY. Device: clocks.max.memory = 10501 MHz, so 10501 * 2 * 192 / 8 = 504 GB/s, confirming the stated theoretical figure on the physically present GPU. Measured 247.4 ms/galaxy gives 77.18 GB / 0.2474 s = 311.9 GB/s = 61.9% of 504 GB/s."
verdict = "confirmed"
verdict_reason = "Measured 61.9% clears the >= 60% threshold on the exact hardware named, and both inputs reproduce exactly. CAVEAT: this is NOT INDEPENDENT of C-1286. Given the 77.2 GB model, '>= 60% of 504 GB/s' is algebraically identical to '<= 255 ms/galaxy', so the same timing decides both and neither corroborates the other. Note also the run used the BASELINE kernel, not the thread coarsening the claim mentions, so coarsening is not required to reach 60%."
recommended_status = "Verified"
verification_rule = "Single durable check covering C-1286 and C-1296: time euclid-df-sweep at --grid 128 --mrt over N galaxies and assert ms/galaxy <= 255, reporting the derived GB/s as 77.18/t."
confidence = "high"

