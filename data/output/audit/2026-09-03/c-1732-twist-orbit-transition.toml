[[successor]]
proposal_key = "staples-cd-typical-among-alternative-and-isomorphic-twists"
statement = "On the E-240 subsample of the deduplicated THEMIS-A Staples benchmark (1,733,470 samples, 578,320 positives, 813 daily files, ChaCha8 seed 42) the canonical Cayley-Dickson associator tensor (1848 terms, 924 positive and 924 negative) reaches ROC-AUC 0.8274. Three control results, stated separately: (1) 50 normalized 2-cocycles on (Z_2)^4 have vanishing associator (0 terms) and chance-level AUC 0.5000; (2) 250 uniform 35-line basis-alternative twists (unital, anticommutative, imaginary squares -1, quaternion triads on the 35 lines of PG(3, 2), term counts 1080 to 1656) reach mean 0.8327, 2.5th percentile 0.8280, 97.5th percentile 0.8373 and maximum 0.8393, 246 of 250 draws at or above the canonical value (tail probability 0.9841), so the canonical AUC sits below that ensemble's 2.5th percentile; (3) 250 algebra-isomorphic relabeling-orbit draws under GL(4, Z_2) x (Z_2)^15 at identical 1848-term 924/924 support reach mean 0.8311, 2.5th percentile 0.8147, 97.5th percentile 0.8407 and maximum 0.8424, 217 of 250 draws at or above the canonical value (tail probability 0.8685), so the canonical tensor is a typical member of its isomorphism class. Discrimination that is extreme among unstructured unital twists (C-1732) is typical among basis-alternative twists and among algebra-isomorphic copies of the sedenion twist."
initial_status = "Verified"
source_or_implementation_boundary = "Phenomenological mapping on one benchmark at interpretive depth 0; the 35-line family is algebraic-invariant and not support-matched; the isomorphic orbit is support-matched; the cocycle family is a negative control with vanishing associator."
required_falsifier = "A re-run of staples-twist-orbit with a different seed, or with n_invariant_twists or n_isomorphic_orbits raised to 999, in which the canonical AUC exceeds the 97.5th percentile of the 35-line ensemble or of the isomorphic orbit; or a support-matched sample of 35-line twists with 1848 terms whose 97.5th percentile lies below 0.8274."
