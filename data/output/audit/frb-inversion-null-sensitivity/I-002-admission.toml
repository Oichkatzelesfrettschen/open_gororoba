expected = { title = "Ultrametric inference depends on the metric, representation and null sensitivity", status = "partial", summary = "C-071 retains its historical refuted disposition. The inspected raw-scalar permutation null preserves the full population of unordered triple distances, so Monte Carlo triple sampling alone supplies no demonstrated power to destroy a proposed physical structure. A retained exhaustive witness preserves 5 qualifying triples of 20 across all 720 permutations. Scalar values with a p-adic metric can be ultrametric; three distinct Euclidean real scalars form a different metric case. Alternative Baire, temporal and dendrogram representations exist, but implementation existence establishes neither detection nor physical validation. Recover the original result bodies and producer identity, inspect every statistic and selection procedure, and demonstrate injection sensitivity before re-adjudicating the historical claim.", status_note = "The metric and relabeling lessons are supported by inspected code and retained independent witnesses. Partial preserves the unresolved attribution and power of the original C-071 experiment; canonical admission changes the insight interpretation and leaves the claim disposition intact.", claim_refs = ["C-071"] }
expected_previous_evidence_sha256 = "f5f5ea64b6050f492ea9baa1294de9847793e4c499cef31bbcc9d293a668e4b3"
revised = { title = "Ultrametric inference depends on the metric, representation and null sensitivity", status = "partial", summary = "C-071 retains its historical refuted disposition. Original scalar and transformed producers, lockfiles, five results and two exact CHIME inputs are retained with verified hashes. The original scalar build fails before compilation because its tracked workspace omits control_core; actual historical invocation and execution replay remain unresolved. Geometry-preserving relabeling nulls supply diagnostics with unestablished physical power. A separately frozen radial-angular dependence instrument passes an independent 1000-replicate-per-family engineering confirmation after the initial 100-replicate control precision gate failed. Flat and gradient alternatives also reject, restricting interpretation to dependence rather than hierarchy. Scalar p-adic and Euclidean metrics remain distinct cases.", status_note = "Partial preserves the supported metric and null-sensitivity lessons, recovered tracked-tree evidence and failed exact-source build. Synthetic confirmation establishes implementation sensitivity under declared generators; physical calibration and historical re-adjudication remain open.", claim_refs = ["C-071"] }

