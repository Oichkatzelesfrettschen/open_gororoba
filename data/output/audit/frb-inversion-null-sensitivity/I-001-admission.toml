expected = { title = "Mean-DM distance conversion requires explicit electron and host conventions", status = "partial", summary = "The mean cosmic-DM implementation includes the Macquart Eq. (2) electron factor 0.875 for helium mass fraction 0.25 and doubly ionized helium. A constant diffuse baryon mass fraction 0.83 specializes the source's fd(z). Independent SI-density quadrature agrees across 12 declared cases to relative error at most 2.9e-15; analytic expansion controls, source-generated inversion and an analytic foreground-subtracted distance test pass. Baseline production fails all four tests, including a measured 8/7 normalization excess. The tested mean-DM value at z=1 is 900.751906538024 pc/cm^3 for the declared Planck parameters. Both FRB callers subtract a fixed observer-frame host from NE2001 excess; catalog halo treatment and physical host-frame provenance remain unresolved. C-071 supplies motivation and retains its refuted disposition.", status_note = "Partial records conditional implementation conformance on the declared finite grid. The correction resolves the missing electron factor and documents numerical foreground conventions. Inverse invalid inputs and upper-bracket exhaustion, ionization/diffuse-fraction evolution, scatter, independent astrophysical calibration and historical FRB producer replays remain open. Source tests establish their implementation layer; they supply no new ultrametric or physical-structure evidence.", claim_refs = ["C-071"] }
expected_previous_evidence_sha256 = "80bcb223a432a5bf6597e4c4978630f205b92caac1b9be7103b5fe7e95d49bf1"
revised = { title = "Mean-DM distance conversion requires explicit electron and host conventions", status = "partial", summary = "The constant-fd Macquart mean cosmic-DM implementation retains electron factor 0.875. Independent SI quadrature agrees across 18 cases through numerical redshift ceiling 100 within relative tolerance 1e-10. Source-generated inversions, exact-zero, near-zero, ceiling, invalid-input and positive-distance-underflow contracts pass. Typed catalog selection uses the chosen NE2001 or YMW16 excess and reports exclusions; both callers propagate conversion errors and identify relabeling outputs as uncalibrated diagnostics. The numerical ceiling supplies no physical validity bound. Halo treatment, host-frame provenance, evolving ionization/diffuse fraction, scatter and localized-FRB calibration remain unresolved.", status_note = "Partial records tested numerical construction and catalog selection. Synthetic radial-angular dependence sensitivity establishes an instrument under one synthetic exchangeability stratum. Physical FRB inference remains unexecuted. C-071 retains its historical refuted disposition.", claim_refs = ["C-071"] }

