[derivation]
raw_equations = "source.tex lines1437-1491 independently transcribe orbital Eq4.3 and all seven fermion groups of Eq4.4, followed by mu/nu symmetrization"
endpoint_equation = "source.tex lines1494-1505, Eq4.5: -1/2*d/dtau1[barDotGB(mu,alpha)*(barDotGB*k)(nu)*exp + mu<->nu]"
endpoint_convention = "Periodic delta12 has total weight1 per insertion period, represented by half weight at each endpoint. Products use source coincidence values: barDotGB=0 and GF12=GF11; anti-periodic GF uses the average of the right value and the sign-reversed left value."
endpoint_result = "barDotGB(0+)=I, barDotGB(1-)=-I. The quadratic primitive has equal one-sided endpoint values, so its signed upper-minus-lower jump vanishes. Each endpoint remains separately nonzero."
contact_equations = "B.4 and B.36 each contribute2*delta12*I. Ghost-subtracted B.8/B.39 coincidence derivatives remain regular."
spinor_contact = "After midpoint products and symmetrization, J2 contact=(GF11[mu,alpha]*k[nu]+GF11[nu,alpha]*k[mu])/T. The1/T factor follows delta(tau)=delta(u)/T. Determinant and dT/T measure remain external."
scalar_contact = "Zero: the orbital contact multiplies barDotGB at coincidence."
integration_owner = "tensor_integrands.rs::double_integrate_rank_three_with_contact adds the analytic contact once per proper-time node outside the open-interval Gauss-Legendre insertion sum."
mutation_owner = "irreducible_tensor.rs::irreducible_contact_integrand binds the contact to J2: OmitJ2 removes it and FlipJ2Sign reverses it."

