[scalar_convention]
old_momentum = "Eq3.3 defines k=k1 in h(k1)A(k2): graviton momentum."
new_momentum = "Eq4.2 eliminates k0=-k: photon momentum. Therefore k_old=-k_new."
orbital_mapping = "At xi_bar=0 the old orbital expression is minus the new expression at equal momentum. Every term is odd in momentum, so J_old(-k_new)=J_new(k_new). The loop prefactor remains +e*kappa/(64*pi^2)."
counterterm_mapping = "C_old(-k_new)=-C_new(k_new). Old scalar Eq3.11 coefficient +(2/3)i e C_old becomes -(2/3)i e C_new. Old spinor -4/3 maps to new+4/3, providing an independent convention cross-check."
