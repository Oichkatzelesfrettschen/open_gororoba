[geometry]
construction = "Place honeycomb s,px,py orbitals at A=(0,0), B=(0,a/sqrt(3)); place kagome s orbitals at nearest-bond midpoints. Select honeycomb-kagome bonds by distance a/(2*sqrt(3)); project p coupling onto each physical bond direction."
matrix_comparison = "Compare every complex element with build_magnonic_9band on 12x12,24x24,48x48 rectangular grids for both source tables. Maximum error 5.978733960281817e-16 GHz."
rectangular_vectors = "(a,0),(0,sqrt(3)*a), containing primitive copies at 0 and a2."
folding_identity = "The directly constructed 18-orbital spectrum equals the union of 9-orbital spectra at k and k+(0,2*pi/(sqrt(3)*a)); maximum sampled difference 1.776356839400251e-14 GHz."
convention = "Table II Delta=(epsilon_B-epsilon_A)/2 maps to builder delta_A=-Delta and delta_B=+Delta. Reversing both sublattices preserves the spectrum and reverses embedded local valley flux."
orbital_gauge = "The periodic-cell Hamiltonian carries exp(i*k*R). The embedded PythTB convention carries exp(i*k*(R+r_j-r_i)); eigenvectors transform by exp(-i*k*r_i). The transformation preserves spectra and full isolated-bundle Chern numbers while local flux depends on the declared embedding."
unresolved = "The exact author PythTB source remains provider-blocked. Geometric matrix reconstruction and raster support constitute an independent, bounded source reproduction."

