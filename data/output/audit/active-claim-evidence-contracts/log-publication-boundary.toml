primary_retention = "Primary-checkout .cache/empirical-claim-original-logs contains byte-identical original logs; .cache/empirical-claim-private-retrieval retains private headers and .cache/empirical-claim-export-regression retains the defective export witness. Dedicated roots use mode 0700; recursive file comparison passes."
