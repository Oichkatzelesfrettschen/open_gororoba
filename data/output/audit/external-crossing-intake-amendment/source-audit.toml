[selection_and_inspection]
selection = "Every unique verified V2 probe-D crossing UTC date in2015/2016;166 dates,165 originally admitted and one failed"
catalog = "data/external/crossing_lists/themis_mp_crossings_v2.txt"
catalog_sha256 = "807b79b73b1266981d24c20627d8f85bca585475d07260d4162277a22ce660b5"
previously_seen = "The V2 catalog determines the date selection and was inspected for intake; the failed raw chronology and conflicting vectors were inspected in native-source RCA. This amendment is retrospective rather than an unseen-data preregistration."
scores = "Retained E283 blocked result records numerical_rows_consumed=0 and native RCA records scientific_predictions_evaluated=false. These inspected records establish no completed external scoring campaign; they do not establish universal absence of historical human exposure."
prohibition = "Quarantine membership must depend on timestamp multiplicity/conflict and declared chronology checks, never catalog distance, class labels, detector scores or desired sample counts."

[parser]
path = "crates/gororoba_cli_physics/src/bin/staples_causal_validation/admission.rs"
state_locators = "parse_file: capacity=max(widths)+7; pending timestamp batch; history; last_time"
malformed_timestamp = "Rows with an unparseable timestamp clear history and pending and continue before the last_time update. Their raw row index and raw-row count remain in the parser accounting."
backward_timestamp = "Negative nanos-last_time rejects the file before admission. Equal timestamp batches clear history and never admit their vectors."
decision_scope = "A new timestamp closes its predecessor, applies the30s gap rule and scores only previously closed history; current vector validation follows decision generation. A quarantine must suppress decisions at every quarantined timestamp as well as their future feature participation."
warmup = "Widths64/256/1024 share capacity1031 samples. After a reset, a decision requires1031 newly closed valid unique batches; six-vector feature span remains<=30s and positive gaps>30s reset again."
mapping_requirement = "Retain original row indices and a reason for each quarantined row, reset boundary, warmup-suppressed decision and retained support; preserve the original date and every nonambiguous row even when it lacks admissible post-reset support."

[models]
directory = "data/output/audit/staples-causal-validation/results"
dataset = "data/output/audit/staples-causal-validation/results/dataset.json"
pattern = "model-width-{64,256,1024}-{baseline,canonical,scramble-1000..1018}.json"
observed_model_file_count = 63
training = "THEMIS-A2007-2012 training-only log-score standardization and ridge-logistic coefficients; fixed three widths and19 exact-support scrambles"
loader = "crates/gororoba_cli_physics/src/bin/staples_causal_validation.rs:323-374"
identity_checks = "Validate training dataset provenance digest, frozen protocol/probe/config, exact source map equality, model record identity and model width/tensor."
source_map = "crates/gororoba_cli_physics/src/bin/staples_causal_validation/evidence.rs:SOURCES includes admission and runner bodies alongside feature/fitting sources."
retained_boundary = "Changing source files changes the exact model-loader source-map check. An amendment must preserve executable compatibility or explicitly prove and register permitted differences; fabricating old source identities is prohibited."

[prerequisites]
declaration = "Register a separately identified intake amendment before transformation/inference; retain parent E283 failure and unchanged0.005 useful-increment requirement."
row_audit = "Pre-scan all166 original files for repeated timestamps and complete conflicting groups; retain per-file byte hashes and raw-index witnesses. Residual backward timestamps after quarantine remain blockers."
data_materialization = "Original external-file-map paths name the earlier empirical-claim-evidence-contracts worktree. Materialize or bind paths by verified original hashes and retain old and new maps separately."
quality_accounting = "Account for all planned dates, original rows, quarantined groups, discarded supports, full reset/warmup effects and resulting class/day counts. Zero-support dates remain in accounting."
comparison = "Prove parity for unaffected file bytes, raw supports, feature implementation and frozen coefficients; bootstrap uses paired whole original UTC days and retains all widths."
physical_scope = "Crossing-day conditional discrimination only; archived retrospective quality screening does not establish real-time arrival causality, ordinary-day false-alert rates, operational utility or independent-mission replication."

[derived_timestamp_marker_amendment]
assessment = "Scientifically consistent as a separately declared retrospective intake estimand and technically compatible with the unchanged admission parser, subject to a sealed transformation rule and complete validation."
mechanism = "Create derived copies replacing only the timestamp field of every occurrence in a declared conflicting repeated-timestamp group with an explicitly invalid timestamp marker. Preserve row order/count, separators and every vector literal; preserve original bytes separately."
reset_effect = "The malformed_timestamp branch clears pending/history and continues before updating last_time. Masking all four witnessed overlapping rows leaves the last valid time before the overlap; the next surviving timestamp must still pass strict chronology and date gates."
decision_effect = "The marker suppresses decisions at the ambiguous timestamp itself, including the first occurrence that the original one-pass parser might otherwise score before discovering a duplicate. Subsequent decisions require complete1031-sample closed-history warmup."
scope_effect = "Complete-file ambiguity discovery uses future archived records. Feature timestamps remain causal within admitted segments, but quality selection is retrospective; historical online execution is not established."
scan = "First scan every original planned file using the exact timestamp parser and a preregistered vector-comparison convention. Group repeated timestamps without changing sequence order; define conflict independently of labels/scores and quarantine every occurrence in each selected group. Second scan remaining timestamp sequence and reject every residual backward step; retain ordinary invalid/fill/duplicate/gap rules."
unresolved_definition = "Before transformation, specify whether conflict compares parsed component bits or numerical equality, how malformed/fill rows participate, and whether all duplicate groups or only conflicting-vector groups are masked. The choice changes the retrospective selection and must not follow score inspection."
proof_obligations = ["original_sha256 and derived_sha256 for each planned date", "exact list of replacement field byte ranges and original timestamps", "all bytes outside declared field ranges identical", "same row count/order and same vector literals", "complete repeated-group membership with original raw indices", "all166 original dates retained in plan order", "remaining valid timestamp sequence admitted without sorting", "explicit reset/warmup and excluded-decision counts", "frozen model and feature source identity"]
manifest = "Keep the original failed manifest immutable. A separately named derived manifest may carry the frozen parent protocol_sha256 for the unchanged parser/model contract, but must additionally bind amendment ID/hash, original manifest/hash, original-to-derived rows/hashes and selection scope. Its admitted status denotes derived-input admission only."
runner_constraints = "validate_external checks the original catalog date set and complete accounting; file-map/result raw hashes must identify derived bytes. The unchanged loader also requires the exact trained source map. Extra provenance must establish the amendment without claiming provider-corrected data or original E283 success."

