verification_outcome = "All source and derived identities pass; all166 dates remain accounted; marker ranges invert byte-exactly; strict retained chronology and original support rules admit external inference using zero new fits. Report discrimination separately from the unchanged0.005 gate."
revision_outcome = "Any mismatch in source, masking, date denominator, support reset or frozen model identity blocks inference and requires a separately retained correction at unchanged criteria."
abandonment_outcome = "A transformed row changes vector text, a masked occurrence survives into feature/calibration support, or any frozen fit is changed: abandon the amended conformance/replication predicate."
inconclusive_outcome = "Insufficient admitted class/support counts or a bootstrap failure retains its exact blocker. A passing archive-conditional score comparison leaves operational utility, external online arrival and source-product repair unestablished."
