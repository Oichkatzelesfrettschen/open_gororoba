preflight = "Bind all166 dates in original plan order and every body to retained attempt hashes and byte counts. Require headerless unquoted four-field CSV, parseable finite-or-fill vector fields, UTC RFC3339 timestamps on the declared day with representable i64 Unix nanoseconds. Reject leap-second encodings, unknown layouts, malformed timestamps, wrong dates and unresolved hashes before writing outputs."
interval_rule = "For each original row with nanosecond timestamp below the maximum preceding timestamp, add closed interval[current,maximum_preceding]. Merge intervals with overlapping or touching endpoints. Quarantine EVERY occurrence of EVERY timestamp inside any merged interval, including occurrences preceding the first observed reversal and both endpoints. Equal timestamps outside reversal intervals remain unchanged for the original duplicate-batch rule."
transformation = "Replace only each quarantined timestamp field with the explicit unparseable marker. Preserve row count/order, vector literals, delimiters, line endings and every other byte. Retain original timestamp and original/derived byte ranges; inverse reconstruction must reproduce the original body hash exactly. Residual valid timestamps must be nondecreasing."
output_rule = "Exclusive new output directory; preflight before writes; retain exact parent/protocol bytes and all source/derived hashes. Emit complete ledger, full-date file map and derived manifest last. Refuse collisions. Parent failed manifest remains untouched."
admission_label = "The unchanged runner consumes status admitted only within a manifest explicitly identified as derived-input retrospective admission. Provider-product correction and original E283 admission remain failed."
reset_rule = "The unchanged parser clears pending batch and common history on each marker before creating a decision. The common1031-sample capacity must refill; every resulting support excludes quarantined rows and preceding segments. Verify supports after preparation."
selection_scope = "Whole-file timestamp-only retrospective pre-scan uses lookahead. The rule uses neither crossing labels nor detector scores; original date selection remains catalog-conditioned. The estimand conditions on admitted quality-masked support and establishes neither online arrival feasibility nor representative ordinary-day performance."
model_rule = "Verify all20 trained-source hashes in the historical snapshot, all63 frozen model records and dataset identity. Use the unchanged runner and frozen preprocessing/coefficients. New training fits remain zero. Scores may be interpreted only after derived raw admission succeeds and produced support identities verify."
uncertainty = "Retain the original2000 paired daily-file bootstrap, seed and global minimum across all three widths and both years. The frozen kernel includes nonempty scored UTC-day clusters; report all166 planned dates, per-date support counts and zero-support dates separately. When any date has zero support, identify the interval as conditional on nonempty admitted dates rather than claiming full166-cluster resampling."
