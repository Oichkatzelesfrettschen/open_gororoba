result = "pass; stable rustfmt emitted warnings for nightly-only configuration keys"

[[gate]]
name = "focused-oracle-controls"
command = "RUSTC_WRAPPER= CARGO_TARGET_DIR=.cache/exp-publish-target cargo test -p gr_core --lib audit_c8 -- --nocapture"
exit_code = 0
result = "8 passed; 0 failed; 843 filtered out"

[[gate]]
name = "gr-core-tests"
command = "RUSTC_WRAPPER= CARGO_TARGET_DIR=.cache/exp-publish-target cargo test -p gr_core --lib"
