contraction_order = "W_mu_nu = sum_alpha Gamma_mu_nu_alpha k_alpha; G_alpha = sum_mu_nu delta_epsilon0_mu_nu Gamma_mu_nu_alpha - RHS_alpha"
matrix_order = "all matrix-vector products use row index first: (M dot v)_mu = sum_nu M_mu_nu v_nu"
frob_norm = "sqrt(sum_mu_nu abs(W_mu_nu)^2)"
euclidean_component_norm = "sqrt(sum_alpha abs(G_alpha)^2)"
normalized_norm = "absolute norm divided by a declared conditioning scale from uncancelled component magnitudes"
determinant_convention = "periodic scalar det^(1/2)[Z/sin(Z)] and spinor det^(1/2)[Z/tan(Z)]; pure magnetic reductions use z/sinh(z) and cosh(z)"
proper_time_convention = "retain the source measure and explicit T powers; do not merge unrenormalized and renormalized APIs"
renormalization_convention = "unrenormalized Ward identities use the source-regulated amplitudes; renormalized tensors use the source subtraction terms"

