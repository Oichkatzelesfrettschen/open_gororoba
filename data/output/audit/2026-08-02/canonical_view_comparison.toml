links = "sqlite3 -readonly -header -separator '|' registry/canonical/control_plane.sqlite3 select claim_id,experiment_id from claim_experiment_refs where claim_id in target set"
compat_claims = "tomlq target selection registry/claims.toml"
compat_atoms = "tomlq target selection registry/claims_atoms.toml"
compat_experiments = "tomlq E-073 selection registry/experiments.toml"

[comparison]
target_claims = ["C-820", "C-821", "C-822", "C-864", "C-865", "C-866", "C-867"]
