comparison_method = "SQLite read-only queries and tomlq selection by stable identifiers"

[query]
claims = "sqlite3 -readonly -header -separator '|' registry/canonical/control_plane.sqlite3 select id,status,last_verified,statement,status_note,where_stated from claims where id in target set"
