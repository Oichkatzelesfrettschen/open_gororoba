method = "Preregistered before execution. Features enter as ln(x + 1e-12). Model B: logistic regression on the six baselines; model B+A adds assoc. Fit by Newton-Raphson with a fixed ridge 1e-6 on standardized coefficients, at most 25 iterations, deviance tolerance 1e-8, no tuning. Outer validation: 5 folds grouped by file_id, fold assignment by one ChaCha8(seed 42) shuffle of the sorted file ids dealt round-robin; standardization fitted on training folds only; both models fitted on identical rows and predicted on identical held-out rows. Metrics on out-of-fold predictions: average-rank ROC-AUC, average-precision PR-AUC, log loss, Brier score, ten equal-count calibration bins with expected calibration error. Paired bootstrap: 1000 resamples of the 813 files with replacement (ChaCha8 keyed on seed and resample), samples reweighted by file draw count, weighted AUC, PR-AUC and log loss from one pass over a global sort per model, paired deltas B+A minus B with 95 percent percentile intervals. Corrected decision rule: a positive delta ROC-AUC interval excluding zero supports incremental discrimination for the declared fitted model and calibration context; an interval containing zero is inconclusive about incremental discrimination and redundancy. Five-increment numerator support matches six samples, while daily-file RMS extends the PVI calibration context beyond that window. Historical preregistration asserted redundancy at matched receptive field for a zero-containing interval; that assertion is retained in Git history and superseded by this correction. I-212 remains open on a zero-containing interval."
output = ["data/output/staples_incremental_information.json"]
