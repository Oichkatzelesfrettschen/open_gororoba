[[experiment]]
id = "E-280"
title = "THEMIS-A six-sample PVI calibration-context comparison"
status = "active"
status_token = "ACTIVE"
status_note = "Completed: 5 grouped CV assignments and 100 paired refit draws; all 750 fits converge. Independent retained-record audit passes. Both separate global endpoint intervals have positive lower percentiles under the conditional procedure; see retained summary and C-1740/C-1741."
