binary_experiment_declared = "E-280"
binary_registered = true
claims = ["C-1738", "C-1739", "C-1740", "C-1741"]
claim_refs = ["C-1738", "C-1739", "C-1740", "C-1741"]
lineage_id = "XL-250"
deterministic = false
seed = 42
gpu = false
reproducibility_class = "seeded_stochastic_replay"
input = "THEMIS-A raw daily files, retained score CSV and dense file map, and Staples crossing catalog; SHA-256 admission and common 256-increment warmup mask."
input_path_refs = ["data/output/benchmark_scores.csv", "data/output/benchmark_scores.files.csv", "data/output/cat_themis_a.csv", "data/output/tha_matched_files.csv"]
method = "Hold five numerator increments over six samples fixed. Compare daily-file RMS, one pooled training-file RMS, and past-only 256-increment RMS. Refit baseline and augmented logistic models under five file-grouped five-fold splits. The protocol retains label time k+4 and feature availability k+5."
run = "RAYON_NUM_THREADS=6 cargo run --profile validation -p gororoba_cli_physics --bin staples-calibration-refits -- --input-root . --scores data/output/benchmark_scores.csv --file-map data/output/benchmark_scores.files.csv --catalog data/output/cat_themis_a.csv --protocol data/output/audit/staples-calibration-grouped-refits/protocol.toml --out-dir data/output/audit/staples-calibration-grouped-refits/results --mode cv"
