download_limits = "Four initial GETs used a 2 MiB file-size limit. Seven failed-HEAD GETs used a 15 MiB file-size limit and 512 KiB/s rate limit. All eleven commands terminated before timeout; failed GETs left zero-byte files."
boundary = "The forty inventory rows pass syntactic HTTP(S), 64-hex SHA256 and nonempty retrieval-command checks. Those prerequisites do not establish that a canonical URL returns the expected bytes. Twenty-one unique URLs received HEAD probes only. Expected inventory hashes and statuses remain unchanged by this audit."
retention = "Per-request logs and downloaded bodies remain in the worktree cache. The durable report retains URLs, expected and observed hashes, sizes, content types, exit statuses and replay commands. Raw headers can contain transient server cookies and are excluded from this report."

[[finding]]
id = "url-hash-association-cross-product"
mechanism = "extend_download_map_from_local_artifacts associates every local artifact path with every artifact link. classify_artifacts then hashes the first readable downloaded or host-only path independently of canonical URL selection. The resulting hash can identify a source-pack CSV rather than bytes available at the URL."
affected_ids = ["ASOT-0029","ASOT-3272","ASOT-3279","ASOT-3280","ASOT-3283","ASOT-2657","ASOT-3067"]
local_hash_owner = "data/csv/c010_nonlocal_material_calibrations.csv"
local_hash_owner_sha256 = "a8647e2952a0a89c70f5ccf31a9e2dee3c8f27e60435a0f9df4155606dbe5f40"
evidence = "sha256sum on the primary checkout CSV reproduces all seven rows expected hash. ASOT-0029/ASOT-2657 canonical arXiv abstract GET and ASOT-3067 PubMed GET return different HTML hashes. The other four source-pack DOI mappings remain unadjudicated at the expected-byte level."

[[finding]]
id = "arxiv-abstract-pdf-byte-mismatch"
affected_ids = ["ASOT-2652"]
evidence = "The canonical abstract URL returns 39113-byte HTML with SHA256 2f910ac8c86050b830f9dab51b359f32967fb0c01489d1fbc81755466be6b180. The expected SHA256 d24cc87832baee75e29a088c23294a9b38afd373cd54ca6bbe4aee3a64ca87c1 identifies the 191938-byte PDF, independently retrieved from the versioned PDF URL."
proposed_canonical_url = "https://arxiv.org/pdf/1602.02317v1.pdf"
disposition = "Proposed URL repair requires a separate bounded mutation and all_links reconciliation. The sealed 533-row repair remains unchanged."

[[finding]]
id = "canonical-url-status-remains-host-observation"
affected_ids = ["ASOT-3272","ASOT-0500","ASOT-0702","ASOT-2828","ASOT-2932","ASOT-2934","ASOT-2964","ASOT-2945","ASOT-2988"]
evidence = "Mozilla wget HEAD and subsequent bounded GET both fail with HTTP 403 at five unique URLs and HTTP 404 at two. The seven failed GETs leave zero-byte files. Statuses describe the observed host and time; other access paths or later attempts can differ."

[[finding]]
id = "citation-policy-classifier-verifier-asymmetry"
status = "addressed"
evidence = "The classifier and verifier use the same HTTP(S) URL and 64-hex SHA256 metadata predicate after removal of the classifier's citation-key exclusions. The doi_key_with_measured_direct_content_admits_remote_metadata regression test covers a DOI identity with a direct PDF URL. Eleven of the forty retained rows have DOI keys, including ASOT-0805 and ASOT-0878 whose canonical URLs directly address PDFs. Metadata admission permits those identities; the separate URL-to-expected-bytes residual remains subject to retrieval and digest verification."

[[finding]]
id = "historical-retrieval-targets"
affected_ids = ["ASOT-0002","ASOT-0005","ASOT-0805","ASOT-0878","ASOT-0879","ASOT-2619","ASOT-2652","ASOT-2687","ASOT-2708","ASOT-2793","ASOT-2815","ASOT-2828","ASOT-2829","ASOT-2830","ASOT-2861","ASOT-2868","ASOT-2875","ASOT-2890","ASOT-2898","ASOT-2906","ASOT-2932","ASOT-2934","ASOT-2964","ASOT-2985","ASOT-3028","ASOT-3065","ASOT-3066","ASOT-3231"]
evidence = "Twenty-eight retained commands write under papers/pdf/. Their commands omit directory creation and content-hash verification. All forty commands are nonempty, but none thereby establishes durable materialization on a fresh checkout."

[recommendation]
bounded_mutation = "Keep the exact 533 invalid-prerequisite status repairs separate from these forty carried historical identities; record the latter as an independent URL-to-byte validation frontier."
future_admission = "Carry canonical URL and content hash as one evidence-bound tuple. For new promotion, use an exact retrieval-ledger URL/path association before local-path cross-product extension and before arXiv alias expansion, then measure the linked bytes. Preserve inferred aliases as references rather than retrieval proof."
carried_facts = "The current carried URL adoption branch only runs when canonical selection is empty while also requiring the URL among links; nonempty links already choose a canonical URL. Preserve a proven carried URL/hash pair together rather than selecting a new first link while retaining the old hash."
host_manifest = "The revised host-materialization filter includes any retained or host-only paths regardless of classification, correctly preserving observations for demoted rows."
claim_boundary = "A metadata admission minimum is a syntax-level contract. End-to-end remotely retrievable expected bytes require a successful exact-URL download and matching digest. Neither a locator, arbitrary carried hash, HEAD success, nor a Mozilla user agent establishes that guarantee."

