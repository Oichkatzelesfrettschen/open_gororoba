schema_version = 1
status = "validated_inventory_correction"
base_commit = "91467ad14eeeade63177e15f45acc592564b7869"
scope = "Host-neutral artifact inventory classification and exact linkless correction"
root_cause = "classify_artifacts assigned remotely_materializable from host_only_paths before establishing a retrieval URL or content identity. Local availability therefore manufactured remote-status assertions for 533 linkless records."
repair = "Classification follows measured or carried identity; remote metadata requires an HTTP(S) URL and a 64-hex SHA256. The verifier shares the predicate. Host materialization selection follows observed paths independently of status."
mutation = "repair-spec.toml seals the original master and reconciliation report SHA256 values and exact 533 ID/key witnesses. The repair checks every prerequisite, changes only selected statuses and two header counts, and proves complete semantic equality with the permitted transformation. Existing renderers regenerate four lane projections and infrastructure reports."
canonical_database_sha256 = "12e4a6eaaf4d332ade177175f143d3a5bdd84497092710f1079351dcb0d3191d"
canonical_boundary = "The repair leaves canonical SQLite unopened. Before-and-after SHA256 observations match. Canonical artifact statuses and transition history stay outside the inventory mutation."
spec = "data/output/audit/artifact-remote-materializability/repair-spec.toml"
result = "data/output/audit/artifact-remote-materializability/repair-result.toml"
retrieval_audit = "data/output/audit/artifact-remote-materializability/remote-identity-audit.toml"

