[cohort]
path = "localized-frb-cohort.csv"
sha256 = "b63c0e1c85f7310b90aa8ff11b1a16dca4b7a058a53fb06479c900790b3cbbf2"
rows = 21
unique_source_ids = 21
parent = "shannon2024.html.gz"
parent_decoded_sha256 = "d88cfaf7d2b734621d2122f3ce13f2b731a8edf6883642ab40435fb00d7e6331"
primary_reference = "Shannon et al., The Commensal Real-time ASKAP Fast Transient incoherent-sum survey, arXiv:2408.02083v1, Appendix A Table 1 (HTML A1.T1)"
fields = ["source_id", "dm_observed", "dm_error", "dm_disk_ne2001", "redshift", "telescope", "frequency_mhz", "redshift_kind", "reference", "discovery_utc_as_reported"]
selection = "Include every Table 1 source whose TNS discovery-date prefix is strictly after 2020-05-28 and whose redshift field is numeric; preserve all predictor failures subsequently"
exclusion = "Exclude all pre-cutoff sources and the published n/a, n/h and p redshift markers. Apply no DM, inferred distance, host-DM, fit residual or posterior-probability cut."
source_population_rows = 43
selection_ledger = "shannon-table1-selection.csv"
selection_ledger_sha256 = "9e3879d2dca34ae1043257bd4ce7297fe1b482673377df946d470feb0453bdf9"
row_anchors = "reference gives the one-based data row beneath the two HTML header rows in A1.T1"
normalization = "Preserve primary central DM, NE2001 disk DM and redshift decimals. Convert parenthetical DM uncertainty digits to their place value; retain the source uncertainty convention rather than assigning a confidence level."
uncertainty_boundary = "Table 1 supplies parenthetical DM uncertainties but omits rowwise NE2001 systematic errors, halo DM, host DM and redshift uncertainties. Those quantities remain unavailable, not zero."
label_boundary = "Measured Table 1 redshifts label the selected observed host cohort; host-association correctness and exchangeability remain assumptions, not mechanically established truth."
cutoff_boundary = "The temporal cut excludes the Macquart2020 development sample and additional early sources; it does not imply independence from later host-association methodological choices."
raw_table_cells = "shannon-source-table-cells.json"
source_typo = "FRB20240201A has a reported UTC of 2024-02-08 20:00:54.246 in Table 1. Preserve that field verbatim; use its TNS identifier for the predeclared temporal cut."

[development_sample]
source = "macquart2020.pdf.gz"
primary_reference = "Macquart et al. (2020), arXiv:2005.13161, Eq. (1), Eq. (2), Table 1 and Methods Sample Selection"
gold_sources = ["FRB20180924B", "FRB20181112A", "FRB20190102C", "FRB20190608B", "FRB20190711A"]
original_exclusions = "The primary analysis excludes FRB121102 and FRB190523 for discovery selection bias, FRB180916 for low Galactic latitude, and FRB190611 for tentative host association."
foreground_convention = "Eq. (1) separates Galactic ISM, Galactic halo, cosmic and observer-frame host DM. The text fixes halo DM=50 pc/cm^3 while discussing an approximate 50-100 range."
host_convention = "The plotted illustrative host subtraction is 50/(1+z) pc/cm^3. The likelihood separately fits a rest-frame lognormal host distribution and applies 1/(1+z). A fixed observer-frame 50 term is a computational estimator choice, not the source physical host prescription."
host_identity_rule = "Methods demands less than 1 percent misidentification without invoking the DM-z relation; triggering sensitivity and Galactic foreground cuts also matter."
galactic_uncertainty = "Methods describes several-tens-of-percent Galactic-model distance errors and restricts its gold sample to predicted disk DM below100 pc/cm^3, conservatively high Galactic latitude. The later frozen cohort deliberately differs and retains its full specified population."

[survey_selection]
source = "shannon2024.html.gz"
host_method = "Section4.2 PATH uses positions, localization regions, galaxy magnitudes, unseen-host and angular-offset priors; the stated inputs omit DM-z."
prior_learning_boundary = "The offset scale prior was revised using a subset of Bhandari sources and new survey sources. Shared association machinery and prior fitting limit claims of independent host-label validation."
followup = "Section4.3 obtains optical spectroscopy for probable hosts; FRB20230718A host identification uses MeerKAT21-cm HI emission. Table2 supplies interferometric positions for every selected source."
discovery_heterogeneity = "The CRAFT/ICS survey includes multiple observing bands, changing antenna counts, commensal and filler modes, and targeted repeat searches. FRB20200906A arose during a repeat search for another source. Localization and measurable-host selection are not an IID sky sample."
primary_inference_boundary = "A source-disjoint split tests this fixed selected measured-redshift cohort conditionally. Marginal conformal coverage requires exchangeability; survey membership alone does not prove that condition or transport to CHIME."

[chime_transport]
source = "chime-catalog1.html.gz"
primary_reference = "CHIME/FRB Collaboration, arXiv:2106.04352v1, Sections II-III, Table2 fields26-27, Table5 and Figure11"
column_definition = "dm_exc_ne2001 and dm_exc_ymw16 are fitburst DM minus the Galactic model evaluated at the best-fit sky position; they are not bonsai DM minus the model."
halo_boundary = "The published excess definition subtracts the Galactic electron-density model only. Shannon identifies NE2001 as a disk contribution, and Macquart Eq. (1) treats halo separately. An additional halo correction requires its own explicit assumption; the excess column does not document a halo subtraction."
grouping = "Table5 includes multiple sub-bursts from one event; fitted DM and scattering parameters are shared across sub-bursts. Burst rows require event/source grouping for independent-sample reasoning."
selection = "CHIME operates at400-800MHz and its sensitivity, localization probability regions and Galactic-DM selection differ from CRAFT/ICS; the source explicitly warns that survey transfer functions create strong cross-survey biases."
boundary = "The source audit covers Catalog1 definitions. Catalog2 source-specific column and selection provenance remains outside this bounded acquisition."

[extraction_checks]
cohort_count = "21 numeric-redshift post-cutoff rows, 21 distinct source IDs"
field_checks = "Every selected DM parses parenthetical last-digit uncertainty; every selected disk DM and redshift parses a finite numeric field"
raw_body_check = "Every stored gzip decodes to its recorded response hash and byte count"
residual_policy = "The acquisition worker calculated no calibration residuals and applied no residual-based exclusions."
selection_counts = "included=21; precutoff_discovery=10; redshift_n/a=6; redshift_n/h=2; redshift_p=4"

