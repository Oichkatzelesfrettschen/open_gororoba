expected = { title = "Ultrametric inference depends on the metric, representation and null sensitivity", status = "partial", summary = "C-071 retains its historical refuted disposition. Original scalar and transformed producers, lockfiles, five results and two exact CHIME inputs are retained with verified hashes. The original scalar build fails before compilation because its tracked workspace omits control_core; actual historical invocation and execution replay remain unresolved. Geometry-preserving relabeling nulls supply diagnostics with unestablished physical power. A separately frozen radial-angular dependence instrument passes an independent 1000-replicate-per-family engineering confirmation after the initial 100-replicate control precision gate failed. Flat and gradient alternatives also reject, restricting interpretation to dependence rather than hierarchy. Scalar p-adic and Euclidean metrics remain distinct cases.", status_note = "Partial preserves the supported metric and null-sensitivity lessons, recovered tracked-tree evidence and failed exact-source build. Synthetic confirmation establishes implementation sensitivity under declared generators; physical calibration and historical re-adjudication remain open.", claim_refs = ["C-071"] }
