target = "Absolute comoving-distance error against the reported spectroscopic redshift labels of the 21 admitted later localized CRAFT/ICS sources."
partition_rule = "Sort SHA256(UTF8(split_salt + ':' + source_id)) ascending with source_id tie-break; first 11 sources calibrate and remaining 10 test. Freeze membership independently of DM, redshift and outcomes."
predictor = "Planck2018 constant-fd mean-DM inverse of observed DM minus NE2001 disk DM minus scenario halo minus fixed observer-frame host. The predictor consumes no measured redshift. Halo50 follows the source convention; observer-host50 is the retained computational predictor, not a claim of universal physical host DM."
calibration_rule = "Absolute comoving-distance error order statistic ceil((n_cal+1)*coverage), including failed predictions as positive-infinite scores. Rank beyond n_cal gives an unbounded interval. Clamp lower distance to zero. Test prediction failures remain uncovered operational outcomes."
primary_outcome = "Report the primary 90 percent artifact's held-out coverage and two-sided95 percent Clopper-Pearson interval; a one-sided Binomial(n_test,0.9) lower-tail p below0.05 flags undercoverage under the stated independent common-coverage model. Otherwise report undercoverage not detected, rather than proof of calibration."
sensitivity_policy = "Report every fixed halo/observer-host/coverage combination. The eight nonprimary foreground pairs and other coverage levels are descriptive sensitivities; choose no winner and perform no multiple inferential claims."
precision_policy = "Report absolute errors and interval widths alongside comparisons with all four historical neighborhood radii. These comparisons assess scale mismatch and supply no application-derived usefulness threshold."
measurement_policy = "DM measurement errors are retained from the primary table. Missing redshift, Galactic, halo and host uncertainty distributions remain unmodeled. Calibration targets published redshift point labels; bounds are empirical prediction intervals, not propagated measurement-error posteriors."
exchangeability = "The finite localized survey cohort is selected by host identification and redshift acquisition. Survey frequency, sensitivity, follow-up and a partly shared host-offset prior vary. Randomized-source-style fixed hash partitioning avoids deliberate outcome selection; an IID or exchangeable superpopulation remains an assumption, not an observed fact."
transport = "The calibration artifact applies as an empirical audit to the admitted cohort. CHIME's400-800MHz selection, FITBURST disk-excess columns and repeated sub-burst rows differ. The study supplies no validated transport or row-exchangeability guarantee for CHIME and no hierarchy-specific evidence."
stopping_rule = "Execute the21 frozen sources,11/10 partition and all nine predetermined foreground pairs once, then exact deterministic replay. Retain every failure and outcome; change no membership, split, foreground, threshold or model after residual inspection."
