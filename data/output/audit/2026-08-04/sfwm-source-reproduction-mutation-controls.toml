schema = "sfwm-source-reproduction-mutation-controls-v1"
bundle_id = "LOCAL-P2C1-SFWM-SOURCE-REPRODUCTION"
policy = "Every declared mutation must change a retained component or violate a typed validation boundary."

[[control]]
id = "SC-P2C1-MUT-001"
mutation = "replace the signed SPDC mismatch with its positive coherence-length magnitude"
test = "positive_only_spdc_mismatch_is_detected"
threshold = "complex cascaded amplitude difference > 1e-25"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-002"
mutation = "omit 2*pi/(n_SH*lambda_SH*Delta_k_SHG) from Eq. 6"
test = "omitted_eq6_prefactor_is_detected"
threshold = "complex cascaded amplitude difference > 1e-25"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-003"
mutation = "replace source chi2 and chi3 with the legacy 27e-12 and 2.4e-21 tuple"
test = "source_susceptibility_substitution_is_detected"
threshold = "ratio difference > 1e-3"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-004"
mutation = "use a legacy scalar/product-of-efficiencies path as the corrected rate"
test = "corrected_paper_input_reproduces_the_source_ratio_boundary plus legacy characterization log"
threshold = "the corrected complex path and legacy path remain numerically distinct"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-005"
mutation = "replace complex phase retention with scalar magnitude-only components"
test = "independent_reference_matches_all_complex_components"
threshold = "real and imaginary components agree at five fixtures"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-006"
mutation = "replace an undefined direct-rate denominator with a numerical floor"
test = "zero_direct_rate_is_not_replaced_by_a_floor"
threshold = "ratio is None rather than finite"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-007"
mutation = "accept negative pump-field-squared input"
test = "negative_pump_field_squared_is_rejected"
threshold = "typed Negative error"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-008"
mutation = "accept negative layer thickness"
test = "negative_thickness_is_rejected"
threshold = "typed Negative error"
result = "detected"

[[control]]
id = "SC-P2C1-MUT-009"
mutation = "use broad monotonicity as the only fringe oracle"
test = "corrected_phase_matching_preserves_source_fringe_structure and grid refinement summary"
threshold = "analytic extrema and periods remain explicit"
result = "detected"

[summary]
controls_declared = 9
controls_detected = 9
source_theory_refuted = false
experimental_data_used = false
substrate_percentage_evaluated = false
