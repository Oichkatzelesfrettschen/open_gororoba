[scope]
included = "complex pole identification, uniform-metal background phase, no-fit Figure 4 comparison, source-derived Figure 5 comparison, constrained held-out Figure 5 fitting"
excluded = "P2A oracle changes, SFWM, photon-graviton, C-864, C-865, C-867, C-1638, C-1639, GPU, theorem identity infrastructure"
paper_language = "Ruan and Fan report excellent agreement for Figure 4 and good agreement for Figure 5 without a universal 1% threshold"
repository_language = "C-849 and the C-850 challenge use a predeclared repository-defined 0.01 unit-scale absolute observable gate"

[c849]
claim_id = "C-849"
metric_name = "unit_scale_absolute_observable_error"
metric_definition = "max over the frozen grid of abs(C_TCMT - C_Mie) for each required normalized observable"
threshold = 0.01
threshold_source = "repository claim predicate; not stated by Ruan and Fan"
lossless_required_observables = ["c_sct"]
lossy_required_observables = ["c_sct", "c_abs", "c_ext"]
complex_amplitude_retained = true
complex_s_threshold = 0.01
complex_s_threshold_source = "repository-defined companion gate"
complex_r_retained = true
phase_error_threshold = 0.01
phase_error_condition = "abs(S_Mie) >= 0.05"
no_fit = true

[c850]
claim_id = "C-850"
minimum_held_out_frequencies = 20
channels = [0, 1, 2, -1, -2]
unique_channels = [0, 1, 2]
observable_threshold = 0.01
observable_threshold_source = "repository-defined challenge; not stated by Ruan and Fan"
complex_s_threshold = 0.01
performance_rule = "constrained TCMT must improve held-out complex S error over background-only and fixed-phase Lorentzian baselines"
aggregation_rule = "retain each channel before applying degeneracy weights 1,2,2"
test_leakage_rule = "test coordinates do not enter initialization, bounds, optimizer choice, stopping, model selection, or tolerance choice"
source_landmark_frequency = 0.2282
source_landmark_scattering = 0.03
source_landmark_absorption = 0.32
source_landmark_uncertainty = "printed two-decimal source anchors; compare with declared graphical and numerical reading interval"

[source_parameter_predicate]
anchor_rule = "compare computed values with intervals implied by printed precision, independent root uncertainty, and high-precision reference"
omega0_fig4 = 0.1552
omega0_fig4_printed_interval_half_width = 0.00005
gamma_fig4 = 0.000019166
gamma_fig4_printed_interval_half_width = 0.0000000005
phi_over_pi_fig4 = -0.4882
phi_over_pi_fig4_printed_interval_half_width = 0.00005
gamma_total_fig4_lossy = 0.00010492
gamma_total_fig4_lossy_printed_interval_half_width = 0.000000005
gamma0_fig4_lossy = 0.000085749
gamma0_fig4_lossy_printed_interval_half_width = 0.0000000005
source_parameter_fit_forbidden = true

[convention]
time_dependence = "exp(-i*omega*t)"
incoming_wave = "H^(2)"
outgoing_wave = "H^(1)"
polarization = "HzTm"
interface_state = "H_z and (1/epsilon)*radial_derivative(H_z)"
drude = "epsilon_m = 1 - omega_p^2/(omega^2 + i*gamma_d*omega)"
complex_root = "omega_tilde = omega_0 - i*Gamma with Gamma > 0"
normalized_cross_sections = "2*lambda/pi"
sqrt_branch = "passive branch with nonnegative imaginary square root and positive real square root on positive real epsilon"
background_phase = "arg of uniform metallic cylinder R_l at the lossless extracted resonance"

[figure4]
geometry = "rho1=0.285*lambda_p, rho2=1.0*lambda_p, rho3=1.5*lambda_p, epsilon_d=12.96, l=0"
lossless_gamma_d = 0.0
lossy_gamma_d = 0.001
