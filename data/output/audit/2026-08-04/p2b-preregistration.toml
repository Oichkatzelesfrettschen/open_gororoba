pole_relevance_rule = "retain every pole in the evaluation window or within near_window_half_width of it; retain all other counted poles as alternates"
pole_selection_rule = "select the relevant pole nearest the evaluation interval, then use lossless-to-lossy continuation; do not select by final curve error"
degeneracy_weights = [1, 2, 2]

[fit]
training_rule = "41 open Chebyshev nodes over [0.22,0.233]"
validation_rule = "41 midpoint nodes over [0.22,0.233]"
test_rule = "201 uniform nodes plus 0.2282 and a 31-node contiguous held-out interval [0.2275,0.2290], after canonicalized disjointness filtering"
minimum_test_points = 20
canonical_coordinate_digits = 15
parameters = ["omega_0", "gamma", "gamma_0", "phi"]
omega0_bounds = [0.20, 0.25]
gamma_bounds = [0.000001, 0.02]
gamma0_bounds = [0.0, 0.02]
phi_bounds = [-3.141592653589793, 3.141592653589793]
starts = [
    [0.225, 0.002, 0.001, 0.0],
    [0.230, 0.005, 0.001, -1.0],
    [0.215, 0.005, 0.001, 1.0],
    [0.233, 0.001, 0.005, 2.0]
]
optimizer = "deterministic bounded Nelder-Mead with fixed iteration limit and no random restarts"
selection_rule = "minimum validation complex residual among finite training-converged starts; test data are unread"
fit_target = "Re(S_l) and Im(S_l) jointly"
baseline_background = "complex constant S_l equal to the training mean"
baseline_fixed_phase = "Fano model with phi fixed at zero and omega0,gamma,gamma0 fitted on training only"
baseline_unconstrained_pole = "complex b + a/(omega - (omega0 - i*gamma)) with complex b,a and positive gamma"
identifiability = ["Jacobian singular values", "local condition number", "parameter profiles", "leave-one-training-node-out sensitivity", "start variation", "pole proximity", "validity ratio"]

[verdict_rules]
c849_survives = "independent roots agree, source anchors pass their envelopes, all required Figure 4 observable and complex S gates pass, and all mutations are detected without evaluation-curve fitting"
c849_falsifies = "stable independently reproduced result violates the preregistered 0.01 observable gate"
c849_inconclusive = "root ambiguity, root disagreement, nonconvergence, multiple-pole contamination, or conditioning defeats the frozen policy"
c850_survives = "source-derived and held-out complex per-channel results pass, totals pass, at least 20 test frequencies pass, landmark agrees within declared uncertainty, constrained TCMT beats both baselines, and no cancellation hides a channel failure"
c850_falsifies = "stable independent result violates the preregistered match criterion, a dominant channel needs multiple poles, or aggregate agreement is cancellation-only"
c850_methodology_invalid = "test leakage, post-test restart, observable-specific refitting, heuristic extraction, or post-test channel selection occurs"
c850_inconclusive = "source parameters are underdetermined, roots are ambiguous, fits are ill-conditioned, or graphical evidence is required but unavailable"

[freeze_gate]
policy_frozen_before_final_grid = true
final_grid_hash_required = true
fit_coordinate_hash_required = true
tolerance_after_final_observation_forbidden = true
post_test_refit_forbidden = true
