diagnostics_sha256 = "d5de77635b7108815255451775c53bb2ebcb3cb0ff35b7433145a6694970cc44"
limitation = "Cflow parses C syntax and reports Rust redefinition errors; its one-node result is not a semantic Rust call graph"

[[tool]]
name = "rg-symbol-occurrence-map"
version = "ripgrep repository tool"
command = "rg symbol candidates over the scoped file list"
output = "call-candidates.tsv"
output_sha256 = "754f81bcc62cf8b957f85050cd810a0db77d5a3e040e1c35ee9d7451096912b8"
role = "lexical occurrence inventory used to assemble the bounded edge map"

[[tool]]
name = "rust-analyzer"
version = "repository-installed rust-analyzer"
command = "rust-analyzer analysis-stats . --only crates/optics_core/src/sfwm.rs --no-test --disable-build-scripts --skip-mir-stats --skip-data-layout"
output = "sfwm-rust-analyzer-analysis-stats.txt"
diagnostics = "sfwm-rust-analyzer-analysis-stats.log"
role = "compiler-aware workspace analysis and unresolved-reference sanity check"
limitation = "analysis-stats does not emit a call graph; it validates item collection and inference coverage"

