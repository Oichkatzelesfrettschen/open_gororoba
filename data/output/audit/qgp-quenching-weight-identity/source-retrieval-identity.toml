[bdms_equation_identity]
visual_locators = ["data/output/audit/qgp-quenching-weight-identity/bdms-laplace-page6.png", "data/output/audit/qgp-quenching-weight-identity/bdms-laplace-page7.png"]
eq18b = "D_tilde(nu)=exp[-integral_0^infinity domega (dI/domega)*(1-exp(-nu*omega))]"
eq18b_scope = "Exact transform of the declared independent-emission source model when the integral exists; exact does not remove the physical soft-emission assumptions."
eq19a = "D_tilde(nu)=exp[-nu*integral_0^infinity domega exp(-nu*omega)*N(omega)], N(omega)=integral_omega^infinity domega_prime*dI/domega_prime"
eq25 = "Q(pT)=integral depsilon D(epsilon)*[vacuum_spectrum(pT+epsilon)/vacuum_spectrum(pT)]"
source_spectrum_measure = "BDMS writes d sigma/d pT^2. A calibrated spectral index for another differential measure requires its own slope definition."
power_law_kernel = "With an exact declared power-law vacuum spectrum, the ratio is(1+epsilon/pT)^(-n). That kernel does not equal exp(-n*epsilon/pT) for finite positive loss and finite n."
eq26 = "The source approximates that ratio by exp(-n*epsilon/pT), with a printed correction of order ln(R)^2/(2*n), using a numerically large effective exponent."
eq27 = "Q(pT) approximately D_tilde(n/pT)=exp[-integral_0^infinity dz exp(-z)*N(pT*z/n)]"
distinction = "Eq18b can compute the transform exactly within the chosen emission model. Identifying one transform value with the power-law convolution adds Eq26's approximation. Using the full spectrum inside Eq18b does not remove that separate kernel approximation."
additional_approximations = "BDMS Eqs20/21 additionally approximate the soft spectrum or its integrated multiplicity. Those approximations remain distinct from both Eq18b and the Eq26 kernel replacement."
exact_power_law_transform_route = "For n>0 and X>=0, (1+X/u)^(-n)=integral_0^infinity dt t^(n-1)*exp(-t)*exp(-t*X/u)/Gamma(n). Nonnegative integrands permit exchanging expectations and integration, giving the gamma-weighted transform integral rather than a single value at n/u."
route_attribution = "The gamma identity is an independently derived computational identity, not a quotation of BDMS Eq27."

