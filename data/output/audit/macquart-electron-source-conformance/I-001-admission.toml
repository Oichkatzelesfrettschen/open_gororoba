[expected]
title = "Mean-DM distance conversion requires explicit electron and host conventions"
status = "partial"
summary = "The implemented DM-to-redshift-to-comoving-distance construction supports a declared cosmology. Macquart et al. Eq. (2) defines a mean cosmic-DM relation with an explicit electron-density helium factor and diffuse baryon fraction; Eq. (1) separates Galactic, halo and redshift-scaled host contributions. The inspected routine omits the explicit 0.875 helium factor under its documented f_IGM convention. Its constants give 927.936546 rather than the approximate comment coefficient 935; multiplying by 0.875 gives only a conditional arithmetic value, 811.944478. An initial bisection bracket of width 10 requires 30 halvings to reach width 1e-8; expanded brackets require additional halvings. Caller host-frame conventions, scatter and physical calibration remain to be admitted. C-071 supplies research motivation rather than evidence for the Macquart formula or inversion convergence."
status_note = "Partial denotes an implemented construction with unresolved source conformance. The retained primary source and arithmetic witness support the stated convention and iteration corrections. Source-faithful numerical repair, caller audit and independent astrophysical validation remain separate tasks."
claim_refs = ["C-071"]

[revised]
title = "Mean-DM distance conversion requires explicit electron and host conventions"
status = "partial"
summary = "The mean cosmic-DM implementation includes the Macquart Eq. (2) electron factor 0.875 for helium mass fraction 0.25 and doubly ionized helium. A constant diffuse baryon mass fraction 0.83 specializes the source's fd(z). Independent SI-density quadrature agrees across 12 declared cases to relative error at most 2.9e-15; analytic expansion controls, source-generated inversion and an analytic foreground-subtracted distance test pass. Baseline production fails all four tests, including a measured 8/7 normalization excess. The tested mean-DM value at z=1 is 900.751906538024 pc/cm^3 for the declared Planck parameters. Both FRB callers subtract a fixed observer-frame host from NE2001 excess; catalog halo treatment and physical host-frame provenance remain unresolved. C-071 supplies motivation and retains its refuted disposition."
status_note = "Partial records conditional implementation conformance on the declared finite grid. The correction resolves the missing electron factor and documents numerical foreground conventions. Inverse invalid inputs and upper-bracket exhaustion, ionization/diffuse-fraction evolution, scatter, independent astrophysical calibration and historical FRB producer replays remain open. Source tests establish their implementation layer; they supply no new ultrametric or physical-structure evidence."
claim_refs = ["C-071"]

