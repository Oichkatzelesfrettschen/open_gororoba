# cargo-deny policy for open_gororoba.
# Keep this file compact and explicit. Remove ignores as upstream fixes land.

[advisories]
# Each ignore below has a rationale recorded in
#   docs/adr/rustsec-dispositions.md
# Remove an entry only when the disposition there is updated to "resolved"
# AND the advisory genuinely no longer triggers (cargo deny will warn
# "advisory-not-detected" if you leave a stale ignore).
ignore = [
    # bincode 1.3.3 (unmaintained). Dev-dep only via iai-callgrind benches.
    # Production uses bincode 2.0.1 via burn-core which is past the
    # advisory's affected range. No runtime exposure.
    "RUSTSEC-2025-0141",
    # json 0.12.4 (unmaintained). Build-dep only via
    # periodic-table-on-an-enum -> materials_core. Not present at runtime.
    "RUSTSEC-2022-0081",
    # paste 1.0.15 (unmaintained). Proc-macro; expanded at compile time, no
    # runtime artifact. Path: paste -> argmin -> algebra_experimental.
    "RUSTSEC-2024-0436",
    # instant 0.1.13 (unmaintained). Runtime via minifb -> gororoba_cli_physics
    # for UI display timing. Migration tracked: see ADR rustsec-dispositions.md.
    "RUSTSEC-2024-0384",
    # proc-macro-error2 is a dev-only benchmark proc-macro with no safe
    # maintained replacement in iai-callgrind.
    "RUSTSEC-2026-0173",
    # ttf-parser is transitive through plotters and lopdf; RustSec reports no
    # safe upgrade for the maintained consumers.
    "RUSTSEC-2026-0192",
    # quick-xml 0.39 is a build-only transitive dependency of wayland-scanner.
    # Runtime XML consumers use quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    #
    # RESOLVED 2026-04-30 by `cargo update -p rustls-webpki --precise 0.103.13`:
    #   RUSTSEC-2026-0098 (rustls-webpki name constraint bug)
    #   RUSTSEC-2026-0099 (rustls-webpki name constraint bug)
    #   RUSTSEC-2026-0104 (rustls-webpki CRL panic, NEW)
    # All three were addressed by the same point release; no longer ignored.
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
