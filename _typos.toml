# typos-cli configuration
# WHY: Catch spelling errors in code, docs, and registry files before they land.
# WHAT: Runs on all text files except data/external, .cache, target, extracted papers.
# HOW: `make typos` or `typos` from repo root.

[files]
extend-exclude = [
    ".cache/",
    "target/",
    "data/external/",
    "proofs/**/*.vo",
    "proofs/**/*.glob",
    "*.sqlite3",
    "*.h5",
    "Cargo.lock",
    # Large registry files with machine-generated content or wrapped text
    "registry/artifact_source_of_truth.toml",
    "registry/claims_evidence_edges.toml",
    "registry/external_sources.toml",
    "registry/knowledge/",
    "registry/source_lanes/",
    # Extracted papers contain OCR artifacts -- not our code
    "papers/extracted/",
    # Curated benchmark CSVs contain x86 instruction mnemonics and LLVM IR
    "curated/",
    # LaTeX bibliographies contain author name fragments
    "docs/latex/refs.bib",
    "docs/latex/arxiv/refs.bib",
    # Data manifests from external ingestion
    "data/papers/",
    # Docker images reference external package names
    "docker/",
    # Generated registry mirrors contain embedded text from external sources
    "crates/data_core/src/registry_mirrors/",
    # Archive CSVs contain x86 instruction mnemonics
    "archive/",
    # Generated materials/project CSV datasets contain element symbols
    "registry/data/",
]

[default]
# Physics/math domain terms that are not typos.
extend-ignore-re = [
    # Common abbreviations in physics code
    "(?i)\\b(nfw|udg|cmr|lbm|mrt|qgp|hott|fhs|psl|smhm)\\b",
    # LaTeX theorem/proof environment commands
    "\\\\(thm|lem|prop|cor|defn|rmk)\\b",
]

[default.extend-words]
# Domain-specific terms that look like typos but are not.
