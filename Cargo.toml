# Rust-native repository policy:
# Cargo is the authoritative workflow surface for Rust operations.
# Add operational entrypoints as Rust binaries in workspace crates.
# Toolchain is pinned stable via rust-toolchain.toml (LLVM codegen only).

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/Oichkatzelesfrettschen/open_gororoba"

[workspace]
resolver = "3"
members = [
    "crates/algebra_analysis",
    "crates/algebra_experimental",
    "crates/brown_1967",
    "crates/brown_1972",
    "crates/casimir_core",
    "crates/cd_kernel",
    "crates/cd_papers",
    "crates/cd_spin_bridge",
    "crates/control_core",
    "crates/cosmic_scheduler",
    "crates/cosmology_core",
    "crates/cr_transport",
    "crates/data_artifacts_core",
    "crates/data_core",
    "crates/de_marrais_2000",
    "crates/dickson_1919",
    "crates/docpipe",
    "crates/fixed_point_lbm",
    "crates/flavor_lifts",
    "crates/gororoba_algebra",
    "crates/gororoba_cli",
    "crates/gororoba_cli_algebra",
    "crates/gororoba_cli_data",
    "crates/gororoba_cli_governance",
    "crates/gororoba_cli_physics",
    "crates/gororoba_cli_provenance",
    "crates/gororoba_cli_quantum",
    "crates/gororoba_cli_warp",
    "crates/gororoba_contracts",
    "crates/gororoba_db",
    "crates/gororoba_engine",
    "crates/gororoba_gpu_bridge",
    "crates/gororoba_gpu_cubecl",
    "crates/gororoba_gpu_cuda",
    "crates/gororoba_gpu_readback",
    "crates/gororoba_gpu_vulkan",
    "crates/gororoba_optix",
    "crates/gororoba_pipeline",
    "crates/gororoba_sparse_grid",
    "crates/gororoba_structurable",
    "crates/gororoba_view_core",
    "crates/gororoba_view_raster",
    "crates/gr_core",
    "crates/grmhd_core",
    "crates/hurwitz_1898",
    "crates/lattice_filtration",
    "crates/lbm_3d",
    "crates/lbm_3d_cuda",
    "crates/lbm_core",
    "crates/lbm_vulkan",
    "crates/lit_search",
    "crates/manga_experiments",
    "crates/materials_core",
    "crates/materials_data",
    "crates/moreno_1997",
    "crates/neural_homotopy",
    "crates/optics_core",
    "crates/pathion_ellip",
    "crates/provenance_core",
    "crates/provenance_ops",
    "crates/provenance_store",
    "crates/qgp_scaling",
    "crates/quantum_core",
    "crates/repo_root",
    "crates/repo_utilities",
    "crates/schafer_1945",
    "crates/scrolls_core",
    "crates/sign_imbalance",
    "crates/snia_core",
    "crates/spectral_core",
    "crates/spin_tomography_core",
    "crates/stats_core",
    "crates/surreal_algebra",
    "crates/tensor_core",
    "crates/verified_core",
    "crates/wilmot_2025",
    "xtask",
]

[workspace.metadata.execution_policy]
single_compile_heavy_command_at_a_time = true
parallelize_non_cargo_tasks_only = true
reuse_existing_build_artifacts = true
deterministic_reproducibility_required = true
contention_avoidance_note = "Serialize compile-heavy cargo commands to avoid package/artifact lock contention."

[workspace.metadata.execution_policy.recommended_sequence]
step_1 = "Run one compile-heavy cargo command at a time."
step_2 = "Parallelize only non-cargo tasks (file scans, report parsing, documentation edits)."
step_3 = "Reuse one built binary set for follow-on runs."

[workspace.metadata.feature_policy]
library_crates_default = "no_gpu"
cli_crates_may_default = "gpu"
tda_scope = "validation_only"
tda_note = "tda 0.1.0 used solely by test-tda-api binary for Betti-number cross-validation. Consider feature-gating behind tda-validation if compile time becomes a concern."
ndarray_duplication_note = "burn pulls its own ndarray version; accept transitive duplication until burn aligns."

# cargo-machete: fast unused dependency detection (regex+AST, no compilation).
# WHY: Detect dead deps before they accumulate. Runs in <2s vs cargo-udeps' minutes.
# NOTE: If machete flags a dep you think is unused, investigate what SHOULD be wired
# in before deleting. False positives are rare but possible for proc-macro deps
# and deps used only via feature gates.
[workspace.metadata.cargo-machete]
ignored = ["wide"]

# Shared dependencies across workspace
[workspace.dependencies]
repo_root = { path = "crates/repo_root" }
# Workspace-internal crates (extracted from gororoba_algebra)
algebra_analysis = { path = "crates/algebra_analysis" }
algebra_experimental = { path = "crates/algebra_experimental" }
cd_kernel = { path = "crates/cd_kernel" }
gororoba_gpu_bridge = { path = "crates/gororoba_gpu_bridge" }
gororoba_gpu_cubecl = { path = "crates/gororoba_gpu_cubecl" }
gororoba_gpu_cuda = { path = "crates/gororoba_gpu_cuda" }
gororoba_gpu_readback = { path = "crates/gororoba_gpu_readback" }
gororoba_gpu_vulkan = { path = "crates/gororoba_gpu_vulkan" }
gororoba_optix = { path = "crates/gororoba_optix" }
gororoba_sparse_grid = { path = "crates/gororoba_sparse_grid" }
gororoba_structurable = { path = "crates/gororoba_structurable" }
gororoba_view_core = { path = "crates/gororoba_view_core" }
gororoba_view_raster = { path = "crates/gororoba_view_raster" }

# Core numerics
# PINNED: statrs 0.18.0 requires nalgebra ^0.33 (<0.34). gauss-quad 0.2.4 pulls
# nalgebra 0.34 transitively (dep duplication). Upgrade when statrs releases 0.19+.
# (Original num-dual 0.13.2 pin reason is stale -- num-dual no longer in dep tree.)
nalgebra = "0.34"
ndarray = "0.17"
num-complex = "0.4"
num-traits = "0.2"

# Graph algorithms
bitvec = "1.0"
fixedbitset = "0.5"
petgraph = "0.8"

# Topological Data Analysis
tda = "0.1.0"

# Statistics
adjustp = "0.1.6" # BH/BY/Bonferroni p-value correction (MIT)
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
statrs = "0.18"

# Algebra extensions
atlas-embeddings = "0.1.1" # Exceptional Lie groups (E6/E7/E8) from resonance classes
diffusionx = "0.11.3" # fBm, Levy, OU processes (requires mimalloc)
num-bigint = "0.4" # Arbitrary precision integers (Monster group order)
padic = "0.1.6" # P-adic numbers
wheel = "0.1.0" # Wheel algebra (division-by-zero semantics)

# Hierarchical clustering and spatial indexing
kiddo = "5.3.0" # High-performance k-d trees (AVX2/SIMD)
kodama = "0.3.0" # Agglomerative hierarchical clustering (dendrograms)

# Dense linear algebra (eigensolvers, SVD)
faer = "0.24"

# FFT and spectral analysis
ndrustfft = "0.6.2" # N-dimensional FFT on ndarray (C2C, R2C, DCT)
rustfft = "6.4.1" # High-performance FFT (pure Rust, AVX/SSE)

# Vulkan and Windowing
ash = "0.38.0"
gpu-allocator = "0.28.0"
# Five crates take naga with wgsl-in + spv-out to compile WGSL to SPIR-V for
# ash: lbm_vulkan, optics_core, gororoba_algebra, grmhd_core, and
# gororoba_gpu_vulkan behind its `ash` feature. They touch four entry points --
# front::wgsl::parse_str, valid::Validator, back::spv::write_vec, and
# back::spv::Options -- which have been stable across 27 through 29, so the
# version tracks upstream rather than a downstream consumer.
naga = "29.0.1"
raw-window-handle = "0.6.2"
winit = "0.30.13"

# Half-precision types
half = "2.7.1"
moyo = "0.7" # Crystal symmetry finder (pure Rust, spglib team)
periodic-table-on-an-enum = "0.3.2" # Element enum with atomic data

# Numerical quadrature
gauss-quad = "0.3.1" # Gauss-Legendre quadrature (replaces hand-rolled Simpson)

# ODE solvers
ode_solvers = "0.6.1" # Dormand-Prince 5(4), Dop853, RK4 (nalgebra-based)
qua_ten_net = "0.2.0" # Tensor networks for quantum computing

# Astrodynamics / Ephemeris
# anise: pure Rust, thread-safe JPL .bsp/SPK parser (machine-epsilon precision).
# Each rayon worker queries .bsp concurrently without locks. Built by nyx-space.
# BANISHED: rust-spice (C-SPICE FFI, thread-unsafe mutable state, segfaults under rayon).
anise = { version = "0.9.6", default-features = false }

# Parallelism
rayon = "1.11"

# Global allocator
mimalloc = "0.1"

# Framebuffer display
minifb = "0.28"

# CPU affinity
core_affinity = "0.8"

# === Complementary Compute Stack ===
# Each crate fills a strictly non-overlapping role:

# Fast Walsh-Hadamard Transform (extracted standalone crate in cratesgororobas).
# Pin by git rev so builds do not depend on a sibling local hub checkout.
# After crates.io publish of fwht, switch to: fwht = "0.1"
fwht = { git = "https://github.com/Oichkatzelesfrettschen/cratesgororobas", rev = "28b5310d3a6755b81b7c1ceb79f9f79f67f1af70" }

# SIMD types + dispatch + distance
pulp = "0.22" # Runtime-dispatched SIMD autovectorization (powers faer)
simsimd = "6" # Hardware-accelerated distance functions (L2, cosine, dot)
wide = "1.2" # Named SIMD types (f64x4, f32x8) for explicit vectorization

# Parallelism (rayon already in workspace) + concurrency hygiene
crossbeam-utils = "0.8" # CachePadded (false-sharing), Backoff, scoped threads

# Buffer/alignment/zero-copy layer
aligned-vec = "0.6" # AVec/ABox: runtime-aligned allocation for SIMD + cache
bytemuck = { version = "1.25", features = ["derive"] } # POD/slice casting + derive macros
dyn-stack = "0.13" # Reusable scratch workspace (dynamic temp arrays, no alloc churn)
smallvec = "1.15" # Inline small buffers, heap spill only when needed

# Memory-mapped I/O (memmap2 already in data_core/cli_physics directly)

# Benchmarking (criterion + iai-callgrind already in workspace)

# ONNX Runtime for real-model evaluation.
# load-dynamic: link to the system libonnxruntime.so at runtime via dlopen.
# Requires onnxruntime-opt-cuda (or equivalent) installed system-wide.
# On Arch with onnxruntime-opt-cuda, the .so is at /usr/lib64/libonnxruntime.so.
# Alternative: download-binaries (default) auto-fetches a vendored runtime --
# avoid because it adds ~50 MB to every CI cache entry and pins the version.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-18"] }

# Unified GPU compute (cubecl: write once, dispatch to CUDA + Vulkan + WebGPU + Metal)
# default-features=false to keep the cubecl base lean. The cd_kernel crate
# enables features=["wgpu"] when its `cubecl` feature is on; that pulls in
# cubecl-wgpu (~150 MB transitive dep tree: wgpu, naga, ash) but lets us
# launch the same #[cube] kernel through the wgpu runtime on Vulkan/DX12/
# Metal/WebGPU. On Linux/Vulkan our hand-rolled VulkanQuantizer is still
# preferred because it avoids the wgpu/naga compilation cost; the cubecl
# path is for cross-platform portability.
cubecl = { version = "0.10.0", default-features = false }
cubecl-core = { version = "0.10.0", default-features = false }
cubecl-wgpu = { version = "0.10.0", default-features = false }

# GPU compute (CUDA via dynamic loading -- binary works without GPU at runtime).
#
# `fallback-latest` decides whether the workspace builds on a machine with no
# CUDA toolkit. `cuda-version-from-build-system` shells to `nvcc --version` and,
# without the fallback, panics at cudarc's build.rs:168 when that command fails;
# `lbm_3d_cuda` takes `cudarc` as a hard dependency and is a workspace member,
# so that panic reaches every `cargo build --workspace`. With the fallback the
# probe still wins wherever nvcc exists, and elsewhere cudarc selects the newest
# version it supports and prints a warning. The selection only picks which API
# surface compiles: `dynamic-loading` resolves the driver at run time, so a
# machine with no toolkit was never going to dispatch a kernel either way.
cudarc = { version = "0.19.8", default-features = false, features = ["std", "driver", "runtime", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "fallback-latest", "cublas", "cufft", "curand", "cusolver"] }

# Dynamic library loading (OptiX FFI)
libloading = "0.9"

# GPU telemetry (NVML). Used for Rust-native sampling without shelling out.
nvml-wrapper = "0.12"

# Machine learning / Neural synthesis (burn 0.16: pure Rust, backend-agnostic)
# Note: burn backends are optional at crate level, not workspace level.
# Native BLAS backends remain crate-local opt-ins so default workspace builds stay
# offline-friendly and do not assume OpenBLAS/BLIS/Accelerate availability.
burn = { version = "0.20", default-features = false, features = ["std", "autodiff"] }

# Error handling
anyhow = "1.0.103"
thiserror = "2.0"

# CLI and serialization
anstyle = "1.0"
# DSP / spectral analysis
apodize = "1.0" # Window functions (Hann, Hamming, Blackman) for FFT spectral analysis
axum = "0.8"
backon = "1.6" # Exponential backoff helpers for resumable HTTP range downloads
blake3 = "1.8" # Fast content hashing for ingest fingerprints
cdf = "0.1.4" # Pure-Rust NASA CDF reader for heliosphere mission products
chardetng = "1.0" # Charset detection for non-UTF8 intake text
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
encoding_rs = "0.8" # Decoding support for lossy/non-UTF8 source ingest
fitsio = { version = "0.21", features = ["default"] } # cfitsio bindings for FITS astronomy file I/O
glob = "0.3" # Unix shell pattern matching for artifact paths
globset = "0.4" # Compiled glob rules for provenance source selection
ignore = "0.4" # Gitignore-aware repo traversal for provenance indexing
linkify = "0.10" # URL extraction from prose without ad hoc regex-only parsing
md5 = { package = "md-5", version = "0.11.0" } # Zenodo checksum verification (crate exports as md5)
pulldown-cmark = "0.13" # Markdown parser for provenance extraction
quick-xml = "0.41" # SAX-style XML parser for VOTable and VO Cone Search responses
regex = "1.12" # Claims matrix parsing, pattern matching
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "gzip", "brotli", "deflate", "form"] } # Standardized blocking HTTP transfer stack for universal recovery routing without pinning unrelated test binaries to the aws-lc provider lane
rusqlite = { version = "0.39", features = ["bundled"] } # SQLite-backed normalized provenance store after removing Burn train/sqlite coupling
rusqlite_migration = "2.5" # SQLite schema migrations for provenance_store
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11" # SHA-256 checksums for data provenance
tokio = { version = "1.51", features = ["rt-multi-thread", "macros"] }
ureq = "3" # Minimal sync HTTP client for data fetching
url = "2.5" # URL parsing for provenance and artifact reconciliation
walkdir = "2.5" # Recursive directory traversal for evidence link checks

flate2 = "1.1" # Gzip compression/decompression
tar = "0.4" # Tar archive reading (WMAP/Planck chain extraction)
zip = "8.5" # ZIP archive extraction

# PDF extraction (pdfium-render is primary; lopdf/pdf-extract are pure-Rust fallback)
arrow-array = "58.1.0"
arrow-ipc = "58.1.0"
arrow-schema = "58.1.0"
camino = "1.2" # UTF-8 canonical repo-relative paths in provenance layers
chromiumoxide = "0.9" # Pure Rust headless chrome client
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] } # PNG/JPEG only; avif disabled to drop rav1e -> core2 chain (RUSTSEC-2026-0105)
lopdf = "0.42" # Pure Rust PDF parser (fallback, object-level access)
parquet = { version = "58.1.0", default-features = false, features = ["arrow", "snap"] }
pdf-extract = "0.12" # Pure Rust PDF text extraction (fallback, wraps lopdf)
pdfium-render = "0.9" # High-level PDFium wrapper (text, images, rendering)
scraper = "0.26" # HTML scraping with CSS selectors (Google Scholar)
strsim = "0.11" # String similarity (Jaro-Winkler, Levenshtein)
toml = "1.1" # TOML serialization/deserialization
toml_edit = "0.25" # Deterministic TOML emission/editing for compatibility exports
unicode-normalization = "0.1" # Unicode normalization for ANSI-safe UTF-8 sanitation
unpdf = "0.7" # Scientific PDF extraction with math support

# HDF5 data export (requires system libhdf5)
# Using the hdf5-metno fork; upstream `hdf5` 0.8.1 last released
# 2021-11-21 and panics on any HDF5 2.x with "Invalid H5_VERSION".
#
# The pin tracks the system library, because hdf5-metno-sys parses
# H5_VERSION out of H5pubconf.h and panics on a value its Version::parse
# does not recognize. Arch and CachyOS ship HDF5 2.2.0, which the sys
# crate behind hdf5-metno 0.12.4 (hdf5-metno-sys 0.11.3) rejects, so the
# floor is 0.14. Raising the system HDF5 past what the pinned sys crate
# parses breaks every build that touches the hdf5-export feature,
# including the registry-validation tools the pre-push governance gate
# builds.
#
# See https://github.com/aldanor/hdf5-rust for upstream activity and
# https://github.com/metno/hdf5-rust for the fork.
hdf5 = { package = "hdf5-metno", version = "0.14" }

# NetCDF support (pure Rust, no C dependencies)
# netcdf3: read/write NetCDF-3 classic format (BOUT++ grid files, legacy datasets)
# netcdf-reader: unified read-only for both NC3 classic and NC4/HDF5 (BOUT++ output)
netcdf-reader = "0.2"
netcdf3 = "0.6"

# Zarr v2/v3 multidimensional array storage (pure Rust)
# Used for FAIR-MAST tokamak data (S3 bucket, blosc/lz4 compressed)
zarrs = { version = "0.23", features = ["blosc", "ndarray"] }
zarrs_filesystem = "0.3"

# Visualization
pgfplots = "0.5.1" # PGFPlots (LaTeX-quality figures)
plotters = "0.3"

# LaTeX generation
chrono = { version = "0.4", features = ["serde"] }
hifitime = "4.2.6"

# Logging and Config
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-tracy = "0.11.4"

# Python bindings
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }

# Testing
approx = "0.5"
argmin = "0.11.0"
argmin-math = { version = "0.5.1", default-features = false, features = ["vec"] }
# Upgraded from 0.5 to 0.8 (2026-03-20, T-042). API surface unchanged:
# criterion_group!, criterion_main!, Criterion, BenchmarkId, black_box.
criterion = { version = "0.8.2", features = ["html_reports"] }
iai-callgrind = "0.16.1"
nalgebra-sparse = "0.11.0"
polars = { version = "0.53.0", default-features = false, features = ["csv", "fmt", "temporal", "dtype-slim"] }
proptest = "1.11"
tempfile = "3.27"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
warnings = "deny"

# cargo-semver-checks: API SemVer compliance gate.
# Run: `make rust-semver-check`
# WHY: All library crates must maintain backward-compatible public APIs within
# the same major version. Breaking changes require a version bump.
# WHAT: Only core library crates are checked. CLI/binary crates are excluded
# via --exclude flags in the Makefile target (no public API surface).
# HOW: `cargo semver-checks check-release` compares public API against
# the last published version (or baseline rev).

# Lint severities for cargo-semver-checks (read by the tool since v0.35+).
# Package-level opt-in: add `[package.metadata.cargo-semver-checks.lints]`
# with `workspace = true` to inherit these defaults.
[workspace.metadata.cargo-semver-checks.lints]
# Deny: hard errors on removed/changed public items.
struct_missing = "deny"
enum_missing = "deny"
function_missing = "deny"
trait_missing = "deny"
# Warn: flag but don't fail CI on additive changes that technically break semver.
function_must_use_added = "warn"
inherent_method_must_use_added = "warn"
struct_must_use_added = "warn"
enum_must_use_added = "warn"
trait_must_use_added = "warn"
# Warn: new trait methods with defaults are minor but worth flagging.
trait_method_added = "warn"

# Development: balanced iteration on stable LLVM. Use
# 'cargo build --profile parity' for release-level numerical parity.
# CGU=16 saturates the 12-thread CPU (Ryzen 5 5600X3D) without thrashing.
# 256 CGUs caused OS-level thread thrashing with multiple crates compiling in parallel.
[profile.dev]
opt-level = 2
debug = 1 # line tables only: file+line for stack traces, flamegraph, perf
strip = "none"
lto = "off"
codegen-units = 16 # saturates 12-thread CPU; 256 causes thrashing
incremental = false # user-local Cargo config (~/.cargo/config.toml) may also enforce this
overflow-checks = true
debug-assertions = true
panic = "unwind"

# Test: faster compile than release; opt-level 1 still inlines generics.
# For numerically-sensitive tests: cargo test --profile parity
[profile.test]
opt-level = 1
lto = "off"
codegen-units = 16 # keep parallel without thrashing under multi-crate builds
incremental = false # user-local Cargo config (~/.cargo/config.toml) may also enforce this
overflow-checks = true
debug = 1 # line tables only (~60% smaller .o than full DWARF)
split-debuginfo = "unpacked" # per-object .dwo files; mold links without re-reading all DWARF

# Heavy math tests: higher opt + fewer CGUs for eigensolvers,
# associator computations, and O(dim^4) ZD graph construction.
# Use: cargo nextest run --cargo-profile test-heavy --profile heavy -p algebra_analysis
[profile.test-heavy]
inherits = "test"
opt-level = 2
codegen-units = 4

# Release: maximum optimization, no debug data, stripped for distribution.
# Use for final binaries, benchmarks against baselines, and published artifacts.
[profile.release]
opt-level = 3
debug = false # no debug info in production binaries
strip = "symbols" # remove symbol table for smaller binary
# Thin, not fat. Fat LTO cannot link any binary that reaches
# private_gemm_x86::F64_SIMD512x4, the AVX-512 path faer 0.24 takes for f64
# matmul and SVD (faer pulls private-gemm-x86 0.1.20 in through its `std`
# feature). The link fails on symbols such as
# gemm_v0_gemm_microkernel_f64_simd512_m48_n4 with "relocation refers to a
# symbol in a discarded section", where the symbol is both defined and
# referenced in the same object.
#
# That crate's build script generates an asm.s of AVX-512 microkernels which
# src/lib.rs admits with `core::arch::global_asm!{ include_str!(...) }`. The
# generated assembly declares the microkernels with plain `.globl` and carries
# no COMDAT directives of its own, so the section grouping and the discard are
# introduced downstream by fat-LTO codegen rather than by the crate.
#
# Isolated by elimination, each measured against spectral-flow: mold 2.42
# segfaults, lld 22.1 reports the same defect cleanly and fails,
# -Wl,--no-gc-sections does not help, -C codegen-units=16 does not help, and
# thin LTO links in 6 s. So the trigger is the LTO mode alone, not the linker,
# section GC, or the codegen-unit count.
#
# Cost is only partly measured. The `zd-algebra search` lane, which does not
# reach the gemm path, grows 784432 -> 846248 bytes (+7.9%); profile-wide size
# and runtime impact are not measured. A gemm-reaching binary cannot be compared
# at all, since no fat-LTO baseline exists for one.
#
# `[profile.bench]` and `[profile.parity]` follow this setting. Restoring
# `lto = "fat"` once private-gemm-x86 or rustc stops producing the discarded
# section means restoring it in all three.
lto = "thin" # cross-crate LTO, per-module (see the note above)
codegen-units = 1 # single codegen unit = maximum LLVM optimization
overflow-checks = true # keep arithmetic behavior aligned with dev/test lanes
panic = "unwind" # required: quantum_core/src/gpu/peps.rs:204 uses catch_unwind

# Validation: optimized diagnostic build for registry and tooling binaries.
# Why not full release: fat LTO + 1 codegen-unit takes 2-9 minutes for binaries
# that spend 90% of runtime in TOML deserialization. Thin LTO + 6 codegen-units
# compiles in ~15s and runs within 10% of fat-LTO speed for I/O-bound workloads.
[profile.validation]
inherits = "release"
lto = "thin" # 10x faster link vs fat LTO; <5% runtime difference for TOML parsing
codegen-units = 6 # parallel codegen; matches physical core count
debug = "line-tables-only" # perf/flamegraph profiling without full DWARF
strip = "none" # keep symbols for perf report
overflow-checks = true

# Per-package codegen-units=1 override for gororoba_cli in validation.
# Why: thin-LTO + codegen-units=6 creates dangling references to gemm/pulp
# SIMD trampolines (gemm_microkernel_c64_simd256_*, libpulp_v0_22_2_st_b32s_*)
# in the `thesis 42-support` lane. The bug reproduces with both rust-lld
# and gnu gold; root cause is multi-cgu LTO discarding "duplicate" symbols
# while still keeping references in the survivor cgu. cgu=1 forces a single
# cgu so LTO has nothing to discard. Other workspace crates remain at cgu=6.
[profile.validation.package.gororoba_cli]
codegen-units = 1

# The discarded-section link failure that commit 5fad8ff1 recorded against
# nonlocal-algebraic-metamaterial, and left deferred to an upstream fix behind
# a `--profile validation` workaround, is the same defect described at
# `[profile.release]` above. Moving release off fat LTO resolves it: that
# binary and the other 260 in gororoba_cli_physics link and run under the
# release profile, so the workaround is retired.
#
# Two approaches from that investigation stay closed and are worth not
# re-attempting. A per-package `lto` override is rejected outright by cargo
# ("lto may not be specified in a package profile"), so no single crate can opt
# out of the workspace LTO mode. Changing the linker does not help either,
# because the discarded relocations are produced during LTO object generation
# rather than at link time; gold, lld and mold each fail on the same input.

# Bench: release-level optimization for baseline parity.
[profile.bench]
opt-level = 3
debug = "line-tables-only" # minimal debug info for flamegraph profiling
# Tracks `[profile.release]`. A benchmark measures production code paths, so it
# has to use the LTO mode production uses; fat here would both measure code
# that never ships and fail to link any gemm-reaching binary.
lto = "thin"
codegen-units = 1 # single codegen for consistent benchmark results

# Parity: bit-exact numerical match with release for validation.
# Use: cargo build --profile=parity -p <crate>
# Use: cargo test --profile=parity -p <crate>
[profile.parity]
inherits = "dev"
opt-level = 3 # opt-level 3 for release parity
# Tracks `[profile.release]`, because this profile exists to reproduce what
# release builds and fat cannot link the gemm path at all. Whether fat and thin
# would have differed numerically here is untested.
lto = "thin"
codegen-units = 1 # single codegen unit for deterministic output
incremental = false # do not pollute cache with LTO artifacts
