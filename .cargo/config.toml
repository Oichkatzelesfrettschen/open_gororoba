# Workspace-level Cargo configuration
# Optimized for AMD Ryzen 5 5600X3D (Zen 3 + 3D V-Cache, AVX2, no AVX-512)

[build]
# Build parallelism and optional compiler caching are controlled by the gate
# environment so local shells and CI can share one worker-budget policy.
# Keep ambient Cargo tooling (for example rust-mcp-server background checks)
# off the gate runner's dedicated target dir. Gate commands override this via
# CARGO_TARGET_DIR=.cache/gate-target so they still land in the isolated gate tree.
target-dir = ".cache/cargo-default-target"
# Cargo splits final artifacts (target-dir) from heavy build intermediates
# (build-dir). We redirect intermediates to /srv/fast/tmp so that
# `make cache-sweep` only needs to manage the much smaller final-artifact tree.
# NOTE: /tmp is a tmpfs (RAM-backed) on this machine -- never put build
# artifacts there. /srv/fast is an nvme partition with room to spare.
# `{workspace-path-hash}` prevents collisions between multiple repo clones.
build-dir = "/srv/fast/tmp/open_gororoba-cargo-build/ambient/{workspace-path-hash}"
# Belt-and-suspenders: the [env] section below sets CARGO_INCREMENTAL=0 which
# wins over any profile-level `incremental = true` in Cargo.toml. This field
# keeps the *config-level* default consistent even without the env override.
incremental = false

[env]
# Disable incremental compilation globally. This wins over profile-level
# `incremental = true` in Cargo.toml (env var has highest precedence). Without
# this, dev and test profiles re-enable incremental, which was the primary
# cause of the target-dir ballooning to 1.7 TB in March 2026.
CARGO_INCREMENTAL = "0"

[cache]
# auto-clean-frequency controls Cargo's built-in GC of CARGO_HOME (downloaded
# crate sources, registry indexes, git checkouts). It does NOT clean build
# artifact target dirs -- use `make cache-sweep` for those.
auto-clean-frequency = "1 day"

[unstable]
# Enables `cargo clean gc` and automatic GC of CARGO_HOME during normal builds.
# Tracks access timestamps on downloaded sources and evicts stale entries.
# Only affects CARGO_HOME caches; build artifact dirs need `make cache-sweep`.
gc = true

[target.'cfg(target_arch = "x86_64")']
# Enable native CPU instruction set (AVX2, BMI2, FMA, POPCNT, etc.)
# This gives ~15-30% speedup on compute-heavy algebra tests.
# Use mold linker for faster link phase on full rebuilds.
rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-fuse-ld=mold", "-Dwarnings"]
linker = "clang"

[profile.dev]
split-debuginfo = "unpacked"

# --- PGO (Profile-Guided Optimization) workflow ---
# PGO requires a two-pass build; it cannot be a static profile setting.
#
# Step 1: Instrument -- build with profile generation enabled:
#   CARGO_PROFILE_RELEASE_LTO=false \
#   RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" \
#     cargo build --release --workspace -j$(nproc)
#
# Step 2: Collect -- run representative workloads to generate .profraw files:
#   cargo run --release --bin ultrametric_gpu_sweep -- ...
#   cargo run --release --bin export_hdf5 -- ...
#   (run any other performance-critical binaries)
#
# Step 3: Merge -- combine raw profiles into a single .profdata:
#   llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data/
#
# Step 4: Optimize -- rebuild using the merged profile:
#   RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata" \
#     cargo build --release --workspace -j$(nproc)
#
# Step 5 (optional): Post-link with BOLT for further ~5-10% speedup:
#   llvm-bolt target/release/binary -o target/release/binary.bolt \
#     -data=perf.fdata -reorder-blocks=ext-tsp -reorder-functions=hfsort
