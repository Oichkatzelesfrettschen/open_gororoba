# open_gororoba cargo configuration.
#
# Linker selection:
#   Use clang + mold for x86_64-linux. mold is single-threaded but
#   ~3-5x faster than the default GNU ld for typical Rust binaries.
#   The project's pre-push gate compiles 441 integration test
#   binaries; each links the workspace dep graph. Mold compresses the
#   ~4m30s link phase to ~1m.
#
#   Requires: clang, mold (both in Arch repos). Verify:
#     command -v clang && command -v mold
#
#   To override on a per-shell basis, set:
#     CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=
#     CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=
#   to empty strings before invoking cargo.
#
# Net config:
#   sparse registry protocol (faster index updates) and git CLI for
#   fetches (handles proxy / auth more robustly than the default).

[build]
# Tier-8 (2026-05-12): single target dir for both CLI cargo and gate
# cargo. Before this, `target/` (CLI default), `.cache/gate-target/`
# (gate via CARGO_TARGET_DIR env), `.cache/cargo-default-target/`
# (legacy), and `.cache/cargo/` (legacy) each held independent
# incremental caches. Cross-invocation cold-cache cost was paid every
# time someone ran `cargo X` without prefixing CARGO_TARGET_DIR.
# Pointing the default at .cache/gate-target/ means CLI cargo and
# gate cargo share artifacts (gate still sets CARGO_TARGET_DIR
# explicitly for isolation under parallel invocations). Saves ~36 GB
# of duplicate working set and restores cache locality.
target-dir = ".cache/gate-target"

# sccache (re-enabled 2026-05-12): cache compiled crate artifacts
# across sessions. Originally enabled sprint-62 (commit 3c3cb85f),
# removed in c4a779e5 for "gate-controlled caching" -- but the
# removal leaves a measurable win on the table for cold-cache rebuilds
# after make cache-sweep or branch switches. sccache wraps rustc;
# mold wraps the linker (set below); they are orthogonal.
#
# CACHING POLICY: sccache caches across SESSIONS. Within a session,
# cargo incremental compilation is faster (sccache passes through with
# ~5ms overhead). The win materializes when:
#   - First build after `make cache-sweep`
#   - Switching branches that have different artifact graphs
#   - CI runs without persistent target/ dir (gate-ci-rust uses
#     CARGO_ENV_CI = CARGO_INCREMENTAL=0; sccache + non-incremental
#     gives full cross-session cache hits)
#
# Verify cache state: sccache --show-stats
# Disable per-shell: RUSTC_WRAPPER= cargo ...
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"
