[report]
title = "Jacobi quantized_shell_permutation n=72 double-double plane-rotation optimization"
date = "2026-03-12"
status = "implemented"
status_token = "IMPLEMENTED"
summary = "The next DD optimization slice targeted the plane-rotation/update hotspot after the pivot comparator win. A row-contiguous matrix-access experiment regressed badly and was rejected. The retained optimization is arithmetic-focused: dd_apply_plane_rotation now uses dd_mul_add_pair so the rotation update does fewer separate DD mul/add renormalizations."

[artifacts]
profile = "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_noinline_fused_opt_dev.json.gz"
sidecar = "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_noinline_fused_opt_dev.json.syms.json"
compare_csv = "reports/benchmarks/jacobi_backend_samply_compare_dd_noinline_fused_opt.csv"
compare_markdown = "reports/benchmarks/jacobi_backend_samply_compare_dd_noinline_fused_opt.md"

[validated_command]
name = "jacobi_shell_samply_dd_dev_noinline_fused_opt"
status = "passed"
command = "orig=$(cat /proc/sys/kernel/perf_event_paranoid); sudo -A sh -c 'echo 1 > /proc/sys/kernel/perf_event_paranoid'; make jacobi-backend-samply PROFILE=dev FEATURES=profile-dd-hotspots PRESYMBOLICATE=1 FAMILIES=quantized_shell_permutation BACKENDS=double_double SIZES=72 REPEATS=20 OUT=reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_noinline_fused_opt_dev.json.gz TITLE='Jacobi quantized_shell_permutation n=72 double_double samply dev noinline fused-opt'; rc=$?; sudo -A sh -c \"echo $orig > /proc/sys/kernel/perf_event_paranoid\"; exit $rc"
notes = "Reuses the profiling-only DD feature lane and captures the post-optimization helper mix."

