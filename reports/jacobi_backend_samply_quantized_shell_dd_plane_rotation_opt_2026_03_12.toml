[rejected_experiment]
summary = "Two follow-up experiments were measured and discarded. A row-contiguous plane-rotation access experiment pushed the same profiled lane to about 79.267 ms, and a conservative dd_rotation small-angle branch pushed it to about 49.312 ms. The repo should not revisit either path without stronger evidence."
