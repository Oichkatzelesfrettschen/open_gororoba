[takeaway]
summary = "The multicore x87 perf smoke is useful as coverage, not as a dispatch oracle. The aggregate counter set completed cleanly and the summary artifact still shows the same semantic split between exact FP80 and throughput-oriented lanes, but the elapsed-time variance is high because one perf invocation spans multiple worker counts, workloads, and strategies. This supports keeping multicore x87 decisions artifact-driven and workload-specific rather than introducing a single size threshold."

