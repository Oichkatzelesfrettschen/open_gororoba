4 | [monograph]
  | ^^^^^^^^^^^
missing field `title`

ERROR: typed schema drift (policy=error): registry/data_artifact_narratives.toml failed typed validation (data_core::registry::ArtifactRegistry): TOML parse error at line 1, column 1
  |
1 | # Data artifact narratives registry (TOML-first).
  | ^
missing field `artifacts`
'''

[changes]
summary = "Updated typed registry deserialization in data_core to accept canonical wrappers and legacy shapes for monograph and data artifact narratives."
items = [
  "MonographRegistry: accept canonical [[document]] wrapper (alias on volumes), while preserving legacy volume wrappers.",
  "MonographMeta/Volume: allow canonical fields (updated/authoritative/document_count/path/body_markdown) and legacy fields together via serde defaults/aliases.",
  "ArtifactRegistry: accept canonical [data_artifact_narratives] header and [[document]] entries while preserving legacy [artifacts]/[[artifact]] support.",
  "ArtifactsMeta/ArtifactEntry: include canonical narrative fields with defaults while keeping legacy fields available.",
]

[validation.cargo_check]
command = "cargo check -p data_core -p gororoba_cli --bin registry-check"
exit_code = 0
stdout_stderr_snippet = '''
