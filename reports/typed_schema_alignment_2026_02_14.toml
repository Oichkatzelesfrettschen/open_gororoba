report_date = "2026-02-14"
scope = [
  "crates/data_core/src/registry.rs",
  "crates/gororoba_cli/src/bin/registry_check.rs",
  "reports/typed_schema_alignment_2026_02_14.toml",
]

authoring_goal = "Eliminate typed-schema drift for registry/monograph.toml and registry/data_artifact_narratives.toml in registry-check strict mode while keeping non-typed checks unchanged."

[before]
command = "cargo run -q -p gororoba_cli --bin registry-check -- --typed-policy error"
exit_code = 1
stdout_stderr_snippet = '''
Registry TOML parse sweep: 1306 files parsed
ERROR: typed schema drift (policy=error): registry/monograph.toml failed typed validation (data_core::registry::MonographRegistry): TOML parse error at line 4, column 1
