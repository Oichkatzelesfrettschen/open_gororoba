[[residual_risk]]
id = "RISK-001"
severity = "low"
area = "alias-deprecation-tail"
description = "Legacy aliases remain enabled until at least the earliest removal date (2026-08-14) to protect downstream operator scripts."
impact = "Functional behavior is stable, but delayed migration by consumers can postpone cleanup."
owner = "legacy alias lane owners"
mitigation = "Track alias usage through the 2026-05-15 review window and keep canonical targets prominent in CI/help output."

[[residual_risk]]
id = "RISK-002"
severity = "low"
area = "early-removal-regression"
description = "Removing aliases before confirming no CI/runbook/operator dependency would risk breaking established invocations."
impact = "Premature alias removal could create avoidable operational failures."
owner = "control-plane maintainers"
mitigation = "Enforce removal criteria checks and block any removal PR before the review date and usage audit."

[[residual_risk]]
id = "RISK-003"
severity = "low"
area = "historical-residue"
description = "Wave-labeled historical plans and archives remain intentionally phase-tagged for provenance and chronology."
impact = "Residue counts will remain non-zero even with canonical operational naming."
owner = "control-plane archival maintainers"
mitigation = "If required, add canonical mirror docs while preserving immutable historical originals."

