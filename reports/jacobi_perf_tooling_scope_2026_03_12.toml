[jacobi_samply_takeaway]
summary = "The deeper-attribution lane now works across all three current Jacobi backends through samply on the dev profile with presymbolication, and the new Rust-native compare step turns those raw captures into one line-level backend-core/shared/dependency/runtime view. The key reconciliation was frame selection: some DD inline stacks listed generic core iterator frames before the repo-local dd_jacobi frame, so a naive first-frame summary understated the DD backend. The compare artifact fixes that. The x87 path resolves through algebra_analysis::x87_jacobi, algebra_analysis::jacobi_shared, and cd_kernel::x87_jacobi_kernels plus Ext80 helpers. The plain DD dev artifact resolves dd_jacobi ownership cleanly, and the profiling-only FEATURES=profile-dd-hotspots build now breaks the DD lane down further into dd_find_pivot, dd_apply_plane_rotation, two_sum, two_product, DD add/mul/div/sqrt/abs, dd_rotation, and dd_diagonal_update. After the direct hi/lo pivot-comparator optimization, the profiled quantized_shell_permutation n=72 run dropped from about 98.48 ms to about 46.59 ms while keeping the same reported max_abs_err. The next helper-specialization step then added dd_mul_add_pair to the plane-rotation path and brought the same profiled lane down again to about 45.18 ms. In that newer capture, dd_apply_plane_rotation falls to about 32.42 percent inclusive samples, two_sum falls to about 14.90 percent, dd_mul_add_pair becomes a visible 19.91 percent helper, and the next DD runtime target shifts to dd_rotation plus its sqrt/div costs. The reference path resolves the shared scaffold, reference_jacobi, nalgebra dependency rows, and the expected libc/libm atan2 and sincos frames."
artifacts = [
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_x87_dev.json.gz",
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_x87_dev.json.syms.json",
  "reports/jacobi_backend_samply_quantized_shell_2026_03_12.toml",
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_dev.json.gz",
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_dev.json.syms.json",
  "reports/jacobi_backend_samply_quantized_shell_dd_2026_03_12.toml",
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_noinline_dev.json.gz",
  "reports/benchmarks/jacobi_backend_samply_quantized_shell_72_dd_noinline_dev.json.syms.json",
  "reports/jacobi_backend_samply_quantized_shell_dd_noinline_2026_03_12.toml",
