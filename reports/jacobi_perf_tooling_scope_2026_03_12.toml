[report]
title = "Jacobi precision performance tooling scope"
date = "2026-03-12"
status = "implemented"
status_token = "IMPLEMENTED"
summary = "The local host already has the main CPU-edge measurement tools needed for the current algebra precision lane: perf, hyperfine, flamegraph, cargo-flamegraph, cargo-llvm-cov, llvm-cov, llvm-profdata, samply, valgrind, and cargo-fuzz. The immediate gap is not missing tooling; it is turning those tools into reproducible repo-native entry points and separating production policy from research evidence. That work now includes a refined offline Jacobi threshold table backed by six-family boundary artifacts."

[host]
hostname = "x570-5600X3D"
cpu = "AMD Ryzen 5 5600X3D 6-Core Processor"

[tooling]
present = [
  "perf",
  "hyperfine",
  "flamegraph",
  "cargo-flamegraph",
  "cargo-llvm-cov",
  "llvm-cov",
  "llvm-profdata",
  "samply",
  "valgrind",
  "cargo-fuzz",
]
optional_missing = [
  "rustfilt",
]

[repo_entrypoints]
make_targets = [
  "x87-strategy-bench",
  "x87-strategy-perf",
  "x87-strategy-hyperfine",
  "x87-strategy-flamegraph",
  "x87-givens-microbench",
  "x87-givens-microbench-perf",
  "jacobi-backend-sweep",
  "block-jacobi-backend-sweep",
  "partial-spectrum-bench",
  "structured-spectrum-bench",
  "jacobi-backend-samply-compare",
]
benchmark_binary = "crates/gororoba_cli_algebra/src/bin/x87_strategy_bench.rs"
jacobi_binary = "crates/gororoba_cli_algebra/src/bin/jacobi_backend_sweep.rs"

