[scoping]
current_goal = "Use deterministic policy for production dispatch, with the first offline threshold table seeded from Jacobi sweep artifacts, and use perf/hyperfine/flamegraph as the evidence lane for future refinements."
next_measurements = [
  "The focused perf pass on quantized_shell_permutation now says the 64 cutoff should stay put; the next refinement should be call-stack attribution, not threshold churn.",
  "Use the new samply lane for x87 when internal hotspot decomposition matters; it resolves the Jacobi/x87 stack where the release-style flamegraph does not.",
  "Use jacobi-backend-samply-compare before escalating to a less inlined build; it already resolves backend-core ownership at line level across reference_f64, x87, and DD.",
  "The profiling-only FEATURES=profile-dd-hotspots DD build now gives helper-level DD attribution, and the first plane-rotation helper specialization via dd_mul_add_pair improved the profiled quantized_shell_permutation n=72 median from about 46.59 ms to about 45.18 ms.",
  "If we pursue DD runtime work next, start with dd_rotation and its sqrt/div costs before opening a separate DD microbench lane.",
  "Do not add a mirrored low-inlining reference_f64 lane yet; the current reference samply artifacts already resolve backend/scaffold/libm ownership clearly enough, while DD was the backend that needed extra decomposition.",
  "Do not add a mirrored low-inlining x87 lane yet; the current x87 samply artifacts already resolve the composed kernel stack well enough, and the new x87-givens-microbench plus x87-givens-microbench-perf lanes are enough to say the transcendental half-angle path, not the diagonal update, remains the x87 optimization target.",
  "Do not change the global cutoff at 64 from DD profiling evidence alone; the new DD work improves backend understanding and profiled runtime, but it does not change the current cross-family speed evidence that set the threshold.",
  "The compare CSV/Markdown outputs are enough machine-readable hotspot surface for now; no extra hotspot artifact format is justified until a downstream consumer needs something beyond the existing CSV rows.",
  "Record perf-stat rows for 1/2/4/6 worker sweeps at realistic sizes before introducing any size-based dispatch threshold.",
  "Only add new tools if a concrete measurement gap remains after using perf, hyperfine, flamegraph, and samply.",
]

[jacobi_smoke_takeaway]
summary = "The first solver-shaped smoke sweep on 4/8/16 matrices shows that the typed default policy remains conservative rather than speed-optimal: the plain reference f64 lane is still the fastest on these small deterministic families, while x87 slightly improves absolute error over double-double on the clustered-pairs family at n = 8 and n = 16."
artifacts = [
  "reports/benchmarks/jacobi_backend_sweep_smoke.csv",
  "reports/benchmarks/jacobi_backend_sweep_smoke.md",
]

[jacobi_threshold_seed_takeaway]
summary = "The first seed sweep was too conservative. After extending the boundary work to six spectral families, then adding one entrywise zero-diagonal quantized obstruction family, and finally repairing the double-double Jacobi rotation path, order 64 still remains the largest measured size where reference_f64 stays fastest across every tested family and backend. The backend repair improved DD correctness but did not move the cutoff, so the current offline obstruction-spectrum threshold table still keeps orders <= 64 on the reference lane and escalates larger sizes to x87 or DD."
artifacts = [
  "reports/benchmarks/jacobi_backend_boundary_24_40.csv",
  "reports/benchmarks/jacobi_backend_boundary_24_40.md",
