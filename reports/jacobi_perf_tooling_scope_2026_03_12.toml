[x87_multicore_takeaway]
summary = "The focused 1/2/4/6-worker sweep on the pinned multicore x87 lane confirms the earlier semantic split. x87_per_chunk remains exact on the hard dot workloads and exact at 1 worker for the cancellation sum, but the cancellation sum still drifts once chunk order changes, and the 6-worker x87 rows are visibly unstable on sum_positive and dot_random. The hybrid and AVX2 lanes remain the throughput leaders for the easy workloads. A follow-up perf smoke over the full worker sweep completed cleanly, but its elapsed variance is high enough that it should be treated as system-level coverage rather than as a per-worker tuning oracle."
artifacts = [
  "reports/benchmarks/x87_strategy_multicore_65536.csv",
  "reports/benchmarks/x87_strategy_multicore_65536.md",
  "reports/benchmarks/x87_strategy_perf_multicore_65536.csv",
  "reports/benchmarks/x87_strategy_perf_multicore_65536.md",
]

[x87_givens_microbench_takeaway]
summary = "The new x87 Givens microbench lane says the actual composed transcendental path is materially more expensive than the diagonal-update micro-kernel. In the first smoke run, the composed x87 Givens/transcendental helpers landed around 102-126 ns/call depending on case, while x87_givens_diagonal_update landed around 6-8 ns/call. The focused perf-stat follow-up on the obstruction_like case then showed x87_atan2_sincos at about 101.751 ns/call, givens_sincos_ext80 at about 103.854 ns/call, and x87_givens_diagonal_update at about 5.831 ns/call, with about 871901553 cycles and 170270428 instructions for the selected-kernel bundle. This replaces the older benchmark prose that talked about one monolithic chain, and it says the current x87 optimization target remains the transcendental half-angle path rather than the diagonal update."
artifacts = [
  "reports/benchmarks/x87_givens_microbench_smoke.csv",
  "reports/benchmarks/x87_givens_microbench_smoke.md",
  "reports/x87_givens_microbench_2026_03_12.toml",
  "reports/benchmarks/x87_givens_microbench_perf_smoke.csv",
  "reports/benchmarks/x87_givens_microbench_perf_smoke.md",
  "reports/benchmarks/x87_givens_microbench_perf_smoke.stat",
  "reports/x87_givens_microbench_perf_2026_03_12.toml",
]

