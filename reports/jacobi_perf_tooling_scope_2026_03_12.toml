[jacobi_threshold_caveat]
summary = "Two caveats still matter. First, most of the obstruction-like sweep families are still spectral proxies realized through a dense Householder construction; only quantized_obstruction_graph and quantized_shell_permutation are entrywise-structured. Second, the DD lane is no longer catastrophically wrong on the obstruction-like families after the stable-rotation fix, but it still trails the reference lane on time in the current boundary region. The focused backend-isolated perf pass on quantized_shell_permutation did not confirm an x87 speed win at 68 or 72, so the current evidence supports keeping the global cutoff at 64."

[jacobi_flamegraph_takeaway]
