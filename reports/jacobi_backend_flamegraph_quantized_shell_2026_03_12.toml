[limitation]
summary = "Even with release debuginfo enabled for the flamegraph target, the x87 and double_double SVGs did not resolve internal helper stacks. The next attribution step, if deeper decomposition is required, should use a frame-pointer-focused build or a different profiler such as samply rather than treating the current monolithic SVGs as complete explanations."
