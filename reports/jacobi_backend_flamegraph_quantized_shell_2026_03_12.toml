[takeaway]
summary = "The flamegraph pass supports the policy conclusion but only partially answers the attribution question. The reference_f64 flamegraph exposes a visible libm atan2 hotspot, while the x87 and double_double flamegraphs remain almost completely collapsed into the jacobi-backend-sweep wrapper even after enabling release debuginfo. That means the current flamegraph lane is good enough to show that the reference path pays a transcendental-library cost, but not yet good enough to decompose the internal x87 or DD hotspots."

