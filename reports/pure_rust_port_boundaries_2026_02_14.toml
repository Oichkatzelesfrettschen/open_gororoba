  "crates/lbm_core/src/lib.rs::test_mass_conservation",
  "crates/lbm_core/src/lib.rs::test_poiseuille_accuracy",
  "crates/lbm_core/src/lib.rs::test_collide_with_associator_keeps_mass_finite",
]
acceptance_commands = [
  "cargo test -p lbm_core test_mass_conservation",
