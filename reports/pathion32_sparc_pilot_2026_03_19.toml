[comparison]
rms_equal = true
d32_minus_d16_snr = 1.47
d32_to_d16_alpha_ratio = 3.420403310542
dominant_difference = "The 32D stack gains significance almost entirely through the extra very-low-k mode near 0.4189, not through a broad elevation across all predicted modes."

[interpretation]
status = "interesting_but_not_yet_falsification_grade"
verdict = "The 32D Pathion lane outperforms the 16D sedenion control on this SPARC cut, but the gain is dominated by a single lowest-frequency mode and therefore is not yet specific evidence for a Pathion harmonic structure."
epistemic_note = "This is competition evidence, not confirmation. A single low-k excess can arise from residual large-scale NFW or baryonic profile mismatch."

[next_steps]
step_1 = "Run a phase-shuffle or sign-shuffle null on the same 148-galaxy stack so the D=32 SNR is compared to an internal null rather than only to the rough threshold heuristic."
step_2 = "Recompute the D=32 score with the first mode removed or downweighted; if the apparent advantage collapses, the signal is likely generic low-frequency mismatch rather than Pathion structure."
step_3 = "Compare the same 148-galaxy cut against DC14 or other baryonic-feedback baselines before attributing the low-k excess to any algebraic forcing."
step_4 = "Map the 32D halo toy delta-v profile against individual SPARC residuals rather than only stacked Fourier power."
