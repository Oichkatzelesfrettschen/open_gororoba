[report]
id = "RPT-C010-MDCTRL-2026-03-12"
title = "C-010 Non-Local Metamaterial Synthesis and Markdown Control-Plane Consolidation"
date = "2026-03-12"
status = "active"
authoring_mode = "repo_manual_structured"
scope = "Non-local algebraic metamaterial lane, repo control-plane migration, remaining markdown lacunae, and falsifiable next-phase theses."

[executive_summary]
resolved = [
  "The provenance/control-plane seam is now Rust-first for artifact-source, source-infrastructure, recovery-plan, doctor, and Pantheon SQLite seeding.",
  "The markdown owner-map, inventory TOML-first verifier, origin-audit builder, and payload-registry builder now have Rust-native command surfaces under gororoba_cli_data::markdown-registry.",
  "The workspace SQLite conflict was resolved by removing Burn default/train feature pull-through at the workspace boundary and unifying on rusqlite 0.38 + rusqlite_migration 2.4 for the provenance lane.",
  "The regenerated markdown payload registries no longer advertise the deleted provenance/markdown Python commands in the live repo surface.",
]
open_lacunae = [
  "The markdown origin audit still reports 19 manual markdown files that are mapped to canonical TOML destinations but have not yet been regenerated with AUTO-GENERATED and Source-of-truth headers.",
  "The markdown inventory, markdown corpus, TOML inventory, and embedded-markdown builder/verifier lanes still retain live Python implementations.",
  "The C-010 non-local design lane is source-backed and implemented at the design/benchmark level, but it is not yet elevated into a fully citation-saturated monograph-grade theory document or fabrication dossier.",
]

[dependency_resolution]
problem = "libsqlite3-sys link conflict between provenance_store and the workspace Burn stack."
root_cause = "The workspace Burn dependency enabled default/train behavior that pulled burn-dataset, r2d2_sqlite, serde_rusqlite, and rusqlite 0.32.1 into the graph."
resolution = [
  "Set workspace Burn to default-features = false and features = ['std', 'autodiff'].",
  "Upgrade the provenance SQLite lane to rusqlite 0.38 and rusqlite_migration 2.4.",
  "Re-check the workspace until cargo tree -i libsqlite3-sys shows a single lineage under provenance_store.",
]
result = "Single SQLite ABI lineage under provenance_store verified."

