[[claim]]
id = "TH-C010-001"
title = "Assessor-topology thesis"
statement = "The relevant algebraic target for C-010 is the 42-assessor graph partitioned into seven disconnected K6 cliques."
current_support = [
  "de Marrais box-kite partition of the 42 assessors.",
  "Repo-local assessor and box-kite machinery in algebra_analysis.",
]
falsifiable_test = "Recompute the assessor adjacency from the algebra realization and verify exact seven-component K6 structure with zero inter-component edges."
required_repo_artifacts = [
  "crates/algebra_analysis/src/boxkites.rs",
  "crates/materials_core/src/nonlocal_metamaterial.rs",
]

[[claim]]
id = "TH-C010-002"
title = "Local-impossibility thesis"
statement = "A strictly local 3D nearest-neighbor metamaterial embedding cannot natively realize the disconnected 7 x K6 assessor topology without synthetic or active non-local coupling."
current_support = [
  "Closed local negative-result lane preserved in C-010 design history.",
  "Need for non-local or synthetic coupling explicitly encoded in replacement design doc.",
]
falsifiable_test = "Exhaustively test local graph-embedding families used by the benchmark gate and verify that none reproduce the exact assessor topology while meeting the gate thresholds."
required_repo_artifacts = [
  "docs/C010_NONLOCAL_ALGEBRAIC_METAMATERIALS.md",
  "crates/gororoba_cli_physics/src/bin/nonlocal_algebraic_metamaterial.rs",
]

[[claim]]
id = "TH-C010-003"
title = "Synthetic-coupling thesis"
statement = "The lifted m3 obstruction tensor can be projected into a masked assessor weight matrix and then realized by either an LC/topolectrical admittance network or a Floquet-effective synthetic permittivity/permeability tensor."
current_support = [
  "materials_core::nonlocal_metamaterial implements the lift, normalization, floor, and topology mask.",
  "The CLI exposes build-matrix, benchmark, and candidate-scan surfaces.",
]
falsifiable_test = "Compare the LC and Floquet reductions and verify that both preserve the exact masked topology and the same dominant coupling ordering."
required_repo_artifacts = [
  "crates/materials_core/src/nonlocal_metamaterial.rs",
  "crates/gororoba_cli_physics/src/bin/nonlocal_algebraic_metamaterial.rs",
]

[[claim]]
id = "TH-C010-004"
