# ---------------------------------------------------------------------------
# Unresolved Disagreements (3)
# ---------------------------------------------------------------------------

[[unresolved]]
id = "D1"
title = "Is the red-noise intrinsic or a leakage artifact?"
resolution_status = "resolved"
summary = "S2 (C-1429): leakage <0.01% of observed power at all modes. Red-noise is intrinsic baryonic floor. P1 and D3 both correct for different quantities (noise leakage vs signal recovery)."

[[unresolved]]
id = "D2"
title = "What population does the ZD bound describe?"
resolution_status = "partially_resolved"
summary = "S1 (C-1428): mean alpha_zd=2.32 vs median=0.27 (8.6x divergence). Paper must decide primary estimator. Decision deferred to paper revision round 2."

[[unresolved]]
id = "D3"
title = "Is the injection recovery failure fixable?"
resolution_status = "reframed"
summary = "SQ-1 invalidated harmonic-absorption root cause. True mechanism unknown but likely rms-denominator growth in SNR metric. S3 (decontaminated injection on trimmed stack) deferred."

