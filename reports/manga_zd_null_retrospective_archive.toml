# ---------------------------------------------------------------------------
# Lessons Learned (15)
# ---------------------------------------------------------------------------

[[lesson]]
id = "L01"
title = "Degenerate REFINE convergence is a fixed-point"
category = "convergence"
description = "Three REFINE iterations produced identical metrics (0.4704). Deterministic pipeline on synthetic null data has a fixed-point SNR determined by systematic model parameters."
action = "Detect fixed-point convergence (delta < epsilon) and stop early."
claim_refs = []
status = "resolved"

[[lesson]]
id = "L02"
title = "Injection recovery shows destructive interference"
category = "calibration"
description = "Per-seed SNR decreases with injection amplitude (anti-monotonic). Baryonic +5% bulge excess at x~0.5 interferes with exp(-x) injection envelope. Root cause reattributed after SQ-1."
action = "Decouple harmonic subtraction from spectral search; consider simultaneous baryonic+ZD fitting."
claim_refs = []
status = "open"

[[lesson]]
id = "L03"
title = "Metric aliasing: detection_snr = primary_metric"
category = "infrastructure"
description = "Both names report identical values for all 660 entries. Duplication exists because harness expects primary_metric while physics pipeline computes detection_snr."
action = "Remove primary_metric or alias explicitly in results.json schema."
claim_refs = []
status = "open"

[[lesson]]
id = "L04"
title = "Per-seed vs structured metric discrepancy (2.7x ratio)"
category = "methodology"
description = "Structured pipeline incorporates cross-seed aggregation that amplifies coherent structure. Ratio is ~1.0 for ablation conditions but 1.4-2.7x for physical-model conditions."
action = "Document both pipelines with distinct field names. Report per-seed SNR as primary (conservative)."
claim_refs = []
status = "open"

[[lesson]]
id = "L05"
title = "Radial coverage is the hard physical constraint"
category = "scientific"
description = "MaNGA IFU probes x=0.5-1.35 r/r_s. ZD predictions peak at x=3-5. No pipeline refinement overcomes a 4-7x radial gap."
action = "Frame paper as inner-halo bound; defer outer-halo campaign to SKA era."
claim_refs = ["C-1365"]
status = "resolved"

[[lesson]]
id = "L06"
title = "Cross-algebra quasi-degeneracy at MaNGA radii"
category = "scientific"
description = "Cross-algebra correlation rho>0.97 for all 6 pairs. At x=0.5-1.35, wavenumber families are quasi-degenerate: effectively one null measured through four lenses."
action = "Disclose N_eff=6-8 honestly. Reframe as insensitivity to algebraic model choice."
claim_refs = ["C-1372"]
status = "resolved"

[[lesson]]
id = "L07"
title = "Ablation coverage gap (5 of 10 classes)"
category = "methodology"
description = "Missing ablation classes: template choice, radial range, galaxy selection, stacking method, detection method. Present: injection, positive control, wavenumber specificity, mode count, noise model."
action = "Add NFW template ablation (Einasto/Burkert) and radial range sweep before submission."
claim_refs = []
status = "open"

[[lesson]]
id = "L08"
title = "Red-noise k^0.81 is reusable but inclination-dependent"
category = "scientific"
description = "Spectral index 0.81 is algebra-universal and subsample-invariant but face-on galaxies have gamma=-0.011 (flat). The 0.808 index applies only to inclination-mixed samples."
action = "Report gamma per inclination bin. Cross-validate before claiming universality."
claim_refs = ["C-1431"]
status = "open"

[[lesson]]
id = "L09"
title = "JSON string formatting failure mode"
category = "infrastructure"
description = "Prior run failed at code_generation stage when HEREDOC-style string with newlines and line-number prefixes was injected verbatim into JSON payload."
action = "Validate JSON payloads programmatically before submission (json.loads preflight)."
claim_refs = []
status = "resolved"

[[lesson]]
id = "L10"
title = "Subsample overlap violates independence"
category = "methodology"
description = "face_on (inc<45) and mass_Q3 (3rd quartile) overlap with full_sample and possibly each other. Independence assumption for multiple-comparisons correction is violated."
action = "State explicitly in paper. Report effective N, not raw N."
claim_refs = []
status = "resolved"

[[lesson]]
id = "L11"
title = "Outlier domination invalidates population-level claims"
category = "scientific"
description = "350 galaxies (5%) contribute 67% of stacked DFT power. Median DFT power is 0.12% of mean. Kurtosis ~284 (vs Gaussian 3). The population null is an outlier-population null."
action = "Report trimmed-mean and median alongside arithmetic mean. Characterize outlier subpopulation."
claim_refs = ["C-1427"]
status = "open"

[[lesson]]
id = "L12"
title = "Paper-code discrepancy is a P0 blocker"
category = "methodology"
description = "paper.md describes M=7 harmonic subtraction; models.py implements none. Invalidated the stated root cause of injection anti-monotonicity and SMART contribution #2."
action = "Add paper-code consistency gate to pre-submission checklist. Resolve SQ-1 before other work."
claim_refs = []
status = "open"

[[lesson]]
id = "L13"
title = "Red-noise spectral slope is an inclination artifact"
category = "scientific"
description = "Face-on (i<45) gamma=-0.011 vs full sample gamma=0.808. The universal red-noise claim in I-180 must be qualified as inclination-stratified."
action = "Report gamma separately for inclination bins. Cross-validate on face-on subsample."
claim_refs = ["C-1431"]
status = "open"

[[lesson]]
id = "L14"
title = "Extreme non-Gaussianity destroys sensitivity estimates"
category = "calibration"
description = "Per-galaxy Fourier power kurtosis ~284 (95x heavier tails than Gaussian). Any Gaussian-assumption sensitivity analysis underestimates variance by >100x. Bootstrap B=50 is unreliable."
action = "Use robust variance estimators (MAD, IQR). Increase bootstrap to B>=1000."
claim_refs = ["C-1421", "C-1438"]
status = "open"

[[lesson]]
id = "L15"
title = "Multi-perspective hypothesis testing finds blind spots"
category = "methodology"
description = "Innovator found kurtosis, pragmatist explained red-noise, contrarian found outlier domination. No single perspective would have found all three."
action = "Use multi-perspective hypothesis testing for high-stakes null results. Budget 1-2 days for synthesis."
claim_refs = []
status = "resolved"

