title = "Focused perf profile for quantized_shell_permutation Jacobi backend boundary"
date = "2026-03-12"
family = "quantized_shell_permutation"
sizes = [68, 72]
perf_events = ["cycles:u", "instructions:u", "branches:u", "branch-misses:u"]
perf_repetitions = 5
solver_repeats = 5

[takeaway]
summary = "The focused perf pass does not support a threshold change. On quantized_shell_permutation at orders 68 and 72, reference_f64 remains ahead of x87 on cycles and median wall time, while double_double remains the accuracy-first but much heavier lane. The earlier sweep-level hint that x87 might edge out reference_f64 on this family did not survive backend-isolated perf measurement."

[[measurement]]
size = 68
backend = "reference_f64"
median_ms = 13.434
max_abs_err = 1.000444e-11
cycles = 289019592
instructions = 1663865891
branches = 281250414
branch_misses = 1157199
ipc = 5.757
branch_miss_rate = 0.004115
command = "perf stat -x, -e cycles:u,instructions:u,branches:u,branch-misses:u -r 5 ./.cache/cargo-default-target/release/jacobi-backend-sweep --sizes 68 --repeats 5 --families quantized_shell_permutation --backends reference_f64 --output reports/benchmarks/jacobi_backend_perf_quantized_shell_68_reference.csv --summary reports/benchmarks/jacobi_backend_perf_quantized_shell_68_reference.md"

