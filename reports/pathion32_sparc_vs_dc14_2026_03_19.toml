scope_note = "Baseline comparison uses the same SPARC galaxy intersection and quality cuts for NFW-Flat and the requested competitor model. For DC14, the competitor is now a bounded per-galaxy coarse-to-fine grid refit over halo mass, concentration, and a single 3.6um stellar mass-to-light ratio constrained to Upsilon_* in [0.30, 0.80]. Model velocities include SPARC gas/disk/bulge contributions, and the report now adds galaxy-level sign-test nulls for the high-k residual-power deltas (k=2..4 and k>1) so the harmonic advantage is inferential rather than purely descriptive."
