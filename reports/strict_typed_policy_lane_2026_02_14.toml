# Strict typed-policy lane integration report.

[report]
id = "strict-typed-policy-lane-2026-02-14"
date = "2026-02-14"
status = "completed"
owner_scope = [
  "Makefile",
  ".github/workflows/ci.yml",
  "reports/strict_typed_policy_lane_2026_02_14.toml",
]

[decision.strict_target]
canonical_target = "registry-verify-typed-policy-error"
command = "cargo run --release --bin registry-check -- --typed-policy error"
naming_rationale = "Uses function-first canonical make naming (`registry-verify-*`) and encodes strict policy mode explicitly as `error`."

[decision.default_typed_policy]
selected = "warn"
changed_binary_behavior = false
decision_summary = "Default --typed-policy remains warn; strict enforcement is introduced as an explicit lane target and CI step."
rationale = [
  "Preserves existing registry-check default behavior and avoids unplanned binary contract changes.",
  "Canonical CI contract keeps governance-gate and registry-acceptance-gate as primary commands.",
  "Strict typed-policy enforcement is still guaranteed in CI via a dedicated supplemental command.",
]

[changes.makefile]
added_phony = ["registry-verify-typed-policy-error"]
added_target = "registry-verify-typed-policy-error"
added_target_command = "cargo run --release --bin registry-check -- --typed-policy error"
