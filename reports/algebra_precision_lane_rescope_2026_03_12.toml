[report]
title = "Algebra precision lane re-scope"
date = "2026-03-12"
status = "in_progress"
status_token = "IN_PROGRESS"
summary = "The x87 backend is now a cleaner shared subsystem, and the duplicated Jacobi solver loop has been collapsed into one shared flat-array scaffold used by the x87 lane, the double-double fallback, and the remaining f64 oracle path. The larger algebra precision story is still a three-lane system: AVX2 throughput kernels, x87/FP80 kernels, and a double-double fallback. The next work is not 'more x87 everywhere'; it is clarifying dispatch policy, normalizing the remaining x87 asm surface, and keeping benchmark evidence separate from production-policy claims until the selection layer is real. That selection layer now exists as a typed deterministic policy, the repo now has a solver-shaped sweep binary that measures the Jacobi backends directly, the DD lane has been repaired on obstruction-like families, and the offline obstruction-spectrum threshold table has been re-confirmed at 64 after both spectral-proxy and entrywise obstruction-like sweeps."

[current_system]
backend_crate = "crates/cd_kernel"
analysis_crate = "crates/algebra_analysis"
benchmark_cli = "crates/gororoba_cli_algebra/src/bin/x87_strategy_bench.rs"
jacobi_sweep_cli = "crates/gororoba_cli_algebra/src/bin/jacobi_backend_sweep.rs"
benchmark_harness = "crates/algebra_analysis/benches/x87_bench.rs"
precision_lanes = [
  "AVX2/FMA binary64 throughput kernels in cd_kernel::avx2_primitives",
  "x87/FP80 kernels in cd_kernel::x87_primitives, x87_ext80, x87_transcendentals, and x87_jacobi_kernels",
  "software double-double fallback in algebra_analysis::double_double and dd_jacobi",
]
dispatch_surface = [
  "typed deterministic Jacobi dispatch in algebra_analysis::precision_policy",
  "solver-family dispatch via SpectrumObjective / MatrixWorkloadClass / MatrixStructureHints in algebra_analysis::precision_policy",
  "policy-driven solver selection in algebra_analysis::homotopy_algebra",
  "heuristic and benchmark evidence in precision_tier_dispatch tests plus x87-strategy-bench",
]

