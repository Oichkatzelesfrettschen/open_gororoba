[[overstated_or_false]]
id = "OF-001"
statement = "The algebra precision work is now 'done' because the x87 backend passes."
verdict = "false"
reason = "The repo still has unresolved integration work around solver-structure sharing, dispatch policy, benchmark evidence, and older x87 asm normalization."

[[overstated_or_false]]
id = "OF-002"
statement = "The current dispatch chooses the numerically best backend for each workload."
verdict = "false"
reason = "The current production dispatch is typed and deterministic, and it now includes a first offline threshold table. It is still intentionally simple and artifact-driven rather than a dynamic benchmark-informed chooser."

[[overstated_or_false]]
id = "OF-003"
statement = "The benchmark narrative automatically counts as tracked evidence for all precision-policy claims."
verdict = "overstated"
reason = "The repo has benchmark code and reports, but several high-level engineering conclusions are still comments or reports rather than enforced selection logic or deterministic claim verifiers."

[remaining_gaps]
gaps = [
  "Decide whether and when block-Jacobi should graduate from benchmark-only prototype to a production default for any full-spectrum workload class.",
  "Measure the crossover between the new partial-spectrum lane and truncated full-spectrum Jacobi on larger obstruction matrices before adding more iterative sophistication.",
  "Decide whether the validated equitable-partition candidate reduction should remain benchmark/support infrastructure or be promoted to a production structured solver after stronger error and lifting checks. The current focused follow-up found zero exact validated quotient cells on the real and entrywise obstruction families, even though exploratory histogram partitions remain nontrivial. The first histogram-projected benchmark prototype was very fast but far too inaccurate, and the follow-up two-level lift repaired that failure only on quantized_obstruction_graph. The new centered cross-cell coupling metric explains the split: it is effectively zero on quantized_obstruction_graph, but rises to about 4-7% on quantized_shell_permutation and the real obstruction family. The next structure-aware step must therefore model cross-cell centered couplings, not just within-cell residual modes.",
  "Add one more entrywise obstruction-like family if the repo needs a stronger claim than the current pair of quantized entrywise families.",
  "Normalize the remaining older x87 asm blocks to the same documented stack/clobber discipline as the newer status-aware modules.",
  "Audit benchmark-doc comments that still read like conclusions without tracked evidence, especially where they describe rejected alternatives or generalized performance ratios.",
  "The deeper samply lane now works for all three current backends, the line-level compare artifact resolves DD ownership cleanly to dd_jacobi.rs, and the profiling-only profile-dd-hotspots build now exposes helper-level DD hotspots. After the direct hi/lo pivot-comparator optimization, a first plane-rotation helper specialization via dd_mul_add_pair improved the profiled DD lane again. The next DD profiler gap is now dd_rotation and its sqrt/div cost rather than pivot scanning or basic plane-update arithmetic.",
  "Map the typed policy surface onto a reproducible performance lane with perf, hyperfine, and flamegraph traces instead of one-off shell history.",
]

[roadmap]
ordered = [
  "Keep x87 as one precision lane, not the whole precision roadmap.",
  "Use the shared Jacobi scaffold as the insertion point for any future precision backend instead of cloning solver orchestration again.",
  "Keep future threshold changes tied to named sweep artifacts or registry inputs rather than ad hoc judgment.",
  "Collect cycle, throughput, and flamegraph evidence with native build-system targets before moving the current size-based threshold table.",
  "Use the new Jacobi backend sweep artifacts to stress and, if needed, refine the 64/68 obstruction-spectrum crossover.",
  "Treat the quantized_shell_permutation perf pass as a keep-cutoff checkpoint: reference_f64 stayed ahead of x87 at 68 and 72 once the backend-isolated perf counters were collected.",
  "Treat the quantized_shell_permutation flamegraph pass as a partial attribution lane: reference_f64 exposes libm atan2, but x87 and DD still need a stronger profiler setup for internal hotspot decomposition.",
  "Use the new samply lane when we need that stronger profiler setup: the dev-profile presymbolicated capture now resolves the reference scaffold/libm path, the x87 Jacobi/kernel path, and the DD solver path, jacobi-backend-samply-compare reconciles those raw captures into one backend-core/shared/dependency/runtime line-level report, and FEATURES=profile-dd-hotspots gives a profiling-only DD helper breakdown.",
  "Do not mirror the low-inlining lane onto reference_f64 yet; the current reference samply artifacts already answer the cross-backend attribution question well enough, and the stronger need was DD decomposition.",
  "Do not mirror the low-inlining lane onto x87 yet; the x87 stack is already visible enough in the current samply artifacts, and the missing evidence was the cost of the composed Givens path itself, which is now covered by the x87 Givens microbench plus focused perf-stat follow-up.",
  "Do not treat the stronger DD profiling lane as threshold-moving evidence by itself; the current 64 cutoff remains a solver-speed policy decision backed by the existing sweep artifacts even after the DD pivot optimization and the new x87 perf-stat follow-up.",
  "Use the new multicore x87 worker-sweep artifacts to distinguish exact FP80 lanes from throughput-oriented AVX2 and hybrid lanes when writing policy notes.",
  "Keep the repaired DD lane under regression coverage on obstruction-like matrices so the old failure mode does not return silently.",
  "Only expand the x87 transcendental surface further when a concrete consumer needs the next primitive.",
]

