# =============================================================================
# MaNGA Zero-Dark Density Null Result: Decisive Experiment Plan
# =============================================================================
# Experiment IDs: E-201 (H1 face-on reanalysis), E-202 (H2 Q3 injection)
# Data: MaNGA DR17 rotation curves (N=6992 galaxies, real observational data)
# Analysis: Stacking-Fourier-Rayleigh pipeline on r/r_s normalized residuals
# Domain: Astrophysics -- NOT machine learning. No train/test splits.
# Prior: E-183 (null SNR=0.29), E-184 (algebra-universal), E-192 (non-static)
# Synthesis: C-1428 (robust bounds), C-1429 (leakage), I-205 (3-perspective)
# =============================================================================

objectives:
  primary: >
    Establish a definitive upper bound on the zero-dark density coupling
    amplitude alpha_zd from MaNGA DR17 IFU rotation curves by testing two
    synthesized hypotheses from the Sprint 84 nine-perspective analysis.
  secondary:
    - >
      Resolve the mean-vs-median estimator divergence (8.6x ratio, C-1428)
      by switching to robust estimators with red-noise baseline subtraction.
    - >
      Determine whether Q3 mass quartile SNR=3.60 is a genuine detection
      or a sparse-bin artifact via injection recovery at 6 valid bins.
    - >
      Provide a clean, inclination-artifact-free bound using face-on
      galaxies (i < 45 deg) only.
  discovery_endpoint: >
    Any mode with Bonferroni-corrected p < 0.05 over n_modes=7 wavenumbers
    after red-noise subtraction and window-function correction would
    constitute a detection requiring follow-up with independent data.

datasets:
  primary:
    name: manga_dr17_rotcurves
    description: >
      MaNGA DR17 rotation curves for 7026 galaxies extracted via DAP.
      Each galaxy has 8-40 radial points with observed velocity, velocity
      error, and deprojected radius. 33 galaxies excluded for < 8 rotation
      curve points, yielding N=6992.
    source_files:
      rotcurves: data/external/manga/rotcurves/manga_rotcurves_all.csv
      dapall_full: data/external/manga/dapall_selection.csv
    format: >
      rotcurves CSV: plateifu, r_kpc, v_obs_km_s, v_err_km_s (126442 rows).
      dapall CSV: plateifu, z, nsa_elpetro_ba, nsa_elpetro_mass, ... (7026 rows).
    normalization: >
      x = r_kpc / r_s, delta_v = (v_obs - v_NFW) / v_NFW.
      r_s from Duffy+2008 c-M, M200 from Moster+2013 SMHM.
    coverage: "x = 0.5 to 1.35 r/r_s (MaNGA IFU ~12-18 kpc vs r_s ~10-20 kpc)"

  regime_factors:
    inclination:
      - name: face_on
        filter: "i < 45 deg"
        source: data/external/manga/subsamples/dapall_lowi.csv
        n_galaxies: 3436
        rationale: >
          Removes inclination artifact (C-1367): SNR increases 0.98->1.30
          with inclination, opposite of ZD prediction.
      - name: mid_inclination
        filter: "45 <= i < 60 deg"
        source: data/external/manga/subsamples/dapall_midi.csv
        n_galaxies: 2898
      - name: high_inclination
        filter: "60 <= i <= 70 deg"
        source: data/external/manga/subsamples/dapall_highi.csv
        n_galaxies: 1218
    mass_quartile:
      - name: Q1_low_mass
        filter: "log M200 < 11.15 (25th percentile)"
        n_galaxies: 1749
        n_valid_bins: 19
      - name: Q3_intermediate
        filter: "11.54 < log M200 < 12.07 (50th-75th percentile)"
        n_galaxies: 1749
        n_valid_bins: 6
        note: "Sparse coverage; only x=0.50-0.74 populated."
      - name: Q4_high_mass
        filter: "log M200 > 12.07 (75th percentile)"
        n_galaxies: 1749
        n_valid_bins: 0
        note: "Zero valid bins. Not usable for Fourier analysis."

  precomputed:
    stacked_d16:
      path: data/results/e183/manga_stack_D16.csv
      format: "x, delta_stack, delta_stack_err, n_contributing"
      n_valid_bins: 19
    per_galaxy_dft:
      path: data/results/e183/cross_algebra_correlation.galaxies.csv
      format: "plateifu, cd_re, cd_im, g2_re, g2_im, j3o_re, j3o_im, sl2_re, sl2_im"
      n_galaxies: 6995

baselines:
  - name: mean_stack_full_sample
    description: >
      E-183 full-sample inverse-variance weighted mean stack with CD-ZD D=16
      wavenumbers. SNR=0.29, alpha_zd < 0.002392, 19 valid bins.
    role: primary_baseline
    precomputed: true
    precomputed_result:
      detection_snr: 0.29
      alpha_zd_upper_bound: 0.002392
      rms_residual: 0.075083
      n_valid_bins: 19
    implementation_spec:
      language: rust
      binary: harmonic-halo-stacking-manga
      class_name: StackingPipeline
      key_methods: [load_rotcurves, normalize_to_x, stack_residuals, fourier_at_wavenumbers, compute_snr]
      algorithm_steps:
        - "1. Load 7026 galaxies from rotcurves CSV, match to dapall metadata"
        - "2. Estimate M200 from nsa_elpetro_mass via Moster+2013 SMHM"
        - "3. Compute NFW (r_s, c200) via Duffy+2008 c-M"
        - "4. Normalize: x = r_kpc / r_s, delta_v = (v_obs - v_NFW) / v_NFW"
        - "5. Stack onto x-grid [0.5, 10.0], inverse-variance weights w_i = 1/sigma_i^2"
        - "6. DFT at 7 CD-ZD wavenumbers k_n = 2*pi*n/7, n=1..7"
        - "7. SNR = sqrt(max_power) / rms_residual"
      loss_function: "N/A (not a learning algorithm)"
      key_hyperparameters:
        x_min: 0.5
        x_max: 10.0
        n_grid: 200
        min_per_bin: 10
        cd_dim: 16
        assessor_fraction: 0.5
      differentiator: "Full-sample mean stack -- the established E-183 baseline"

  - name: nfw_only_chi2_baseline
    description: >
      Standard dark matter analysis: chi-squared goodness of fit of NFW
      residuals. No harmonic template, no ZD hypothesis. Represents what
      a conventional dark matter analysis would report.
    role: conventional_baseline
    implementation_spec:
      language: python
      class_name: NFWChi2Baseline
      key_methods: [load_stacked, filter_valid, compute_chi2, compute_rms]
      algorithm_steps:
        - "1. Load stacked profile from manga_stack_D16.csv"
        - "2. Filter to valid bins (n_contributing >= 10)"
        - "3. chi2 = sum((delta_stack / delta_stack_err)^2)"
        - "4. chi2_reduced = chi2 / n_valid_bins"
        - "5. rms = sqrt(mean(delta_stack^2))"
        - "6. No Fourier analysis -- pure residual magnitude assessment"
      loss_function: "chi2 = sum_i (d_i / sigma_i)^2"
      key_hyperparameters:
        min_per_bin: 10
      differentiator: "No ZD hypothesis -- conventional NFW residual test only"

  - name: relatores_composite_baseline
    description: >
      Following Relatores+2019 (ApJ 887, 94): composite stacking with
      3-sigma iterative outlier clipping. Tests whether outlier rejection
      methodology affects the null result.
    role: literature_baseline
    implementation_spec:
      language: python
      class_name: RelatoresComposite
      key_methods: [load_stacked, sigma_clip, recompute_rms, fourier_analysis]
      algorithm_steps:
        - "1. Load pre-stacked profile (manga_stack_D16.csv)"
        - "2. Compute mu = mean(delta_stack), sigma = std(delta_stack)"
        - "3. Iteratively clip |delta - mu| > 3*sigma (max 5 iterations)"
        - "4. Recompute RMS and SNR on clipped profile"
        - "5. Compare with unclipped baseline"
      loss_function: "N/A"
      key_hyperparameters:
        outlier_sigma_clip: 3.0
        max_iterations: 5
      differentiator: "3-sigma iterative clipping per Relatores+2019 methodology"

  - name: multi_algebra_mean_stack
    description: >
      E-184 result: all four algebraic frameworks produce identical SNR=0.29.
      Confirms null is algebra-universal, not CD-ZD wavenumber artifact.
    role: cross_algebra_baseline
    precomputed: true
    precomputed_result:
      cd_zd_snr: 0.29
      g2_snr: 0.29
      j3o_snr: 0.29
      sl2_snr: 0.23
    implementation_spec:
      language: rust
      binary: lie-jordan-halo-analysis
      class_name: MultiAlgebraAnalysis
      key_methods: [load_rotcurves, stack_all, fourier_at_4_algebras, compare_snr]
      algorithm_steps:
        - "1. Stack N=6992 galaxies at 4 wavenumber sets"
        - "2. CD-ZD D=16: k_n = 2*pi*n/7, n=1..7 (7 modes)"
        - "3. G2 Aut(O): k_n = 2*pi*n/6, n=1..6 (6 modes)"
        - "4. Albert J3(O): k_n = 2*pi*n/3, n=1..3 (3 modes)"
        - "5. sl(2): k = {2,4}*2*pi/7 (2 modes)"
        - "6. Compare SNR across all 4 frameworks"
      loss_function: "N/A"
      key_hyperparameters:
        cd_dim: 16
      differentiator: "Cross-algebra comparison -- tests algebra universality of null"

proposed_methods:
  # ===== H1: Face-on reanalysis with red-noise baseline subtraction =====
  - name: face_on_rednoise_subtracted
    description: >
      H1 PRIMARY: Restrict to face-on galaxies (i < 45 deg, N=3436), stack,
      compute Rayleigh R at 7 CD-ZD wavenumbers, fit and subtract k^gamma
      red-noise envelope, compute corrected alpha_zd upper bound.
    hypothesis: H1
    experiment_id: E-201
    detection_criterion: "Any mode with |R_resid| > 3*sigma above red-noise envelope"
    failure_criterion: "All modes consistent with envelope; corrected alpha_zd < 0.0015"
    implementation_spec:
      language: rust
      binary: face-on-red-noise-rayleigh
      source: crates/gororoba_cli_physics/src/bin/face_on_red_noise_rayleigh.rs
      class_name: FaceOnRedNoiseRayleigh
      key_methods: [load_face_on, normalize, stack, rayleigh_R, fit_rednoise, subtract_envelope, bootstrap_ci]
      algorithm_steps:
        - "1. Load rotation curves, match to dapall_lowi (i < 45 deg, N=3436)"
        - "2. Normalize to x = r/r_s using Duffy+2008 c-M + Moster+2013 SMHM"
        - "3. Stack with inverse-variance weighting onto x-grid [0.5, 10.0]"
        - "4. Compute jackknife Rayleigh R at 7 CD-ZD wavenumbers k_n = 2*pi*n/7"
        - "5. Fit red-noise envelope R(k) = A * k^gamma via log-log OLS"
        - "6. Compute R_resid(k) = R_obs(k) - R_pred(k)"
        - "7. sigma_resid = std(R_resid) over 7 modes"
        - "8. Detection test: any |R_resid| > 3*sigma_resid?"
        - "9. Corrected alpha_zd = max(R_resid, 0) / (0.5 * e)"
        - "10. Bootstrap 200x galaxy resampling for 95% CI on alpha_zd"
      loss_function: "N/A (frequentist hypothesis test)"
      key_hyperparameters:
        gamma_prior: 0.808
        n_bootstrap: 200
        seed: 42
        cd_dim: 16
        min_per_bin: 10
        x_min: 0.5
        x_max: 10.0
      differentiator: >
        Red-noise envelope subtraction removes the k^{-0.78} baryonic floor
        before computing detection statistics. Combined with face-on selection,
        eliminates both the spectral bias and the inclination artifact.

  - name: face_on_whitened_matched_filter
    description: >
      H1 SECONDARY: Apply variance-normalized matched filter to face-on
      stacked profile. Per-bin whitening accounts for 33x noise variation.
    hypothesis: H1
    experiment_id: E-201
    implementation_spec:
      language: rust
      binary: whitened-matched-filter
      source: crates/gororoba_cli_physics/src/bin/whitened_matched_filter.rs
      class_name: WhitenedMatchedFilter
      key_methods: [load_stacked, prewhiten, whitened_dft, chi2_test, rednoise_correction]
      algorithm_steps:
        - "1. Load face-on stacked CSV"
        - "2. Pre-whiten: d_white(x_i) = delta(x_i) / sigma(x_i)"
        - "3. Whitened DFT at 7 CD-ZD wavenumbers"
        - "4. var(re_k) = sum_i cos^2(k*x_i), var(im_k) = sum_i sin^2(k*x_i)"
        - "5. chi2_k = re_w^2/var_re + im_w^2/var_im per mode"
        - "6. Total chi2 ~ chi2(df=14) under H0"
        - "7. Fit red-noise P(k) = A * k^{-gamma} on whitened power spectrum"
        - "8. Divide each mode by expected red-noise, recompute corrected chi2"
        - "9. Report p-values: naive, whitened, corrected"
      loss_function: "chi2 = sum_k (|F_k|^2 / var(F_k))"
      key_hyperparameters:
        min_per_bin: 10
      differentiator: >
        Neyman-Pearson optimal test for known template in Gaussian noise
        with known covariance. Standard in pulsar timing and GW detection.

  - name: face_on_gp_model_comparison
    description: >
      H1 TERTIARY: GP model selection on face-on stacked profile.
      Matern kernel (smooth baryonic) vs Matern+ExpSineSquared (periodic at
      CD-ZD frequency). Bayes factor < 1 confirms no periodic structure.
    hypothesis: H1
    experiment_id: E-201
    implementation_spec:
      language: python
      script: src/ghost_stats/gp_model_comparison.py
      class_name: GPModelComparison
      key_methods: [load_csv, fit_matern, fit_matern_periodic, compute_bayes_factor]
      algorithm_steps:
        - "1. Load face-on stacked CSV, filter to valid bins (n >= 10)"
        - "2. Fit Model A: Matern(nu=2.5) + WhiteKernel (20 restarts)"
        - "3. Fit Model B: Matern + ExpSineSquared(period=7.0) + WhiteKernel"
        - "4. Delta_LML = LML(B) - LML(A)"
        - "5. Bayes factor = exp(Delta_LML)"
        - "6. Delta_LML < 0 -> periodic component worsens fit (confirms null)"
      loss_function: "Log marginal likelihood: LML = log p(y|X, theta)"
      key_hyperparameters:
        n_restarts: 20
        matern_nu: 2.5
        periodic_period: 7.0
      differentiator: >
        Bayesian model selection avoids SNR threshold dependence.
        Directly answers 'does adding periodicity improve the model?'

  # ===== H2: Q3 mass-quartile injection recovery validation =====
  - name: q3_injection_recovery
    description: >
      H2 PRIMARY: Inject alpha_zd = {0.001, 0.004, 0.01} into Q3 galaxies
      (N=1749, 6 valid bins). Measure delta_SNR. Compare with Q1 control
      (19 bins) and synthetic-6-bin Q1 to isolate window vs mass effects.
    hypothesis: H2
    experiment_id: E-202
    detection_criterion: "delta_SNR > 2.0 at alpha=0.004 AND recovery > 80%"
    failure_criterion: "delta_SNR < 0.5 at alpha=0.004 (pipeline blind at 6 bins)"
    implementation_spec:
      language: rust
      binary: q3-injection-recovery
      source: crates/gororoba_cli_physics/src/bin/q3_injection_recovery.rs
      class_name: Q3InjectionRecovery
      key_methods: [sort_by_mass, extract_quartile, stack_baseline, inject_signal, measure_delta_snr, bootstrap_ci]
      algorithm_steps:
        - "1. Load all galaxies, estimate log(M200), sort"
        - "2. Extract Q3 (50th-75th percentile, N~1749, log M200=11.54-12.07)"
        - "3. Stack Q3 baseline, compute SNR at 7 CD-ZD wavenumbers"
        - "4. For alpha_zd in {0.001, 0.004, 0.01}:"
        - "   a. Inject: v_inject(x) = v_obs(x) * (1 + alpha_zd * sum_n cos(k_n*x))"
        - "   b. Stack injected Q3, compute SNR"
        - "   c. delta_SNR = SNR(injected) - SNR(baseline)"
        - "5. Bootstrap 200x for 95% CI on delta_SNR at each alpha"
        - "6. Run Q1 control (19 bins) at same 3 alpha levels"
        - "7. Run synthetic-6-bin Q1 (x_max=0.74) at same alpha levels"
        - "8. Compare: Q3 vs Q1 vs Q1-6bin recovery rates"
      loss_function: "N/A"
      key_hyperparameters:
        inject_alphas: [0.001, 0.004, 0.01]
        n_bootstrap: 200
        seed: 42
        cd_dim: 16
        min_per_bin: 10
      differentiator: >
        Injection recovery with matched controls (Q1 full and Q1 restricted
        to 6 bins) isolates whether Q3 SNR=3.60 is a mass effect or a
        window-width artifact.

ablations:
  # ===== H1 ablations: isolating pipeline components =====
  - name: face_on_no_rednoise_subtraction
    description: >
      H1 ablation: face-on stack WITHOUT red-noise subtraction.
      Isolates the effect of the k^{-0.78} spectral detrending.
    ablates: face_on_rednoise_subtracted
    what_is_removed: "Red-noise envelope subtraction (gamma set to 0)"
    how_it_differs: "gamma_prior=0.0 makes R_pred(k) = const (flat correction)"
    expected_effect: >
      alpha_zd bound should be LOOSER because the k^{-0.78} baryonic
      floor inflates raw R values. The difference quantifies sensitivity
      gained by red-noise correction.
    implementation_spec:
      language: rust
      binary: face-on-red-noise-rayleigh
      key_hyperparameters:
        gamma_prior: 0.0
        n_bootstrap: 200
        seed: 42

  - name: face_on_free_gamma_fit
    description: >
      H1 ablation: face-on stack with FREE gamma fit (no prior from full
      sample). Tests whether gamma=0.808 transfers to face-on subsample.
    ablates: face_on_rednoise_subtracted
    what_is_removed: "Gamma prior (gamma fitted from face-on data alone)"
    how_it_differs: "OLS fit of log(R) vs log(k) on face-on data, no prior constraint"
    expected_effect: >
      If gamma_face_on differs from 0.808 by > 2*sigma, the prior is invalid
      for face-on data and projection effects alter spectral shape.
    implementation_spec:
      language: rust
      binary: face-on-red-noise-rayleigh
      note: "Requires --free-gamma flag or gamma_prior=NaN to trigger OLS fit"

  - name: face_on_median_stack
    description: >
      H1 ablation: face-on with MEDIAN instead of mean stacking.
      Addresses C-1428: median alpha_zd = 0.27 vs mean = 2.32.
    ablates: face_on_rednoise_subtracted
    what_is_removed: "Mean estimator (replaced with per-bin median)"
    how_it_differs: "At each x-grid point, take median(delta_v) instead of weighted mean"
    expected_effect: >
      Median alpha_zd should be 3-10x tighter than mean because outlier
      galaxies are suppressed. Confirms or refutes C-1428 on face-on data.
    implementation_spec:
      language: python
      script: experiments/manga_zd_null/models.py
      key_hyperparameters:
        estimator: median
        subsample: dapall_lowi.csv
        n_bootstrap: 50

  - name: face_on_trimmed_05
    description: >
      H1 ablation: face-on with 5%-trimmed mean DFT.
      Intermediate between full mean and median.
    ablates: face_on_rednoise_subtracted
    what_is_removed: "5% most extreme per-galaxy DFT coefficients from each tail"
    how_it_differs: "Sort galaxies by |F|^2, remove top/bottom 5%, compute mean"
    expected_effect: >
      Trimmed mean should shift toward median. If alpha_zd drops > 30%,
      outlier contamination extends beyond top 5%.
    implementation_spec:
      language: rust
      binary: trimmed-stacking-robustness
      key_hyperparameters:
        trim_fraction: 0.05

  - name: face_on_trimmed_20
    description: >
      H1 ablation: 20%-trimmed mean DFT (aggressive, removes 40% total).
    ablates: face_on_rednoise_subtracted
    what_is_removed: "20% most extreme DFT coefficients from each tail"
    how_it_differs: "Same as trimmed_05 but with trim_fraction=0.20"
    expected_effect: >
      If alpha_zd is still not near median value, outliers are pervasive
      beyond the 20% tails and the power distribution is fundamentally
      heavy-tailed, not contaminated by a small outlier population.
    implementation_spec:
      language: rust
      binary: trimmed-stacking-robustness
      key_hyperparameters:
        trim_fraction: 0.20

  # ===== H2 ablations: isolating Q3 result =====
  - name: q1_injection_recovery_control
    description: >
      H2 ablation: injection recovery on Q1 (low mass, 19 valid bins)
      as control. Establishes expected recovery rate for well-sampled data.
    ablates: q3_injection_recovery
    what_is_removed: "Q3 mass selection (replaced with Q1)"
    how_it_differs: "Same pipeline on Q1 galaxies which have 19 valid bins"
    expected_effect: >
      delta_SNR > 2.0 at alpha=0.004 (pipeline works at 19 bins).
      This is the reference recovery rate for Q3 comparison.
    implementation_spec:
      language: rust
      binary: q3-injection-recovery
      note: "Q1 control is computed as part of the standard q3-injection-recovery run"

  - name: q1_synthetic_6bin_control
    description: >
      H2 ablation: injection recovery on Q1 restricted to x_max=0.74
      (artificially creating 6-bin window). Isolates window vs mass.
    ablates: q3_injection_recovery
    what_is_removed: "Q3 mass selection AND full Q1 coverage"
    how_it_differs: "Q1 galaxies with x_max=0.74, creating same 6-bin window as Q3"
    expected_effect: >
      If Q1-6bin also shows high SNR: 6-bin window is biased (artifact).
      If Q1-6bin shows low SNR: Q3 mass bin has a real peculiarity.
    implementation_spec:
      language: rust
      binary: q3-injection-recovery
      note: "Synthetic-6-bin Q1 is computed as part of the standard q3-injection-recovery run"

  # ===== Cross-cutting ablations =====
  - name: inclination_stratified_injection
    description: >
      Cross-cutting: injection recovery at 3 inclination bins x 6 alpha
      levels. Tests whether E-183 inclination artifact persists under
      injection and whether recovery is inclination-dependent.
    ablates: face_on_rednoise_subtracted
    what_is_removed: "Inclination mixing (stratified by i-bin)"
    how_it_differs: "Runs injection at low/mid/high inclination separately"
    expected_effect: >
      If recovery differs by > 2x between low-i and high-i, inclination
      creates systematic bias in the stacking-Fourier pipeline.
    implementation_spec:
      language: rust
      binary: inclination-injection-calibration
      source: crates/gororoba_cli_physics/src/bin/inclination_injection_calibration.rs

  # ===== Spectral and topological diagnostics =====
  - name: full_sample_bispectral_fano
    description: >
      Diagnostic: Fano plane bispectral selection rule test. Three-wave
      coupling at octonion triples vs non-Fano triples. Ratio near 1.0
      falsifies algebraic structure.
    ablates: mean_stack_full_sample
    what_is_removed: "Linear Fourier assumption (tests 3-wave nonlinearity)"
    how_it_differs: "Bispectrum B(k_i, k_j) instead of power spectrum"
    expected_effect: "Fano/non-Fano ratio in [0.7, 1.3] -> no selection rule"
    implementation_spec:
      language: rust
      binary: bispectral-selection-rule

  - name: full_sample_persistence_topology
    description: >
      Diagnostic: sublevel persistence of stacked residual. 7-mode ZD
      oscillation creates ~7 persistent H_0 features; baryonic creates 2-3.
    ablates: mean_stack_full_sample
    what_is_removed: "Fourier decomposition (uses topological invariants instead)"
    how_it_differs: "Counts persistent features via sublevel-set union-find"
    expected_effect: "N_persistent <= 3: baryonic origin, falsifies ZD topology"
    implementation_spec:
      language: rust
      binary: persistence-residual-topology

  - name: full_sample_mutual_information
    description: >
      Diagnostic: KSG mutual information between cross-algebra DFT phases.
      Tests whether rho > 0.97 degeneracy hides non-linear dependencies.
    ablates: multi_algebra_mean_stack
    what_is_removed: "Linear correlation assumption (tests non-linear coupling)"
    how_it_differs: "KSG MI estimator with circular phase embedding"
    expected_effect: "NMI < 0.05: trivial independence; > 0.15: unexpected coupling"
    implementation_spec:
      language: python
      script: src/ghost_stats/mutual_information_phase.py

  - name: full_sample_variance_quantization
    description: >
      Diagnostic: Hartigan dip test on per-galaxy Fourier power distribution.
      Tests whether extreme kurtosis (~284) indicates multimodality.
    ablates: mean_stack_full_sample
    what_is_removed: "Unimodality assumption"
    how_it_differs: "Hartigan dip test with 5000 permutations"
    expected_effect: >
      CD-ZD CV / mean(other CV) > 1.5 indicates excess variance in
      CD-ZD framework. Expect ratio near 1.0 (algebra-universal noise).
    implementation_spec:
      language: rust
      binary: variance-quantization-test
      key_hyperparameters:
        n_perm: 5000
        seed: 42

metrics:
  primary_metric:
    name: alpha_zd_upper_bound
    direction: minimize
    units: dimensionless
    description: >
      95% CL upper limit on ZD coupling amplitude. Derived from maximum
      corrected Rayleigh R (H1) or maximum corrected Fourier amplitude (H2).
      Lower = tighter constraint on new physics.
    formula: "alpha_zd = max(R_resid, 0) / (assessor_fraction * e)"
    e183_baseline: 0.002392
    ska_2030_threshold: 0.004

  secondary_metrics:
    - name: detection_snr
      direction: minimize
      description: "SNR of Fourier power vs noise floor. SNR < 2 = null."
    - name: injection_recovery_fraction
      direction: maximize
      description: "Fraction of injected signals recovered with delta_SNR > 2.0."
    - name: rayleigh_R_corrected
      direction: minimize
      description: "Rayleigh R after red-noise subtraction. Lower = more null."
    - name: red_noise_gamma
      direction: null
      description: "Power-law index of baryonic spectral floor. Expected ~0.78."
    - name: chi2_p_value_corrected
      direction: maximize
      description: "Chi-squared p-value after whitening. p > 0.05 = null."
    - name: bayes_factor_periodic
      direction: minimize
      description: "BF for periodic vs smooth GP. BF < 1 = null."

  discovery_metric:
    name: corrected_mode_p_value
    threshold: 0.05
    correction: bonferroni
    n_modes: 7
    effective_threshold: 0.00714
    description: >
      Per-mode p-value after Bonferroni correction for 7 wavenumber tests.
      Any corrected p < 0.00714 = detection requiring independent follow-up.

  statistical_reporting:
    confidence_interval: "95% bootstrap CI (N=200 resamples)"
    effect_size: "Cohen d for paired comparisons between conditions"
    comparison_test: "Wilcoxon signed-rank (non-parametric, N < 30)"
    per_seed_reporting: true

risks:
  - id: R1
    description: >
      Face-on subsample (N=3436) may have too few galaxies per bin at
      large x, reducing n_valid_bins below 12.
    severity: medium
    mitigation: >
      Check n_valid_bins in face-on stack. If < 12, also run with
      min_per_bin=5 as secondary analysis.

  - id: R2
    description: >
      Gamma prior (0.808) from full sample may not transfer to face-on
      subsample if projection artifacts alter spectral slope.
    severity: medium
    mitigation: >
      face_on_free_gamma_fit ablation tests this explicitly. If face-on
      gamma differs from 0.808 by > 2*sigma, use face-on-specific gamma.

  - id: R3
    description: >
      Q3 injection uses same pipeline that produced SNR=3.60. Systematic
      bias at 6 bins would be reproduced.
    severity: high
    mitigation: >
      Q1-synthetic-6-bin control isolates window from mass effect. If
      Q1-6bin also shows elevated SNR, the 6-bin window is biased.

  - id: R4
    description: >
      Bootstrap N=200 may underestimate tail uncertainty. Ideally N=1000
      but compute budget constrains this.
    severity: low
    mitigation: >
      Report bootstrap SE of CI endpoints. Use N=200 for primary, N=50
      for diagnostic ablations.

  - id: R5
    description: >
      GP model comparison depends on sklearn. If unavailable, skip and
      report as 'not computed'.
    severity: low
    mitigation: >
      GP is tertiary. Core results (H1 primary, H2 primary) are Rust-only.

compute_budget:
  total_seconds: 600
  breakdown:
    - phase: 1_precompute
      conditions: [face_on_stack_generation]
      estimated_seconds: 30
      note: "harmonic-halo-stacking-manga with dapall_lowi.csv"
    - phase: 2_baselines
      conditions: [mean_stack_full_sample, multi_algebra_mean_stack, nfw_only_chi2_baseline, relatores_composite_baseline]
      estimated_seconds: 5
      note: "Mostly precomputed; only NFW chi2 and Relatores need fresh computation"
    - phase: 3_h1_primary
      conditions: [face_on_rednoise_subtracted]
      estimated_seconds: 30
      n_bootstrap: 200
    - phase: 4_h2_primary
      conditions: [q3_injection_recovery]
      estimated_seconds: 120
      n_bootstrap: 200
      note: "Longest single run: 3 alpha levels x bootstrap x Q1 control x 6-bin"
    - phase: 5_h1_ablations
      conditions: [face_on_no_rednoise_subtraction, face_on_free_gamma_fit, face_on_median_stack, face_on_trimmed_05, face_on_trimmed_20]
      estimated_seconds: 85
    - phase: 6_h1_diagnostics
      conditions: [face_on_whitened_matched_filter, face_on_gp_model_comparison]
      estimated_seconds: 15
    - phase: 7_h2_diagnostics
      conditions: [q1_injection_recovery_control, q1_synthetic_6bin_control]
      estimated_seconds: 0
      note: "Computed in phase 4 as part of q3-injection-recovery run"
    - phase: 8_cross_cutting
      conditions: [inclination_stratified_injection, full_sample_bispectral_fano, full_sample_persistence_topology, full_sample_mutual_information, full_sample_variance_quantization]
      estimated_seconds: 75
    - phase: 9_aggregation
      estimated_seconds: 40
      note: "Result collection, claim registration, integrity resolution"
  total_estimated: 400
  margin_seconds: 200
  margin_note: "50% safety margin within 600s budget"

  condition_summary:
    baselines: 4
    proposed_methods: 4
    ablations: 12
    total_conditions: 20
    bootstrap_primary: 200
    bootstrap_diagnostic: 50
