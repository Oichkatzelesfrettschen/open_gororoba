objectives:
  - "OBJ-1: Construct 2D exclusion surface in (alpha_zd, r/r_s) space on baryonic-corrected NFW baseline, achieving 90% CL floor alpha_zd < 0.001 across x=0.5-0.85 (>=2x improvement over current 0.002392 threshold)"
  - "OBJ-2: Quantify effective independent tests N_eff in multi-dimension and multi-algebra analysis; retract comprehensiveness claim if N_eff < 2"
  - "OBJ-3: Search for anisotropic ZD velocity structure via azimuthal Fourier modes m=0..4 on 2D IFU maps; null if all modes SNR < 2.0, detection if m=2 SNR > 3.0 with phase correlated to galaxy PA"

datasets:
  - "manga_rotcurves_all.csv: 7026 galaxies, 126442 rotation curve rows (data/external/manga/manga_rotcurves_all.csv)"
  - "manga_stack_D16.csv: pre-computed stacked profile at CD D=16, 200 radial bins (data/results/e183/manga_stack_D16.csv)"
  - "dc14_stacking.csv: pre-computed DC14 vs NFW comparison, 200 bins showing DC14 undershoots by 17-35% (data/results/e183/dc14_stacking.csv)"
  - "contrarian_baseline.csv: baryonic-corrected NFW residuals, 3-5x smaller than raw NFW at x<0.9 (data/results/e183/contrarian_baseline.csv)"
  - "cross_algebra_correlation.csv: 6-pair correlation matrix, rho_avg 0.990-0.998 confirming near-total framework redundancy (data/results/e183/cross_algebra_correlation.csv)"
  - "injection_recovery.csv: existing 6-point injection-recovery showing pipeline insensitivity at alpha_zd <= 0.004 (data/results/e183/injection_recovery.csv)"
  - "dapall_lowi.csv: low inclination 30-45 deg subsample, N=3140 (data/external/manga/subsamples/dapall_lowi.csv)"
  - "dapall_midi.csv: mid inclination 45-60 deg subsample, N=2677 (data/external/manga/subsamples/dapall_midi.csv)"
  - "dapall_highi.csv: high inclination 60-70 deg subsample, N=1175 (data/external/manga/subsamples/dapall_highi.csv)"
  - "Regime factor 1 -- inclination_bin: [low_i_30_45, mid_i_45_60, high_i_60_70] -- discriminates projection artifacts from genuine signal (C-1367)"
  - "Regime factor 2 -- radial_coverage: [inner_x_lt_0p85, outer_x_gt_0p85] -- separates baryonic-dominated inner halo from sparser but cleaner outer halo (I-179)"

baselines:
  - "nfw_harmonic_stack: existing E-183 NFW-normalized radial stacking + Fourier decomposition (C-1365); standard dark matter profile with known 10-15% cusp-core residuals at x=0.6-0.87; ref Moster+2013 SMHM, de Blok 2010; binary harmonic-halo-stacking-manga; pre-computed results in sweeps/"
  - "dc14_harmonic_stack: DC14 cored profile (Di Cintio+2014) replacing NFW; pre-computed results show DC14 INCREASES Fourier power 40-60x at ZD modes due to systematic 17-35% velocity undershoot; ref Di Cintio+2014, Read+2016; binary dc14-stacking; demonstrates baseline choice matters in opposite direction from naive expectation"

proposed_methods:
  - "baryonic_corrected_exclusion_surface (H1): NFW + empirical baryonic correction from contrarian_baseline.csv + phase-shift scan delta_x in [-0.5,+0.5] step 0.05 + injection-recovery on 20x20 grid in (alpha_zd, x) space producing 90% CL exclusion surface; binary harmonic-halo-injection; key hyperparams: 20 alpha_zd values [0.0001..0.1], x_inject 0.5-1.35 in 20 steps, n_bootstrap=200, detection_sigma=3.0; differentiator: baryonic-corrected residuals are 3-5x smaller than raw NFW yielding tighter exclusion"
  - "azimuthal_fourier_pa_aligned_stack (H3): per-galaxy 2D velocity residual decomposition into azimuthal Fourier modes m=0..4 at each radial bin, m=2 phase aligned by galaxy PA before stacking; key hyperparams: max_mode=4, n_radial_bins=18, n_azimuthal_bins=16, n_bootstrap=200; detection via SNR_m and Rayleigh test on PA-aligned phase distribution; differentiator: first 2D azimuthal analysis of MaNGA ZD search -- all prior work used 1D radial averaging that destroys anisotropic structure"

ablations:
  - "baryonic_corrected_no_phaseshift (H1): exclusion surface with delta_x=0 only, removing phase-shift scan; tests whether adiabatic contraction shifts ZD template; expected <10% change if template correctly phased, weaker exclusion at x<0.7 if contraction matters"
  - "azimuthal_fourier_no_pa_alignment (H3): azimuthal modes stacked WITHOUT galaxy-PA alignment; stacked amplitude should be sqrt(N)~84x smaller for any coherent signal; critical diagnostic: if aligned and unaligned give similar SNR, the signal is noise"
  - "single_algebra_cd_zd_only (H2): CD-ZD D=16 wavenumbers only, discarding G2/J3(O)/sl(2); tests whether multi-algebra adds independent information; expected SNR identical to multi-algebra result given rho=0.998 correlation"
  - "nfw_exclusion_surface_uncorrected (H1 control): exclusion surface on raw NFW residuals without baryonic correction; directly compared to corrected version; expected 2-5x weaker exclusion at x<0.85 quantifying correction improvement"
  - "dimension_gradient_injection (H2): inject alpha(D)=0.01*log2(D)/4 across D=16..1024, measure recovery slope; slope=0 confirms pseudoreplication via af=0.5 identity (C-1349); slope=1 means pipeline has full dimension sensitivity; injection at velocity level upstream of ZD density computation"

metrics:
  - "PRIMARY: exclusion_floor_alpha_zd (direction: minimize, units: dimensionless) -- tightest 90% CL upper limit on alpha_zd across x=0.5-0.85 on corrected baseline; current=0.002392, target<0.001"
  - "effective_independent_tests (direction: minimize) -- N_eff from eigenvalues of inter-framework correlation matrix; N_eff=1 means total pseudoreplication"
  - "azimuthal_m2_snr (direction: minimize) -- PA-aligned stacked m=2 mode SNR; minimize=null (SNR<2), value>3 is detection"
  - "dimension_gradient_recovery_slope (direction: minimize) -- slope of recovered vs injected alpha across D=16..1024; 0=pseudoreplication, 1=full sensitivity"
  - "dc14_to_nfw_exclusion_ratio (direction: minimize) -- ratio of corrected to uncorrected exclusion floors; <1.0 means correction helps"
  - "success_rate: fraction of bootstrap seeds completing without NaN/crash, threshold >= 0.95"
  - "detection_flag: binary 1 if any condition produces SNR > 3.0 at alpha_zd=0"
  - "anisotropy_pa_correlation: Spearman rho between m=2 phase and galaxy PA; >0.3 with p<0.01 indicates physical signal"
  - "Statistical requirements: 5 bootstrap seeds, 200 internal resamples, 95% bootstrap CI, Wilcoxon signed-rank paired across radial bins, rank-biserial effect size"

risks:
  - "RISK-1 (HIGH, mitigated): DC14 amplifies ZD-mode Fourier power 40-60x instead of suppressing it; mitigation: use baryonic-corrected NFW baseline instead of DC14 as primary substrate"
  - "RISK-2 (HIGH, mitigated): injection-recovery has zero sensitivity at alpha_zd<=0.004; mitigation: extend grid to alpha_zd=0.1 and report detection EFFICIENCY curve, define exclusion where efficiency crosses 90%"
  - "RISK-3 (MEDIUM, requires validation): azimuthal decomposition needs (r,theta) coordinates not directly in manga_rotcurves_all.csv which stores 1D pseudo-slit curves; mitigation: estimate m=2 from approach/recede asymmetry or fall back to DAP MAPS FITS download for N=500 subsample"
  - "RISK-4 (MEDIUM, mitigated): 5 bootstrap seeds insufficient for Wilcoxon test; mitigation: Wilcoxon applied across N=18-20 radial bins (paired observations), not across seeds"
  - "RISK-5 (LOW, accepted): af=0.5 identity may make dimension_gradient_injection trivially zero by mathematical necessity; mitigation: injection is at velocity level upstream of ZD density, distinguishing pipeline limitation from algebraic truth"
  - "Numerical stability: floor v_NFW at 5 km/s for x<0.5 division safety; atan2 phase unwrapping for azimuthal modes; require n_contributing>=10 per radial bin to prevent bootstrap NaN"

compute_budget:
  - "Total time budget: 600s with 20% margin (effective cap 480s)"
  - "Phase 0 -- Framework Audit (H2): dimension_gradient_injection 7D x 5 seeds = 35 runs x 3s = 105s; single_algebra_cd_zd_only 3 incl x 5 seeds = 15 runs x 2s = 30s; subtotal 135s"
  - "Phase 1a -- Exclusion Surface (H1, parallel with 1b): baryonic_corrected_exclusion_surface 3x5=15 runs x 12s = 180s; nfw_exclusion_surface_uncorrected 3x5=15 runs x 8s = 120s; baryonic_corrected_no_phaseshift 3x5=15 runs x 4s = 60s; subtotal 360s"
  - "Phase 1b -- Azimuthal Decomposition (H3, parallel with 1a): azimuthal_fourier_pa_aligned_stack 3x5=15 runs x 5s = 75s; azimuthal_fourier_no_pa_alignment 3x5=15 runs x 4s = 60s; subtotal 135s"
  - "Total: 125 runs, 630s raw, 480s effective after Phase 1a||1b parallelism; PASSES 480 <= 480 hard cap"
  - "Hardware: single CPU core, <4 GB memory, <100 MB output, no GPU required"
  - "Pre-built Rust binaries: harmonic-halo-stacking-manga, harmonic-halo-injection, dc14-stacking, cross-algebra-correlation, inclination-injection-calibration, contrarian-template-sweep (all in .cache/gate-target/release/)"
  - "Output directory: ${ARC_ARTIFACT_DIR:-data/output/manga_zd_exclusion}"
  - "Execution order: Phase 0 gates Phase 1 (both 1a and 1b proceed regardless but H2 results inform paper framing); Phase 1a and 1b run in parallel"
  - "9 total conditions: 2 baselines + 2 proposed methods + 5 ablations; 6 regime cells (3 inclination x 2 radial); 5 bootstrap seeds per condition"
