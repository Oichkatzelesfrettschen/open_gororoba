[[insight]]
id = "I-074"
title = "Lorentz oscillator sign convention requires absolute-value guards in derived properties"
body = """The Drude-Lorentz dielectric function has two competing sign conventions for the damping term:

Physics convention: eps = eps_inf - omega_p^2 / (omega^2 + i*gamma*omega) -> Im(eps) > 0 in absorption
Engineering convention: eps = eps_inf - omega_p^2 / (omega^2 - i*gamma*omega) -> Im(eps) < 0 in absorption

Our implementation uses Complex64::new(omega_0^2 - omega^2, gamma * omega) in the Lorentz denominator, which corresponds to the engineering convention (+i*gamma*omega). This means Im(eps) < 0 in absorption bands, and sqrt(eps) yields negative k (extinction coefficient) via the principal branch.

The robust solution is NOT to change the convention (which would break all existing epsilon() and epsilon_imaginary() values), but to use absolute values in derived quantities:
  n = sqrt(eps), with k = |Im(n)| forced non-negative
  sigma_1 = eps_0 * omega * |Im(eps)|
  alpha = 2 * omega * |k| / c
  loss = |Im(eps)| / |eps|^2

This approach is convention-agnostic: it produces correct physical observables regardless of which sign convention the underlying dielectric function uses. The reflectivity R = |(n-1)/(n+1)|^2 is invariant under Im(n) sign flip because it depends on |...|^2."""
