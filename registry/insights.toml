[[insight]]
body = """
The Lifshitz formula for Casimir free energy at temperature T is a sum over discrete imaginary frequencies (Matsubara frequencies): xi_n = 2*pi*n*k_B*T/hbar.

At T=300K: xi_1 = 2.47e14 rad/s = 0.163 eV (far-infrared, ~76 um wavelength).

This has profound implications for optical database design:
1. Only the first ~1000 Matsubara frequencies contribute significantly (xi_1000 ~ 163 eV, well into X-ray).
2. The n=0 (zero-mode) term is the most controversial: for Drude metals, eps(0) diverges (Drude prescription), while for the plasma model, eps(0) = eps_inf + omega_p^2/xi_0^2 is finite. This is the Drude-plasma controversy in Casimir physics.
3. Most of the Casimir energy comes from xi_1 to xi_100 (0.16 to 16 eV), spanning far-IR through UV. This is precisely the range covered by our Drude-Lorentz optical models.
4. The epsilon_imaginary() function (Wick rotation to imaginary frequency) is the KEY quantity: real-frequency spectroscopy enters the Casimir formula ONLY through the analytically continued eps(i*xi).
5. Polycrystalline averaging for anisotropic materials (Cs0.33WO3) must be done at each Matsubara frequency, not as a post-processing step on the Casimir energy. The UniaxialOptical.epsilon_at_matsubara() method implements this correctly.

The Hagen-Rubens relation R ~ 1 - 2*sqrt(2*omega*eps_0/sigma_dc) provides the extrapolation below the first Matsubara frequency, bridging DC conductivity measurements to the n=0 zero-mode. Our test confirms <5% agreement between HR and full model at 5 meV for gold."""
