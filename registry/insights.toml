[[insight]]
id = "I-072"
title = "Tensor permittivity requires polycrystalline averaging for scalar Casimir"
body = """Casimir force calculations between parallel plates assume a scalar dielectric function epsilon(i*xi). For anisotropic crystals like hexagonal tungsten bronzes (Cs0.33WO3), the dielectric tensor has two independent components: epsilon_parallel (c-axis) and epsilon_perpendicular (a-b plane).

For polycrystalline samples with randomly oriented grains, the correct orientation average is:
  eps_avg = (eps_par + 2*eps_perp) / 3

The 1:2 weighting arises because in 3D, there is one parallel direction and two perpendicular directions. This is the simplest valid averaging scheme; more sophisticated approaches (effective medium theory for oriented grains) exist but require knowledge of grain shape and orientation distribution.

The UniaxialOptical struct preserves both tensor components, allowing single-crystal Casimir calculations in the future while providing the polycrystalline scalar average for current use."""
