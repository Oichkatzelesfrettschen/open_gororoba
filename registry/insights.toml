Casimir force calculations between parallel plates assume a scalar dielectric function epsilon(i*xi). For anisotropic crystals like hexagonal tungsten bronzes (Cs0.33WO3), the dielectric tensor has two independent components: epsilon_parallel (c-axis) and epsilon_perpendicular (a-b plane).

For polycrystalline samples with randomly oriented grains, the correct orientation average is:
