date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-075"
title = "Matsubara frequencies bridge optical spectroscopy to Casimir force calculations"
body = """The Lifshitz formula for Casimir free energy at temperature T is a sum over discrete imaginary frequencies (Matsubara frequencies): xi_n = 2*pi*n*k_B*T/hbar.

At T=300K: xi_1 = 2.47e14 rad/s = 0.163 eV (far-infrared, ~76 um wavelength).

This has profound implications for optical database design:
1. Only the first ~1000 Matsubara frequencies contribute significantly (xi_1000 ~ 163 eV, well into X-ray).
2. The n=0 (zero-mode) term is the most controversial: for Drude metals, eps(0) diverges (Drude prescription), while for the plasma model, eps(0) = eps_inf + omega_p^2/xi_0^2 is finite. This is the Drude-plasma controversy in Casimir physics.
3. Most of the Casimir energy comes from xi_1 to xi_100 (0.16 to 16 eV), spanning far-IR through UV. This is precisely the range covered by our Drude-Lorentz optical models.
4. The epsilon_imaginary() function (Wick rotation to imaginary frequency) is the KEY quantity: real-frequency spectroscopy enters the Casimir formula ONLY through the analytically continued eps(i*xi).
5. Polycrystalline averaging for anisotropic materials (Cs0.33WO3) must be done at each Matsubara frequency, not as a post-processing step on the Casimir energy. The UniaxialOptical.epsilon_at_matsubara() method implements this correctly.

The Hagen-Rubens relation R ~ 1 - 2*sqrt(2*omega*eps_0/sigma_dc) provides the extrapolation below the first Matsubara frequency, bridging DC conductivity measurements to the n=0 zero-mode. Our test confirms <5% agreement between HR and full model at 5 meV for gold."""
related_claims = ["C-718", "C-719"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-076"
title = "Lorentzian vs Urbach tails determine optical gap finder reliability"
body = """The optical_gap_ev() method finds where the absorption coefficient alpha exceeds a threshold, starting from the transparent-window minimum. This two-pass algorithm correctly handles materials with phonon absorption at low energy.

However, the Lorentz oscillator model has a fundamental limitation: alpha ~ omega^2 far from resonance (Lorentzian tail), while real semiconductors follow alpha ~ exp(-E_0/E) (Urbach tail) below the gap. The Lorentzian tail decays as 1/omega^2 -- much more slowly than the exponential Urbach tail.

Consequence: for broad oscillators (gamma/omega_0 > 0.1), the minimum alpha can be 10^4-10^5 m^-1, meaning no transparent window exists below standard thresholds (100-1000 m^-1). The gap finder correctly returns None in this case.

For materials where the Lorentz model is a poor representation of the absorption edge (WO3 gamma=0.8 eV, CaWO4 gamma=1.0 eV), the threshold must be set above the transparent-window minimum (e.g., 1e5 m^-1). The resulting 'gap' energy corresponds to the onset of significant Lorentz tail absorption, not the true crystallographic band gap.

Takeaway: optical_gap_ev() is reliable for weak oscillators (S < 1) or narrow resonances (gamma/omega_0 < 0.01), and for order-of-magnitude gap estimation at appropriate thresholds for broader models."""
related_claims = ["C-722", "C-723"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-077"
title = "Optical sum rules as self-consistency diagnostics for Drude-Lorentz models"
body = """Sum rules connect integrated spectral quantities to fundamental material parameters, serving as powerful consistency checks:

1. f-sum rule: integral_0^inf sigma_1(omega) domega = pi*n*e^2/(2*m_e). The partial sum N_eff(omega_c) counts effective electrons contributing below cutoff. For gold, N_eff(30 eV) ~ 5e28 m^-3 matches the known carrier density.

2. Loss function sum rule: integral_0^inf omega*L(omega) domega = (pi/2)*omega_p^2. This should recover the bare plasma frequency, providing an independent check on the Drude parameters.

3. Spectral weight partitioning: W_total = W_intra (Drude) + W_inter (oscillators). The intraband weight is analytically known from omega_p, while the interband weight sums the oscillator contributions. Their ratio characterizes the balance between free-electron and bound-electron response.

4. Static sum: eps_static = eps_inf + sum(S_j) gives the DC dielectric constant for insulators. This is the zero-frequency limit of the Kramers-Kronig transform.

5. Reststrahlen subtlety: ANY Lorentz oscillator with S*omega_0/(2*gamma) > eps_inf creates a narrow frequency band where Re[eps] < 0 above the resonance. This is the reststrahlen effect in polar crystals (silica, SiC, etc.). The screened_plasma_ev() method detects these crossings -- they represent real physics, not model artifacts.

Pitfall: the f-sum rule prefactor is (2*m_e)/(pi*e^2) with NO eps_0 factor, because sigma_1 = eps_0*omega*|Im(eps)| already includes eps_0. Including eps_0 twice gives N_eff off by ~10^11."""
related_claims = ["C-724", "C-725", "C-726"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-078"
title = "Kramers-Kronig self-consistency of Drude-Lorentz models: baseline and subtraction"
body = """The Kramers-Kronig (KK) relation connects the real and imaginary parts of the dielectric function through a Hilbert transform. For causal response functions, this is exact.

Key implementation subtleties discovered:

1. BASELINE MATTERS: The KK integral reconstructs eps_1(omega) - eps_inf, NOT eps_1(omega) - 1. The eps_inf represents spectral weight from transitions far above the model's cutoff frequency. Using 1.0 as the baseline causes systematic errors proportional to (eps_inf - 1), which can be 100%+ for materials like silica (eps_inf = 2.1).

2. POLE SUBTRACTION: The naive approach of skipping grid points near the singularity at omega' = omega introduces asymmetric errors. The subtracted form replaces f(omega')/(omega'^2 - omega^2) with [f(omega') - f(omega)]/(omega'^2 - omega^2), which has a removable singularity (L'Hopital gives f'(omega)/(2*omega)). The remaining constant part is integrated analytically as a logarithmic PV correction: (1/2*omega)*ln|(Lambda-omega)/(Lambda+omega)|.

3. CONVERGENCE: The KK error decreases monotonically with grid density, confirming numerical (not model) limitation. At 20k steps over 50 eV, gold achieves < 50% RMS error. The dominant error source is the finite cutoff (50 eV) truncating high-energy spectral weight.

4. CAUSAL MODELS: Drude-Lorentz models satisfy KK exactly by construction (they are rational functions of omega with poles in the lower half-plane). A KK check therefore validates the NUMERICAL implementation, not the physics. For tabulated experimental data, KK checks would validate data quality.

Practical implication: the KK consistency metric provides an automated quality gate for any dielectric function model in the database."""
related_claims = ["C-727", "C-728", "C-729"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-079"
title = "Temperature-dependent optical response and effective medium composites"
body = """Thermal broadening of optical response has two distinct physical mechanisms:

1. PHONON OSCILLATORS (Bose-Einstein): gamma_j(T) = gamma_j(0) * coth(omega_0j / (2*k_B*T)). At T=0, coth->1 (zero-point motion sets minimum width). At T >> Theta_D, gamma grows linearly. The coth formula captures the crossover from quantum to classical phonon populations.

2. DRUDE ELECTRON SCATTERING (Bloch-Gruneisen): gamma(T) = gamma_0 * (1 + (T/T_Debye)^2). The T^2 low-temperature behavior comes from the phase space for electron-phonon Umklapp scattering. For gold (T_D=170 K), room temperature gives 4x Drude broadening.

Key constraint: only DAMPING changes with temperature, never oscillator strength or position. Oscillator strengths are determined by matrix elements (dipole transition amplitudes), which are temperature-independent in the harmonic approximation. Positions shift only through thermal expansion of the lattice (a much smaller effect, ignored here).

EMT composites: Maxwell-Garnett vs Bruggeman represents a real physical choice, not a numerical convenience. MG is valid for dilute inclusions in a host matrix (asymmetric topology). Bruggeman is valid for random two-phase mixtures with no preferred topology (symmetric, self-consistent). For Casimir calculations on composite materials, the choice of EMT affects the predicted force by up to 30% at moderate fill fractions.

Plasma screening subtlety: in the eps_inf=1 parameterization (explicit Lorentz oscillators for interband transitions), the zero-crossing of Re[eps] can be ABOVE the bare Drude omega_p. This is because Lorentz oscillator tails above their resonance frequency contribute negatively to Re[eps], effectively making the dielectric function more metallic at intermediate frequencies. The screening ratio omega_p_bare/omega_screened < 1 is correct physics for this parameterization, though it differs from the eps_inf > 1 convention where screening_ratio = sqrt(eps_inf) > 1."""
related_claims = ["C-730", "C-731", "C-732"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-080"
title = "Nonlinear optics from linear Drude-Lorentz: scope and limits of Miller's rule"
body = """Miller's rule (1964) provides a semi-empirical bridge from linear to nonlinear optical response. The key relation chi^(3) ~ delta * |chi^(1)|^4 with a nearly universal delta ~ 4.5e-24 m^2/V^2 works because both linear and nonlinear response are dominated by the same electronic transitions (anharmonic oscillator model).

Strengths of the approach:
1. Correctly predicts chi^(3) ordering: metals >> semiconductors >> wide-gap dielectrics (because |chi^(1)| = |eps-1| is largest for metals).
2. Captures the frequency dependence through chi^(1)(omega) -- near resonance, chi^(1) diverges and so does chi^(3), matching real behavior.
3. No additional parameters beyond the linear DL model.

Limitations (important caveats):
1. Miller's delta is NOT universal. It varies by 1-2 orders of magnitude between material classes. The value 4.52e-24 is calibrated for alkali halides and transparent oxides.
2. Resonant enhancement near band edges can give chi^(3) orders of magnitude above Miller's prediction. The DL model captures the resonant chi^(1) divergence but not the resonant chi^(3) enhancement from real excited states.
3. For metals, the Drude-Lorentz chi^(1) diverges at low frequency (1/omega^2), giving chi^(3) ~ 1/omega^8 -- physically unreasonable. Miller's rule should only be used at optical frequencies for metals.
4. The Sheik-Bahae TPA model is better calibrated for semiconductors than the Miller chi^(3) estimate, because it uses material-specific E_g and n rather than a universal delta.
5. GVD from numerical differentiation accumulates errors at high order (d^2k/domega^2 uses nested finite differences on n_g which itself uses finite differences on n). Step sizes 1e-4*omega keep this under control for smooth DL functions.

For Casimir physics: nonlinear corrections to the Casimir force (dynamical Casimir effect, Casimir-Polder with two-photon transitions) require chi^(3), but these are higher-order effects typically < 1% of the linear Casimir force at separations > 10 nm."""
