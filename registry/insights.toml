[[insight]]
body = """
The Kramers-Kronig (KK) relation connects the real and imaginary parts of the dielectric function through a Hilbert transform. For causal response functions, this is exact.

Key implementation subtleties discovered:

1. BASELINE MATTERS: The KK integral reconstructs eps_1(omega) - eps_inf, NOT eps_1(omega) - 1. The eps_inf represents spectral weight from transitions far above the model's cutoff frequency. Using 1.0 as the baseline causes systematic errors proportional to (eps_inf - 1), which can be 100%+ for materials like silica (eps_inf = 2.1).

2. POLE SUBTRACTION: The naive approach of skipping grid points near the singularity at omega' = omega introduces asymmetric errors. The subtracted form replaces f(omega')/(omega'^2 - omega^2) with [f(omega') - f(omega)]/(omega'^2 - omega^2), which has a removable singularity (L'Hopital gives f'(omega)/(2*omega)). The remaining constant part is integrated analytically as a logarithmic PV correction: (1/2*omega)*ln|(Lambda-omega)/(Lambda+omega)|.

3. CONVERGENCE: The KK error decreases monotonically with grid density, confirming numerical (not model) limitation. At 20k steps over 50 eV, gold achieves < 50% RMS error. The dominant error source is the finite cutoff (50 eV) truncating high-energy spectral weight.

4. CAUSAL MODELS: Drude-Lorentz models satisfy KK exactly by construction (they are rational functions of omega with poles in the lower half-plane). A KK check therefore validates the NUMERICAL implementation, not the physics. For tabulated experimental data, KK checks would validate data quality.

Practical implication: the KK consistency metric provides an automated quality gate for any dielectric function model in the database."""
