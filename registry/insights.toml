summary = "On Ada Lovelace SM 8.9, BF16 and FP16 Tensor Core WMMA share the same hardware datapath and produce identical theoretical throughput (~330 TFLOPS). Both use the 16x16x16 WMMA shape with FP32 accumulation. The key difference is the mantissa/exponent tradeoff: BF16 has 8-bit exponent + 7-bit mantissa (same dynamic range as FP32, ~0.8% error), while FP16 has 5-bit exponent + 10-bit mantissa (narrower range +-65504, ~0.1% error). For LBM scalar kernels, neither BF16 nor FP16 WMMA paths are directly applicable since collision is a point operation, not a matrix-matrix multiply. The BF16-TC proxy benchmark (tensor_core_bf16_proxy kernel in kernels_tensor_core.cu) validates this parity and completes the WMMA coverage suite: TF32/FP16/BF16/INT8/INT4. The headroom gap -- BF16 scalar LBM at ~400 MLUPS vs BF16 TC peak ~330 TFLOPS -- quantifies how far a Hermite-expansion matrix reformulation of the BGK collision step could push throughput if implemented via cuBLAS-level matrix paths."
