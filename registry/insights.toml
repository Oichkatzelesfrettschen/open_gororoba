[[insight]]
id = "I-069"
title = "Stolpp Lifshitz-Point Mechanism: Microscopic Origin of High-Field Transport Enhancement"
body = """Stolpp et al. PRB 99, 134413 (2019) provides the microscopic mechanism for the observation
in I-068: at the Lifshitz point (alpha=1/4 = J2/J1), the single-particle magnon dispersion
epsilon_k(alpha) = J(cos k + alpha cos 2k) splits from one minimum at Q=pi to two degenerate
minima at +/-Q. This has three consequences:

(1) CARRIER DOUBLING: Two Fermi surfaces instead of one. Near saturation, transport carriers are
dilute fermions near these minima. Doubling the minima doubles the available transport channels.

(2) EFFECTIVE MASS DIVERGENCE: The inverse effective mass 1/m*(alpha) = J(1-4*alpha) vanishes at
alpha=1/4, creating an effective mass divergence. For alpha > 1/4, 1/m*(alpha) = J(4*alpha - 1/(4*alpha))
increases monotonically, so K_th ~ 1/sqrt(m*) also increases.

(3) FIELD POLARITY INVERSION: At B=0, frustration opens a gap (dimer phase for alpha > 0.2411),
SUPPRESSING transport: D_E(alpha)/D_E(0) drops to ~0.25 at alpha=0.7. At B ~ B_sat, frustration
ENHANCES transport: K_th(alpha)/K_th(0) reaches ~15x at alpha=1.2 (ED, M=0.4, T/J=0.1). This
field polarity inversion is the key physics: same frustration parameter, opposite transport effect.

Our 30,778x D_S enhancement at B=3.0, N=10 is quantitatively larger than Stolpp's 15x because:
(a) stronger field B=3.0 produces deeper polarization, (b) N=10 is further from thermodynamic limit,
(c) CD interpolation spans continuous lambda from quaternion to sedenion (wider parameter range than
discrete alpha). But the DIRECTION of the effect -- enhancement at high field -- matches exactly.

The asymptotic formula K_th(alpha)/K_th(0) ~ 4*alpha (Stolpp Eq. 40 + Fig. 7) provides the scaling
law for transport enhancement by frustration in the polarized regime. This is the theoretical
foundation for the first-principles Kubo coupling model (C-681)."""
