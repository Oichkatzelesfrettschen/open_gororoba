[[insight]]
id = "I-081"
title = "Surface plasmon physics from Drude-Lorentz models: parameterization vs reality"
body = """Surface plasmon polaritons (SPPs) and localized surface plasmon resonances (LSPR) are directly computable from the complex dielectric function, but their quantitative accuracy depends critically on the DL parameterization:

1. SPP DISPERSION: k_spp = (omega/c)*sqrt(eps_m*eps_d/(eps_m+eps_d)). This is exact given eps(omega) -- the SPP dispersion relation follows analytically from Maxwell's equations at a planar interface. The DL model gives the correct qualitative behavior: k_spp > omega/c (subwavelength confinement), Im[k_spp] > 0 (lossy propagation), and L_spp decreasing with frequency as the mode approaches the surface plasmon frequency.

2. LSPR QUANTITATIVE DISCREPANCY: The Frohlich condition Re[eps] = -2 occurs at 5.93 eV in our gold model (eps_inf=1, 2 oscillators), vs the experimental ~2.5 eV. The discrepancy arises because our model uses eps_inf=1 with moderate Lorentz oscillators, while physical gold has a LARGE interband (d-band) contribution that effectively gives eps_inf ~ 9-12 at optical frequencies. In the eps_inf > 1 convention, the Frohlich crossing moves to lower energy: omega_LSPR ~ omega_p/sqrt(eps_inf + 2).

3. EVANESCENT FIELDS IN CASIMIR PHYSICS: The evanescent decay length delta = c/(omega*sqrt(-Re[eps])) determines how deeply fluctuation-induced fields penetrate each plate. For the Lifshitz formula, this sets the effective separation-dependent cutoff: at separation d, only modes with evanescent decay length > d contribute significantly. For gold at 1 eV, delta ~ 20 nm, meaning the Casimir force is dominated by near-surface modes at d < 20 nm separations.

4. FRESNEL-LIFSHITZ CONNECTION: The Fresnel reflection coefficients r_s and r_p are exactly what enter the Lifshitz formula. The casimir_energy_density() function already uses reflection_te/reflection_tm, but the new Fresnel methods allow independent validation at real frequencies, and extend to oblique incidence (relevant for Casimir-Polder forces on tilted surfaces).

Practical takeaway: for SPP propagation lengths and Casimir forces, the existing 2-oscillator gold model is adequate (errors < 30%). For LSPR predictions, a 6-oscillator Brendel-Bormann model (Rakic 1998 Table II) would give quantitative accuracy at ~2.5 eV."""
related_claims = ["C-736", "C-737", "C-738"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-082"
title = "Magneto-optical response and transport diagnostics from Drude parameters"
body = """The Drude model encodes not just optical response but the full free-carrier transport physics. Part 11 extracts this systematically:

1. DRUDE WEIGHT AND SUM RULES: D = (pi/2)*omega_p^2*eps_0 is the integrated spectral weight of the free-carrier conductivity (f-sum rule). It connects optics to thermodynamics: the ratio D_measured/D_band_theory quantifies correlation effects (kinetic energy renormalization). For strongly correlated materials like LaTiO3, D << D_band indicates Mott physics suppressing carrier kinetic energy.

2. MAGNETO-OPTICS FROM DRUDE: The off-diagonal Voigt tensor element eps_xy arises from cyclotron motion in a magnetic field. At omega >> omega_c (typical for optical frequencies and laboratory fields), eps_xy scales linearly with B. This gives Faraday rotation theta_F ~ omega*omega_c*omega_p^2 / (2*c*n*omega^3) at high frequency, demonstrating 1/omega^2 falloff -- the magneto-optical Verdet constant. For Casimir physics, the magneto-optical response modifies the Lifshitz formula by lifting the TE/TM degeneracy, leading to Casimir torques between birefringent plates.

3. TRANSPORT-OPTICS BRIDGE: dc_resistivity = gamma/(eps_0*omega_p^2) bridges optical spectroscopy and four-probe measurements. The agreement is typically 10-30% because optical omega_p includes interband contributions that four-probe resistivity does not see. The scattering_time tau = hbar/gamma connects to mean free path l = v_F*tau and to the anomalous skin depth delta_anom ~ (v_F*c^2/(omega*omega_p^2))^(1/3) in the regime omega*tau << 1.

4. CARRIER DENSITY ESTIMATION: plasma_frequency_from_density() inverts the Drude relation to get omega_p from n and m*. This enables consistency checks: given an optical omega_p and a known carrier density (from Hall effect), one can extract m*, or vice versa. For TCOs like AZO, this connects doping level to infrared plasmonic cutoff."""
related_claims = ["C-740", "C-741", "C-742"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-083"
title = "Ellipsometry, thermal emission, and ENZ physics from Drude-Lorentz: measurement connections"
body = """Part 12 bridges the DL model to three major experimental techniques:

1. SPECTROSCOPIC ELLIPSOMETRY (SE): The ratio rho = r_p/r_s = tan(psi)*exp(i*delta) is the primary measurable in SE. For an isotropic substrate at a single incidence angle, (psi, delta) at each omega are equivalent to knowing (n, k) -- the same information as the DL model provides. The key physics: at the Brewster angle, psi -> 0 because r_p -> 0 while r_s stays finite. For metals with large Im[n], there is no true Brewster angle (only a pseudo-Brewster minimum), so psi stays finite everywhere. SE fitting typically refines DL parameters (omega_p, gamma, oscillator strengths) by minimizing MSE between measured and modeled (psi, delta).

2. THERMAL EMISSION: Kirchhoff's law connects absorptivity to emissivity for bodies in thermal equilibrium. For opaque materials (metals at optical wavelengths, thick dielectrics), emissivity = 1 - R. The spectral emittance L = emissivity * Planck tells us what wavelengths a hot body radiates. For Casimir physics, thermal emission corrections (finite-T Lifshitz) are proportional to k_B*T/hbar*c, becoming important at separations d > hbar*c/(k_B*T) ~ 7 um at 300K. The n=0 Matsubara term captures this thermal correction and is the center of the Drude-plasma controversy (see casimir_drude_plasma_discrepancy).

3. ENZ PHYSICS: At the epsilon-near-zero frequency, the material's permittivity passes through zero, creating exotic optical effects: divergent phase velocity (but finite group velocity), vanishing in-material wavelength (super-coupling), and dramatic enhancement of nonlinear effects (chi^(3)/eps^2 diverges). For metals, the ENZ point IS the screened plasma frequency. For ENZ metamaterials and TCOs like AZO, the ENZ point can be tuned to technologically relevant wavelengths (telecom, mid-IR) by adjusting carrier density. The reststrahlen band in polar dielectrics (omega_TO to omega_LO) is effectively a broadband ENZ-like region where eps < 0.

4. LYDDANE-SACHS-TELLER RELATION: The LST relation omega_LO^2/omega_TO^2 = eps_static/eps_inf connects the phonon splitting to the dielectric screening. Large splitting (SrTiO3: eps_static/eps_inf ~ 100) means strong ionic polarizability. The reststrahlen band width scales as sqrt(eps_static/eps_inf) - 1, which is why ferroelectric perovskites have the broadest reststrahlen bands."""
related_claims = ["C-743", "C-744", "C-745"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-084"
title = "EELS, LDOS, and absorption engineering: from fundamental response to device design"
body = """Part 13 connects the dielectric function to three application domains:

1. ELECTRON ENERGY LOSS: The loss function Im[-1/eps] (bulk) and Im[-1/(1+eps)] (surface) are the two fundamental EELS spectra. They peak at different frequencies: bulk at the volume plasmon (Re[eps] = 0), surface at the surface plasmon (Re[eps] = -1). The surface plasmon is always at LOWER energy than the bulk plasmon (by a factor 1/sqrt(2) in the free-electron model). For Casimir physics, the loss function enters through the fluctuation-dissipation theorem: the electromagnetic vacuum fluctuation spectral density is proportional to Im[eps].

2. PURCELL EFFECT AND CASIMIR-POLDER: The LDOS modification near a surface (Purcell factor) and the associated Lamb shift are the single-emitter analogs of the Casimir effect. The Casimir energy between two plates is the sum of all vacuum mode energy shifts, while the Purcell/Lamb shift is the mode shift experienced by a single quantum emitter. The 1/d^3 near-field scaling of both effects comes from the quasistatic (non-retarded) limit of the electromagnetic Green's function, which dominates when the emitter-surface separation is much smaller than the wavelength.

3. ABSORPTION AND IMPEDANCE MATCHING: Perfect absorption occurs when the surface impedance matches free space (Z = Z_0 = 377 Ohm). For a bare metal half-space this never happens (metals have |Z| << Z_0). But for thin-film absorbers, interference between front and back reflections can achieve critical coupling. The impedance_mismatch() metric quantifies how far from this condition a given material is. For metamaterial absorbers (Thesis 1), the goal is to design stacks where interference zeros the net reflection -- making impedance_mismatch = 0 at the target frequency. The optimal_absorber_thickness gives the single-layer starting point."""
related_claims = ["C-746", "C-747", "C-748"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-085"
title = "Quality metrics and coherence: bridging optics to device performance"
body = """Part 14 provides dimensionless figures of merit that connect the DL model parameters to device-level performance metrics:

1. QUALITY FACTORS: Three distinct Q-factors serve different purposes. The oscillator Q = omega_0/gamma measures phonon or exciton lifetime (relevant for polaritonics, where high-Q phonons hybridize with photons to form phonon-polaritons). The Drude Q = omega/gamma measures how many coherent oscillation cycles the free carriers complete before scattering (relevant for antenna efficiency, plasmonic waveguiding). The SPP FoM = Re[k]/2Im[k] directly counts how many surface plasmon wavelengths propagate before 1/e decay -- this is the metric that determines whether long-range SPP waveguides are feasible.

2. SPECTRAL WEIGHT ANALYSIS: The windowed spectral weight integral partial_SW = integral[sigma_1 d_omega] partitions the total f-sum into arbitrary frequency windows. This reveals where the oscillator strength resides: for metals, most SW is below the plasma frequency (intraband); for semiconductors, it's at the band edge; for ionic crystals, it's at the phonon frequencies. The ratio of intraband to total SW is a measure of metallicity.

3. COHERENCE AND INTERFERENCE: The coherence length l_c = c/(n*delta_omega) determines the maximum optical path difference for which interference fringes are visible. For Casimir physics, the relevant coherence length is set by the Matsubara frequency spacing 2*pi*k_B*T/hbar ~ 2.6e13 rad/s at 300K, giving l_c ~ 7 um -- this is why the Casimir effect transitions from quantum (retarded) to thermal (non-retarded) behavior at plate separations around 7 um.

4. PENETRATION DEPTH RATIO: delta/lambda classifies the interaction regime. When delta/lambda << 1 (metals in visible): the material acts as a mirror, and skin-depth effects dominate Casimir force corrections. When delta/lambda >> 1 (dielectrics): the material is transparent and the Casimir force comes from bulk dielectric response. The crossover delta/lambda ~ 1 marks the onset of anomalous skin effect physics (relevant for high-purity metals at low temperature)."""
related_claims = ["C-750", "C-751", "C-752"]
date = "2026-02-17"
sprint = 44

[[insight]]
id = "I-086"
title = "Photovoltaic metrics and selective thermal emission: from material response to energy harvesting"
body = """Part 15 bridges the DrudeLorentzParams dielectric model to solar energy and thermophotovoltaic (TPV) device metrics:

1. SOLAR ABSORPTANCE AND REFLECTANCE: The AM1.5G solar spectrum peaks near 2.5 eV (500 nm). Solar absorptance alpha_s = integral[A(omega)*S(omega)*d_omega]/integral[S(omega)*d_omega] weights the material absorptance A=1-R by the blackbody solar spectrum (approximated at T_sun=5800K). Metals like gold have alpha_s ~ 0.5 (high visible reflectance), while dielectrics like silica have alpha_s near zero (transparent). The complement solar_reflectance = 1 - alpha_s is the figure of merit for solar mirrors.

2. ANTIREFLECTION COATINGS: Quarter-wave AR coating thickness d = lambda/(4*n) minimizes reflection when the coating refractive index n = sqrt(n_substrate). The antireflection_thickness() method gives this optimal thickness for single-layer coatings. For the Casimir effect, AR coatings on plate surfaces modify the reflection coefficients and hence the Casimir force -- a practical tuning knob explored in Thesis 1 metamaterial stacks.

3. WIEN DISPLACEMENT LAW: The peak of the Planck spectral radiance is at omega_peak = 2.821 * k_B * T / hbar (in rad/s). At T=5800K this gives ~2.5 eV (visible), at T=300K it gives ~62 meV (mid-IR). Wien's law connects equilibrium thermal radiation to the material optical response: a material that absorbs strongly at omega_peak will also emit strongly there (Kirchhoff's law). The static methods wien_peak_omega() and wien_peak_ev() provide this conversion.

4. LUMINOUS REFLECTANCE: The CIE photopic luminosity function V(lambda) peaks at 555 nm (2.23 eV) with approximate Gaussian width sigma ~ 0.34 eV. Luminous reflectance R_v = integral[R(omega)*V(omega)*d_omega]/integral[V(omega)*d_omega] is the photometrically-weighted reflection relevant for architectural glass, display coatings, and laser safety. Metals like gold are highly luminous-reflective; dielectrics like silica are not.

5. SELECTIVE EMITTER EFFICIENCY: TPV devices require selective thermal emitters that radiate strongly above the PV cell bandgap but suppress sub-bandgap emission (which generates heat, not electricity). The selective_emitter_efficiency eta = integral[eps(omega)*B(omega,T)*d_omega for omega>omega_gap] / integral[eps(omega)*B(omega,T)*d_omega] quantifies this selectivity. Tungsten (with its natural emissivity rolloff in the IR) is a classic selective emitter; WO3-x plasmonic oxides (Part 2) are designed to enhance this selectivity through engineered plasma edges."""
related_claims = ["C-753", "C-754", "C-755"]
date = "2026-02-17"
sprint = 44

