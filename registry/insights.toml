[[insight]]
id = "I-068"
title = "Varma Mechanism Explains Polarized-Regime Transport Enhancement"
body = """The 30,778x D_S enhancement with frustration at B=3.0, T=0.1, N=10 appears paradoxical
against the standard result that frustration suppresses spin transport (Heidrich-Meisner PRB 68,
134436). The resolution comes from two independent published mechanisms:

(1) Varma & Sanchez PRB 92, 195143 (2015) showed that Drude weight can increase with frustration
in a regime where competing interactions suppress the frustrating effects. This produces non-monotonic
transport: D first rises (frustration suppressed by interactions), then falls (CDW fluctuations).

(2) In the strong-field polarized regime (B=3J >> T=0.1J), the external field gaps all spin excitations.
Increasing J2 (frustration) competes with polarization, reopening low-energy channels. The mechanism
is opposite to zero-field: at B=0, J2 gaps the spectrum; at B>>J, J2 ungaps it.

These are distinct from the standard Karrasch (PRL 108, 2012) picture where D_S decreases monotonically
with anisotropy Delta at B=0. The three regimes (B=0 integrable, B=0 frustrated, B>>J frustrated)
have qualitatively different transport physics, now documented with published benchmark comparisons."""
