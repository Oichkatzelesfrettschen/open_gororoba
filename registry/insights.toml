[[insight]]
id = "I-071"
title = "Meltdown gating as control-theoretic adaptive concurrency regulation"
body = """The meltdown gating algorithm adjusts the threshold epsilon adaptively at each step based on the current concurrency m_n compared to a target M0. The update rule (eps *= gamma_up when m_n > M0, eps *= gamma_down when m_n < Mlow) is structurally identical to a PI controller acting on the concurrency signal.

The controller interpretation: M0 is the setpoint, (m_n - M0) is the error signal, and gamma_up/gamma_down are the proportional gains for the two branches of the dead-band controller. The dead band [Mlow, M0] prevents oscillation around the target (equivalent to integral windup protection in classical control). The bounds eps_min and eps_max enforce actuator saturation limits.

Classical PI-controller design theory predicts: (1) the p95 concurrency will be reduced vs fixed-eps by reducing overshoot episodes, (2) the RelErr cost is bounded because eps is decreased (more coefficients retained) when m_n < Mlow, preventing accuracy degradation. Thesis 2 (C-704) validates both predictions empirically: >= 10% p95 reduction at RelErr <= 0.02 across four rho values on the forced-diffusion surrogate."""
