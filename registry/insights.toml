[[insight]]
id = "I-073"
title = "Oxygen vacancy concentration controls plasmon frequency in WO3-x"
body = """The transition from wide-gap semiconductor (WO3) to plasmonic conductor (WO3-x) is controlled entirely by oxygen vacancy concentration x. Each vacancy donates ~2 electrons, so carrier density scales as n ~ 2*x*N_WO3 where N_WO3 is the WO3 unit cell density (~2.3e22 cm^-3).

For x~0.1: n ~ 4.6e21 cm^-3, giving omega_p ~ 1.5 eV (NIR plasmon)
For x~0.03: n ~ 1.4e21 cm^-3, giving omega_p ~ 0.8 eV (SWIR plasmon)
For x~0.01: n ~ 4.6e20 cm^-3, giving omega_p ~ 0.45 eV (MWIR plasmon)

This tunability makes WO3-x unique among plasmonic oxides: the same base material can be tuned from visible-transparent insulator to NIR/MWIR plasmon resonance by controlling reduction conditions. The effective mass m*=1.2*m_e is relatively stable across the doping range because the conduction band minimum at Gamma has weak dispersion variation with filling.

This is physically distinct from the Cs0.33WO3 bronze, where carriers come from Cs intercalation into tunnel sites (fixed stoichiometry, anisotropic transport) rather than from oxygen vacancy disorder (variable, isotropic)."""
