id = "I-078"
related_claims = ["C-727", "C-728", "C-729"]
sprint = 44
title = "Kramers-Kronig self-consistency of Drude-Lorentz models: baseline and subtraction"

[[insight]]
body = """
Thermal broadening of optical response has two distinct physical mechanisms:

1. PHONON OSCILLATORS (Bose-Einstein): gamma_j(T) = gamma_j(0) * coth(omega_0j / (2*k_B*T)). At T=0, coth->1 (zero-point motion sets minimum width). At T >> Theta_D, gamma grows linearly. The coth formula captures the crossover from quantum to classical phonon populations.

2. DRUDE ELECTRON SCATTERING (Bloch-Gruneisen): gamma(T) = gamma_0 * (1 + (T/T_Debye)^2). The T^2 low-temperature behavior comes from the phase space for electron-phonon Umklapp scattering. For gold (T_D=170 K), room temperature gives 4x Drude broadening.

Key constraint: only DAMPING changes with temperature, never oscillator strength or position. Oscillator strengths are determined by matrix elements (dipole transition amplitudes), which are temperature-independent in the harmonic approximation. Positions shift only through thermal expansion of the lattice (a much smaller effect, ignored here).

EMT composites: Maxwell-Garnett vs Bruggeman represents a real physical choice, not a numerical convenience. MG is valid for dilute inclusions in a host matrix (asymmetric topology). Bruggeman is valid for random two-phase mixtures with no preferred topology (symmetric, self-consistent). For Casimir calculations on composite materials, the choice of EMT affects the predicted force by up to 30% at moderate fill fractions.

Plasma screening subtlety: in the eps_inf=1 parameterization (explicit Lorentz oscillators for interband transitions), the zero-crossing of Re[eps] can be ABOVE the bare Drude omega_p. This is because Lorentz oscillator tails above their resonance frequency contribute negatively to Re[eps], effectively making the dielectric function more metallic at intermediate frequencies. The screening ratio omega_p_bare/omega_screened < 1 is correct physics for this parameterization, though it differs from the eps_inf > 1 convention where screening_ratio = sqrt(eps_inf) > 1."""
