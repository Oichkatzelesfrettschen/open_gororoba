[[insight]]
id = "I-070"
title = "Wavelet reservoir bridging as Mori-Zwanzig exponential-memory closure"
body = """The negative-dimensional reservoir in WaveletBridge accumulates sub-threshold wavelet coefficients that are below the hard-threshold eps. Reinjection occurs with weight alpha = 1 - exp(-kappa*dt), which is precisely the discrete-time memory kernel of a Mori-Zwanzig projection operator with exponential memory decay rate kappa.

The key insight is that hard-threshold compression is a non-unitary projection P on wavelet space: P maps the full state c to its sparse approximation c_thresh. The complement Q = I - P accumulates in the reservoir buffer. Rather than discarding Q*c at each step (plain compression), the bridge reinjects it weighted by the time-integrated memory kernel.

Thesis 3 (C-705) empirically validates that the ACF of the unresolved energy ||Q*c||^2 is single-exponential with R2 >= 0.95 for eps <= 1e-2. This grounds the exponential-weight alpha choice in the Mori-Zwanzig projection formalism: if the ACF decays as exp(-kappa*tau), the optimal memory kernel for the reinjection is exactly 1 - exp(-kappa*dt). The forced-diffusion surrogate (rho*sin*u^2 nonlinearity) generates multiscale structure that makes this closure non-trivial and potentially beneficial for compressed PDE integration."""
