title = "Lorentzian vs Urbach tails determine optical gap finder reliability"

[[insight]]
body = """
Sum rules connect integrated spectral quantities to fundamental material parameters, serving as powerful consistency checks:

1. f-sum rule: integral_0^inf sigma_1(omega) domega = pi*n*e^2/(2*m_e). The partial sum N_eff(omega_c) counts effective electrons contributing below cutoff. For gold, N_eff(30 eV) ~ 5e28 m^-3 matches the known carrier density.

2. Loss function sum rule: integral_0^inf omega*L(omega) domega = (pi/2)*omega_p^2. This should recover the bare plasma frequency, providing an independent check on the Drude parameters.

3. Spectral weight partitioning: W_total = W_intra (Drude) + W_inter (oscillators). The intraband weight is analytically known from omega_p, while the interband weight sums the oscillator contributions. Their ratio characterizes the balance between free-electron and bound-electron response.

4. Static sum: eps_static = eps_inf + sum(S_j) gives the DC dielectric constant for insulators. This is the zero-frequency limit of the Kramers-Kronig transform.

5. Reststrahlen subtlety: ANY Lorentz oscillator with S*omega_0/(2*gamma) > eps_inf creates a narrow frequency band where Re[eps] < 0 above the resonance. This is the reststrahlen effect in polar crystals (silica, SiC, etc.). The screened_plasma_ev() method detects these crossings -- they represent real physics, not model artifacts.

Pitfall: the f-sum rule prefactor is (2*m_e)/(pi*e^2) with NO eps_0 factor, because sigma_1 = eps_0*omega*|Im(eps)| already includes eps_0. Including eps_0 twice gives N_eff off by ~10^11."""
