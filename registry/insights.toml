title = "Temperature-dependent optical response and effective medium composites"

[[insight]]
body = """
Miller's rule (1964) provides a semi-empirical bridge from linear to nonlinear optical response. The key relation chi^(3) ~ delta * |chi^(1)|^4 with a nearly universal delta ~ 4.5e-24 m^2/V^2 works because both linear and nonlinear response are dominated by the same electronic transitions (anharmonic oscillator model).

Strengths of the approach:
1. Correctly predicts chi^(3) ordering: metals >> semiconductors >> wide-gap dielectrics (because |chi^(1)| = |eps-1| is largest for metals).
2. Captures the frequency dependence through chi^(1)(omega) -- near resonance, chi^(1) diverges and so does chi^(3), matching real behavior.
3. No additional parameters beyond the linear DL model.

Limitations (important caveats):
1. Miller's delta is NOT universal. It varies by 1-2 orders of magnitude between material classes. The value 4.52e-24 is calibrated for alkali halides and transparent oxides.
2. Resonant enhancement near band edges can give chi^(3) orders of magnitude above Miller's prediction. The DL model captures the resonant chi^(1) divergence but not the resonant chi^(3) enhancement from real excited states.
3. For metals, the Drude-Lorentz chi^(1) diverges at low frequency (1/omega^2), giving chi^(3) ~ 1/omega^8 -- physically unreasonable. Miller's rule should only be used at optical frequencies for metals.
4. The Sheik-Bahae TPA model is better calibrated for semiconductors than the Miller chi^(3) estimate, because it uses material-specific E_g and n rather than a universal delta.
5. GVD from numerical differentiation accumulates errors at high order (d^2k/domega^2 uses nested finite differences on n_g which itself uses finite differences on n). Step sizes 1e-4*omega keep this under control for smooth DL functions.

For Casimir physics: nonlinear corrections to the Casimir force (dynamical Casimir effect, Casimir-Polder with two-photon transitions) require chi^(3), but these are higher-order effects typically < 1% of the linear Casimir force at separations > 10 nm."""
