source_ref = "This collapses from ~6 FP operations to 3 FMA + 1 MUL. At 4.54 cy per FFMA, the saving is approximately 2 FFMA cycles per direction per cell, which sums to 38 cycles per cell across all 19 lattice directions. YSU-engine reported a 3.16x MLP speedup via hand-scheduled FMA sequences in their Vulkan compute shaders. Note: nvcc with --use_fast_math may already contract multiply-add pairs to FMA instructions, but explicit fmaf() calls guarantee the schedule regardless of optimization level and prevent the compiler from reordering operations that would break the FMA chain. This is particularly important for NVRTC runtime compilation where optimization flags may vary. ## Shared Memory Strategy for Lattice Neighbor Access D3Q19 streaming reads 19 neighbors per cell from global memory. Even with SoA layout providing coalesced access, each cell still issues 19 separate global loads during the streaming step. A shared memory tiling strategy can reduce this cost significantly for kernels that access spatial neighbors. **Tiling approach:** A 3x3x3 tile in shared memory covers all D3Q19 neighbor directions (the D3Q19 velocity set spans at most +/-1 in each axis). The cooperative loading protocol is: 1. Each thread loads its own cell data from global memory into shared memory. 2. Boundary threads additionally load halo cells (1-cell border). 3. Call __syncthreads() to ensure all loads complete. 4. Each thread reads its 19 neighbors from shared memory instead of global. **Latency comparison:** - Shared memory read: ~28 cy per access - Global memory read: ~92-200 cy per access (depending on cache behavior) - Improvement: 3-7x per read operation **Caveat for our codebase:** The dark_halo kernel already uses SoA layout which provides coalesced global reads. Shared memory tiling is most beneficial for the collision kernel with force coupling, which reads rho, velocity, and force vectors from neighbors for gradient computation (enstrophy kernel, MHD source terms). **SM 8.9 shared memory budget:** Ada Lovelace SM 8.9 has 100 KB of configurable L1/shared memory. With 48 KB allocated to shared memory: - Capacity: 48K / (4 bytes * 19 directions) = ~631 cells per block - At 128 threads/block: each thread has ~5 cells of shared memory buffer - This is sufficient for a 3D tile with halo, provided block dimensions are chosen to minimize the surface-to-volume ratio of the tile (e.g., 8x4x4 rather than 128x1x1) ## Occupancy Culling for Sparse DM Density Regions NFW dark matter density profiles concentrate mass at the galactic center and fall off as 1/r at small radii and 1/r^3 at large radii. In our heliospheric simulation domain (1-157 AU), approximately 60% of cells at outer radii (>50 AU) have DM density below the threshold where drag forces are physically significant. **Early-exit strategy:** In the Guo forcing kernel, add an early-exit check before the 19-iteration forcing loop"
