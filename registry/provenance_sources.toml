source_ref = "This avoids the 19-iteration Guo forcing loop for cells with negligible DM drag, saving approximately 19 * (2 FMA + 1 MUL) = ~95 FP operations per skipped cell. **Analogy to YSU-engine:** YSU uses similar culling for empty voxels in volume rendering -- transparent cells skip the shading pipeline entirely. The principle is identical: avoid computation in regions where the result is below the noise floor. **Warp divergence tradeoff:** Early-exit creates divergence within warps when some threads exit and others continue. However, the net throughput gain exceeds the divergence penalty when more than 50% of cells in a warp qualify for the early exit. At outer heliosphere distances, the skip fraction typically exceeds 60%, making this a net win. Use __ballot_sync(0xFFFFFFFF, force_mag < FORCE_EPSILON) to count active lanes within a warp. This enables adaptive behavior: if ALL 32 lanes would skip, the entire warp can return early without any divergence penalty. Our dark_halo_detector kernel already uses __ballot_sync + __popc for warp-level reduction (the same pattern). **Expected speedup:** Approximately 2x for the Guo forcing kernel at outer heliosphere distances (>50 AU), decreasing to ~1.1x near 1 AU where DM density is more uniform above threshold. ## Polynomial Transcendental Approximation The MUFU special function unit on Ada Lovelace costs 17.56 cy for exp2 and ~17 cy for sin, compared to 4.54 cy for FFMA -- a 3.9x latency ratio. Additionally, SFU throughput is only 16 ops/cycle/SM versus 128 for FFMA, an 8x throughput gap. **Where transcendentals appear in our LBM kernels:** 1. Voudon frustration kernel: sinf() for phase modulation 2. Zero-divisor viscosity modulation: sinf() for oscillatory tau adjustment 3. Potential future DM cross-section: exp() for temperature-dependent sigma **D3Q19 equilibrium is already polynomial** -- no transcendentals needed. The FMA chain optimization in Section 2 applies directly without any approximation error. **Polynomial replacement options:** - Degree-4 Chebyshev polynomial for exp(x) on [-2, 2]: ~1e-5 relative error, cost = 4 FMA = ~18.2 cy (comparable to MUFU.EX2 at 17.56 cy -- marginal gain) - Degree-5 minimax polynomial for sin(x): ~1e-6 accuracy, cost = 4 FMA + 1 MUL = ~23 cy (worse than MUFU.SIN at ~17 cy) **Recommendation:** Only apply polynomial transcendental approximation when profiling shows that transcendentals consume more than 10% of total kernel time. For current D3Q19 kernels, the FMA chain optimization (Section 2) and shared memory tiling (Section 3) give larger payoffs. The polynomial approach becomes worthwhile only if a future kernel introduces transcendentals in the hot inner loop (e.g., per-cell temperature-dependent cross sections evaluated every timestep). ## CUDA Assembly Optimization Reference SASS (Streaming ASSembler) analysis provides ground-truth performance data that complements high-level profiling. Two key tools: -"
