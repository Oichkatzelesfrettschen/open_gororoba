he count Moreno's formula would allow. The 15 Pathion ensembles of Assessors have many features we've already seen in box-kites: Assessors at all 14 vertices of the analogous lattice have the same inner xor, its value - one of 15 possible (O or) S indices - acting as the ensemble's signature. This signature plays the role of \"strut constant\" as well, so that the Assessors at the 14 vertices are arrayed in opposing pairs which do not form DMZ's, since their products include non-canceling pairs of strut-constant-indexed and index-16 imaginaries. And, as with box-kites, not just the (here, index- 16 instead of 8) generator, but the Assessor whose Pathion is the xor of the strut constant with it, is also excluded from the lattice. While this much is easy to see, visualizing the connectedness of these ensembles is hard: with each having 14 vertices, possibly forming DMZ's with all but 1 of the others, we have 84 edges, forming (14 x 12)/3! = 28 \"sails,\" divvied out among 7 Box- Kites, each of which shares each of its 3 strut with 2 of the others. We say \"possibly forming\" advisedly: one of the most surprising features of these ensembles - and why, as we'll see, we call them \"sand mandalas\" - is that the full count of 168 DMZ's is only ob- tained when the strut constant is 8 or less. And, when it is precisely 8, we get a peculiar phenomenon we'll call \"edge polarization.\" To grasp these things, however, a different sort of visualizing strategy is called for. In a partial generalization of the table appended to the box-kite diagram toward the start of this paper, we'll display the behaviors of the sand mandalas in 14 x 14 spreadsheet-like layouts we'll call emanation tables. As with the column headings there, indices will be arranged to best satisfy two sometimes conflicting constraints. First, Assessors on opposite ends of a strut are given symmetrically opposite placement, so that indices have \"nested parentheses\" ordering (just as columns A and F, B and E, and C and D formed strut-opposed pairings in the earlier table). Second, when this first constraint allows (as it does for the first half of the column heads for all sand mandalas with strut constants of 8 or greater), the lower- indexed Assessors from all strut-pairs should have their O or S terms placed atop the columns in ascending left-to-right order (and top-to-bottom order on the rows). When arranged in this manner, all cells of both long diagonals of the table will always be empty: those running from the upper left toward the bottom right represent products of an Assessor's diagonals with themselves, and these can never form DMZ's; those running downward from the upper right, meanwhile, represent products of \"strut opposites,\" and these will always contain pairs of index-16 and strut-constant-indexed imaginaries. The remaining 142 - (2 x 14) = 168 cell entries are assumed, by convention, to be the O or S indices of the ZD \"emanated\" by multiplying the row-head's Assessor times the column-head's, with appropriate edge-sign prefixing the entry. Page 13 We'll construct the first \"emanation table,\" for strut constant = 1, now. All the Assessors have inner xor 17, units indexed 1 and 16 are excluded, and \"nested parenthe- ses\" plus left-right (top-bottom) ordering give us the Sedenions listed in the first line as column and row headings, associated with the Pathions of index > 16 listed below them: 2 4 6 8 10 12 14 15 13 11 9 7 5 3 19 21 23 25 27 29 31 30 28 26 24 22 20 18 2 4 6 8 A C E F D B 9 7 5 3 2 6 4 A 8 E C D F 9 B 5 7 For compactness of presenta- 4 tion, edge signs associated with ema- 6 2 C E 8 A B 9 F D 3 7 nating the Assessors in the cell entries 6 4 2 E C A 8 9 B D F 3 5 are indicated by putting their Sedeni- 8 A C E 2 4 6 7 5 3 F D B on indices in underscored italics, with A 8 E C 2 6 4 5 7 3 D F 9 hex notation used for indices > 9: Se- C E 8 A 4 6 2 3 7 5 B 9 F denions 10 through 15 display as let- E C A 8 6 4 2 3 5 7 9 B D ters A through F. Our table will then F D B 9 7 5 3 2 4 6 8 A C look as shown at left. D F 9 B 5 7 3 2 6 4 A 8 E Cell-entry values are deployed B with mirror symmetry about the void 9 F D 3 7 5 4 6 2 C E 8 9 diagonals; they also show reverse-or- B D F 3 5 7 6 4 2 E C A der symmetry in opposite rows: e.g., 7 5 3 F D B 9 8 A C E 2 4 entries for the leftmost 2nd - 7th cells 5 7 3 D F 9 B A 8 E C 2 6 of the top row echo those for the 14th 3 7 5 B 9 F D C E 8 A 4 6 - 8th on the bottom-most row. Note that all 168 available cell-entries are filled with emanations: save for the diagonals, all row-listed ZD's form DMZ's with all column-listed ZD's. As a harbinger of things to come, however, the eighth such table (strut constant indexing the Sedenions' generator) shows a peculiar alignment: in each quadrant, all edge-signs are identical. In upper left and lower right, they're negative, and positive otherwise. As is readily shown by writing products in CDP form and recalling that all inner xor's will equal 16 + 8, this is a side-effect of the peculiar characteristic of generators mentioned earlier: namely, all their products with lower-indexed units, if taken on the same side, have the same sign. More subtle, and far more surprising, is an effect ultimately attributable to the same root cause, but by a less transparent route: when the strut constant gets bigger than the generator's index, only 72 of the available cell-entries contain emanations. Even more mysterious, if we subtract 8 from the strut constant and call this the \"excess,\" then 48 of these cell entries saturate the rows and columns at a distance of the excess from the outer boundary: hence, for strut constant 9, all the outermost cells save for the 4 corners are filled, and for 15, a cross of central rows and columns (minus the central square the diagonals make) is formed, with contents evenly divided among allowed row- and col- umn- heading Sedenions, save for '8' and the excess. Instead, these excepted entries are equally dispersed among the remaining 24 filled cells, with the edge-signs always nega- tive for entries of index '8' (and always positive for index equal to the excess), and re- stricted to the same quadrants as the '/' and '\\' empty diagonals respectively. Page 14 Viewed in sequence, these tables suggest the patterns made by cellular automata; seen individually, they suggest nothing so much as the short-shelf-life \"sand mandalas\" of Tibetan Buddhist ritual, made by monks on large flat surfaces with colored sands or powdered flowers, minerals, or even gemstones. To best convey this sensibility, all 7 of the 72-entry tables (prefaced by the \"edge-polarized\" table generated by strut constant 8) are arrayed in two rows of four each, to be scanned left to right, top row first. They have also been color-coded: the void diagonals are left empty; the cells which \"should\" be filled but are magically left content-free are painted gray; the 24 entries made of strut- constant components are green; the 48 which contain all other allowed entries are ren- dered in red. (Rendered originally in MS Word tables, the cell-entry contents are quite readable at 200% zoom in their native application; they become muddy, however, and hard to read, when zoomed in the PDF format they were ported to, for which we offer our apologies. In one sense, though, this \"bug\" is a \"feature\": it demands you attend to the overall patterning, which is obviously what matters most here!) We're not yet done with surprises: for just as Kite-Chain Middens indicate a way in which low-level structure can be echoed higher up the endless 2n -ion ladder, the seven 72-cell sand mandalas show us the way to collapse from one level of form to that native to a level lower down. If we fold any of their tables along their row and column mid- lines, the red cells of the sand mandala in question will overlay precisely and only those O's and S's which form the vertices of the Box-Kite whose strut constant is equal to the \"excess.\" The cells painted green, on the other hand, will adjoin the Sedenions' index-8 generators and the Box Kite's own strut constant in a trio of ensembles, one per strut - or, said another way, one for each \"forbidden\" O-triplet containing the strut constant. We can imagine the Pathion units associated uniquely with each emanation-table entry being \"boiled off\" by some reductive process, the possible nature of which must be left for future contemplation. We can also, of course, imagine \"Sand-Mandala-Chain Middens,\" echoing their basic structure in a modulo-32 rhythm. And we can imagine even richer possibilities with the 31 emanation tables associated with the Chingons . . . \"restless triplet\" cyclings connecting all such systems . . . and so on. Page 15 To reach an understanding of the happenings in higher reaches, a more formal grasp of the simplicities underlying the surprises in the Pathions would stand us well. We know that units indexed g = 2n - hence, any generators of the next (2n -1) units via CDP - operate in a uniquely uniform way. For all units iu , u < g, iu <U+00B7> ig = + i(u+g) . In the upper left (\"NW\") quadrant of the emanation table, meanwhile, all row and column index-pairs can be written (r, R) and (c, C) respectively, where lower-case indices all are O's, and upper-case are P's (all > 16). Specifically, for all 72-celled sand mandalas, each Asses- sor's inner xor (\"ix\") = 24 + <U+039E> , where <U+039E> (\"xi\") is the \"excess\" in the range of 1 to 7. But 24 is the sum of the first two generators which yield ZD behavior. Multiplied with O's, the combined effect of the unilateral signing behavior of each taken separately is reversed: i24 <U+00B7> iu = + i(24+u) . Further, if iu <U+00B7> iv = + iw makes an O triplet, i(24 + u) <U+00B7> i(24 + v) = + iw also. (By CDP, we get (- i(8 + u) <U+00B7> i(8 + v) ); this gives + iw by the \"Quadrant III\" rule applied to generation of S's from O's.) Hence, for all u = r or c in the NW box, the term- by-term signing of the two pairs of units in the product (r, 24 + r*) <U+00B7> (c, 24 + c*) will be the same as for (r, r*) <U+00B7> (c, c*). But this latter just involves O's, and so lacks the sign- canceling among like-indexed terms DMZ's require - and so, therefore, must the former! The only way around this null result is for one of the indices of R, C, or R xor C to be precisely 24, with corresponding index r, c, or r xor c precisely the excess <U+039E> . Say r = <U+039E> , left-multiply (c, C) by (r, R), and leave a sign-variable sg(..) = <U+00B1> (..) undetermined: (<U+039E> , 24) <U+00B7> (c, 24 + c*), where c <U+00B7> c* = sg( <U+039E> ), and hence <U+039E> <U+00B7> c = sg( c* ) Left-multiplying by <U+039E> , then 24, we get these indices in successive output lines: <U+039E> <U+00B7> c <U+00E0> sg( c* ), <U+039E> <U+00B7> (24 + c*) <U+00E0> 24 + (<U+039E> <U+00B7> c*) = ( - sg(24 + c) ) 24 <U+00B7> c <U+00E0> (24 + c), 24 <U+00B7> (24 + c*) <U+00E0> (- c* ) Comparing cross-terms in the two lines, it's clear we have a zero product, with the edge between (r, R) and (c, C) being signed the same as sg. Supposing c is <U+039E> instead leads to the same result with a change of labels; slightly more work is called for if <U+039E> is in the product instead of either multiplier. By symmetry, the same ZD criteria just demon- strated can be appropriately interpreted in all quadrants. The 72-count (not just of non- void cell entries, but of distinct DMZ pairings of ZD diagonals) follows trivially. That last parenthetical remark is a signal one: in Sedenion Box-Kites, the 12 ZD diagonals in each, each belong to 2 Sails, making 24 DMZ's in all. In this, they conform to the same formula we can generalize from the sand mandalas with <U+039E> > 0: for 2n -ions, n>3, the ZD-pairings formula, up to Voudons, gives 6 <U+00B7> (2n-1 -4) = 24, 72, 168, 360, 744. Alone in this series, the pairings for Pathions are a simple multiple of their predecessors'. A little investigation shows us why: each of the 7 \"excessive\" sand mandalas can in fact be partitioned into 3 Box-Kites, all sharing the same strut constant, but otherwise exactly like those in the Sedenions - save for their each containing an \"impossible\" 8 as the low index in one Assessor, forming a triple zigzag with two Assessors whose low-index terms are an O and its xor with 8! So not only can we \"fold over\" its emanation table to get a Sedenion Box-Kite; we can see it as housing 3 \"harmonics\" of it of a special kind. The analogy to the Hyperbolic vs. Elliptic Umbilic Catastrophes' 1 to 3 Cusps, vis <U+00E0> vis 1 triple-zigzag to 3 trefoil Sails, was explored in our prior paper. How deep does it go? Page 16 In Catastrophe Theory, the D4 singularity takes on two forms when projected from the complex to the real domains, and these are the two Umbilics just named. More, it is also well-known, thanks to the \"A-D-E Problem,\"20 that the D4 pattern relates to close-packing in 4-D, yielding the \"Feynman checkerboard\" of 24 unit hyperspheres in each other's immediate proximity (the same pattern giving the 24-element group of integer Quaternions). The Hyperbolic Umbilic, meanwhile, has its 2-D \"behavior plane\" - when its definitive control variable is zero - degenerate into the 4-to-1 collapsing of quadrants topologists call \"folding the handkerchief.\" The similarity of this process to the \"folding over\" of emanation tables - plus the special significance of 24 here - seems hardly accidental. (And 72, for what it's worth, is the \"closest-packing number\" associ- ated with the singularity E6 - the basis of the mysterious \"trance tunnel\" geometry stu- died by James Callahan in a series of seminal papers modeling emotional affect re- sponse.21 ) How might these patterns echo in higher number forms? We have not, for instance, considered the \"pathologies\" awaiting in higher 2n -ions, when not 2, but 3 or more such \"hypernumbers\" are multiplied. (Will we need, perhaps, to contemplate \"ema- nation solids\"? And does the fact that both the Sedenions' 24 and the Pathions' 72 are contained as simple factors of the Routons' \"Babylonian\" 360 mean anything special? In this domain, so little is known, and so much computation will be required to learn more, that we can truly deem this brand of mathematics an \"experimental\" discipline.) Let's wind down with something more concrete to mull on: the emanation table shown as the last on the right of the top row in the prior illustration (with <U+039E> = 3) will be exemplified. Its \"green cell\" units of 3 and 8 indicate a \"folding over\" into the Sedenion Box-Kite with strut constant 3; the low-end indices shown in the emanation table do in- deed \"fold over\" in the manner described above so that strut-opposed terms form Sedeni- on Assessors (2, 9), (1, 10), (7, 12), (6, 13), (5,14), (4,15) as required. Meanwhile, if you check the first table presented in this paper to corroborate that statement, you'll recall the format of presentation (Assessors A, B, C forming a triple-zigzag, etc.). That format can be retrieved (sans the now-redundant strut constant in the left-most column) to present the 3 \"impossible\" Box-Kites the emanation table in question partitions into (each of whose triple-zigzags' bolded lower-index terms form hard-working, Box-Kite-sustaining \"mule-trains\" of \"sterile\" triplets which can never form ZD's in their own right). This emanation table partitions into 3 Box-Kites with strut constant 11 as follows: A B C D E F . 1, 26 8, 19 9, 18 2, 25 3, 24 10, 17 4, 31 8, 19 12, 23 7, 28 3, 24 15, 20 6, 29 8, 19 14, 21 5, 30 3, 24 13, 22 Note that the common appearance of the (8, 19) and (3, 24) Assessors in each of these 3 Box-Kites would seem to belie the assertion that they partition the 72 DMZ cells cleanly: but this shared pair of Assessors are strut-opposites, and we are now viewing these Box-Kites not as collections of 12 ZD diagonals, but of 24 DMZ-pairings; so, as such, there's no sharing of any terms between them! From all we've seen of the Pathions and their patterns of emanation, this distinction, while subtle, is obviously a crucial one. Page 17 But this suggests the 7 interconnected Box-Kites of the 168-cell emanation tables may be viewed in a similar manner, making their interconnectedness not hard to deal with, but simple. Consider the first table's Assessor list given atop page 14: take the lower-index items in the first of its two lines as given, and pick the leftmost value (2). The two successive pairs that follow each complete a triple with it. Add in their 3 strut- opposites on the right, and we've got the lower-index scheme for the first 3 Box-Kites: (2, 4, 6, 7, 5, 3); (2, 8, 10, 11, 9, 3); (2, 12, 14, 15, 13, 3). Now move right, pick the (4), and form 2 new triples with it from the left of the line; including opposites from the right gives 2 more Box-Kites: (4, 8, 12, 13, 9, 5); (4, 10, 14, 15, 11, 5). Shift again, pick the (6), perform the same trick: (6, 8, 14, 15, 9, 7); (6, 10, 12, 13, 11, 7). Parting thought anent \"Mule-Trains\": the attentive reader may already have fig- ured out that if each <U+039E> -high (henceforth, \"Sky-High\") emanation table splits into 3 Box- Kites, each with 2 sails based on one of the 7 overworked \"Mule-Train\" triplets, 7 x 3 x 2 = 42. The MT-Sails, then, play a role in Sky-Highs akin to the Sedenions' 42 Assessors - or, perhaps more precisely, to the 42 inscriptions of the similarly \"sterile\" Octonions on Box-Kite vertices therein. In this sense, each Sky-High's excluding but one Mule-Train (the triplet completing the \"green cell\" pairings) is like the ban of the strut-constant Octo- nions in the Sedenion context, which also act as \"signatures.\" Is all this the beginning of a \"Jordan-Holder\" sort of theory of lattice hierarchies in the ZD-Net? Tune in next monograph, same text archive, same font of speculation, for the next exciting episode . . . {3} Simulating \"Creation Pressure\" ( Cellular Automata Underneath Number?): In the early days of neural networks, random Booleans operator values were strewn across gate arrays, while researchers \"watched what happened.\" Differently weighting different levels of 2n -ions suggests itself, with further study of the harmonics and collapses, first in evidence with the Pathions as just discussed, calling for a more programmatic approach. The possibility of underwriting such a \"ZD-net\" with cellular-automata-like rules - and hence, seeing Number itself as their side-effect in some deep senses - merits serious con- sideration as well. Steve Wolfram's \"Rule 30,\"22 for instance - if a term and its right- hand neighbor share a property, they switch its value to that held by the neighbor on their left - might prove a good starting point in exploring \"triplet-switch effects\": for any As- sessor, in any Sail, its lower-order (O, say) index will form a triplet with the other lower- order indices in the same Sail; but it will also form a triplet with its adjacent Assessors' higher-order (S or P, say) indices. Meanwhile, collapsing a Sky-High onto a Sedenion box-kite leaves all Assessors properly indexed, but since the strut-opposite cell contents from which they were engen- dered in the Pathions always have opposite edge-signs, their own edge-signs are left inde- finite, and hence any interrupted cyclings may perhaps be left hanging (and vulnerable, thereby, to \"digression pressure\") . . . at least for the moment of symmetry-breaking when Pathions are \"boiled off.\" Then too, kite-chain midden harmonics allow for ever greater \"switching yard\" complexities as the n in 2n -ion gets bigger. What underlying restlessness of triplets, or overarching \"gantry-work\" for growing n, might lead all these systems to \"cross-pollin- ate\"? To what effect? By induction, and in conclusion, one can easily imagine things in the general case getting wacky with alacrity. Where, then, one must wonder, might we go with this? Page 18 1 R. Guillermo Moreno, \"The zero divisors of the Cayley-Dickson algebras over the real numbers,\" Bol. Soc. Mat. Mexicana (3), 4 , 1 (1998), 13-28; preprint available as http://arXiv.org/abs/q-alg/9710013 . 2 K. and Mari Imaeda, \"Sedenions: Algebra and analysis,\" Appl. Math. Comput., 115, 2/3 (October 2000), 77-88. 3 Robert de Marrais, \"The 42 Assessors and the Box-Kites they fly: Diagonal axis -pair systems of zero- divisors in the Sedenions' 16 dimensions,\" preprint available as http://arXiv.org/abs/math.GM/0011260 . (November, 2000) 4 Corrado Segr<U+00E8>, in Math. Ann., 40 (1892), 413-167, and in Segr<U+00E8>'s Opere, I, Edizione cremonese, 1957. 5 G. Baley Price,Introduction to Multicomplex Spaces and Functions, Marcel Dekker, New York, 1991. 6 R. Penrose and W. Rindler, Spinors and Space-Time, Vol. 1: Two-Spinor Calculus and Relativistic Fields, Cambridge University Press, Cambridge - London - New York, 1984. 7 Charles Mus<U+00E8>s, \"Applied Hypernumbers: Computational Concepts,\" Appl. Math. Comput., 3 (1976), 211-226; \"Hypernumbers - II. Further Concepts and Computational Applications,\" Appl. Math. Comput., 4 (1978), 45-66; \"Hypernumbers and Quantum Field Theory with a Summary of Physically Applicable Hypernumber Arithmetics and their Geometries,\" Appl. Math. Comput., 6 (1980), 63-94. 8 Pertti Lounesto, Clifford Algebras and Spinors, Cambridge University Press, Cambridge - New York - Melbourne, 1997, 207-8. 9 Andrei Sakharov, \"Vacuum quantum fluctuations in curved space and the theory of gravitation,\" Dokl. Acad. Nauk. SSSR 177 (1967), 70-71; translated in Sov. Phys. Dokl. 12 (1968), 1040-1041. 10 H. E. Putoff, Phys. Review A, 39 (1989), 2223; B. Haisch, A. Rueda, H. E. Putoff, Phys. Review A, 49 (1994), 678; B. Haisch, A. Rueda, Phys. Review A, 268 (2000), 224; Y. Dobyns, A. Rueda, B. Haisch, xxx.lanl.gov/gr_qc/0002069 (February, 2000), to appear in Foundations of Physics. 11 Jaak L<U+00F5>hmus, Eugene Paal, Leo Sorgsepp, Nonassociative Algebras in Physics, Hadronic Press, Palm Harbor FL, 1994. Geoffrey Dixon's extension of the Standard Model based on the tensor product of the Complex, Quaternion and Octonion algebras, where electric, weak, and strong forces naturally arise from these 3 factors respectively, suggests the next \"big break\" - allowing zero-divisors - would point toward including gravity (and that nothing less than this could hope to). See Dixon's Division Algebras: Octo- nions, Quaternions, Complex Numbers and the Algebraic Design of Physics, Kluwer, Dordrecht, 1994. 12 John Milnor, Morse Theory, based on lecture notes by M. Spivak and R. Wells, Princeton University Press, Princeton NJ, 1969. Diagram and quote from p. 54, at the end of \"<U+00A7>9. The Curvature Tensor.\" 13 J. J. Sylvester, \"On quaternions, nonions, sedenions etc.\", Johns Hopkins Univer. Circular, 3:7-9, 1889; this and earlier pieces on Nonions are in his Collected Works, III, 647-650; and IV, 122-132. 14 D. Siersma, \"Singularities of C8 functions of right-codimension smaller or equal than eight,\" Indag. Math. 74 (1973), 31-37; simply explained and motivated in Tim Poston and Ian Stewart, Catastrophe Theory and its Applications, Pitman Publishing, Boston - London - Melbourne, 1978, pp. 162-170. 15 A. R. Rajwade, Squares, Cambridge University Press, Cambridge - New York - Melbourne, 1993. 16 T. Kirkman, \"On pluquaternions and homoid products of sums of n squares,\" Philos. Mag. (Ser. 3) 33 (1848), 447-459; 494-509. 17 I've yet to find the actual paper, \"The algebraic set of the zero divisors in the Cayley-Dickson algebras,\" but its results are cited at http://www.innerx.net/~tsmith/Ndalg.html -- Tony Smith's well-traveled math and physics website. A brief abstract of Moreno's talk, in which he presents the results cited above as \"up- per bounds\" on the number of \"irreducible components\" (a point of much interest to us) can be found at www.matmor.unam.mx/events/ams -smm/EN/SESIONES/sessionR1/sesionR1.pdf . 18 Helena Albuquerque and Shahn Majid, \"Quasialgebra structure of the octonions,\" preprint available as http://arXiv.org/abs/math.QA/9802116 . (February, 1998) 19 Moreno's formula is identical to that derived by Hurwitz in a superficially unrelated context: the classification of compact Riemann surfaces of genus g > 2 have automorphism groups of size 84(g-1). And, as the smallest order such group is a simple group, there is no Hurwitz group of order 84 - so the first instance is analogous to the Pathion harmonic just described, while higher instances are no longer general! (But indeed, even the Pathions' case isn't truly general either, as we'll see next section!) See Gareth A. Jones and David Singerman, Complex Functions: An Algebraic and Geometric Viewpoint, Cambridge University Press, Cambridge - New York - Melbourne, 1987, Chapters 5 and 6. 20 M. Hazewinkel, W. Hesselink, D. Siersma, F. D. Veldkamp, \"The ubiquity of Coxeter-Dynkin diagrams (an introduction to the A-D-E problem), Nieuw Arch. Wisk. 25 (1977), 255-307. The A-D-E problem arose in the work of V. I. Arnol'd as a result of his sensing the connection between singularity theory and Page 19 the classic \"A, D, E\" of Dynkin diagrams. See his Catastrophe Theory (3nd revised and expanded edi- tion),Springer-Verlag, Berlin Heidelberg New York Toronto, 1992, especially the concluding chapter. An updated roster of links on the subject is maintained by Tony Smith at the website cited earlier. 21 James Callahan, \"A Geometric Model of Anorexia and Its Treatment,\" Behavioral Science, 27, 1982, 140-154, is where the E6 dynamics of the \"trance tunnel\" were first reported; these were embedded in the full dimensionality of the Double Cusp in a pair of papers written with psychoanalyst Jerome I. Sashin, \"Models of Affect-Response and Anorexia Nervosa,\" in S. H. Koslow, A. J. Mandell, M. F. Shlesinger, eds., Conference on Perspectives in Biological Dynamics and Theoretical Medicine. Annals N. Y. Acad. Sci., 504, 1986, 241-259; \"Predictive Models in Psychoanalysis,\" Behavioral Science, 35, 1990, 60-76. 22 Steve Wolfram, A New Kind of Science, Wolfram Media Inc., www.stevewolfram.com , 2002. Page 20"
