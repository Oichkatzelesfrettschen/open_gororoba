[python_retention]
version = 1
policy = "first_match_wins"
inventory_output = "registry/python_retention_inventory.toml"
notes = "Classify every remaining Python file by governance role so Rust-vs-Python decisions are explicit and machine-checkable."

[[rule]]
id = "PY-001"
globs = [
  "crates/gororoba_py/venv/**/*.py",
  "venv/**/*.py",
  ".venv/**/*.py",
  "wow_analysis_venv/**/*.py",
  "build/**/*.py",
  "target/**/*.py",
]
classification = "exclude_vendored"
action = "exclude_from_first_party_counts"
canonical = false
owner = "external"
rationale = "Vendored environments and build outputs are not first-party repo logic."

[[rule]]
id = "PY-001A"
globs = ["src/verification/verify_registry_crossrefs.py"]
classification = "bridge_or_retire"
action = "retire_after_rust_parity_is_established"
canonical = false
owner = "gororoba_cli_data"
rationale = "Cross-registry verification is now owned by the Rust governance verifier; keep the Python file only as a short-lived reference until removal."

[[rule]]
id = "PY-001B"
globs = [
