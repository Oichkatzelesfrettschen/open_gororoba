[python_retention]
version = 1
policy = "Pure Rust: Python is only allowed in isolated virtual environments for auxiliary tools."
inventory_output = "registry/python_retention_inventory.toml"

[[rule]]
id = "PR-001"
globs = ["wow_analysis_venv/**"]
classification = "auxiliary"
action = "isolate"
canonical = false
owner = "external"
rationale = "Isolated VENV for auxiliary legacy data tools."

[[rule]]
id = "PR-002"
globs = ["venv/**", ".venv/**"]
classification = "auxiliary"
action = "isolate"
canonical = false
owner = "external"
rationale = "Standard development VENVs for VSCode/LSP support."
