[[rule]]
id = "PY-002"
globs = ["src/scripts/analysis/**/*.py", "src/verification/**/*.py"]
classification = "rust_canonical_migrate_now"
action = "port_to_gororoba_cli_data"
canonical = true
owner = "gororoba_cli_data"
rationale = "Authoritative registry builders and verifiers belong in the Rust control plane."

[[rule]]
id = "PY-003"
globs = ["scripts/**/*.py"]
classification = "rust_canonical_migrate_now"
action = "port_to_rust_workspace_tooling"
canonical = true
owner = "workspace_tooling"
rationale = "CI scope, local test planning, and gate orchestration are Rust-workspace concerns."

[[rule]]
id = "PY-004"
globs = ["tests/**/*.py"]
classification = "rust_test_migration"
action = "replace_with_rust_tests_when_touching_lane"
canonical = true
owner = "workspace_tests"
rationale = "Python tests for canonical registries and claims should converge on Rust-native test surfaces."

[[rule]]
id = "PY-005"
globs = ["bin/fetch_*.py", "bin/record_*.py", "bin/manga_dapall_to_csv.py"]
classification = "python_utility_noncanonical"
action = "wrap_with_rust_entrypoint_or_document_noncanonical"
canonical = false
owner = "bin_utilities"
rationale = "Downloaders and one-shot ingest helpers are useful, but they should not define the canonical repo control plane."

[[rule]]
id = "PY-006"
globs = [
  "bin/analyze_*.py",
  "bin/ascii_check.py",
  "bin/ascii_placeholder_cleanup.py",
  "bin/check_rho_mean_finite.py",
  "bin/convos_chunker.py",
  "bin/coq_prepare_confine.py",
  "bin/doctor.py",
  "bin/manga_maps_to_rotcurves.py",
  "bin/patch_pyfilesystem_pkg_resources.py",
  "bin/terminology_gate.py",
]
classification = "python_utility_noncanonical"
action = "wrap_with_rust_entrypoint_or_document_noncanonical"
canonical = false
owner = "bin_utilities"
rationale = "Small operational helpers can remain utilities, but they should be explicitly classified and wrapped if they become required."

[[rule]]
id = "PY-007"
globs = ["src/ghost_stats/**/*.py", "src/scripts/visualization/**/*.py"]
classification = "scientific_python_phaseout"
action = "port_to_rust_artifact_or_analysis_bin"
canonical = false
owner = "scientific_analysis"
rationale = "Scientific analysis and visualization are still Python-heavy, but the live artifact lane is being moved to Rust."

