# Control-plane naming standards for registry lanes and gates.
# Canonical naming policy: function-first, phase-neutral, alias-safe.

[meta]
updated = "2026-02-14"
authoritative = true
version = "1.2.0"
scope = "Makefile registry lanes and acceptance gates"

[policy]
goal = "Replace phase labels (wave/batch) with durable functional names."
legacy_alias_policy = "Preserve legacy target names as compatibility aliases until explicit deprecation."
prefix_rules = [
  "registry-build-* => mutating/generation targets",
  "registry-verify-* => read-only verification targets",
  "registry-*-gate => aggregate pass/fail gates",
]

[legacy_alias_deprecation_horizon]
id = "ALIAS-HORIZON-2026-02-14"
start_date = "2026-02-14"
review_date = "2026-05-15"
earliest_removal_date = "2026-08-14"
tracking_report = "reports/alias_deprecation_policy_2026_02_14.toml"
applies_to = "All lane/gate legacy_aliases groups unless superseded by a future policy revision."

[phase_plan_mirror_policy]
intent = "Map historical phase-labeled plan files to phase-neutral canonical mirror paths."
mirror_index = "registry/phase_plan_canonical_mirrors.toml"
legacy_archival_policy = "Wave-labeled plan files are archival snapshots and must remain immutable."
canonical_edit_policy = "Standards-compliant updates land in canonical mirror files with explicit provenance metadata."
provenance_requirements = [
  "legacy_path",
  "legacy_id",
  "legacy_updated",
  "legacy_sha256",
  "mirror_created",
]

[[phase_plan_mirror]]
id = "PLAN-MIRROR-001"
canonical_path = "registry/control_plane_roadmap.toml"
legacy_path = "registry/wave4_roadmap.toml"
intent = "Preserve Wave 4 chronology under a durable control-plane roadmap name."

[[phase_plan_mirror]]
id = "PLAN-MIRROR-002"
canonical_path = "registry/strict_toml_granularization_plan.toml"
legacy_path = "registry/wave5_toml_granularization_plan.toml"
intent = "Preserve Wave 5 strict TOML granularization history under a phase-neutral path."

[[phase_plan_mirror]]
id = "PLAN-MIRROR-003"
canonical_path = "registry/toml_source_enforcement_plan.toml"
legacy_path = "registry/wave6_toml_source_enforcement_plan.toml"
intent = "Preserve Wave 6 TOML-source enforcement history under a phase-neutral path."

[[lane]]
id = "LANE-CSV-PIPELINE"
canonical_gate = "registry-csv-pipeline-gate"
legacy_aliases = ["registry-wave3"]
deprecation_horizon_ref = "ALIAS-HORIZON-2026-02-14"
legacy_alias_owner = "registry data pipeline maintainers"
legacy_alias_removal_criteria = [
  "No CI workflow, required script, or documented operator runbook invokes registry-wave3.",
  "One review cycle passes with governance-gate and registry-acceptance-gate usage staying canonical in automation.",
  "Alias removal patch updates Makefile, policy, and compatibility reports in the same change set.",
]
scope = "Project/external/archive CSV split, holdings, and corpus coverage verification."
evidence_refs = [
  "Makefile",
  "src/verification/verify_csv_scroll_pipeline.py",
  "src/verification/verify_csv_corpus_coverage.py",
  "src/verification/verify_legacy_csv_toml_parity.py",
]
rationale = "Names the data lane by function (CSV pipeline) instead of rollout phase."

