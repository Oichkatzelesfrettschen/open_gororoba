2. **Power Law**: nu(x) = nu_base * (1 + (F(x) - 3/8))^alpha
3. **Sigmoid**: nu(x) = nu_base / (1 + exp(lambda * (F(x) - F_c)))
4. **Piecewise**: nu(x) = nu_1 if F < 3/8, else nu_2

**Implementation**:
