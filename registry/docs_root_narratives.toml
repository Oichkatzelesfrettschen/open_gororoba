## PART 3: KEY EQUATIONS EXTRACTED

### TCMT Foundation (Ruan & Fan 0909.3323)
- **Eq 8**: Basic temporal coupled-mode equation (angular momentum channels)
- **Eq 14**: Scattering cross-section formula from TCMT
- **Eq 21**: Absorption cross-section derivation
- **Eq 23**: Fano line shape (asymmetric resonance profile)
- **Key Parameter**: Asymmetry factor `q` (Fano parameter)

### Worldline QFT (Bastianelli & Schubert gr-qc/0412095)
- **Compact two-parameter integral representation**: Valid for arbitrary photon energies and EM field strengths
- **Manifestly covariant formalism**: Loop integration using path integrals
- **One-loop amplitude structure**: Charged particle circulation in electromagnetic background

### Worldline Extensions (Bastianelli et al. 0710.5572)
- **On-shell polarization components**: Explicit expressions for limiting cases
- **Spinor/scalar loop distinctions**: Different particle types in background fields

### Photon-Graviton Complete (Ahmadiniaz et al. 2601.23279)
- **Three-diagram structure**: Irreducible, tadpole, external-leg amplitudes
- **Worldline unification**: Single framework across all contributions
- **Ward identity validation**: Gravitational consistency check
- **Magnetic dichroism condition**: Tadpole does NOT affect this observable

### Maksimov Generic Constraints (2505.00396)
- **Energy conservation constraints**: TCMT parameters must obey conservation laws
- **Time-reversal symmetry rules**: Restrict coupling/decay rate combinations
- **Unidirectional guided modes**: Asymmetric outgoing wave coupling
- **Reflection/transmission zeros**: Linked to parameter combinations

