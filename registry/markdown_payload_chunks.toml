kind = "paragraph"
line_start = 69
line_end = 69
heading_level = 0
text_ascii = "$$R_{AA}(p_T,y) = \\frac{1}{\\langle T_{AA} \\rangle} \\frac{1}{N_{\\text{evt}}^{AA}} \\frac{d^2N^{AA}}{dp_T\\,dy} / \\frac{d^2\\sigma^{pp}}{dp_T\\,dy}$$"
text_sha256 = "1cb2d4f8adfa8a78558a0d960819f32846bac8124b05bf7b0dd91af7e285831a"

