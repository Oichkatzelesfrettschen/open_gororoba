text_ascii = "Claims about what ran in 2025 and why it matters"
text_sha256 = "56889c88f0fe3f2726770ceec3a5690f97c031967c16951f6713b3ac07d2c88c"

[[chunk]]
id = "MPY-00003-C0010"
document_id = "MPY-00003"
chunk_index = 10
kind = "paragraph"
line_start = 17
line_end = 18
heading_level = 0
text_ascii = "**Claim A1 (run content and sequence)**: In early July 2025, the LHC executed a special light-ion program with proton\\u2013oxygen (p\\u2013O), oxygen\\u2013oxygen (O\\u2013O), and neon\\u2013neon (Ne\\u2013Ne) collisions, including setup/commissioning in between. **Status**: Verified. CERN states the schedule explicitly: 29 June\\u20139 July 2025."
text_sha256 = "b294de658cfbfeccb0a0f00e8a758e419c0d4497f13350b0d3a285bbded86dd2"

[[chunk]]
id = "MPY-00003-C0011"
document_id = "MPY-00003"
chunk_index = 11
kind = "paragraph"
line_start = 20
line_end = 21
heading_level = 0
text_ascii = "**Claim A2 (physics motivation)**: The light-ion program targets the \\u201Csystem-size question\\u201D (how small a system can still exhibit QGP-like collectivity and parton energy loss) and simultaneously supports cosmic-ray interaction modeling in the atmosphere via p\\u2013O. **Status**: Verified."
text_sha256 = "0e61b38b0f55c08e69327866108511526d02c5d5348c745ae8d03e0076c7c8cb"

[[chunk]]
id = "MPY-00003-C0012"
document_id = "MPY-00003"
chunk_index = 12
kind = "paragraph"
line_start = 23
line_end = 24
heading_level = 0
text_ascii = "**Claim A3 (end-of-Run-3 context)**: 2025 was the final full year of Run 3 operations; the 2026 run was planned March\\u2013June followed by a long shutdown toward HL-LHC. **Status**: Verified."
text_sha256 = "a9628a95fd02a86e535b2f0cecd1b700742214f901617adc849ea12bb4e3e6f2"

[[chunk]]
id = "MPY-00003-C0013"
document_id = "MPY-00003"
chunk_index = 13
kind = "heading"
line_start = 26
line_end = 26
heading_level = 3
text_ascii = "Claims about \\u201Cwhat was seen\\u201D in O\\u2013O / Ne\\u2013Ne"
text_sha256 = "2a1ce33e8d8b1aa732d3a21bb301c0d27ae1a7367ad640f91f877e325146e874"

[[chunk]]
id = "MPY-00003-C0014"
document_id = "MPY-00003"
chunk_index = 14
kind = "paragraph"
line_start = 28
line_end = 29
heading_level = 0
text_ascii = "**Claim B1 (CMS: parton-energy-loss signature in O\\u2013O via charged-hadron suppression)**: CMS measured the nuclear modification factor $R_{AA}$ for O\\u2013O at $\\sqrt{s_{NN}}=5.36$ TeV and found suppression below unity, with a minimum around $p_T\\sim 6$ GeV of about $0.69 \\pm 0.04$. **Status**: Verified (CMS-HIN-25-008, HEPData 166013)."
text_sha256 = "013ec941490fb44f3aa1c4127008910df2941a7e8acbf1c791dba4e70bb00ccf"

[[chunk]]
id = "MPY-00003-C0015"
document_id = "MPY-00003"
chunk_index = 15
kind = "paragraph"
line_start = 31
line_end = 32
heading_level = 0
text_ascii = "**Claim B2 (ALICE: hints of jet quenching in O\\u2013O via neutral-pion suppression)**: ALICE reported first hints of jet quenching in O\\u2013O using neutral pion production shortly after the 2025 run. **Status**: Verified as \"first hints\"."
text_sha256 = "43e254cd18a7c68fa34c856ea1d7ab8b20164cb4b1115205d769a994815c287f"

[[chunk]]
id = "MPY-00003-C0016"
document_id = "MPY-00003"
chunk_index = 16
kind = "paragraph"
line_start = 34
line_end = 35
heading_level = 0
text_ascii = "**Claim B3 (ATLAS: flow signals and nuclear-shape sensitivity in O\\u2013O / Ne\\u2013Ne)**: ATLAS measured anisotropic flow coefficients $v_n$ (n=2\\u20134) in O\\u2013O and Ne\\u2013Ne, using both two-particle correlations and four-particle subevent cumulants to suppress non-flow, and finds patterns consistent with nuclear-shape differences (enhanced $v_2$ in central Ne\\u2013Ne consistent with prolate neon). **Status**: Verified (arXiv:2509.05171)."
text_sha256 = "01f2e725ee88e3ee8337b039a3cfc9726d5fcab4d6a5fb96f1e0055ed0de0b3a"

[[chunk]]
id = "MPY-00003-C0017"
document_id = "MPY-00003"
chunk_index = 17
kind = "paragraph"
line_start = 37
line_end = 38
heading_level = 0
text_ascii = "**Claim B4 (ALICE: geometry-driven flow in light ions)**: ALICE measured $v_2$ and $v_3$ in O\\u2013O and Ne\\u2013Ne at 5.36 TeV and interprets results as sensitive to nuclear geometry. **Status**: Verified (arXiv:2509.06428)."
text_sha256 = "cb096d0a2779d2d4e74674198f95a63a1fa9d6e187cb891751d3c24c0564e34f"

[[chunk]]
id = "MPY-00003-C0018"
document_id = "MPY-00003"
chunk_index = 18
kind = "paragraph"
line_start = 40
line_end = 41
heading_level = 0
text_ascii = "**Claim B5 (LHCb: neon \\u201Cbowling-pin\\u201D shape extraction via flow in fixed-target Pb\\u2013Ne)**: LHCb measured $v_2$ and $v_3$ using multiparticle cumulants in fixed-target PbNe and PbAr at $\\sqrt{s_{NN}}=70.9$ GeV, finding larger $v_2$ in PbNe consistent with the prolate neon ground-state shape. **Status**: Verified (arXiv:2509.12399)."
text_sha256 = "14e4f6b106e8f442952d6bb7f1f7077bd650ce9b3f43c9fd891b56afd9129a1e"

[[chunk]]
id = "MPY-00003-C0019"
document_id = "MPY-00003"
chunk_index = 19
kind = "heading"
line_start = 43
line_end = 43
heading_level = 3
