kind = "paragraph"
line_start = 6
line_end = 6
heading_level = 0
text_ascii = "The previous \"Grand Synthesis\" reported a remarkably tight cross-domain invariant ($J \\approx 0.001$, Variance $= 0.0002$) across raw astrophysical datasets (FRBs, Pulsars, Quasars, etc.). This seemingly proved that hierarchical scaling is independent of the underlying physics."
text_sha256 = "6867d88c2b91d61eb636e9462e4fb81dbca09be4a0182250f68269f332ed0d91"

[[chunk]]
id = "MPY-00002-C0006"
document_id = "MPY-00002"
chunk_index = 6
kind = "paragraph"
line_start = 8
line_end = 8
heading_level = 0
text_ascii = "To subject this claim to maximum falsification pressure, we ran the same Coupler-Manifold projection against `c071g_multi_dataset_ultrametric_residualized.csv`. This dataset has been \"residualized,\" meaning shared systemic instrument biases (e.g., specific telescope systematics $f_0 - f_5$) have been mathematically projected out."
text_sha256 = "1108e41979b527c68e58e5ba6e0124c33ad3873412748e2ced8f873f137ed9d5"

[[chunk]]
id = "MPY-00002-C0007"
