heading_level = 0
text_ascii = "This treatise treats the full chat corpus (user narrative + all linked references + the assistant\\u2019s earlier \\u201Cdata layers\\u201D framing) as a single technical document whose factual claims must be verifiable, whose data-access paths must be operationally reproducible, and whose implied models must be made explicit. The target style matches the \\u201CPBS Space Time\\u2013style\\u201D constraint: mechanism-first, technically faithful, and\\u2014where possible\\u2014decision procedures over rhetoric."
