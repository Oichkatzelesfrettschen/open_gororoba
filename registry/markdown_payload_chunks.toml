chunk_index = 17
kind = "paragraph"
line_start = 24
line_end = 24
heading_level = 0
text_ascii = "The previously observed tight correlation was actually an artifact of **shared systemic measurement noise** acting as a massive confounder. When the instrument bias is removed, the physical systems shatter into distinct scaling domains. A pulsar scales differently than a magnetar, and radio frequencies scale differently than JWST infrared metadata."
