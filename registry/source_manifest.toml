# Source Manifest: Registry Compatibility Layer
#
# This file declares which TOML files are compatibility artifacts for SQLite-first
# migration and verification flows.
#
# The `gororoba-db build` command reads this manifest to discover which files
# feed compatibility ingest and export consistency checks against the canonical DB.

[manifest]
version = 1
description = "Compatibility manifest for TOML artifacts in SQLite-first workflows"

# ── Core research registries ─────────────────────────────────────────

[[source]]
path = "registry/claims.toml"
role = "core"
table = "claims"
description = "1300+ formal research claims with verification status"

[[source]]
path = "registry/claim_transitions.toml"
role = "evidence"
table = "claim_transition_events"
description = "Append-only claim transition events with verdicts, prior statuses, and evidence"

[[source]]
path = "registry/claim_relations.toml"
role = "evidence"
table = "claim_relations"
description = "Typed predecessor and successor claim relations"

[[source]]
path = "registry/insights.toml"
role = "core"
table = "insights"
description = "Cross-domain research insights"

[[source]]
path = "registry/experiments.toml"
role = "core"
table = "experiments_cp"
description = "Reproducible experiment definitions"

[[source]]
path = "registry/binaries.toml"
role = "core"
table = "binaries_cp"
description = "Binary entrypoint to experiment mapping"

[[source]]
path = "registry/project.toml"
role = "core"
# TODO: registry/canonical/control_plane.sqlite3 holds no table of this name; the lane is unmigrated.
table = "project_metadata"
description = "Project metadata and sprint history"

[[source]]
path = "registry/external_sources.toml"
role = "core"
table = "external_source_contracts"
description = "External data source contracts"

# ── Evidence and knowledge graph ─────────────────────────────────────

[[source]]
path = "registry/bibliography.toml"
role = "evidence"
table = "bibliography"
description = "434 reference entries"

[[source]]
path = "registry/claims_evidence_edges.toml"
role = "evidence"
# TODO: registry/canonical/control_plane.sqlite3 holds no table of this name. The empty
# evidence_edges table is a candidate target, but its source_id/target_id/edge_type
# columns do not match this file's claim_id/edge_role/target_ref shape, so the
# correspondence is unproven.
table = "claims_evidence_edges"
description = "Evidence chain edges linking claims"

[[source]]
path = "registry/experiment_lineage.toml"
role = "evidence"
# TODO: registry/canonical/control_plane.sqlite3 holds no table of this name; the lane is unmigrated.
