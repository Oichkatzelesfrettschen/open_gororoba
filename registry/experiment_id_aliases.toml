# Experiment identifier alias registry (governance support).
#
# A legacy identifier is one that an active surface (crate source, LaTeX,
# tracked markdown, plan) used for an analysis before the canonical registry
# assigned that identifier to a different experiment. Each alias row binds the
# legacy identifier and its scheme to the canonical experiment that now
# carries the analysis. governance-verify experiment-reference-identity
# rejects legacy identifiers on active surfaces, so this file is a migration
# record, never a second namespace. Retired identifiers are numbers a legacy
# scheme consumed; the canonical registry never allocates them.

