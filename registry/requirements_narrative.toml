[[document]]
path = "REQUIREMENTS.md"
title = "Installation Requirements (Reproducible)"
body_markdown = """
# Installation Requirements (Reproducible)

This repo targets a **host Python** for non-quantum work and a **Docker Python 3.11**
environment for Qiskit.

Canonical (more detailed) requirements live in `docs/REQUIREMENTS.md`. This file is a short
top-level entrypoint.

Maintenance note: when requirements guidance drifts, update `docs/REQUIREMENTS.md` first and
keep this file as a stable pointer + minimal quickstart.

## 1) Core (Python >=3.11)

```bash
make install
make check
make doctor
make studio-check
```

Notes:
- `make check` runs the fast shared non-mutating gate: `make lint`, `make python-smoke`, `make ascii-check`, `make terminology-gate`, and `make verify-no-reports-writes` (warnings-as-errors).
- `make lint` is the required changed-file Ruff ratchet for Python files under `src/`, `tests/`, `bin/`, and `scripts/`; use `make lint-all` or `make lint-advisory` to inspect the full legacy backlog.
- `make smoke` runs the dedicated fast smoke lanes (`make python-smoke` + `make rust-smoke`). Pytest files marked `requires_ext` stay out of the default smoke lane.
- `make gate-local` is the pre-push entrypoint; it runs `make check`, then adds scoped Rust regression and read-only governance verification only when the current diff touches those surfaces.
- The local Rust fast path is intentionally narrower than CI: `make rust-regression-scoped` now lint-checks only `--lib --tests` for the affected packages before running scoped light `cargo nextest`. Full `--all-targets` clippy enforcement remains in the required CI/full regression lanes.
- `make rust-regression` runs the required non-ignored Rust regression lane.
- `make python-regression` runs the default regression pytest lane without optional-extension suites; Python pytest lanes use `pytest-xdist` with the shared worker budget (`nproc/2`) and explicit plugin loading because plugin autoload is disabled by default. Use `make python-requires-ext` when the matching extras are installed and you want the opt-in extension/vendor coverage.
- `make studio-check` runs Rust tests + clippy (`-D warnings`) for the Studio app lane.
- `make integrity` carries the verifier, ASCII, and inventory bundle.
- If your shell or outer tooling exports `MAKEFLAGS` globally and GNU make warns about a stale jobserver FIFO before targets run, invoke repo targets through `./makew <target>` so the repo's own concurrency policy is applied from a clean environment.
- Rust quality lanes auto-detect logical threads, divide by two for the worker budget, and apply that budget consistently to Cargo build jobs, nextest test threads, libtest threads, and Rayon pools unless a lane overrides it for a known heavy test group.
- Required Rust gates isolate Cargo state per project by default: `CARGO_HOME=$(pwd)/.cache/cargo-home` and `CARGO_TARGET_DIR=$(pwd)/.cache/gate-target`. This avoids cross-project package-cache locks when multiple agents, MCP background checks, or neighboring repos are active at the same time.
- `make clean` removes the repo-local gate target dir for a fresh rebuild, while `make clean-all` also removes `.cache/cargo-home` for a fully cold Rust dependency/bootstrap cycle.
- Some doc/source extraction utilities rely on system tools like `pdftotext`; see `docs/REQUIREMENTS.md`.
- Optional modules may not install cleanly on very new Python versions; use a Python 3.11/3.12 env or Docker when needed.
- In particular, the `analysis` extra conditionally installs `scikit-learn` only for Python <3.14 (see `pyproject.toml`).
- System-installed Python packages (e.g., Arch/AUR) are not visible inside this repo's default venv unless you use `--system-site-packages` or install the pip equivalents.
- Editable installs may create `src/*.egg-info/`; these are gitignored and should never be committed.
- Dev tooling now includes `pytest-xdist` so pytest can use the same bounded worker budget as the Rust lanes without relying on plugin autoload.

## 2) Optional Modules

- Analysis/Topology/Embeddings: see `docs/requirements/analysis.md`
- Astronomy data fetching: see `docs/requirements/astro.md`
- Algebra engine / sedenion replications: see `docs/requirements/algebra.md`
- Particle physics (PDG/CMS toy spectra): see `docs/requirements/particle.md`
- Quantum (Qiskit, Aer): see `docs/requirements/quantum-docker.md`
- C++ kernels (Conan + CMake): see `docs/requirements/cpp.md`
- Coq proofs: see `docs/requirements/coq.md`
- LaTeX / paper build: see `docs/requirements/latex.md`
- Materials datasets: see `docs/requirements/materials.md`
- Gororoba Studio front-end app: see `apps/gororoba_studio/README.md`

## 3) Artifact generation (optional)

```bash
make artifacts-dimensional
make artifacts-materials
make artifacts-motifs
make artifacts-motifs-big
make verify
```

## 4) Data provenance and cleanup (Rust-native)

```bash
cargo run -p gororoba_cli_data --bin fetch-datasets -- --all --skip-existing --output-dir data/external
cargo run -p gororoba_cli_data --bin hepdata-refresh -- --dirs alice_pbpb_raa,cms_oo_raa
cargo run -p gororoba_cli_data --bin record-external-hashes -- --root data/external --output data/external/PROVENANCE.local.json
cargo run -p gororoba_cli_data --bin external-redownload-audit -- --execute true --out reports/external_redownload_audit_YYYY-MM-DD.toml --backend-order wget,curl,fetch
cargo run -p gororoba_cli_data --bin external-blocked-burndown -- --out reports/external_blocked_burndown_YYYY-MM-DD.toml
cargo run -p gororoba_cli_data --bin external-blocked-retry-ledger -- --seed-missing true --status seeded --phase governance_contract --note "Seed blocked_action_plan ledger rows"
cargo run -p gororoba_cli_data --bin data-origin-audit -- --fail-on-strict-unknown
cargo run -p gororoba_cli_data --bin data-governance-gate --
cargo run -p gororoba_cli_data --bin data-semantic-validate --
cargo run -p gororoba_cli_data --bin data-semantic-validate -- --fail-on-unverifiable true
cargo run -p gororoba_cli_data --bin data-clean -- --scope reproducible --apply
```

Notes:
- Reproducible generated data is treated as build output and should stay gitignored.
- External datasets must carry reproducible provenance metadata (hash + timestamp + path) and source contract coverage via `data/external/SOURCES.toml`.
- The governance gate is fail-closed for strict lanes (`data/external`, `data/artifacts`, `data/evidence`).
- Use `external-redownload-audit` to distinguish reproducible active sources from explicitly blocked sources with deadlines/evidence.
- Active source rules must use explicit scientific validator refs (no `structure_only` on active entries).
- `data-semantic-validate` reports pass/fail/unverifiable status for schema and scientific checks (strict mode: `--fail-on-unverifiable true`), while `data-clean` is the Rust-native clean lane for reproducible outputs.
- Validation snapshot (`2026-02-25`): strict semantic gate passed `29/29` validators with `failed=0` and `unverifiable=0` (`reports/data_semantic_validate_2026-02-25_burndown_step2_postretire.toml`).
- Origin snapshot (`2026-02-25`): data-origin-audit reports `unknown_count=0`, `strict_unknown_count=0`, and `unclassified_count=0` (`reports/data_origin_audit_2026-02-25_burndown_step2_postretire.toml`).
"""

[[document]]
path = "docs/REQUIREMENTS.md"
title = "Requirements for Gemini Experiments"
body_markdown = """
# Requirements for Gemini Experiments

This project follows a \"Maximal Synthesis\" protocol. Installs are designed to be reproducible,
offline-testable by default, and compatible with warnings-as-errors.

If you need module-specific details, see:
- `docs/requirements/algebra.md`
- `docs/requirements/analysis.md`
- `docs/requirements/astro.md`
- `docs/requirements/materials.md`
- `docs/requirements/quantum-docker.md`
- `docs/requirements/coq.md`
- `docs/requirements/latex.md`
- `apps/gororoba_studio/README.md`

## Python version policy

- **Recommended**: Python 3.11 or 3.12 (best wheel availability).
- **Allowed**: Python 3.13+ for the core engine, but some optional extras may be skipped by
  dependency markers or may not have wheels yet (use Docker or a Python 3.11/3.12 env).

## Quickstart (core engine)

1. Create an isolated venv + install the editable package:
   ```bash
   make install
   ```
2. Run the fast smoke + integrity gate with warnings-as-errors:
   ```bash
   PYTHONWARNINGS=error make check
   ```
3. Run the required Rust regression lane:
   ```bash
   PYTHONWARNINGS=error make rust-regression
   ```
4. Run environment and toolchain diagnostics:
   ```bash
   make doctor
   ```
5. Verify the Studio front-end lane with warnings-as-errors Rust checks:
   ```bash
   make studio-check
   ```

6. Run Rust-native data governance checks:
   ```bash
   cargo run -p gororoba_cli_data --bin fetch-datasets -- --all --skip-existing --output-dir data/external
cargo run -p gororoba_cli_data --bin hepdata-refresh -- --dirs alice_pbpb_raa,cms_oo_raa
   cargo run -p gororoba_cli_data --bin record-external-hashes -- --root data/external --output data/external/PROVENANCE.local.json
   cargo run -p gororoba_cli_data --bin external-redownload-audit -- --execute true --replay-mode staging --fail-on-replay-side-effects true --out reports/external_redownload_audit_YYYY-MM-DD.toml --backend-order wget,curl,fetch
cargo run -p gororoba_cli_data --bin external-blocked-burndown -- --out reports/external_blocked_burndown_YYYY-MM-DD.toml
cargo run -p gororoba_cli_data --bin external-blocked-retry-ledger -- --seed-missing true --status seeded --phase governance_contract --note "Seed blocked_action_plan ledger rows"
   cargo run -p gororoba_cli_data --bin data-origin-audit -- --fail-on-strict-unknown
   cargo run -p gororoba_cli_data --bin data-governance-gate --
   cargo run -p gororoba_cli_data --bin data-semantic-validate --
cargo run -p gororoba_cli_data --bin data-semantic-validate -- --fail-on-unverifiable true
   cargo run -p gororoba_cli_data --bin data-clean -- --scope reproducible --apply
   ```

   Why each command exists:
   - `fetch-datasets` replays approved origin fetchers into `data/external/`.
   - `record-external-hashes` refreshes machine-readable provenance (`PROVENANCE.local.json`).
   - `external-redownload-audit` verifies replayability and checksum stability against source rules, and in staging mode prevents execute-time mutation of live `data/external` by failing on out-of-scope replay side effects.
- `external-blocked-burndown` quantifies blocked-source debt by source/file-count/bytes and supports threshold-based burn-down gates.
- `external-blocked-retry-ledger` appends blocked-source action-plan retries into a shared ledger artifact used by governance and semantic validators.
   - `data-origin-audit` enforces strict-lane origin coverage (no unknown provenance in strict lanes).
   - `data-governance-gate` enforces fail-closed policy checks (origin, naming, gitignore, blocked deadlines, unclassified-lane zero).
   - `data-semantic-validate` reports lane-level status as pass/fail/unverifiable for structural plus scientific checks; use `--fail-on-unverifiable true` for strict governance passes.
   - `data-clean` removes reproducible build outputs so regeneration remains deterministic.
- Cargo workflow policy: detect logical threads, divide by two for the worker budget, use that budget for Cargo build parallelism (`CARGO_JOBS`), nextest scheduling (`NEXTEST_TEST_THREADS`), libtest threads (`RUST_TEST_THREADS`), and intra-test worker pools such as Rayon unless a specific lane narrows concurrency further. Required gates also isolate Cargo state per project with `CARGO_HOME=$(pwd)/.cache/cargo-home` and `CARGO_TARGET_DIR=$(pwd)/.cache/gate-target`.
- Python workflow policy: use `pytest-xdist` for bounded pytest parallelism at the same worker budget, but keep the registry/markdown builder scripts selective and mostly serial unless a specific script proves to be CPU-bound and safe under `concurrent.futures`.
- Cleanup policy: `make clean` drops `.cache/gate-target/`; `make clean-all` also drops `.cache/cargo-home` for a cold-start dependency refresh.
- Lane boundary: keep only replayable dataset payloads in `data/external`; move manual intake/document corpora to `data/papers` (manual import exception lane).
   - Active source rules must use explicit scientific validator refs (no `structure_only` on active entries).
   - Validation snapshot (`2026-02-25`): strict semantic gate passed `29/29` validators with `failed=0` and `unverifiable=0` (`reports/data_semantic_validate_2026-02-25_burndown_step2_postretire.toml`).
   - Origin snapshot (`2026-02-25`): data-origin-audit reports `unknown_count=0`, `strict_unknown_count=0`, and `unclassified_count=0` (`reports/data_origin_audit_2026-02-25_burndown_step2_postretire.toml`).

The canonical Python dependency sets live in `pyproject.toml`. Prefer using the `make install-*`
targets (they match the extras).

## Optional Python extras

- **Analysis** (topology + embeddings):
  - Install: `make install-analysis`
  - Notes: scikit-learn is intentionally skipped on very new Python versions (see markers in
    `pyproject.toml`); use Python 3.11/3.12 if you need it.
- **Astronomy** (astroquery + GWpy + healpy + dataset loaders):
  - Install: `make install-astro`
- **Particle physics** (CMS/ROOT readers):
  - Install: `make install-particle`
  - Notes: `docs/requirements/particle.md`
- **Quantum** (Qiskit):
  - Preferred: Docker (`docs/requirements/quantum-docker.md`)
  - Optional local install: `make install-quantum` (only on Python versions supported by wheels)

Notes:
- Extras currently defined in `pyproject.toml`: `dev`, `analysis`, `astro`, `particle`, `quantum`.
- Some domains have requirements docs but no dedicated extra (e.g., algebra is part of core deps).

## Quantum (Dockerized)
See `docs/requirements/quantum-docker.md` and `docs/QISKIT_SETUP.md`.

## C++ Acceleration Kernels
- CMake >= 3.25
- Conan 2.x (C++ package manager)
- GCC 14 or Clang 18 (C++20 required)
- Catch2 (via Conan; unit tests)
- Google Benchmark (via Conan; micro-benchmarks)
- pybind11 (via Conan; Python bindings)

Build: `make cpp-build`, test: `make cpp-test`, bench: `make cpp-bench`.

See also: `docs/requirements/cpp.md`.

## System tools (non-Python)

Some targets rely on standard system utilities (documented here for reproducibility):

- `pdftotext` (Poppler) for `make convos-extract` and some source-caching pipelines.
  - Arch: `poppler`
  - Debian/Ubuntu: `poppler-utils`
- `wget` (preferred) and/or `curl` for opt-in fetch scripts (tests remain offline).
- `git`, `make`
- Optional: `tor` + `torsocks` for Tor-based fetches when required.
  - Arch: `sudo pacman -S tor torsocks` (or `paru -S tor torsocks`)
  - Enable: `sudo systemctl enable --now tor`
  - Note: do NOT run a second `tor` instance on `127.0.0.1:9050` if `tor.service` is already running.
    Check: `sudo ss -lntp | rg ':9050'`
  - Use: `torsocks wget -O <path> <url>`

## Dev / Quality
- `pytest>=7.4.0`    # Testing framework
- `ruff>=0.6.0`      # Fast linter
"""

[[document]]
path = "docs/requirements/algebra.md"
title = "Requirements: Algebra Engine (Cayley-Dickson, de Marrais, Reggiani)"
body_markdown = """
# Requirements: Algebra Engine (Cayley-Dickson, de Marrais, Reggiani)

These components primarily live in Rust crates under `crates/algebra_core/` and are
exercised by Rust unit and integration tests.

Install:
```bash
make install
make rust-smoke
make rust-regression
```

Notes:
- The core algebra replication/validation code depends only on the base install extras (NumPy/SciPy/SymPy/Numba).
- Keep `PYTHONWARNINGS=error` enabled in scripts/CI; treat warnings as errors.
- Native BLAS backends for the Burn-based `neural_homotopy` path are explicit Cargo feature opt-ins, not defaults.
  - `cargo check -p neural_homotopy --features openblas-system`
- The opt-in boundary is the crate's `[features]` section in `crates/neural_homotopy/Cargo.toml`, enabled with `cargo ... --features <name>`. A detected system library does nothing by itself until a build command opts into the matching feature.
- Use `make doctor-blas` (or `sh scripts/detect_native_blas.sh`) to see which native BLAS/LAPACK candidates are present on the host and how they map to the repo's exposed feature surface.
- `openblas-system` expects a system OpenBLAS install and is the only repo-exposed native BLAS feature today.
- `BLIS` is intentionally not exposed as a repo feature today: `blas-src` supports it, but Burn's ndarray backend does not forward a BLIS selector for this crate.
- Burn can support other native BLAS equivalents upstream, but this repo intentionally keeps them off the exposed feature surface until they can coexist with the default `nextest` smoke lane without implicit dependency downloads. A fresh `openblas` source-backed build currently attempts a network fetch through `openblas-src`, so the repo exposes only `openblas-system`. `accelerate` and `blas-netlib` therefore stay upstream-only, while `blis`, `intel-mkl`, and `r` remain `blas-src`-level capabilities that are not forwarded by Burn for this crate.
- Artifact generation entrypoints:
  - `make artifacts-boxkites` (de Marrais exports)
  - `make artifacts-reggiani` (Reggiani exports)
  - `make artifacts-motifs` (motif census baseline: 16D/32D + plot)
  - `make artifacts-motifs-big` (motif census extended: 64D/128D exact + 256D sampled + plot)

## Optional: advanced quaternion + math foundations (system + pip)

The repo's default workflow uses an isolated venv (`make install`). If you want to use additional
math foundations, install them into the venv with pip (recommended) even if you also have them
installed system-wide (Arch/AUR).

### Quaternion / geometry

- euclid3
  - Arch pkg: `python-euclid3`
  - pip: `euclid3`
  - import: `euclid3`
- numpy-quaternion
  - Arch pkg: `python-numpy-quaternion`
  - pip: `numpy-quaternion`
  - import: `quaternion`
- pyquaternion
  - Arch pkg: `python-pyquaternion`
  - pip: `pyquaternion`
  - import: `pyquaternion`
- quaternionic (provider-dependent)
  - Arch pkg: `python-quaternionic`
  - pip: `quaternionic` (verify on install)
  - import: usually `quaternionic` (verify on install)

### Multidimensional numerics / inference

- findiff (finite-difference derivatives, N dimensions)
  - Arch pkg: `python-findiff`
  - pip: `findiff`
  - import: `findiff`
- ipfn (iterative proportional fitting, N dimensions)
  - Arch pkg: `python-ipfn`
  - pip: `ipfn`
  - import: `ipfn`
- MultiNest Python bindings
  - Arch pkg: `python-multinest`
  - pip: commonly `pymultinest` (verify on install)
  - import: commonly `pymultinest` (verify on install)
- typedunits (units + dimensions with static checking)
  - Arch pkg: `python-typedunits`
  - pip: `typedunits` (verify on install)
  - import: `typedunits` (verify on install)
- mutatorMath (piecewise linear interpolation in multiple dimensions)
  - Arch pkg: `python-mutatormath-git`
  - pip: `MutatorMath` / `mutatorMath` (verify on install)
  - import: commonly `mutatorMath` (verify on install)

### Utility (non-math but sometimes needed in pipelines)

- unicodedata2
  - Arch pkg: `python-unicodedata2`
  - pip: `unicodedata2`
  - import: `unicodedata2`
- defcon / fontMath (font tooling)
  - Arch pkgs: `python-defcon`, `python-fontmath`
  - pip: `defcon`, `fontMath`
  - imports: `defcon`, `fontMath`
  - warning: some transitive deps currently emit deprecation warnings on Python 3.14; avoid
    importing these in `PYTHONWARNINGS=error` test paths unless the warnings are resolved upstream.

## Deprecation note: pyfilesystem2 (`fs`) importing `pkg_resources`

On this machine, the system `fs` package currently calls `pkg_resources.declare_namespace(...)`
at import time. Newer `pkg_resources` emits a deprecation warning, which becomes a hard error under
`PYTHONWARNINGS=error`.

Workarounds (prefer reproducible venv-based ones):
- Use a venv and pin `setuptools<81` (avoids the warning, but does not remove the underlying
  dependency on `pkg_resources`).
- Patch `fs` to avoid `pkg_resources` at import time (recommended if you must use `fs`):
  `make patch-pyfilesystem2`
  This applies the small `pkgutil.extend_path(...)` replacement in venv site-packages.

Important:
- This repo's `make` targets create an isolated venv via `python3 -m venv venv` which does NOT
  see system site-packages by default.
- To use these from the venv, either:
  - install the pip equivalents into `venv` (preferred for reproducibility), or
  - create the venv with system packages enabled (less reproducible):
    `python3 -m venv --system-site-packages venv`

Suggested venv install (edit as needed for your environment):
```bash
venv/bin/pip install euclid3 numpy-quaternion pyquaternion quaternionic findiff ipfn
venv/bin/pip install typedunits pymultinest
```

Sanity-check note (this machine, system `python3` = 3.14.2, verified 2026-01-28):
- Venv (`venv/bin/python3`): none of these are installed by default.
- System `python3` import matrix with `PYTHONWARNINGS=error`:
  - OK: `euclid3`, `quaternion` (numpy-quaternion), `pyquaternion`, `mutatorMath`, `ipfn`, `unicodedata2`, `fontMath`
  - Missing: `quaternionic`, `typedunits`, `findiff`
  - NOT warnings-as-errors safe: `defcon` (raises a `pkg_resources` deprecation warning at import time)

If you need deterministic availability inside the repo build, install the pip equivalents into the venv.
"""

