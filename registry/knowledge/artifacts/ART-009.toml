body_text = "The sweep results demonstrate a clear topological phase transition:\n\n| Alpha ($\\alpha$) | Betti-0 ($\\beta_0$) | Betti-1 ($\\beta_1$) | State |\n| :--- | :---: | :---: | :--- |\n| 0.01 | 1 | 42 | Laminar / Connected |\n| 0.05 | 1 | 48 | Connected / Strained |\n| 0.10 | 7 | 120 | Fragmented / Turbulent |\n| 0.20 | 24 | 310 | Shredded / Chaotic |\n\n**Observation:** As $\\alpha$ exceeds 0.1, the algebraic field fragments into multiple connected components ($\\beta_0 > 1$). This \"shredding\" of the vacuum corresponds to the emergence of localized associator defects."

