aive=326ns`, `kahan=1379ns`; dot `x87=389ns`, `naive=331ns`, `kahan=1378ns`; norm_sq `x87=239ns`, `naive=329ns`, `kahan=1377ns`. At `n=128`, `x87_norm_sq` still leads slightly (60.3ns vs 63.1ns). `x87_norm_sq_16_fixed` measures 8.51ns. Horner remains slower on x87 (21.19ns vs 10.74ns at `n=16`) because it is a dependency chain, not an ILP-friendly reduction. The norm_sq win is therefore specific, real, and measurable evidence that the loop-inside-asm spill-prevention pattern (C-1349, I-172) improves throughput as well as precision. | crates/algebra_analysis/benches/x87_bench.rs (all groups), crates/algebra_analysis/src/x87_primitives.rs, E-188 | **Verified** | 2026-03-12 | |", "| C-210 | Jordan product {a,b} = (ab+ba)/2: the Jordan identity {a, {b, a^2}} = {{a,b}, a^2} holds EXACTLY at ALL CD dims (4-128 tested). However, general Jordan associativity {a, {b, c}} = {{a,b}, c} fails even at dim=4 (quaternions). The Jordan identity is universal (follows from flexibility), but Jordan associativity requires commutativity. | `src/scripts/analysis/cd_algebraic_experiments_v27.py`, `data/csv/cd_algebraic_experiments_v27.json` | **Verified** | 2026-02-01 | verified_constraint |", "| C-221 | Only trivial idempotents (0 and e_0) exist in CD algebras: e_0^2 = e_0 and 0^2 = 0 are EXACT at ALL dims 4-128. No non-trivial idempotent a^2=a found via random search (min\\|\\|a^2-a\\|\\|> 0.01 for random unit vectors) or Newton iteration (diverges to NaN at dim>=16). This is consistent with the absence of zero divisors at dim<=8 (since a^2=a implies a(a-e_0)=0). | `src/scripts/analysis/cd_algebraic_experiments_v29.py`, `data/csv/cd_algebraic_experiments_v29.json` | **Verified** | 2026-02-01 | |", "| C-230 | Re(ab) = Re(ba) holds EXACTLY at ALL CD dims 4-512. The real part of the product is symmetric even though the full product is not commutative. This is equivalent to the symmetry of the bilinear form B(a,b) = <a,b> and follows from the CD conjugation structure. Max deviation = 0.0 at