# Experiment dataset_refs migration mapping (plan P6A.S4.T4).
#
# Each [[migration]] row says "for experiment E-NNN, attach these
# dataset IDs (PC-/EX-/XS-) to its dataset_refs field". Consumed by
# the `experiment-dataset-refs-migrate` binary which patches
# `registry/canonical/control_plane.sqlite3#experiments_cp.
# compat_toml_text`.
#
# This file is append-only: once applied, entries stay here as a
# permanent record. Re-running the migration is idempotent (the
# binary skips rows whose dataset_refs is already populated).

