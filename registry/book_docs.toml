# RFC-001.1 The Mergus Bridge

This architecture note sets the repo's main direction:

- stop climbing as a primary agenda
- keep higher Cayley-Dickson towers and surreal lanes as controls
- start bridging through the already existing `flavor_lifts` seam

## Classical spine

The governing historical chain is:

- Schafer and later kernel summaries fix the universal Cayley-Dickson law class
- Allison and Allison-Faulkner fix the structurable bridge
- Loos fixes the Jordan-pair geometry layer
- McCrimmon stabilizes the exceptional Jordan route
- Elduque fixes the symmetric-composition and triality route

## Repo consequences

- `cd_kernel` remains the binary reference substrate
- `flavor_lifts` is the mandatory ABI seam for any middle-tier bridge
- `gororoba_structurable` is the first bridge crate, carrying Jordan-pair,
  structurable, and value-level FKTS/Kantor operators
- signature-parametric multiplication stays separate from
  signature-sensitive observables
- `albert` and `octonion_geometry` stay separate crates/modules connected by
  adapter traits rather than hard fusion

## Engineering rules

- Remove the false post-octonionic property-loss ladder from physics-facing
  docs and align them with the kernel's universal CD properties.
- Evaluate ternary structures at the value level in hot paths; do not
  materialize dense operator matrices in PMNS/CKM loops.
- Add symmetric composition, para-Hurwitz, and triality APIs alongside the
  Hurwitz/CD kernel, not as a replacement for it.
- Treat split and indefinite signatures as first-class in observables, but
  do not silently reuse Euclidean diagnostics there.

See `docs/external_sources/MERGUS_BRIDGE_SOURCES.md` for the focused source
bundle behind this RFC.
'''

