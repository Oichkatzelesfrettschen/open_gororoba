[[binary]]
name = "bout-cd-analysis"
crate = "gororoba_cli_physics"
description = "Read BOUT++ NetCDF4 output (HDF5-based), extract evolved field variables (n, phi, vort), build 32D Takens embedding from spatial profiles along sweep axis, compute CD associator at each timestep. Supports multi-channel embedding, direction-only normalization, configurable sweep axis."

[[binary]]
name = "bout-grid-inspect"
crate = "gororoba_cli_physics"
description = "Inspect BOUT++ tokamak grid files (NetCDF-3 classic format) using pure-Rust netcdf3 crate. Lists dimensions, variables, attributes, and reads key magnetic geometry fields (Rxy, Zxy, Bpxy, Btxy, psixy)."

[[binary]]
name = "bout-grid-cd"
crate = "gororoba_cli_physics"
description = "CD analysis on BOUT++ tokamak equilibrium grid (NetCDF-3). Extracts multi-variable radial profiles, builds 16D/32D/64D embeddings, computes A(psi) profile. Validates that CD is a dynamics diagnostic (smooth equilibria give A=0)."

[[binary]]
name = "mast-fetch"
crate = "gororoba_cli_physics"
description = "Pure Rust MAST Zarr downloader using ureq HTTP + rayon parallel chunk fetching. Downloads Mirnov diagnostic data from FAIR-MAST public S3 bucket (s3://mast/ at s3.echo.stfc.ac.uk). Zero authentication, blosc/lz4 compressed Zarr v2."

[[binary]]
name = "mast-mirnov-cd"
crate = "gororoba_cli_physics"
description = "CD analysis on FAIR-MAST experimental Mirnov coil data (Zarr v2, blosc/lz4). Reads n=2 and n=odd toroidal mode signals, builds 32D Takens embedding, computes sliding-window CD associator. Pure Rust: zarrs + cd_kernel."

[[binary]]
name = "solar-storm-propagation"
crate = "gororoba_cli_physics"
description = "Solar storm propagation tracker: traces CME from SDO SHARP (0 AU) through ACE L1 (1 AU) to Voyager ISM (~125 AU). Computes CD at each segment with uniform embedding for cross-distance comparison. Supports hourly CD profile and storm ratio calculation."

[[binary]]
name = "cd-anomaly-scan"
crate = "gororoba_cli_physics"
description = "Systematic CD anomaly scanner using Tukey fence (IQR * k) outlier detection across all datasets. Scans JSON/CSV files in ablations directory, ranks anomalies by sigma above median, reports top events per dataset and globally."

[[binary]]
name = "sdo-fits-parse"
crate = "gororoba_cli_physics"
description = "SDO/HMI SHARP FITS IMAGE parser: reads 2D vector magnetogram cutouts (Bp, Br, Bt) via fitsio 0.21. Computes spatial statistics including RMS, unsigned flux proxy, skewness, kurtosis. Ready for per-pixel CD embedding."

[[binary]]
name = "ism-multichannel-null"
