[[route]]
dataset_key = "gaia_dr3_nearby"
family = "astronomy"
provider_surface = "Gaia DR3 Nearby Stars"
ingress_binary = "fetch-datasets"
local_globs = ["data/external/gaia_dr3_nearby.csv"]
parser_ref = "data_core::catalogs::gaia::parse_gaia_csv"
analysis_binaries = ["survey-crossmatch", "multi-dataset-ultrametric", "catalog-feature-cube", "catalog-feature-algebra"]
report_patterns = ["reports/survey_catalog_matrix_*.toml", "reports/catalog_feature_cube_*.toml", "reports/catalog_feature_algebra_*.toml"]
notes = "Bounded nearby-star lane with spatial and topology consumers."

[[route]]
dataset_key = "jwst_public_metadata"
family = "mast"
provider_surface = "JWST Public Observation Metadata"
