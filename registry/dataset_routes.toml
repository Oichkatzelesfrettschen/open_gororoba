parser_ref = "data_core::catalogs::jwst::parse_jwst_public_metadata_csv"
analysis_binaries = ["survey-crossmatch", "multi-dataset-ultrametric", "mast-program-clustering", "catalog-feature-cube", "catalog-feature-algebra"]
report_patterns = ["reports/survey_catalog_matrix_*.toml", "reports/catalog_feature_cube_*.toml", "reports/catalog_feature_algebra_*.toml", "reports/mast_program_clustering_*.toml", "data/csv/c071g_multi_dataset_ultrametric.csv"]
notes = "Bounded JWST metadata lane for crossmatch, clustering, and feature-cube work."

