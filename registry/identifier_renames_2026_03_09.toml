updated = "2026-03-09"
authoritative = true
status = "active"
scope = "crate_and_path_renames_for_cayley_dickson_modularization"
ripgrep_query = "algebra_core|crates/algebra_core/|cd_kernel/src/cayley_dickson.rs"

[rename_audit.standard]
current_path_prefix = "CURRENT::PATH "
legacy_path_prefix = "LEGACY::PATH "
current_crate_prefix = "CURRENT::CRATE "
legacy_crate_prefix = "LEGACY::CRATE "
policy = "When a historical path or crate name appears in narrative, evidence, or registry prose, rewrite it to CURRENT::<kind> <new> (LEGACY::<kind> <old>). Operational command fields, package selectors, and live path keys should use the current identifier directly and may record legacy values in adjacent note fields or the rename ledger."

