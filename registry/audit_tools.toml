[[tool]]
id = "repo-audit"
name = "repo-audit"
make_target = "repo-audit"
install = ""
description = "Anchored debt-baseline counter (Rocq + Rust). Comment/string stripping eliminates phantom matches; --sqlite splices the canonical revisions audit into the report."
audit_comprehensive = false
status = "active"

[[tool]]
id = "repo-audit-strict"
name = "repo-audit (strict baseline)"
make_target = "repo-audit-strict"
install = ""
description = "repo-audit with --baseline-compare against data/output/debt_baseline_2026_04_30.toml + --strict. Fails the build if any debt class grew vs baseline."
audit_comprehensive = false
status = "active"

[[tool]]
id = "repo-audit-strict-unjustified"
name = "repo-audit (strict unjustified)"
make_target = "repo-audit-strict-unjustified"
install = ""
description = "repo-audit with --strict-unjustified-per-root 0 over crates/. Gates against any new #[allow(clippy::*)] in crates/ that lacks a justification comment."
audit_comprehensive = false
status = "active"

[[tool]]
id = "cache-sweep"
name = "Cache Sweep"
make_target = "cache-sweep-soft"
install = "cargo install cargo-sweep"
description = "Runs age-based cargo-sweep first, then removes regenerable gate-cbuild/<hash>/ intermediates when repo-local cargo cache pressure still exceeds the 150 GB soft cap. cache-check fails at both soft and hard caps."
audit_comprehensive = false
status = "active"

[[tool]]
id = "audit-comprehensive-structured"
name = "audit-comprehensive (structured)"
make_target = "audit-comprehensive-structured"
install = ""
description = "xtask audit-comprehensive variant: same 4-step chain as Makefile audit-comprehensive but emits per-step exit codes, log files, Markdown summary, and structured TOML record under reports/audit-comprehensive/<date>/<time>/. Use for tranche-acceptance archival."
audit_comprehensive = false
status = "active"

# -----------------------------------------------------------------------------
# SQLite-canonical registry tooling (the four binaries that mutate / export
# the canonical control plane). Not "audit" tools per se but documented here
# so REQUIREMENTS.md has one tool table not two.
# -----------------------------------------------------------------------------

[[tool]]
id = "gororoba-db"
name = "gororoba-db"
make_target = ""
install = ""
description = "Canonical mutator for claims, insights, experiments, planning, requirements. Writes to registry/canonical/control_plane.sqlite3 with append-only revisions audit. Run via `cargo run --release -p gororoba_db --bin gororoba-db -- <subcommand>`."
audit_comprehensive = false
status = "active"

[[tool]]
id = "provenance-export-control-plane"
name = "provenance export-control-plane"
make_target = ""
install = ""
description = "Re-emit registry/*.toml from canonical SQLite. Run after any SQLite mutation with --regen-toml=false; auto-invoked when --regen-toml=true. Lives in crates/gororoba_cli_provenance."
audit_comprehensive = false
status = "active"

[[tool]]
id = "registry-integrity"
name = "registry-integrity"
make_target = "registry-integrity"
install = ""
description = "Recompute registry/schema_signatures.toml after legitimate Layer-2 TOML changes. Required for the governance gate's content_sha check to pass."
audit_comprehensive = false
status = "active"

# -----------------------------------------------------------------------------
# ONNX + Vulkan build-time tools (only required by specific feature lanes).
# -----------------------------------------------------------------------------

[[tool]]
id = "turboquant-onnx-eval"
name = "turboquant onnx-eval"
make_target = ""
install = "Vendored option: enable `ort` crate `download-binaries` feature (auto-fetches ONNX Runtime; +50 MB CI cache). System-pkg fallback: paru -S onnxruntime-opt-cuda on Arch; Microsoft GitHub release: https://github.com/microsoft/onnxruntime/releases."
description = "TurboQuant real-model evaluation lane. Uses ort 2.0.0-rc.12 with load-dynamic + api-18; loads libonnxruntime.so via ORT_DYLIB_PATH. End-to-end verified on distilgpt2.onnx (12 layers, 24 KV tensors). Run `cargo run -p gororoba_cli_physics --bin turboquant --features onnx-eval -- onnx-eval`."
audit_comprehensive = false
status = "active"

[[tool]]
id = "vulkan-spirv-build"
name = "Vulkan SPIR-V build"
make_target = ""
install = "GitHub release: https://github.com/google/shaderc/releases (prebuilt glslc tarball). System-pkg fallback: paru -S shaderc on Arch."
description = "cd_kernel build.rs compiles quantize.comp + dequant_dot.comp to SPIR-V via glslc. Required for the cd_kernel vulkan feature; if shaderc is missing, build.rs writes 0-byte placeholders and VulkanQuantizer::is_available() returns false."
audit_comprehensive = false
status = "active"
