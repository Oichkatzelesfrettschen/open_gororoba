# Engineering Standards & Style Guide (Canonical Registry)
# Formalized from RUST_STYLE_GUIDE.md

[engineering_standards]
authoritative = true
updated = "2026-02-17"
status = "active"

[engineering_standards.toolchain]
channel = "nightly"
reason = "Required for cudarc, nvrtc, and SIMD intrinsics"
edition = "2024"
lockfile_policy = "checked_in"
ci_strictness = "deny_warnings"

[engineering_standards.formatting]
tool = "rustfmt"
trigger = "pre-commit"
import_grouping = "std_external_crate"

[engineering_standards.linting]
tool = "clippy"
policy = "cargo clippy --all-targets --all-features -- -D warnings"
allowed_lints_policy = "explicit_justification_required"
license_check = "cargo-deny"

[engineering_standards.quality_gate_cadence]
mode = "two_speed"
fast_iteration_scope = "crate_local"
fast_iteration_commands = [
  "WORKER_BUDGET=$(sh scripts/detect_worker_budget.sh) CARGO_BUILD_JOBS=$WORKER_BUDGET cargo check -p <crate> --all-targets",
  "WORKER_BUDGET=$(sh scripts/detect_worker_budget.sh) CARGO_BUILD_JOBS=$WORKER_BUDGET RAYON_NUM_THREADS=$WORKER_BUDGET RUST_TEST_THREADS=$WORKER_BUDGET cargo nextest run --build-jobs $WORKER_BUDGET --test-threads $WORKER_BUDGET -p <crate> <filter-or-test>",
  "WORKER_BUDGET=$(sh scripts/detect_worker_budget.sh) CARGO_BUILD_JOBS=$WORKER_BUDGET cargo clippy -p <crate> --all-targets -- -D warnings",
]
checkpoint_push_policy = "Allowed via git push --no-verify for rapid iteration only after focused crate gates pass."
milestone_gate_policy = "Required for production claims and major merges: make check plus make rust-regression, with algebra_analysis and gr_core routed through cargo nextest --cargo-profile test-heavy."
execution_topology = "Detect logical threads at runtime, divide by two to set the worker budget, apply that same budget to Cargo build jobs, nextest test threads, libtest test threads, and Rayon worker pools unless a narrower lane override is required."
rationale = "Balance high-velocity iteration with strict milestone integrity."

[engineering_standards.gpu_run_cadence]
default_run_class = "smoke_or_short_basemark"
default_duration_seconds = 20
default_sweep_repeats = 1
avoid_concurrent_long_gpu_lanes = true
production_300s_policy = "Run only on explicit request, or when measured-gate/fastpath changes require fresh production evidence."
rationale = "Keep iteration cycles fast while reserving long production lanes for explicit, evidence-driven checkpoints."

[engineering_standards.architecture]
backend_pattern = "trait_based"
backend_examples = ["LbmBackend3D enum (Cpu/Gpu)"]
configuration = "serde_toml"
state_management = "struct_owned"
global_statics_policy = "forbidden_except_managed_caches"

[engineering_standards.error_handling]
libraries = "thiserror"
applications = "anyhow"
panics_policy = "forbidden_in_lib_unless_safety_documented"

[engineering_standards.feature_policy]
library_default = "no_gpu"
cli_default = "may_include_gpu"
gpu_gate = "gpu"
cufft_gate = "cufft"
hdf5_gate = "hdf5-export"
native_blas_policy = "crate_local_opt_in_only"
native_blas_surface = "neural_homotopy exposes only openblas-system via Cargo features."
native_blas_detection = "Use make doctor-blas or sh scripts/detect_native_blas.sh to report host BLAS/LAPACK candidates; detection never auto-enables Cargo features."
native_blas_non_goal = "Do not expose BLIS, Accelerate, Netlib, or source-backed OpenBLAS in repo features until the selected backend is reproducible in offline gates without implicit downloads."
make_entrypoint_wrapper = "Use ./makew <target> when shells or outer tools export MAKEFLAGS and you need the repo's own concurrency policy without inherited GNU make jobserver warnings."
validation_deps = "tda used only by test-tda-api; consider feature-gating if compile time grows"

[engineering_standards.gpu_safety]
feature_gate = "gpu"
ffi_encapsulation = "lbm_3d_cuda crate"
unsafe_policy = "comment_invariants"

[engineering_standards.testing]
unit_tests = "colocated_in_src"
integration_tests = "tests_directory"
property_testing = "proptest"
benchmarking = "criterion"
taxonomy = "smoke_regression_heavy"
smoke_lane = "Dedicated fast suites only (`make smoke`, `make python-smoke`, `make rust-smoke`)."
regression_lane = "Required default non-ignored coverage (`make test`, `make python-regression`, `make rust-regression`)."
heavy_lane = "Ignored, GPU, and research-heavy suites (`make heavy`) with nextest heavy profile routing."
inventory_source = "registry/test_taxonomy.toml via cargo run -p gororoba_cli_data --bin test-inventory -- --check"
heavy_crate_policy = "Never use standard cargo test for algebra_analysis or gr_core; use cargo nextest with --cargo-profile test-heavy and the repo worker budget (logical threads / 2) for build threads, nextest test threads, libtest threads, and Rayon pools unless a stricter per-test override applies."

[engineering_standards.documentation]
public_api = "warn_missing_docs"
math_format = "latex_or_ascii_approx"

[engineering_standards.version_control]
commit_style = "conventional_commits"
dependency_policy = "no_git_deps_in_release"

[engineering_standards.crate_roles]
gororoba_engine = "orchestration_config_traits"
lbm_core = "pure_cpu_kernels"
lbm_3d_cuda = "gpu_ffi_nvrtc"
algebra_core = "abstract_math_types"
gororoba_cli = "binary_entry_points"

[engineering_standards.warp_gate_profiles]
policy_source = "registry/engineering_standards.toml"
default_policy = "canonical_300s_measured_for_production_claims"

[engineering_standards.warp_gate_profiles.canonical_300s]
scalar_min_abs_max = 1.0e-14
scalar_min_std_dev = 0.0
enstrophy_min_abs_max = 1.0e-20
enstrophy_min_std_dev = 0.0

[engineering_standards.warp_gate_profiles.canonical_300s_measured]
enstrophy_measured_min_abs_max = 1.0e-20
enstrophy_measured_min_std_dev = 0.0
u_rms_min_abs_max = 1.0e-14
u_rms_min_std_dev = 0.0
algebra_norm_min_abs_max = 1.0e-20
algebra_norm_min_std_dev = 0.0
spectral_total_power_min_abs_max = 1.0e-24
spectral_total_power_min_std_dev = 0.0
enstrophy_measured_nonzero_fraction_min = 0.01
u_rms_nonzero_fraction_min = 0.01
algebra_norm_nonzero_fraction_min = 0.01
spectral_total_power_nonzero_fraction_min = 0.01
u_rms_model_lock_max_fraction = 0.999

[engineering_standards.warp_forcing_profiles]
default = "canonical_300s_matched_fp32_bf16_v1"

[engineering_standards.warp_forcing_profiles.kolmogorov_bf16_measured_v1]
re_target = 192.0
max_mach = 0.12
rho0 = 1.0
mode_y_requested = 1
bf16_min_delta_ulp_ratio = 0.05
bf16_enforce_mode_floor = true
enforce_mode_floor_all_precisions = true
rationale = "Use low-Mach NS-balanced Kolmogorov forcing while enforcing cross-precision mode matching to avoid BF16-vs-FP32 physics drift from precision-dependent mode_y selection."

[engineering_standards.warp_forcing_profiles.canonical_300s_matched_fp32_bf16_v1]
re_target = 192.0
max_mach = 0.12
rho0 = 1.0
mode_y_requested = 1
bf16_min_delta_ulp_ratio = 1.0
bf16_enforce_mode_floor = true
enforce_mode_floor_all_precisions = true
rationale = "Canonical production profile: matched FP32/BF16 forcing envelope with low-Mach NS balance and BF16 quantization-resolving mode floor applied consistently across precisions."

[[engineering_standards.warp_forcing_profiles.canonical_300s_matched_fp32_bf16_v1.per_resolution]]
resolution = 128
mode_y_requested = 1
re_target = 192.0
max_mach = 0.12
rho0 = 1.0
bf16_min_delta_ulp_ratio = 1.0
bf16_enforce_mode_floor = true
enforce_mode_floor_all_precisions = true

[[engineering_standards.warp_forcing_profiles.canonical_300s_matched_fp32_bf16_v1.per_resolution]]
resolution = 256
mode_y_requested = 1
re_target = 192.0
max_mach = 0.12
rho0 = 1.0
bf16_min_delta_ulp_ratio = 1.0
bf16_enforce_mode_floor = true
enforce_mode_floor_all_precisions = true
