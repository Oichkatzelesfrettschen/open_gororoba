[[novel_thesis]]
id = "LFT-001"
title = "Lambda Critical Window Detection"
statement = "Transport and topology metrics should be monitored as piecewise-smooth functions of lambda, with explicit detection of critical windows where curvature spikes."
anchor_experiments = ["E-034", "E-027"]
anchor_claims = ["C-678", "C-679", "C-657", "C-658"]
status = "proposed"

[[novel_thesis]]
id = "LFT-002"
title = "Zero-Divisor Motif Priors for Lambda Scheduling"
statement = "Zero-divisor motif density should be used as a prior for lambda schedule selection before expensive transport sweeps."
anchor_experiments = ["E-027", "E-031"]
anchor_claims = ["C-657", "C-659", "C-677"]
status = "proposed"

[[novel_thesis]]
id = "LFT-003"
title = "Loop-Automorphism Regularization of Homotopy Search"
statement = "Loop automorphism constraints should regularize m3 and higher correction search to reduce overfitting in neural homotopy runs."
anchor_experiments = ["E-029"]
anchor_claims = ["C-671", "C-672", "C-684"]
status = "proposed"

[[novel_thesis]]
id = "LFT-004"
title = "Representation Invariance Check for Lambda Effects"
statement = "Observed lambda response classes should remain stable across equivalent representation choices when mapped through the same CD stage semantics."
anchor_experiments = ["E-031", "E-035"]
anchor_claims = ["C-677", "C-682"]
status = "proposed"

[[novel_thesis]]
id = "LFT-005"
title = "Identity-Regime Guardrails for Coupling Models"
statement = "Each lambda-coupling claim should declare the identity regime assumptions explicitly to avoid invalid cross-stage extrapolation."
anchor_experiments = ["E-034", "E-031"]
anchor_claims = ["C-681", "C-682"]
status = "proposed"

