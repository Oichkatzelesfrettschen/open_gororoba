[[deliverable]]
id = "NA023-D008"
phase = "PH-MEDIUM"
title = "NA-023 closure packet and go/no-go decision"
boundaries = ["PB-001", "PB-002", "PB-003", "PB-004", "PB-005", "PB-006"]
outputs = [
