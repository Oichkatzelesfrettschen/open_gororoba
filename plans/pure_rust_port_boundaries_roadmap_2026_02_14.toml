# NA-023 phased roadmap for clean-room pure-Rust port boundaries.

[roadmap]
id = "NA023-PURE-RUST-BOUNDARIES-ROADMAP-2026-02-14"
updated = "2026-02-14"
source_ref = "NA-023"
status = "active"
status_token = "ACTIVE"
authoritative = false
boundary_report = "reports/pure_rust_port_boundaries_2026_02_14.toml"
scope = "short_and_medium_term_execution_for_clean_room_module_boundaries"

[execution_contract]
clean_room_only = true
direct_external_code_import = "blocked_until_NA-021_resolution"
targeted_checks_only = true
full_workspace_gate_default = false

[[phase]]
id = "PH-SHORT"
horizon = "short_term"
window = "0_to_2_sprints"
goal = "Freeze boundaries, wire acceptance hooks, and prevent forbidden coupling."
deliverable_focus = [
  "boundary_contract_freeze",
  "acceptance_hook_activation",
  "coupling_guardrails",
]

[[phase]]
id = "PH-MEDIUM"
horizon = "medium_term"
window = "3_to_6_sprints"
goal = "Implement modular extraction and deterministic integration across ownership crates."
deliverable_focus = [
  "module_extraction",
  "engine_level_integration",
  "regression_and_performance_controls",
]

[[deliverable]]
id = "NA023-D001"
phase = "PH-SHORT"
title = "Boundary contract freeze and ownership confirmation"
boundaries = ["PB-001", "PB-002", "PB-003", "PB-004", "PB-005", "PB-006"]
outputs = [
  "reports/pure_rust_port_boundaries_2026_02_14.toml",
  "plans/pure_rust_port_boundaries_roadmap_2026_02_14.toml",
]
acceptance_hooks = [
  "python3 -c \"import tomllib, pathlib; tomllib.load(pathlib.Path('reports/pure_rust_port_boundaries_2026_02_14.toml').open('rb')); print('ok')\"",
  "python3 -c \"import tomllib, pathlib; tomllib.load(pathlib.Path('plans/pure_rust_port_boundaries_roadmap_2026_02_14.toml').open('rb')); print('ok')\"",
]
dependencies = []
risk_controls = [
  "Require crate-owner sign-off before changing any boundary contract field.",
  "Treat external paths as behavioral references only; no code copy.",
]
exit_criteria = "Both NA-023 files parse as TOML and boundary IDs are stable for downstream tasks."

[[deliverable]]
id = "NA023-D002"
phase = "PH-SHORT"
title = "Targeted acceptance harness activation for algebra and fluid kernels"
boundaries = ["PB-001", "PB-002", "PB-003"]
outputs = [
  "crate-scoped test command set for lbm_core, sign_imbalance, and algebra_core",
  "recorded pass/fail hook status in NA-023 execution notes",
]
acceptance_hooks = [
  "cargo test -p lbm_core test_mass_conservation",
  "cargo test -p sign_imbalance test_scalar_imbalance_bridge_integration",
  "cargo test -p algebra_core test_all_signatures_dim16_commutativity",
]
dependencies = ["NA023-D001"]
risk_controls = [
  "Use crate-targeted filters to avoid unrelated concurrent-worktree noise.",
  "Pin deterministic seeds and explicit tolerances for nondeterministic paths.",
]
exit_criteria = "Each kernel boundary has at least one passing high-signal acceptance hook."

[[deliverable]]
id = "NA023-D003"
phase = "PH-SHORT"
title = "Migration-lane acceptance harness for equation catalog and typed-term data"
boundaries = ["PB-004", "PB-005"]
outputs = [
  "docpipe equation catalog hook set",
  "neural_homotopy training-data and integration hook set",
]
acceptance_hooks = [
  "cargo test -p docpipe dedupe_and_classification_behavior",
  "cargo test -p docpipe parity_and_gap_reports_are_stable",
  "cargo test -p neural_homotopy test_samples_cover_full_basis_product_space",
]
dependencies = ["NA023-D001"]
risk_controls = [
  "Fixture-first validation to prevent schema drift in equation catalogs.",
  "Keep training data generation deterministic and bounded in size.",
]
exit_criteria = "Both migration lanes have deterministic fixture tests wired and passing."

[[deliverable]]
id = "NA023-D004"
phase = "PH-SHORT"
title = "PEPS CPU/GPU boundary split hardening"
boundaries = ["PB-006"]
outputs = [
  "explicit CPU fallback contract for PEPS row contraction",
  "feature-gated GPU acceptance command and expected behavior notes",
]
acceptance_hooks = [
  "cargo test -p quantum_core test_peps_product_state_entropy_zero",
  "cargo test -p quantum_core --features gpu test_gpu_contract_rows_correctness",
]
dependencies = ["NA023-D001"]
risk_controls = [
  "GPU path must remain optional and never block baseline CPU correctness.",
  "Document mismatch-input behavior to avoid silent API drift.",
]
exit_criteria = "PEPS boundary tests pass on CPU path and GPU path remains explicitly gated."

[[deliverable]]
id = "NA023-D005"
phase = "PH-MEDIUM"
title = "Module extraction and API fencing in ownership crates"
boundaries = ["PB-001", "PB-002", "PB-003", "PB-004", "PB-005", "PB-006"]
outputs = [
  "public API fences for boundary entrypoints in each ownership crate",
  "private-internal helper split where forbidden coupling risk is currently high",
]
acceptance_hooks = [
  "cargo clippy -p lbm_core -p sign_imbalance -p algebra_core -p docpipe -p neural_homotopy -p quantum_core -- -D warnings",
]
dependencies = ["NA023-D002", "NA023-D003", "NA023-D004"]
risk_controls = [
  "Use compile-time visibility boundaries to stop accidental cross-crate leakage.",
  "Block runtime registry writes from kernel modules via review checklist.",
]
exit_criteria = "All boundary entrypoints are isolated behind crate-owned public interfaces."

[[deliverable]]
