[[risk]]
id = "R-001"
name = "license_contamination"
severity = "high"
description = "External candidate code or structure could leak directly into clean-room implementations."
controls = [
  "Clean-room-only policy with behavior-level references.",
  "NA-021 gate remains hard dependency for any import policy change.",
]
watch_items = [
  "new vendored source files from external repositories",
  "commit diffs containing copied external code blocks",
]

[[risk]]
id = "R-002"
name = "forbidden_coupling_drift"
severity = "high"
description = "Boundary code may start depending on unrelated crate internals."
controls = [
  "API fencing in ownership crates.",
  "Targeted clippy and crate-level review checklist for dependency edges.",
]
watch_items = [
  "new non-public cross-crate imports",
  "runtime registry mutations in kernel paths",
]

[[risk]]
id = "R-003"
name = "nondeterministic_regressions"
severity = "medium"
description = "Kernel and training outputs may drift without explicit seed and tolerance contracts."
controls = [
  "Deterministic fixture-based tests for each boundary.",
  "Pinned tolerances and replay checks in acceptance hooks.",
]
watch_items = [
  "flaky test outcomes across repeated runs",
  "unseeded random initialization in boundary entrypoints",
]

[[risk]]
id = "R-004"
name = "performance_regression_without_visibility"
severity = "medium"
description = "Boundary modularization can degrade throughput if not tracked with explicit baselines."
controls = [
  "Capture baseline metrics before optimization changes.",
  "Enforce regression thresholds in medium-term hooks.",
]
watch_items = [
  "increasing runtime on key acceptance commands",
  "unstable GPU fallback behavior",
]

