  "regression thresholds for acceptance hook outputs",
]
acceptance_hooks = [
  "cargo test -p lbm_core test_poiseuille_accuracy",
  "cargo test -p sign_imbalance test_imbalance_density_par_matches_sequential",
  "cargo test -p algebra_core test_find_zero_divisors_sedenion",
  "cargo test -p quantum_core test_peps_entropy_boundary_cases",
]
dependencies = ["NA023-D005"]
