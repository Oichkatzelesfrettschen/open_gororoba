# Repository debt roadmap seeded from the 2026-04-11 CPD and structure audit.

[meta]
id = "REPO-DEBT-ROADMAP-2026-04-11"
updated = "2026-04-11"
status = "superseded"
superseded_by = "plans/repo_debt_taxonomy_roadmap_2026_06_04.toml"
scope = "open_gororoba repository structure, build gates, scientific evidence lanes, and modularization"
authoritative = false
source_mode = "repo_evidence_plus_primary_pmd_docs"

[execution_contract]
warnings_as_errors = true
full_workspace_gate_default = false
prefer_crate_scoped_validation = true
network_in_tests = "forbidden"
