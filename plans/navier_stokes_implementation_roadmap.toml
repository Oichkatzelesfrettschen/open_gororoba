]
implemented_method = "Derive cutoff-independent K3=64 and G3=96 directly for normalized-volume H3 using lattice shell sums, Young and Cauchy-Schwarz. Check a continuous piecewise-affine supersolution by exact convex quadratic endpoint inequalities. Quantize only slopes outward; preserve error endpoints exactly across segments and slabs."
limits = "The bounded subdivision search can return INCONCLUSIVE despite an existing supersolution. Analytic local existence, continuation, comparison and constant derivations remain in the explicit trust boundary; no Rocq correspondence is claimed."

[[milestones]]
id = "F"
title = "Certify a nontrivial Beltrami perturbation neighborhood"
status = "implemented_with_documented_analytic_trust_and_same_implementation_replay"
paths = ["crates/navier_stokes_verify/src/beltrami.rs", "crates/navier_stokes_verify/src/certificate.rs", "crates/navier_stokes_verify/fixtures/beltrami_neighborhood.json"]
requirements = [
  "Set M=||v0||_s, c0=(G_s+K_s)M, D_s=D_(s+1)=M exp(-nu t), epsilon_s=0 for exact unit-wave Beltrami data.",
  "Certify delta_s < c0/[G_s expm1(c0/nu)] using enclosed arithmetic and the exact M=0 limit nu/G_s.",
  "Identify the projected datum explicitly; include conversion and projection errors and a complete tail declaration in its H^s distance.",
  "Emit independently reproducible human-readable and machine-readable certificates for the stated datum or neighborhood."
]
analytic_derivation = "Let A(t)=exp[-nu t+(c0/nu)(1-exp(-nu t))] and Q(t)=[exp((c0/nu)(1-exp(-nu t)))-1]/c0. Then R(t)=delta_s A(t)/(1-G_s delta_s Q(t)); positivity for all t follows from the strict radius. For c0=0 use Q(t)=(1-exp(-nu t))/nu."
arithmetic_requirement = "Use certified exp/expm1 or log-domain enclosures. A floating underflow to zero does not establish the M=0 case."
fixture = "nu=1; ABC amplitudes A=B=C=1/8; add exact z-component coefficients 2^-100 at +/- (2,1,0). The reference H3 norm is sqrt(3)/8, above the zero-reference small-data threshold 1/96. The complete perturbation H3 norm is sqrt(250)*2^-100 and lies strictly inside the positive enclosed radius."
reproduction_limit = "The CLI recomputes the complete certificate in a separate process using the same source-identified implementation. This passes deterministic replay, not the independent-implementation acceptance gate."

