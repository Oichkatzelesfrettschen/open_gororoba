implementation = "crates/navier_stokes_verify/src/certificate.rs: versioned deny_unknown_fields serde schema, complete exact rational inputs and projected datum, all slab bounds, source/lockfile digest, request digest, evidence level, scope and error accounting."
scope_limit = "Version 1 supports complete rational polynomials only. Source and lockfile hashes identify the verifier independently of optional caller-declared solver/verifier Git context. CI records the checked revision and compiler. Formal verification and an independent implementation remain explicit unmet acceptance gates."
required_fields = ["schema_version", "status", "evidence_level", "equation_identity", "viscosity_enclosure", "domain", "fourier_normalization", "sobolev_convention", "sobolev_order", "initial_data_identity", "initial_data_tail_enclosure", "projection_and_conversion_error", "cutoffs", "reconstruction", "time_slabs", "norm_bounds", "residual_bounds", "aliasing_and_discarded_terms", "arithmetic_model", "constant_sources", "majorant_enclosure", "comparison_theorem", "certificate_scope", "solver_commit", "verifier_commit", "input_hashes", "independent_reproduction"]
fail_closed = "Do not issue CERTIFIED when required data, constants, tails, reconstruction bounds, arithmetic assumptions or theorem scope are missing."

