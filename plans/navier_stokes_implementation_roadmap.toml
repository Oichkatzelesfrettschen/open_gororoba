schema_version = 1
title = "Navier-Stokes numerical reference and continuum verification roadmap"
baseline_commit = "e036a72b87b9915847cde2ed1908f319cc67eeca"
last_reviewed = "2026-09-07"
owner = "open_gororoba"
evidence_level = "specified_data_global_certificate_under_documented_analytic_trust"
first_research_phase_complete = false
continuum_certificate_implemented = true
purpose = "Compute the original interaction, falsify structural claims, and verify selected continuum trajectories."
long_range_objective = "Discover and prove cutoff-independent stretching or linearized-evolution bounds."
execution_order = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M"]

[baseline]
equation = "dt(u) + P[(u.grad)u] = nu Delta(u)"
domain = "(R / 2 pi Z)^3"
data = "Require smooth, real, divergence-free, zero-mean initial data and nu > 0."
fourier_series = "u(x) = sum_k u_hat[k] exp(i k.x)"
constraints = ["k.u_hat[k] = 0", "u_hat[-k] = conjugate(u_hat[k])", "u_hat[0] = 0"]
volume_measure = "(2 pi)^(-3) dx"
kinetic_energy = "0.5 * sum_k |u_hat[k]|^2"
sobolev_norm = "For zero-mean fields use ||u||_s^2 = sum_(k != 0) |k|^(2s) |u_hat[k]|^2."
sobolev_order = "Require s > 5/2 for the Kato comparison argument."
zero_mode = "Use P_0 = I for general Leray projection; impose zero mean separately. The LBM diagnostic helper projects into the zero-mean subspace."
modified_equations = ["forcing", "variable viscosity", "stabilization", "spectral filters", "Smagorinsky closures", "algebraically reweighted interactions"]
evidence_levels = ["simulation", "numerical_convergence", "verified_trajectory", "finite_time_certificate", "specified_data_global_certificate", "conditional_theorem", "arbitrary_data_theorem"]
promotion_rule = "Never promote convergence, symmetry, conservation, or statistics into a continuum regularity theorem."

[mathematical_corrections]
majorant_direction = "Use R' >= ell_s R + G_s R^2 + epsilon_s, or equality; <= belongs to the error, not its upper majorant."
beltrami_norm = "D_s = D_(s+1) on |k|=1 uses the homogeneous norm. Inhomogeneous norms require D_(s+1)=sqrt(2) D_s and a changed c0."
constant_conversion = "For constants stated using unnormalized L2(dx), multiply K_s and G_s by (2 pi)^(3/2) before using this normalized-volume norm. Verify the source convention rather than copying decimals."
covariance = "Test all 48 signed coordinate permutations on Z^3. An arbitrary rotation requires rotating the periodic lattice too."
closed_triads = "The convolution uses p+q=k. LBM extractor labels satisfy k+p+q=0; their receiving-k inputs are -p and -q. Emit all three receivers."
refinement = "At fixed physical data, halve dx and lattice velocity, quarter dt, quadruple steps, and preserve tau and physical viscosity."
restored_equalities = ["nu_phys = (tau-1/2) dx^2/(3 dt)", "0.5 d_t ||omega||_2^2 = integral omega^T S omega dx - nu ||grad omega||_2^2"]

[[sources]]
title = "Morosi and Pizzocchero, Smooth solutions of the Euler and Navier-Stokes equations from the a posteriori analysis of approximate solutions"
url = "https://arxiv.org/html/1405.3421v4"
scope = "Use Sections 2 and 4 for norm conventions, bilinear constants and control inequalities; Section 5 for the zero-reference small-data criterion. Convert normalization explicitly."

[[sources]]
title = "Morosi and Pizzocchero, On approximate solutions of the incompressible Euler and Navier-Stokes equations"
url = "https://arxiv.org/abs/1104.3832"
scope = "Trace the original approximate-solution and Galerkin verification framework."

