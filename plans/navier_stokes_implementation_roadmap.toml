id = "A"
title = "Correct physical transfer and pass exact falsifiers"
status = "implemented_numerical_validation"
paths = ["crates/lbm_core/src/turbulence.rs", "crates/lbm_core/tests/navier_stokes_transfer.rs", "crates/spectral_core/src/warp_physics.rs"]
requirements = [
  "Compute N_k = -i P_k sum_(p+q=k) (q.u_hat[p]) u_hat[q] and T_k = Re(conjugate(u_hat[k]).N_k).",
  "Preserve signs, all vector components, receiving-mode phases, Hermitian partners and both ordered input contractions.",
  "Compare against the independent ordered convolution; pass exact -1/+1, quadrature phase, missing-mode, cubic-scaling, conservation, projection and covariance controls.",
  "Reject nonfinite input and arithmetic before amplitude screening can turn invalid data into empty diagnostics.",
  "Retain scalar warp quantities only as triad_amplitude_proxy and triad_weighted_amplitude; label E7 stabilization as modified equations."
]
limits = "Thresholded, low-mode LBM extraction is a selected diagnostic. Use full spectral convolution for complete modal transfer. These computations use ordinary f64."

