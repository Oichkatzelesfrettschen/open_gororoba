classification_rule = "Separate scientific propositions, empirical generalizations, fitted constructions, hypotheses, negative-result lessons, engineering observations and planning proposals before choosing validation criteria."

[audit_design]
grouping_rule = "Group by a traced shared source, dataset, transformation, estimator, implementation, assumption, calibration or falsifier. Titles and keywords nominate candidates. They do not justify merging propositions or counting repeated analyses as independent evidence."
membership = "Allow a record to belong to several audit families; retain one canonical record and explicit relationship roles."
proposed_reference_roles = ["supports", "refutes", "negative_result_about", "motivates", "depends_on", "shares_pipeline", "shares_source", "supersedes"]
schema_rule = "These roles are design candidates. Audit actual examples and existing table owners before implementing a migration; the existing claim_relations vocabulary cannot be silently extended by ad hoc writes."
required_family_fields = ["Atomic source and repository propositions", "Record IDs and evidence layer", "Primary sources and inclusion/exclusion log", "Data/code identities and execution boundary", "Intervening maps and free-parameter budget", "Independent and shared evidence roles", "Matched controls and cheapest decisive falsifier", "Verification, revision, abandonment and inconclusive outcomes", "Exploratory successor hypothesis and independent test", "Canonical write owner, regeneration and verification commands", "Unassigned records and residual obligations"]
research_cycle = ["Preserve the original statement and evidence", "Trace the mechanism and declare a decisive falsifier", "Execute only after inputs and protocol are admitted", "Record support, refutation, revision or inconclusiveness at the supported layer", "Extract a narrower result, obstruction or methodological lesson", "Treat newly suggested explanations as exploratory hypotheses", "Declare an independent or held-out test before promotion", "Update typed canonical records and recompute dependent review candidates"]
success_rule = "An accurate negative result, obstruction, corrected instrument or narrower mechanism is a valid result. The audit does not promise a positive finding or force every record to change."
priority_rule = "Resolve authority and evidence-role blockers first; then choose high-fanout interpretive dependencies with decisive offline tests. Keep source-only, CPU, GPU and externally blocked lanes distinct."

[scientific_boundaries]
recent_work = "PRs #172-175 are merged. The latest correction separates effect evidence, historical target attainment and practical utility. Reuse the retained results instead of repeating their experiments without a new reason."
threshold_rule = "The detector's 0.005 ROC-AUC value remains a historical discrimination target without established application-based justification. It supplies neither a general scientific gate nor a usefulness verdict."
evidence_layer_rule = "Source propositions, implementation conformance and phenomenological mappings require different evidence. Success at one layer does not promote another."
negative_result_rule = "Review the meaning of an insight's reference before propagating a parent's refutation; lessons from refutation can remain valid."
same_data_rule = "A successor explanation discovered during falsification is exploratory until independently tested; reusing the discovery data does not turn it into a new confirmation."

[retrieval]
user_preference = "Use wget with a Mozilla user agent. Try HTTP mirrors when HTTPS fails and supported rsync, FTP, FTPS or other transport endpoints when needed."
example = "wget --user-agent='Mozilla/5.0' --timeout=30 --tries=2 -O <local-file> <source-url>"
source_priority = "Primary publisher or author sources, institutional repositories and identified preprint/source releases; confirm DOI, title, authors, edition and relevant equation/table."
lfs_rule = "An LFS pointer is a locator, not an admitted paper or dataset. Retrieve actual non-LFS bytes or an independently identified source version and record the distinction."
identity_rule = "Retain requested/final URLs, protocol, dates, response outcome, byte length, hash and source version. A different edition or body receives its own identity rather than satisfying an old digest expectation."
absence_rule = "A failed endpoint proves only that attempt failed. Record searched surfaces and an intake condition instead of asserting global unavailability."
search_log_fields = ["Family question", "Database or website", "Exact query", "Search date", "Candidate identity", "Included or excluded", "Reason", "Source version", "Relevant section/equation", "Retrieval receipt"]

[repository_workflow]
canonical_write_target = "registry/canonical/control_plane.sqlite3"
mutation_rule = "Use gororoba-db owning commands, then export-control-plane, execution-planning as needed and registry-integrity. Preserve append-only transition and revision history. Never hand-edit generated compatibility exports."
destructive_import_rule = "Do not rebuild/import the canonical database to refresh exports. Such operations can discard history."
implementation_rule = "Pure Rust; warnings as errors; narrow source changes, meaningful tests and independent review. New Markdown requires the repository's allowance policy; prefer existing docs or TOML planning artifacts."
cache_rule = "The retained handoff checkout supports REPO_SHARE_PRIMARY_CACHE=1. Pass absolute Cargo roots. Its source remains different from the historical frozen runner."
publication_rule = "The next execution pass should use isolated changes, focused validation and the required full pre-push gate before PR integration. The present handoff is a local planning commit, not a scientific adjudication."
