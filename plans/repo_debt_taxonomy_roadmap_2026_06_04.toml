# Reconciled, evidence-grounded technical-debt taxonomy and forward roadmap.
#
# WHY: The repository accumulated three overlapping debt artifacts (the
# 2026-04-11 roadmap with 12 classes, the 2026-05-12 post-gate tracker,
# and ~24 scattered DEBT-* identifiers strewn across plans, data, docs,
# and source). The fragmentation is itself a debt (DEBT-TAXONOMY-COHERENCE):
# a reader cannot tell a canonical debt CLASS from a Stage-B work-item TAG,
# and several debt surfaces the maintainer named (methodology, organizational,
# language/package-manager/delivery, and the domain-aligned numerical /
# dimensional / transcription / proof-extraction surfaces) were only
# implicit. This file reconciles all prior identifiers into one coherent
# six-axis taxonomy, grounds every class in a reproducible measurement, and
# defines the forward phasewise/stepwise/taskwise program.
#
# WHAT: 21 canonical debt classes across 6 macro-axes; a reconciliation
# table mapping every legacy DEBT-* tag onto a canonical class; a fresh
# measured baseline reference (data/output/debt_baseline_2026_06_04.toml);
# and 9 forward phases with atomic, falsifiable tasks.
#
# HOW: Each [[debt_class]] carries a current_magnitude metric with the exact
# command that reproduces it, confirmed_examples by path, a resolution
# pattern, and a falsifiable_acceptance criterion (a command whose pass/fail
# decides whether the class is closed). Phases reference these via task
# acceptance_hooks. Re-measure by re-running repo-audit (see [provenance]).

[meta]
id = "REPO-DEBT-TAXONOMY-ROADMAP-2026-06-04"
updated = "2026-06-04"
status = "active"
authoritative = true
scope = "open_gororoba repository: code structure, build/toolchain/delivery, test/verification, data/provenance, scientific/methodology, documentation/organizational debt"
source_mode = "repo_evidence_plus_repo_audit_anchored_measurement"
supersedes = "plans/repo_debt_roadmap_2026_04_11.toml"
subsumes = ["plans/post_gate_optimization_2026_05_12.toml"]
evidence_baseline = "data/output/debt_baseline_2026_06_04.toml"
predecessor_baselines = [
  "data/output/debt_baseline_2026_04_30.toml",
  "data/output/debt_baseline_2026_05_09.toml",
]

[meta.relationship_to_predecessors]
roadmap_2026_04_11 = "Historical. Its 12 [[debt_class]] ids are preserved verbatim here (no renames -- renaming breaks the C-/I-/E- style cross-references in source comments and finding-docs). Its PH-0..PH-6 + PH-MOD phase plan is treated as executed-or-in-flight; the open remainder is folded into the forward phases below."
post_gate_optimization_2026_05_12 = "Folded into DEBT-MODULARIZATION (monolith remainder), DEBT-DATA-PROVENANCE (registry counter reconciliation), and DEBT-OBSERVABILITY (gate-timing soak). Its task-id references (#116-#130) remain valid task history."
scattered_tags = "DEBT-PROOF-1/-2, DEBT-UNSAFE-1/-CRATES/-PROOFS/-PROOFS-SCAFFOLDING, DEBT-TEST-1/-2, DEBT-PLACEHOLDER-1/-2, DEBT-EXPERIMENT-1, DEBT-CLAIMS-PROOF are Stage-B WORK-ITEM TAGS (in [task_scope_adjustments] of the 2026-05-09 baseline and in docs/engineering/*_2026_05_09.md finding-docs), not canonical classes. They are reconciled in [[identifier_reconciliation]] below."

# ----------------------------------------------------------------------------
# Execution contract (inherited from the 2026-04-11 roadmap, unchanged).
# ----------------------------------------------------------------------------
[execution_contract]
warnings_as_errors = true
full_workspace_gate_default = false
prefer_crate_scoped_validation = true
network_in_tests = "forbidden"
default_network_features = "forbidden_without_explicit_opt_in"
generated_files = "do_not_hand_edit"
registry_mutation = "sqlite_canonical_then_export"
documentation_updates = "update_source_registries_first_then_regenerate"
hardcoded_demonstrations = "forbidden"
ascii_only = true
comment_hygiene = "no_task_pr_phase_or_deictic_refs_in_source"

# ----------------------------------------------------------------------------
# Six-axis taxonomy. Each axis groups the canonical classes that share a
# review surface, a tooling lane, and an owner mental-model. The grouping
# maps the maintainer's enumerated debt kinds onto measurable classes.
# ----------------------------------------------------------------------------
[taxonomy]
axis_count = 6
class_count = 21

[taxonomy.axes.A_code_structure]
label = "Code and structure debt"
classes = [
  "DEBT-MODULARIZATION",
  "DEBT-STRUCTURAL-ARCHITECTURE",
  "DEBT-DUPLICATION",
  "DEBT-GENERATED-ARTIFACT",
  "DEBT-MEMORY-SAFETY",
]
review_lane = "cargo clippy + cpd-audit + repo-audit (unsafe/SAFETY) + monolith inventory"

[taxonomy.axes.B_build_toolchain_delivery]
label = "Build, toolchain, package-manager, and delivery debt"
classes = [
  "DEBT-BUILD-WORKSPACE",
  "DEBT-SUPPLY-CHAIN",
]
review_lane = "Makefile/xtask migration, cargo-deny, dep-audit, semver-check, toolchain pin"

[taxonomy.axes.C_test_verification]
label = "Test and verification debt"
classes = [
  "DEBT-TEST-VERIFICATION",
  "DEBT-FORMAL-VERIFICATION",
  "DEBT-PROOF-EXTRACTION-FIDELITY",
  "DEBT-OBSERVABILITY",
]
review_lane = "nextest coverage, proofs/ vos+vok, extraction parity, gate-timing telemetry"

[taxonomy.axes.D_data_provenance]
label = "Data and provenance debt"
classes = [
  "DEBT-DATA-PROVENANCE",
  "DEBT-DATA-TRANSCRIPTION",
]
review_lane = "provenance registry, source hashing, transcribed-table codegen-from-source"

[taxonomy.axes.E_scientific_methodology]
label = "Scientific and methodology debt (domain-aligned)"
classes = [
  "DEBT-NUMERICAL-ALGORITHM",
  "DEBT-NUMERICAL-REPRODUCIBILITY",
  "DEBT-DIMENSIONAL-UNITS",
  "DEBT-SCIENTIFIC-EVIDENCE",
  "DEBT-METHODOLOGY",
]
review_lane = "solver parity tests, determinism/seed control, unit-correctness, claim-evidence linkage, falsifiability discipline"

[taxonomy.axes.F_documentation_organizational]
label = "Documentation and organizational debt"
classes = [
  "DEBT-DOCUMENTATION-REQUIREMENTS",
  "DEBT-ORGANIZATIONAL",
  "DEBT-TAXONOMY-COHERENCE",
]
review_lane = "registry-driven docs regeneration, plan/branch lifecycle, agent coordination, this taxonomy"

