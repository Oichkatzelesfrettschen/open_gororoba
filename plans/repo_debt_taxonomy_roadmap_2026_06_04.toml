[[debt_class]]
id = "DEBT-NUMERICAL-REPRODUCIBILITY"
axis = "E_scientific_methodology"
label = "Determinism, seed control, and cross-backend bitwise parity"
risk = "A scientific result that does not reproduce bit-for-bit (or within a stated tolerance) on re-run or on a different backend is not research-grade. Nondeterministic time-seeding, unseeded RNG, and silent f32-GPU vs f64-CPU divergence undermine the source-of-data claim."
current_magnitude = "36 entropy-seeded RNG sites (rand::rng() / ThreadRng) across 22 crates/ files seed computations nondeterministically. NOTE: rand 0.10 renamed thread_rng() to rand::rng(), so a thread_rng/from_entropy grep is a false-negative detector (it reports 0 while the nondeterminism persists under the new name) -- detect with 'rand::rng\\(\\)|ThreadRng'. Also 241 Instant::now() call sites (telemetry is fine, but must never seed a computation). GPU kernels run FP32 while CPU reference runs FP64, with an empirically-characterized ~1e-4 relative drift per D3Q19 step at low Mach, documented but not universally asserted by a parity test. The seeded-ChaCha discipline is exemplified in crates/cd_kernel/tests/proof_extraction_fidelity.rs."
magnitude_reproduce = "rg -c 'rand::rng\\(\\)|ThreadRng|thread_rng|from_entropy' crates --type rust | awk -F: '{s+=$2} END{print s}' ; rg -c 'Instant::now\\(\\)' crates --type rust | awk -F: '{s+=$2} END{print s}'"
confirmed_examples = [
  "36 rand::rng()/ThreadRng sites in 22 files (gororoba_algebra species_audit, lattice_filtration zero_divisor_census, cosmology_core mass_ladder, many gororoba_cli_physics bins).",
  "241 Instant::now() sites (telemetry vs computation must be separable).",
  "GPU FP32 vs CPU FP64 LBM drift (~1e-4 rel/step; documented in cd_kernel/lbm comments).",
]
resolution_pattern = "Seed every stochastic pathway from an explicit u64 (rand::rng()/ThreadRng forbidden in a computation; expose a --seed CLI flag defaulting to a fixed value so a run is reproducible yet a sweep can vary the seed); keep Instant::now strictly for telemetry; add cross-backend parity tests asserting GPU-vs-CPU agreement within a stated tolerance recorded as a claim. The 36-site conversion is a careful per-site sweep (a blind global hardcoded seed would break Monte-Carlo null-test semantics), not a single mechanical edit."
falsifiable_acceptance = "rg 'rand::rng\\(\\)|ThreadRng|thread_rng|from_entropy' crates --type rust outside tests yields zero; a GPU-vs-CPU parity test asserts a bounded relative error at fixed seed for at least one LBM and one cd_kernel pathway."
status = "open"  # detector corrected; 36-site seed-parameterization sweep remaining
predecessor_ids = []
cross_links = ["DEBT-SCIENTIFIC-EVIDENCE", "DEBT-PROOF-EXTRACTION-FIDELITY"]

