# ----------------------------------------------------------------------------
# AXIS A -- CODE AND STRUCTURE DEBT
# ----------------------------------------------------------------------------

[[debt_class]]
id = "DEBT-MODULARIZATION"
axis = "A_code_structure"
label = "Hand-written monolith modularization"
risk = "Multi-thousand-line hand-written .rs files slow language servers, defeat focused review, and concentrate merge conflicts. Single impl blocks running thousands of lines mask coupling and obscure module boundaries."
current_magnitude = "33 non-generated .rs files exceed the 2000-line warn threshold; 5 exceed the 4000-line target_max; 0 exceed the 8000-line urgent threshold (down from 1 at 2026-05-12). Worst: optical_database.rs 7638, boxkites/tests.rs 7016, repo_visuals.rs 4394, emanation/tests.rs 4327, provenance_store/lib.rs 4220."
magnitude_reproduce = "find crates xtask -name '*.rs' -not -path '*/registry_mirrors/*' | xargs wc -l | sort -rn | head -25"
confirmed_examples = [
  "crates/materials_core/src/optical_database.rs (7638; but see DEBT-DATA-TRANSCRIPTION -- this is transcribed data, not logic)",
  "crates/algebra_analysis/src/boxkites/tests.rs (7016; boxkites.rs main split into submodules already, tests remain bulky)",
  "crates/gororoba_cli_data/src/bin/repo_visuals.rs (4394)",
  "crates/provenance_store/src/lib.rs (4220; was 5335, one 4850-line impl block partially decomposed)",
  "xtask/src/main.rs (3411; manual string-dispatcher monolith)",
]
resolution_pattern = "Split monoliths by logical surface (types vs algorithms vs IO vs phenomenon classes), keep the public API stable via pub use re-exports from the original module path, validate per-crate with cargo check + clippy + nextest under workspace deny-warnings. Test-heavy files (boxkites/tests, emanation/tests) use the #[cfg(test)] mod tests; + sibling parent/tests.rs relocation."
falsifiable_acceptance = "find crates xtask -name '*.rs' -not -path '*/registry_mirrors/*' | xargs wc -l | awk '$1>=4000' yields only TRANSCRIBED-DATA files (optical_database, crystal_symmetry) AND test-only files explicitly exempted; no production-logic .rs over 4000 lines."
status = "in_progress"
predecessor_ids = ["DEBT-MODULARIZATION (PH-MOD)"]
cross_links = ["plans/post_gate_optimization_2026_05_12.toml task #116-#127", "DEBT-DATA-TRANSCRIPTION"]

