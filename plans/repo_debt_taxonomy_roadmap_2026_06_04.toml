[[debt_class]]
id = "DEBT-PROOF-EXTRACTION-FIDELITY"
axis = "C_test_verification"
label = "Binding between Rocq-proven models and shipping Rust code"
risk = "A proof can be internally complete yet prove a property of an idealized model that the Rust executable does not actually implement. Without a binding, the formal-verification badge overclaims: the proof constrains a definition, not the kernel that runs. This is the single highest research-integrity risk for arXiv-grade claims."
current_magnitude = "The repo proves theorems about Cayley-Dickson structures (Moreno 1997, Brown 1972) and ships Rust kernels (cd_kernel) computing in those algebras. The first explicit proof-to-executable binding now exists: crates/cd_kernel/tests/proof_extraction_fidelity.rs reimplements the Rocq CDDoubleFunctor::cd_mul / cd_conj recurrence as an independent oracle and asserts all three production multiply paths (recursive cd_multiply, SIMD cd_multiply_simd, sign-table multiply_via_table) match it on seeded random inputs at dims 8..256, plus the octonion composition identity at dim 8. Remaining: most of the other 144-of-1441 proof-backed claims still bind by naming convention, not by a parity test."
magnitude_reproduce = "grep -c 'formal_proof' registry/claims.toml ; ls proofs/extraction 2>/dev/null ; rg 'Brown1972|Moreno1997' crates/cd_kernel/src | wc -l"
confirmed_examples = [
  "cd_kernel Rust multiplication vs Rocq sed_mul / oct_mul definitions (parity asserted by naming, not by a generated oracle).",
  "FidelityCD / tower-instantiation proofs referenced in scattered DEBT-PROOF tags.",
]
resolution_pattern = "For each safety-critical algebraic identity, add a property-based Rust test (proptest) whose oracle is the same recurrence the Rocq proof uses, so the executable is checked against the proven recurrence on random inputs; record the theorem-id <-> Rust-function binding in the claim registry's formal_proof field."
falsifiable_acceptance = "cargo nextest run -p cd_kernel --test proof_extraction_fidelity passes (recurrence-binding landed); and each claim with formal_proof_present names both a Rocq theorem id AND a Rust test that exercises the corresponding executable path."
status = "in_progress"  # first binding landed: cd_kernel multiply <-> CDDoubleFunctor::cd_mul
predecessor_ids = []
cross_links = ["DEBT-FORMAL-VERIFICATION", "DEBT-SCIENTIFIC-EVIDENCE", "crates/cd_kernel/tests/proof_extraction_fidelity.rs"]

