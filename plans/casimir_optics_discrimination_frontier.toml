[[row]]
frontier_id = "lifshitz-planar-polar-normalization"
priority = "P0"
domain = "casimir"
mechanism = "Zero-temperature planar Lifshitz pressure and energy use a dimensionless polar quadrature without an angular wedge cutoff."
current_evidence = "The quantum_core helper exposes the dimensionless momentum cutoff and radial and angular quadrature orders; hosted audit run 34740642669 retained independent cutoff, radial-order, and angular-order rows."
completion_state = "closed"
completion_witness = "planar_convergence.tsv records cutoff orders 16, 20, and 24, radial orders 128, 256, and 512, and angular orders 32, 64, and 128. The highest-order ideal pressure and energy references pass at 2e-9 relative tolerance, the multilayer angular sequence passes at 1e-8, and summary.toml records the pressure-energy identity at 5.94e-11 relative error."
completion_verifier = "GitHub Actions run 34740642669, Verify retained Casimir and optics audit freshness"
discriminating_question = "Does the Rust API reproduce ideal pressure and the pressure-energy derivative identity?"
required_observation = "Ideal-mirror pressure at 200 nm agrees with -pi^2*hbar*c/(240d^4), quadrature refinement converges, and -d(E/A)/dd agrees with pressure."
execution_class = "offline"
authority_owner = "crates/quantum_core/src/casimir/lifshitz.rs"
canonical_data_target = "data/output/audit/casimir-optics-discrimination/summary.toml"
required_generator = "cargo test -p quantum_core casimir"
probe_declaration = "Deterministic Gauss-Legendre q-mu quadrature with explicit cutoff and orders."
bounded_output_schema = "summary.toml:quantity,value,reference,relative_error"
maximum_rows_and_bytes = "64 rows; 32 KiB"
retention_class = "tracked-derived-evidence"
tools = ["rg", "cargo", "gauss-quad"]
ordering_dependencies = ["primary-source-intake"]
completion_gate = "Exact ideal pressure and energy tests, derivative test, and retained cutoff/order refinement observations pass their declared tolerances."
falsification_condition = "The highest declared cutoff or order fails its tolerance, refinement fails to converge toward a stable reference, or the ideal limit retains the legacy 0.9005 ratio."

