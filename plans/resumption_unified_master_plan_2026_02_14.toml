[phase.5]
name = "Basemark + Precision Matrix + BF16 Fastpath"
goal = "Establish truthful N^3 basemarks, fix GPU timing/FFT/telemetry, and iterate BF16 fastpath before re-running authoritative 300s production."

[[phase.5.step]]
id = 41
action = "Fix cuFFT forcing path: remove device-to-device `CudaSlice::clone()` copies, reuse solver buffers, bind cuFFT plan to solver stream, and normalize IFFT with 1/(N^3)."
validation = "gororoba_cli builds with --features gpu; forcing path reuses buffers; no dtod clones in the hot loop."

[[phase.5.step]]
id = 42
action = "Extend GPU solver control surface: add `initialize_uniform`, `initialize_custom`, `set_force_field`, `set_viscosity_field`, and `evolve` on `LbmSolver3DCuda` plus matching CUDA kernels where needed."
validation = "`warp-gpu-experiment`, `percolation-experiment`, and E-027 GPU path compile and run."

[[phase.5.step]]
id = 43
action = "Make timing truthful: add `TimingMode` to warp runner and default GPU lanes to CUDA event timing (or explicit sync) so timing histograms represent device work, not async launch overhead."
validation = "Timing TOMLs show realistic step times for 128^3 and 256^3 (no microsecond p50 artifacts)."

[[phase.5.step]]
id = 44
action = "Add a Rust-native `warp-basemark-suite` binary: run N^3 basemark matrix and emit HDF5 artifacts, timing TOMLs, and a consolidated basemark report."
validation = "`cargo run -p gororoba_cli --bin warp-basemark-suite --features gpu,hdf5-export --` completes and emits a `reports/warp_basemark_report_YYYY_MM_DD.toml`."

[[phase.5.step]]
id = 45
action = "Run basemark lane (default 45s): GPU matrix for 32^3, 128^3, 256^3 in FP32/BF16 (plus CPU 32^3 FP64 baseline) and gate artifacts fail-closed."
validation = "`warp-acceptance-gate` passes on all basemark H5 outputs."

[[phase.5.step]]
id = 46
action = "Fill the missing 32^3 300s lane: run 32^3 for 300 seconds (at least BF16, optionally FP32 reference) and gate artifacts."
validation = "A 32^3 300s H5 artifact exists on disk and passes `warp-acceptance-gate`."

[[phase.5.step]]
id = 47
action = "Upgrade telemetry: implement NVML sampling via `nvml-wrapper` with fallback to `nvidia-smi`; attach telemetry CSV to production and basemark suites."
validation = "Telemetry CSV is emitted reliably without needing shell-only workflows."

[[phase.5.step]]
id = 48
action = "Kernel geometry tuning: add block-dim override and/or autotune for the fused LBM kernel; record best settings per resolution in a TOML tuning registry."
validation = "Basemark shows >=3% BF16 improvement at 128^3 and 256^3 vs prior baseline before re-running 300s production."

[[phase.5.step]]
id = 49
action = "Write physics + numerics derivation: document D3Q19 BGK update, tau-viscosity mapping, stability notes, scaling with N^3, and why async GPU timing requires events/sync."
validation = "`docs/WARP_RING_N3_PHYSICS_AND_NUMERICS.md` exists and matches current implementation."

[[phase.5.step]]
id = 50
action = "Re-run authoritative 300s production after fastpath gate: BF16 128^3 and BF16 256^3 with telemetry and truthful timing enabled."
validation = "New `data/h5/production/<timestamp>/warp_ring_128_BF16_300s.h5` and `warp_ring_256_BF16_300s.h5` exist plus timing + telemetry reports."

[[phase.5.step]]
id = 51
action = "Emit consolidated fastpath report TOML after 300s rerun."
validation = "`reports/warp_bf16_300s_fastpath_report_YYYY_MM_DD.toml` exists."

[[phase.5.step]]
id = 52
action = "Add GPU FP64 reference precision (kernels + reductions) for basemark/behavior reference (not a speed target)."
validation = "Basemark suite can run GPU FP64 at 32^3 and gates still pass."

[[phase.5.step]]
id = 53
action = "Add CPU FP32 and CPU BF16-storage solver variants with Rayon parallelism and SIMD where available (Zen3: AVX2/FMA; no AVX512 BF16)."
validation = "CPU basemark can run FP64/FP32/BF16-storage at 32^3 and passes invariants within tolerances."

[[phase.5.step]]
id = 54
action = "Add cross-precision invariant tests (small 8^3 and 16^3): rho_mean drift bounds across CPU/GPU and FP32/BF16/FP64 reference where available."
validation = "`cargo test --workspace` passes under --features gpu."

[[phase.5.step]]
id = 55
action = "Add a basemark analyzer (Rust binary) that reads timing TOMLs + telemetry CSV and prints a normalized comparison table into `reports/`."
validation = "Analyzer emits a single table report suitable for committing as evidence."
