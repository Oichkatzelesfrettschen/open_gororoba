name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/gate-target
    steps:
      - uses: actions/checkout@v4

      - name: Detect worker budget from logical threads / 2
        run: |
          WORKER_BUDGET="$(sh scripts/detect_worker_budget.sh)"
          echo "WORKER_BUDGET=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "RAYON_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "CARGO_JOBS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "NEXTEST_TEST_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "Detected worker budget $WORKER_BUDGET from logical threads / 2."

      - name: Install Rust toolchain (stable 1.97.0, with clippy)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Single-session repository validation
        run: ./makew validate-ci

      # Validation-timing regression check. Reads
      # data/output/audit/<date>/validation-timing-*.jsonl artifacts from
      # prior runs, filters by the artifact timestamp rather than
      # checkout mtime, and compares the latest run's per-phase
      # elapsed_sec against the baseline median.
      #
      # HARD GATE: the 2-week observation window has elapsed. The check
      # is warmup-guarded -- a phase with fewer than --min-samples baseline
      # records is reported as "warmup" and never fails -- so the gate stays
      # dormant until enough committed history accrues, then catches a phase
      # whose latest elapsed_sec exceeds --threshold x the baseline median.
      - name: Validation-timing regression check
        run: |
          if [ -d data/output/audit ]; then
            "$CARGO_TARGET_DIR/validation-tools/xtask" validation-timing-regression-check \
              --baseline-days 14 \
              --threshold 2.0 \
              --min-samples 5
          else
            echo "No validation-timing JSONL history yet; skipping regression check."
          fi

      - name: Warp artifact acceptance gate (when HDF5 artifacts are present)
        if: ${{ hashFiles('data/h5/**/*.h5') != '' }}
        run: |
          cargo run -p gororoba_cli_warp --features gpu,hdf5-export --bin warp-acceptance-gate --allow-empty -- "data/h5/**/*.h5"

      - name: Upload validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-reports
          path: reports/validation/**
          if-no-files-found: ignore

  docs-gate:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: Detect worker budget from logical threads / 2
        run: |
          WORKER_BUDGET="$(sh scripts/detect_worker_budget.sh)"
          echo "WORKER_BUDGET=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "RAYON_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "CARGO_JOBS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "NEXTEST_TEST_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=$WORKER_BUDGET" >> "$GITHUB_ENV"
          echo "Detected worker budget $WORKER_BUDGET from logical threads / 2."

      - name: Install Rust toolchain (stable 1.97.0)
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo registry and docs artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin
            ${{ env.CARGO_TARGET_DIR }}
          key: rust-docs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-docs-${{ runner.os }}-

      - name: Install mdBook
        run: cargo install --force --version 0.4.40 mdbook

      - name: Build publishable documentation bundle
        run: ./makew docs-gate

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/site-docs

  docs-freshness:
    needs:
      - validation
      - docs-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site

      - name: Verify docs freshness and redirect wiring
        run: cargo run --release -p repo_utilities --bin repo-utilities -- docs-redirect-check docs-site

  docs-deploy:
    needs:
      - docs-freshness
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
