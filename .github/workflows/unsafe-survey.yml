name: unsafe-survey

# Dependency changes trigger the survey; the monthly run also detects tool drift.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'tools/vendor/cargo-geiger/**'
      - '.github/workflows/unsafe-survey.yml'
  pull_request:
    paths:
      - 'tools/vendor/cargo-geiger/**'
      - '.github/workflows/unsafe-survey.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geiger:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ''
      RUSTUP_TOOLCHAIN: '1.97.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Install linker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/vendor/cargo-geiger -> ../../../target
          key: unsafe-survey-${{ hashFiles('tools/vendor/cargo-geiger/Cargo.lock') }}
          cache-on-failure: true
      - name: Test the vendored survey package
        run: |
          cargo test --locked --release --manifest-path tools/vendor/cargo-geiger/Cargo.toml -p cargo-geiger --lib --test workspace_report
          test -x "$CARGO_TARGET_DIR/release/cargo-geiger"
      - name: Lint the vendored survey package
        run: cargo clippy --locked --manifest-path tools/vendor/cargo-geiger/Cargo.toml -p cargo-geiger --lib --bin cargo-geiger -- -D warnings
      - name: Survey workspace once and record its outcome
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p survey
          stage=compiler_identity
          # The EXIT trap invokes the receipt writer; ShellCheck versions classify
          # indirect trap calls as unreachable commands or an uninvoked function.
          # shellcheck disable=SC2317,SC2329
          record_receipt() {
            command_status=$?
            trap - EXIT
            receipt_status=0
            jq -n --rawfile raw_report <(cat survey/report.json 2>/dev/null || true) \
              --arg commit "$GITHUB_SHA" --arg stage "$stage" \
              --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson exit_status "$command_status" \
              '($raw_report | try fromjson catch null) as $report |
               {schema_version: 2, tool: "vendored cargo-geiger 0.13.0 workspace report", git_commit: $commit,
                captured_at: $captured_at, exit_status: $exit_status, stage: $stage,
                survey_completed: ($exit_status == 0),
                report_json_valid: ($report | type == "object"),
                syntax_scan_complete: (if $exit_status == 0 then $report.syntax_scan_complete else null end),
                syntax_files_failed: (if $exit_status == 0 then $report.syntax_files_failed else null end),
                syntax_inventory_limit: "Successful execution retains parse failures and ignored build scripts; it does not imply all files parsed",
                report: "report.json", denominator: "workspace.json",
                used_source_scope: "union of workspace compilation units; not isolated per-root usage",
                interpretation: "Diagnostic unsafe inventory; counts are not a vulnerability verdict"}' \
              > survey/receipt.json || receipt_status=$?
            if [ "$command_status" -eq 0 ] && [ "$receipt_status" -ne 0 ]; then
              command_status=$receipt_status
            fi
            exit "$command_status"
          }
          trap 'record_receipt' EXIT
          RUSTC="$(rustup which --toolchain 1.97.0 rustc)"
          export RUSTC
          "$RUSTC" --version --verbose > survey/compiler-identity.txt
          printf '%s\n' "$RUSTC" >> survey/compiler-identity.txt
          stage=tool_identity
          "$CARGO_TARGET_DIR/release/cargo-geiger" --version > survey/tool-version.txt
          stage=workspace_metadata
          cargo metadata --locked --no-deps --format-version 1 > survey/workspace.json
          survey_binary="$CARGO_TARGET_DIR/release/cargo-geiger"
          status=0
          stage=workspace_survey
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/survey-target" CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 \
            "$survey_binary" --workspace-report --locked \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --all-targets \
            --all-dependencies --include-tests > survey/report.json 2> survey/geiger.log || status=$?
          if [ "$status" -eq 0 ]; then
            stage=coverage_validation
            jq -e --slurpfile metadata survey/workspace.json \
              '(.workspace_members | sort) == ($metadata[0].workspace_members | sort) and
               ([.root_reports[].root] | sort) == (.workspace_members | sort) and
               .compilation_count == 1 and
               (.excluded_graph_packages_with_compiler_sources | length) == 0' survey/report.json > survey/coverage-check.txt || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=completed
          fi
          exit "$status"
      - name: Upload survey report and execution receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: geiger-${{ github.run_id }}
          path: survey/
          if-no-files-found: warn
          retention-days: 30
