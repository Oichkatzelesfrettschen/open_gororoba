name: unsafe-survey

# Dependency changes trigger the survey; the monthly run also detects tool drift.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/unsafe-survey.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geiger:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install linker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang
      - name: Cache survey tool
        id: geiger-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: geiger-${{ runner.os }}-${{ runner.arch }}-0.13.0-rust1.97.0
      - name: Install cargo-geiger
        if: steps.geiger-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.13.0 cargo-geiger
      - uses: Swatinem/rust-cache@v2
        with:
          key: unsafe-survey
      - name: Run cargo-geiger and record its outcome
        shell: bash
        run: |
          mkdir -p survey
          cargo geiger --version > survey/tool-version.txt
          cargo metadata --locked --no-deps --format-version 1 > survey/workspace.json
          jq -r '.workspace_members as $members | .packages[] |
            select(.id as $id | $members | index($id)) |
            [.name, .manifest_path] | @tsv' survey/workspace.json > survey/members.tsv
          status=0
          while IFS=$'\t' read -r package manifest; do
            package_status=0
            cargo geiger --locked --manifest-path "$manifest" --all-targets \
              --all-dependencies --include-tests > "survey/${package}.txt" 2>&1 || package_status=$?
            jq -n --arg package "$package" --argjson exit_status "$package_status" \
              '{package: $package, exit_status: $exit_status}' >> survey/packages.jsonl
            if [ "$package_status" -ne 0 ]; then
              status=1
              echo "::error::cargo-geiger failed for $package (exit $package_status)"
            fi
          done < survey/members.tsv
          jq -n --arg commit "$GITHUB_SHA" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson exit_status "$status" \
            '{schema_version: 1, tool: "cargo-geiger 0.13.0", git_commit: $commit,
              captured_at: $captured_at, exit_status: $exit_status,
              survey_completed: ($exit_status == 0), package_outcomes: "packages.jsonl", denominator: "members.tsv",
              interpretation: "Diagnostic unsafe inventory; counts are not a vulnerability verdict"}' \
            > survey/receipt.json
          exit "$status"
      - name: Upload survey report and execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geiger-${{ github.run_id }}
          path: survey/
          if-no-files-found: warn
          retention-days: 30
