name: docs-publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docs-publish-${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.id || 'main' }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/gate-target
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  docs-publication:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40,sccache@0.15.0
      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted documentation publication uses $worker_budget workers from std::thread::available_parallelism()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done
      - name: Install compiler and data dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config
      - name: Cache documentation dependencies and build artifacts
        id: docs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
            ${{ github.workspace }}/.cache/docs-cbuild
            ${{ github.workspace }}/target/docs-target
            ${{ github.workspace }}/.cache/book-cbuild
            ${{ github.workspace }}/target/book-target
          key: docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.event.workflow_run.head_sha }}-
            docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - name: Build default-feature docs and check freshness together
        env:
          DOCS_RUST_SCOPE: --workspace
        run: make --jobs="$WORKER_BUDGET" --keep-going docs-freshness DOCS_CARGO_BUILD_DIR="$GITHUB_WORKSPACE/.cache/docs-cbuild" DOCS_BOOK_CARGO_BUILD_DIR="$GITHUB_WORKSPACE/.cache/book-cbuild"
      - name: Retain documentation build artifacts
        if: success() && steps.docs-cache.outputs.cache-primary-key != '' && steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
            ${{ github.workspace }}/.cache/docs-cbuild
            ${{ github.workspace }}/target/docs-target
            ${{ github.workspace }}/.cache/book-cbuild
            ${{ github.workspace }}/target/book-target
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/site-docs
          retention-days: 7

  docs-deploy:
    needs: [docs-publication]
    if: needs.docs-publication.result == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs-site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
