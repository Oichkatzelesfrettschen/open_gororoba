name: CD Kernel Multi-Platform Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/cd_kernel/**'
      - 'crates/fwht/**'
      - 'crates/verified_core/**'
      - 'crates/gororoba_gpu_bridge/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/bench-cd-kernel.yml'
  push:
    branches: [main]
    paths:
      - 'crates/cd_kernel/**'
      - 'crates/fwht/**'
      - 'crates/verified_core/**'
      - 'crates/gororoba_gpu_bridge/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/bench-cd-kernel.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86
          - runner: ubuntu-24.04-arm
            architecture: arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - name: Install linker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang glslc
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ matrix.architecture }}
      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "CARGO_BUILD_JOBS=$worker_budget" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$worker_budget" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=$worker_budget" >> "$GITHUB_ENV"
          echo "Hosted benchmark validation uses $worker_budget process-visible CPUs."
      - name: Record processor topology
        id: host-cpu
        continue-on-error: true
        run: lscpu
      - name: Record host memory
        id: host-memory
        continue-on-error: true
        run: free -h
      - name: Record kernel and architecture
        id: host-kernel
        continue-on-error: true
        run: uname -a
      - name: Record Rust compiler
        id: host-rustc
        continue-on-error: true
        run: rustc --version --verbose
      - name: Build and run the benchmark target
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p cd_kernel --test bench_multiplatform -- --nocapture --test-threads="$RUST_TEST_THREADS" 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.architecture }}
          path: bench.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Report collected host-probe failures
        if: always()
        env:
          HOST_CPU_OUTCOME: ${{ steps.host-cpu.outcome }}
          HOST_MEMORY_OUTCOME: ${{ steps.host-memory.outcome }}
          HOST_KERNEL_OUTCOME: ${{ steps.host-kernel.outcome }}
          HOST_RUSTC_OUTCOME: ${{ steps.host-rustc.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in HOST_CPU_OUTCOME HOST_MEMORY_OUTCOME HOST_KERNEL_OUTCOME HOST_RUSTC_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing host probe(s)." >&2
            exit 1
          fi
