name: CD Kernel Multi-Platform Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/cd_kernel/**'
      - 'crates/verified_core/**'
      - 'crates/gororoba_gpu_bridge/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/bench-cd-kernel.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86
          - runner: ubuntu-24.04-arm
            architecture: arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install linker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ matrix.architecture }}
      - name: Record execution host
        run: |
          lscpu
          free -h
          uname -a
          rustc --version --verbose
      - name: Build and run the benchmark target
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p cd_kernel --test bench_multiplatform -- --nocapture --test-threads=1 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.architecture }}
          path: bench.txt
          if-no-files-found: warn
          retention-days: 14
