name: proofs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - '.github/workflows/proofs.yml'
  pull_request:
    paths:
      - 'proofs/**'
      - '.github/workflows/proofs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Resolve process-visible worker count
        run: |
          echo "MAKE_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "Hosted proof validation uses $(nproc) process-visible CPUs."

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam

      - name: Restore opam
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-ubuntu24-ocaml5.4.0-rocq9.1.1-stdlib9.1.0-flocq4.2.2-v1

      - name: Install Rocq 9.1
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing --yes
          opam switch create rocq-9.1.1 ocaml-base-compiler.5.4.0 --yes
          opam repository add rocq-released https://rocq-prover.org/opam/released --switch=rocq-9.1.1 --yes
          eval "$(opam env --switch=rocq-9.1.1)"
          opam install rocq-core.9.1.1 rocq-stdlib.9.1.0 coq-flocq.4.2.2 --yes

      - name: Save installed proof toolchain
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Compile all proofs
        id: compile
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.1.1)"
          make --jobs="$MAKE_JOBS" --keep-going all

      - name: Zero-Admitted check
        id: admitted
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.1.1)"
          make --jobs="$MAKE_JOBS" --keep-going check

      - name: Extraction golden-file diff
        id: extraction
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.1.1)"
          make --jobs="$MAKE_JOBS" --keep-going extract-check

      - name: Report collected proof failures
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          ADMITTED_OUTCOME: ${{ steps.admitted.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in COMPILE_OUTCOME ADMITTED_OUTCOME EXTRACTION_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing proof lane(s)." >&2
            exit 1
          fi
