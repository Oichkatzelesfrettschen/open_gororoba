[pytest]
testpaths = tests
pythonpath = src
addopts = -q --strict-markers
markers =
    smoke: fast confidence checks required on every change.
    regression: default functional regression coverage.
    slow: opt-in tests with higher runtime or external latency.
    requires_ext: tests that depend on optional compiled stacks, vendor SDKs, or external toolchains.
filterwarnings =
    error
