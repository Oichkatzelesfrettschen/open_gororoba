gpu_enable_cmd = "WORKER_BUDGET=$$(sh scripts/detect_worker_budget.sh) CARGO_BUILD_JOBS=$$WORKER_BUDGET cargo build --workspace --features gpu"
gpu_note = "CUDA support is feature-gated; cudarc uses NVRTC runtime compilation."
gpu_policy = "Use CUDA-first, Vulkan-second for pure GPU compute backends. Use strictly Pure Vulkan (via Rust kernels/SPIR-V) for all hybrid simulation-visualization tasks."
clock_model = "two_phase"
phi1 = "collision_or_preparation"
phi2 = "streaming_or_execution"

[shared.gpu_optimization_roadmap]
priority = "top"
target_gpu = "RTX 4070 Ti (Ada Lovelace SM 8.9, 48 MB L2, 504 GB/s, CUDA 13.1)"
target_cpu = "5600X3D (Zen 3, 96 MB L3 V-Cache, 6 physical cores)"
cudarc_version = "0.19.1"

[shared.gpu_optimization_roadmap.phase_1_soa_coalescing]
status = "complete"
summary = "AoS -> SoA memory layout for D3Q19 distribution functions"
detail = "f[i * n_cells + idx] gives 4-byte stride, 32 threads per warp pull one 128-byte cache line. Fused collision+streaming kernel eliminates intermediate barrier."
files = ["crates/lbm_3d_cuda/src/kernels_dark_halo.cu", "crates/lbm_3d_cuda/src/lib.rs"]

[shared.gpu_optimization_roadmap.phase_2_l2_residency]
status = "complete"
summary = "Pin rho field in Ada Lovelace L2 cache via CU_LAUNCH_ATTRIBUTE_ACCESS_POLICY_WINDOW"
detail = "hitRatio=1.0, PERSISTING. 64 MB rho field pinned. cudarc 0.19 raw sys bindings."

[shared.gpu_optimization_roadmap.phase_3_zero_copy_dma]
status = "complete"
summary = "Page-locked host memory via ctx.alloc_pinned::<f32>()"
detail = "PinnedHostSlice bypasses OS paging. GPU DMA controller writes directly to pinned physical addresses."

[shared.gpu_optimization_roadmap.phase_4_vcache_simd]
status = "complete"
summary = "CPU-side halo counting via rayon par_chunks(8) + wide::f32x8"
detail = "Portable SIMD via wide crate (AVX2 on x86_64, NEON on aarch64). 96 MB V-Cache fits 256^3 rho field."

[shared.gpu_optimization_roadmap.phase_5_tensor_core_la]
status = "active"
summary = "Tensor Core AVT via Left-Multiplication Matrix L_a for dim>=64 CD algebras"
detail = """
CANONICAL STANDARD for all high-dimensional (dim>=64) CD algebra GPU computation.

The Left-Multiplication Matrix L_a encodes a*x as standard matrix-vector product:
  L_a[i][j] = a[i XOR j] * gamma(i XOR j, j)
where gamma = cd_basis_mul_sign. This maps non-associative CD multiplication into
linear algebra suitable for Tensor Core WMMA MMA instructions.

Key properties:
- For basis elements (entries 0 or +/-1), FP16 is EXACT -- no rounding.
- FP32 accumulator preserves full single precision for linear combinations.
- At dim=256 (Voudon), L_a = 256x256 = 256 WMMA 16x16 tiles.
- Tiled streaming: never need full L_a in memory. Build tiles on-the-fly via
  build_left_mul_tile(). Working set: ~2 KB per row-block.

Files:
- crates/gororoba_algebra/src/gpu/kernels_tensor_avt.cu  (CUDA kernel: build_left_mul_tile + tensor_cd_mul_kernel)
- crates/gororoba_algebra/src/gpu/tensor_avt.rs          (host orchestration: TensorAVT, compute_cd_mul, compute_dense_avt_field)
- crates/cd_kernel/src/cayley_dickson/mod.rs             (CPU reference module: left_mult_operator f64)
- crates/gororoba_algebra/src/construction/cayley_dickson  (re-export: cd_basis_mul_sign, cd_multiply)

Verification: 3 independent paths must agree:
1. compute_cd_mul (L_a row-scan)
2. cd_multiply from cd_kernel (recursive doubling)
3. reference_cd_multiply (target-index accumulation, test-only)

Dims supported: 16, 32, 64, 128, 256, 512, 1024 (powers of 2, >= 16).
"""
hardware = "RTX 4070 Ti SM 8.9: 4th-gen Tensor Cores, FP16 MMA + FP32 accumulate, ~165 TFLOPS"

