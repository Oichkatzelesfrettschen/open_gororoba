[shared.conventions]
# The gate is anti-emoji, not anti-Unicode. `ansi-check --check` fails a file
# only on an emoji or a control character other than tab, newline or carriage
# return; curly quotes, dashes, arrows, Greek letters and box-drawing all pass.
# The former key name was ascii_only, which read as a prohibition on all
# non-ASCII text and caused agents to refuse legitimate mathematical notation.
emoji_blocked = true
ascii_preferred = true
warnings_as_errors = true
nightly_toolchain_required = true
workspace_dependency_rule = "Define shared dependencies in root Cargo.toml; use workspace=true in crate manifests."
error_handling_libraries = "thiserror"
error_handling_binaries = "anyhow"
panics_in_library_code = "forbidden"
autobins_policy = "explicit_only"
conventional_commit_required = true
synthetic_data_forbidden = true
synthetic_data_policy = """
All experiment binaries, density initializations, parameter defaults, calibration tables, \
and published results MUST trace to real observational data, measured materials tables, \
published theoretical models, or governed catalog entries. Arbitrary synthetic defaults \
(for example --sersic-n 4 or --m200 1e12) are FORBIDDEN as hard-coded primary settings. \
Primary claim evidence MUST come from cited real or published inputs; surrogate, normalized, \
or synthetic generators are allowed only as explicitly labeled secondary fallbacks that are \
fit against cited real data or published response classes and can never be the sole basis for \
a primary claim. Binaries must either: (1) require mandatory arguments with no defaults for \
physics parameters, (2) load from a real catalog file (parquet, FITS, CSV), or (3) reference \
a specific published object, measurement, or material calibration with a citation. If a binary \
needs a quick-test mode, gate it behind an explicit --synthetic flag that prints a warning: \
'WARNING: using synthetic parameters, not real data'. Any fallback output must carry an in-band \
warning and a provenance note marking it as secondary/scoping-only. Rationale: this is a research \
platform; every numerical result must have traceable provenance, and primary conclusions must \
remain anchored to real evidence."""

[shared.quality_gate_cadence]
mode = "two_speed"
fast_iteration_scope = "crate_local"
fast_iteration_policy = "Prefer rust.check.focused + rust.test.focused + rust.clippy.focused during active implementation loops."
checkpoint_push_policy = "Checkpoint pushes may use git.push.checkpoint after focused crate gates pass and when no production claim is being published."
milestone_policy = "Before production claims, artifact publication, or major merges, run rust.smoke (workspace clippy/tests with warnings-as-errors)."
rationale = "Reduces iteration latency while preserving strict full-workspace quality at milestone boundaries."

[shared.gpu_run_cadence]
default_run_class = "smoke_or_short_basemark"
default_duration_seconds = 20
default_sweep_repeats = 1
avoid_concurrent_long_gpu_lanes = true
production_300s_policy = "Run only on explicit request, or when a measured-gate/material fastpath change requires new production evidence."
rationale = "Prevent unnecessary long GPU runs during iteration while preserving high-fidelity production reruns when truly needed."

[[shared.pitfall]]
id = "PIT-001"
issue = "nalgebra pinned to 0.33 (statrs 0.18.0 requires ^0.33; gauss-quad pulls 0.34 transitively)"
impact = "dep tree has two nalgebra copies (0.33 + 0.34); upgrade blocked until statrs 0.19+"
mitigation = "do not upgrade without verifying statrs compatibility; original num-dual reason is stale"

[[shared.pitfall]]
id = "PIT-002"
issue = "cudarc kernels compile via NVRTC at runtime"
impact = "assuming build-time nvcc can lead to wrong setup or debugging path"
mitigation = "debug runtime kernel strings and feature-gated execution path"

[[shared.pitfall]]
id = "PIT-003"
issue = "hdf5 must use hdf5-metno"
impact = "using upstream hdf5 crate can break with HDF5 2.0 systems"
mitigation = "keep package = hdf5-metno, version 0.12"

[[shared.pitfall]]
id = "PIT-004"
issue = "LBM f_i initialized to zero leads to NaN instability"
impact = "invalid simulation startup state"
mitigation = "initialize f_i to lattice weights"

[[shared.pitfall]]
id = "PIT-005"
issue = "hurst crate has GPL-3.0 implications"
impact = "license-policy conflicts if used casually"
mitigation = "respect current project license constraints and policy checks"

[[shared.pitfall]]
id = "PIT-006"
issue = "burn 0.16 optimizer API details are easy to misapply"
impact = "training code breaks with stale patterns"
mitigation = "use AdamConfig::new().init() and pass lr via optim.step()"

[[shared.pitfall]]
id = "PIT-007"
issue = "Clippy modernization requirements are strict"
impact = "CI fails for legacy patterns"
mitigation = "prefer is_multiple_of and std::io::Error::other forms"

[[shared.pitfall]]
id = "PIT-008"
issue = "Large Vietoris-Rips complexes can OOM"
impact = "topology jobs can fail unpredictably"
mitigation = "truncate point sets before expensive distance computations"

[[shared.pitfall]]
id = "PIT-009"
issue = "Uniform forcing with periodic BC can nullify strain"
impact = "simulation may not exhibit intended dynamics"
mitigation = "use non-uniform forcing patterns where required"

[[shared.pitfall]]
id = "PIT-010"
issue = "ndarray transitive duplication via burn"
impact = "two ndarray versions in dependency tree, inflated compile time"
mitigation = "accept until burn aligns; documented in workspace.metadata.feature_policy"

[[shared.pitfall]]
id = "PIT-011"
issue = "boxkites.rs heavy tests cause 30+ min workspace test runs"
impact = "cargo test --workspace blocked on O(dim^3+) exhaustive graph enumeration in debug mode"
mitigation = "26 heavy tests gated with #[ignore]; run via cargo test -p algebra_analysis -- --ignored for research lane"

[[shared.pitfall]]
id = "PIT-012"
issue = "ADI stability for PTE: CFL in (r, ln p) space"
impact = "PteSolver momentum upwind step becomes unstable if (1/3)*|div(u)|*dt/d_ln_r >= 1"
mitigation = "With v_sw ~ 0.05 LBM and d_ln_r ~ 0.23, CFL ~ 0.001 -- safe. Binding constraint is spatial advection: u_sw (lattice) < 1 (LBM stability). Monitor if dt_s is increased beyond 1e5 s."

[[shared.pitfall]]
id = "PIT-013"
issue = "Voyager CRS data is at a different SPDF path from merged plasma files"
impact = "CRS data (particle counts) lives under voyager/voyager{1,2}/particle/crs/, NOT the merged/ directory used by SpdfColumnLayout parsers"
mitigation = "Use fetch_crs.py (bin/fetch_crs.py) and voyager_crs.rs parser (separate struct, NOT SpdfColumnLayout). File naming: vy{N}crs_{YEAR}.asc."

[[shared.pitfall]]
id = "PIT-014"
issue = "LbmSolver3D::new takes tau: f64 directly, not BgkCollision struct"
impact = "BgkCollision struct has tau_field: Vec<f64>, not nu: f64. Using BgkCollision {} literal in ::new() call causes E0560/E0308 errors."
mitigation = "Use LbmSolver3D::new(nx, ny, nz, tau) directly. BgkCollision::new(tau) exists but is not the solver constructor argument."

