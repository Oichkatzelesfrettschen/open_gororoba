schema = "open_gororoba.agents.v2"
source_of_truth = true
updated_on = "2026-03-12"

[agents_md_render]
title = "Agent and Contributor Operating Manual"
source_comment = "agents.toml"
rust_first_heading = "Rust First"
rust_first_intro = "This repository is a pure Rust codebase first and foremost."
rust_first_rules = [
    "All new automation, analysis, verification, ingestion, artifact generation, and claim-support implementations MUST be written in Rust crates, Rust binaries, or Rust tests.",
    "Python, notebooks, and ad hoc scripting are migration debt, not acceptable end states for new work.",
    "If a workflow currently exists only in a non-Rust form, the required action is to migrate it to Rust rather than add another non-Rust layer beside it.",
]
policy_link_heading = "Policy Link"
policy_link_body = "`agents.toml` is the canonical machine-readable policy file for this repo.\nRead it with this file, keep the two in sync, and follow the stricter Rust-first interpretation if they ever drift."

[rust_native_policy_top]
enforced = true
repo_mode = "rust_native"
cargo_first = true
no_new_shell_workflow_drivers = true
no_new_python_workflow_drivers = true
no_new_make_wrappers_for_rust_ops = true
cargo_toml_is_authoritative_for_rust_workflows = true
note = "This repository is Rust-native. Add operational workflows as Cargo binaries, not shell/python/make wrappers."

[shared]
canonical_file = "agents.toml"
rust_tooling_catalog = "docs/rust-tooling-packages.toml"
rust_tooling_note = "Rust package and tool inventory lives in docs/rust-tooling-packages.toml."
rust_crate_catalog = "registry/rust_crate_catalog.toml"
rust_crate_catalog_note = "Workspace crate inventory and staged third-party crate adoption live in registry/rust_crate_catalog.toml."

[shared.cargo_execution_policy]
single_compile_heavy_command_at_a_time = true
parallelize_non_cargo_tasks_only = true
reuse_existing_build_artifacts = true
deterministic_reproducibility_required = true
contention_avoidance_note = "Avoid concurrent cargo build/run/clippy/test invocations that contend on package/artifact locks. Serialize compile-heavy cargo tasks and parallelize only non-cargo work. Required gates isolate Cargo state per project with repo-local CARGO_HOME and CARGO_TARGET_DIR defaults so different repos and agents do not fight over shared cache locks."

[shared.cargo_execution_policy.recommended_sequence]
step_1 = "Run one compile-heavy cargo command at a time."
step_2 = "Parallelize only non-cargo tasks (file scans, report parsing, documentation edits)."
step_3 = "Reuse one built binary set for follow-on runs."

[shared.testing_protocol]
mandatory = true
note = """
Test execution is split into explicit `smoke`, `regression`, and `heavy` lanes. \
`smoke` runs only the dedicated fast suites, `regression` runs the required \
default non-ignored coverage, and `heavy` owns ignored/GPU/research lanes. \
Never use standard `cargo test` for algebra_analysis or gr_core. These crates \
contain O(dim^3+) mathematical tests that take 29+ minutes under Cranelift. \
Always use the LLVM test-heavy profile via nextest."""

[shared.testing_protocol.heavy_crates]
algebra_analysis = "cargo nextest run --cargo-profile test-heavy --profile heavy -p algebra_analysis"
gr_core = "cargo nextest run --cargo-profile test-heavy --profile heavy -p gr_core"

[shared.testing_protocol.core_pinning]
required_for = "Any new heavy O(dim^3+) mathematical test"
call = "crate::test_support::init_physical_rayon_pool();"
placement = "First line of test function body"
reason = "Prevents SMT V-Cache thrashing on AMD Zen 3D and similar architectures"

[shared.project]
name = "open_gororoba"
kind = "computational_physics_research_platform"
summary = "Rust-first scientific workspace linking Cayley-Dickson algebra, LBM fluid dynamics, TDA, cosmological observables, multi-spacecraft heliospheric tomography (1-157 AU), and Parker Transport Equation (GCR modulation + DM anomaly detection)."
workspace_crates = 42
cli_binaries = 177
registry_model = "toml_first"

